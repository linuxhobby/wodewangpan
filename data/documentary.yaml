  description: "美国 FBI 探员福克斯·穆德（大卫·杜楚尼 David Duchovny 饰）童年时曾经历一起离奇神秘的绑架案，他的妹妹萨曼莎在睡梦中被外星人劫持，至今下落不明。从此穆德便专注于神秘事件的研究，并专门负责FBI总部的X档案部门。因穆德行事乖张，难以驾驭。FBI 高层从联邦调查局学院调来女性探员黛娜·斯科莉（吉莲·安德森 Gillian Anderson 饰），表面上是协助穆德工作，实际上是希望这名崇尚科学的理性探员能够制约穆德的行为。两人最初的合作并不理想，完全不同的思维模式时刻导致争论的爆发。但随着各种离奇案件的出现以及两人交往的加深，穆德和斯科莉最终变成可以为对方出生入死的可靠伙伴……｜TMDB 8.4"
