  baidu_code: "k02m"
  description: "一个科、四十张完全不同的脸，BBC 这部只用猫科动物撑起整季。从非洲狮、老虎、美洲豹到猎豹、云豹、雪豹、美洲狮、猞猁、豹猫、渔猫，再到黑足猫、兔狲、薮猫、沙漠猫这些难得露面的家伙，全都出场。它的编排不是按物种挨个介绍，而是把伏击、群居、攀爬、夜间潜行这些生存策略横向铺开对比，让人看清楚大体型和小体型各自的难处：一个要靠力量维持领地，一个得在捕食者的缝隙里活着，最后却演化出惊人相似的骨架与感官。适合喜欢动物纪录片的观众，猫科爱好者更是不容错过。黑足猫和兔狲那几段是极少见的影像，值得单独看一遍。拍摄层面最值得一提的是红外与高速摄影的应用，许多夜行种类根本不可能靠肉眼追踪得到。看完全季再回头看一眼家猫的脸，会对这副结构为什么长成这样多一点理解。｜TMDB 7.9"
