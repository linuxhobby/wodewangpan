- id: dc-065
  title: "荒野间谍"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/df15818c148e"
  baidu_url: "https://pan.baidu.com/s/1cK61V4BSZOHSrdQ0-7H7vg"
  baidu_code: "9pqd"
  description: "BBC 的「动物卧底」思路在 2017 年这一部里被推到了新高度：做一批外形逼真的假动物，把摄像机藏进身体，再混进野生动物群里贴近拍摄。机器河马、猴子、树懒这一季做得尤其精细，连眼睑和嘴角都会动，因此拿到了不少以往不可能记录的近距离互动。它聪明的地方在于没有把制作过程藏起来，幕后占了不小篇幅——怎么让假动物被族群接纳、多少次拍摄被识破、工程师如何一点点把机械感做掉。适合喜欢自然纪录片的观众，更推荐给想知道这些画面究竟怎么拍出来的人，带孩子一起看也非常合适。真正的笑点其实在动物身上：黑猩猩对着假同伴反复试探，大象会主动过来查看这个新来的家伙，这些反应比任何解说都更能说明问题。全片的调子轻松，甚至在结尾给这些机器替身安排了一句玩笑，让人愿意回头再看一遍。｜TMDB 7.0"
  date: 2017-01-12
  added: 2026-05-02
  image: dc-065.jpg

