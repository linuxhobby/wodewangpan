  baidu_code: "dts3"
  description: "一连六集，探索南美洲大陆上繁杂独特、惊险刺激的野生生态。从赤道几乎伸展至南极，广袤的南美大陆地貌悬殊，既有热带海洋，也有冰冠雪山。地球上最大的河系、最长的山系、最大的雨林和最乾的沙漠，都在南美洲。 摄影队运用红外线夜视摄影机和最先进的摄影技术，把鲜为人知的动物呈现在我们眼前。而空中摄影师则飞跃大陆，以全新角度记录南美洲那变化多端的地貌。 这六集特辑带我们深入亚马逊盆地，登上安第斯山脉的雪峰，横穿大草原，穿梭生气勃勃的雨林，最后饱览南美洲那壮观的海岸线--这旅程终身难忘。｜TMDB 9.0"
  date: 2000-11-06
