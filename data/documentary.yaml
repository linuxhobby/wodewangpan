- id: dc-086
  title: "越南战争"
  category: 纪录片
  tags: ["纪录片", "War & Politics", "越南战争 The Vietnam War"]
  quark_url: "https://pan.quark.cn/s/efd9c0c57fb6"
  description: "【第 1 季 · 共 10 集】这是肯·伯恩斯与林恩·诺维克为 PBS 制作的大型越战纪录片，2017 年播出，十集总时长接近十八小时，制作周期长达十年。两位导演采访了来自各方的近八十位亲历者：参战与反战的美国人，南越与北越的军民，都有机会在镜头前讲完自己的版本。素材层面同样下足了功夫，摄制组跨遍全球搜集档案，其中有许多少见和重新数字化的影像，还有二十世纪相当出名的新闻照片、家庭录像、历史新闻片段以及政府内部的秘密录音，配乐与旁白的处理保持了伯恩斯作品一贯的水准。全片按时间顺序从战后殖民背景一路讲到美军撤离与战争结束，没有把任何一方写成简单的好坏，而是把战争怎么一步步把所有人拖进去的过程讲得很清楚。对想系统了解越战的观众，这十集几乎就是一份完整课程；对美国当代政治与社会的理解，它也提供了绕不开的背景。体量大，建议分几天慢慢看完。｜TMDB 8.2"
  date: 2017-09-17
  added: "2026-10-12 12:25"
  image: dc-086.jpg

