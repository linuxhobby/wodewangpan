  description: "这部 2025 年的纪录类影片把镜头对准电动汽车：它究竟解决了什么，又带来了哪些不太愿意被摆到台面上讨论的问题。相比常见的宣传口径，片子更想把账算完整，电池的原材料从哪里来、驱动它的电又从哪里来、整车报废之后往哪里去，以及充电网络在不同地区的铺设程度差别有多大。需要如实说明的是，这部片子的公开资料极少，具体章节划分和受访者名单暂无可靠来源，这里只能给出基本收录信息：英文原名如上，归类纪录，时长待核。适合关注新能源车、电池回收与充电基础设施话题的观众，也适合在讨论政策之前，先看一遍不同立场各自的说法。完整介绍待资料核实后补充。片名里的三个词基本就是它的结构：好、坏、难看，各占一段，立场算不上温和，但至少不让任何一边独占话筒。如果你正在纠结要不要换车，它不会替你下结论，却能把你原本没算进去的那部分成本摊开摆到桌面上。｜TMDB 10.0"
