  baidu_url: "https://pan.baidu.com/s/1gADwNmjyla1jUixVSBlI_w"
  baidu_code: "rimr"
  description: "沿着铁轨走，会看到英国的另外一个版本。主持人茱莉亚带着老铁路手册上路，顺着线路一段段走，在车站和沿线小镇落脚，拜访当地的名人异士，听他们讲这条线当年给镇子带来了什么。片子同时把铁路如何推动工业革命交代清楚：货运、通勤、度假潮怎样被几条钢轨改写，沿海支线和乡村小站又是怎样一点点被遗忘再重修。它的节奏舒缓，适合随手打开慢慢看，不必从头追。喜欢英国乡村、铁道文化和旅行人文纪录片的观众会特别受用，那些月台花圃、老售票窗和站房招牌本身就是内容的一部分。看完会有挑一条支线去坐一趟的冲动。它并没有把铁路讲成怀旧主题公园，支线被砍、货运衰退这些代价也一并提了，正因为如此，那些今天还在通车的乡村小站才显得格外不容易。｜TMDB 6.7"
  date: 2008-10-02
  added: 2026-05-02
  image: dc-071.jpg

- id: dc-070
  title: "野性南美洲"
