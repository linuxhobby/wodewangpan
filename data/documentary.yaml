  description: "植物既能与动物互利共生，也可以像任何生物那样充满攻击性、竞争性与戏剧性；为了争夺光照、空间和养分，它们与邻居、动物、环境进行着看不见硝烟却同样致命的斗争。这部系列把二十多年来的研究成果汇到了一起，靠专用摄影和延时设备把人眼看不见的过程压缩成看得见的剧情，于是藤蔓绞杀、叶片反击害虫、种子借风远行都成了有张力的段落，植物第一次以主角的身份出现在这里。影片另有大量幕后内容，能看出同一段生长过程常常要拍上好几个月。适合喜欢《地球脉动》那类作品的观众，看完再看窗外的行道树会换一种眼光。把它当成《行星地球》的植物版也不算错，只是这次的主角不会动，所有追逐与搏斗都被压进了另一个时间尺度里。全季在物种取舍上的标准很简单：能不能讲出一个有戏剧性的故事，这也让它比一般科普更好看。｜TMDB 8.8"
  date: 2022-01-09
  added: 2026-05-02
  image: dc-077.jpg

- id: dc-076
