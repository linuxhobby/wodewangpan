  baidu_url: "https://pan.baidu.com/s/1b9iloCjSB6hku66mPLrsnQ"
  baidu_code: "zgr5"
  description: "FBI 探员福克斯·穆德童年时经历过一起离奇事件：妹妹萨曼莎在睡梦中失踪，他坚信是被外星人劫走，此后便一头扎进神秘事件，专门负责总部那个没人愿意接的 X 档案部门。由于行事乖张难以约束，高层从学院调来信奉理性的女探员黛娜·斯科莉，名义上是协助，实际是让他别跑太远。两人最初的合作相当糟糕，一个相信一切可能，一个要求证据，几乎每件事都要争。但随着离奇案件一件件出现，这种分歧反而成了最有效的组合——穆德负责提出假说，斯科莉负责证伪。前期以单元案件为主，随手挑一集也不影响，外星阴谋的主线则一点点往后铺。剧集真正的支点其实是两人之间的信任，跨越近十年慢慢长出来的那种。九十年代的质感如今看反而成了优点，特效的粗糙里带着实在的想象力。适合喜欢悬疑与超自然题材的观众。｜TMDB 8.4"
  date: 1993-09-10
  added: 2026-05-02
