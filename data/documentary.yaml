  baidu_code: "2ju7"
  description: "BBC的《奥斯维辛集中营》电视剧于2005年拍摄并公映，该纪录片共6集，采用了现代影视技术演示集中营的设施，使其易于观瞻。奥斯威辛集中营是大屠杀的代名词，但它在地图上也是一个在二战前有着令人惊讶历史的地方。奥斯维辛集中营中的囚犯，包括犹太人和非犹太人，都拥有一个序列号，先是在胸前，后是在左臂。据估计，40万个数字被打在奥斯威辛营地的囚犯身上，现只有几千名幸存者。事实上，本片的主角是数字编号本身，随着时间的流逝，从1940年到今天，它已然是一种个人和集体的象征。这部纪录短片由梅丽尔·斯特里普 （Meryl Streep） 讲述，讲述了奥斯威辛集中营从建造到臭名昭著的故事。｜TMDB 0.0"
  date: 2013-11-15
  added: 2026-05-02
  image: dc-028.jpg

- id: dc-027
  title: "天才发明家"
  category: 纪录片
  tags: ["纪录片", "动画", "家庭", "喜剧", "天才发明"]
  quark_url: "https://pan.quark.cn/s/5f24f346b255"
  baidu_url: "https://pan.baidu.com/s/1JfMsYdNxZWX36YdFSkUw0w"
  baidu_code: "g30d"
  description: "这是一部面向孩子的动画喜剧，主角崔希把聪明全用在了偷懒上：为了不用自己写作业和做家务，她先造了一台机器人代劳；为了让好朋友歇墨斯建立自信、顺利当上班长，又发明了机器人助教。每一集基本围绕一个新发明展开，笑料热闹，造型一个比一个滑稽，底下讲的其实是「耍小聪明往往把事情搞得更复杂」这个道理。孩子看热闹，大人看教训，两边都不亏。适合给学龄孩子看的家庭动画，篇幅短、节奏快，家长陪看也不费劲，每集十分钟出头，看完一集再决定要不要继续都没负担。它对小观众的尊重在于不把道理讲白，机器人每次失控的后果都由主角自己去收拾，笑点和教训都藏在结果里。动画风格朴素，配色明亮，看多了节奏飞快的作品之后，这种略慢的步调反而让人松口气。适合放假在家、想找点能陪孩子一起看的内容时打开。｜TMDB 8.2"
