  image: dc-070.jpg

- id: dc-069
  title: "里克·斯坦的墨西哥美食之旅"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/68adee5ec199"
  baidu_url: "https://pan.baidu.com/s/1ZTAT2vwgVpMyka6LKspYhQ"
  baidu_code: "qh9g"
  description: "一趟公路旅行能记一辈子，这在里克·斯坦身上是真的。1968 年，还是年轻人的他沿着太平洋海岸公路一路开到墨西哥边境，半个世纪后他回来重走这条路：从旧金山出发南下，路边摊、家庭厨房、本地主厨的招牌菜，一路吃一路听做菜的人讲自己和食物的关系。他的方式一贯随和，不做夸张挑战也不靠量取胜，重点放在这道菜为什么这样处理、这种食材为什么只在这里长成这样。看下来能摸到墨西哥菜真正的脉络：玉米、辣椒、酸味，以及街头那一套朴素逻辑。适合喜欢美食旅行节目的人，打算沿这条路自驾的观众还能顺手记下吃单。指望刺激环节的话会失望。比起教人做菜，它更像一份关于食物为什么会变成这样的田野笔记，加州与墨西哥之间食材处理方式的差别，被他用一顿顿饭串了起来。看饿了属于正常反应，厨房里有存货的话建议先备着。｜TMDB 7.3"
  date: 2017-11-07
  added: 2026-05-02
  image: dc-069.jpg

- id: dc-068
  title: "谁在引导我们消费"
  category: 纪录片
  tags: ["纪录片", "无节制消费的元凶"]
  quark_url: "https://pan.quark.cn/s/62d55a75670f"
  baidu_url: "https://pan.baidu.com/s/1RYt-yzZzrSprAK9TwVK-fw"
  baidu_code: "zuu5"
  description: "我们为什么要买东西，是谁把世界变成了今天这个无节制消费的样子？调查记者雅克·佩雷蒂一路追下去，给出的答案有点反直觉：元凶并不只是人们习惯归咎的广告人和营销者。片子从耐用产品的刻意短命讲起，到把消费包装成身份认同、把焦虑转化成购买欲，一层层拆开制造欲望的机制，也让那些操盘的人自己开口说话。看完之后走进任何一家商场的感觉都会不一样，你会开始留意货架高度、限时标签，以及所谓新品究竟有几处是真升级。适合愿意被泼冷水的观众，想知道钱包为什么总也守不住的人尤其该看一遍。它的视角始终在往前追：欲望并非被制造给某一个人，而是先被设计成一套系统，然后让人自己走了进去。它最后留给观众的提醒很朴素：看懂这套机制之后，真正难的是下一次站在货架前的那三十秒。｜TMDB 8.0"
  date: 2014-07-12
  added: 2026-05-02
  image: dc-068.jpg
