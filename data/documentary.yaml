- id: dc-034
  title: "徒步尼罗河"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/756ec345c362"
  baidu_url: "https://pan.baidu.com/s/1vINryMrBnjOsUTqzxk84tw"
  baidu_code: "fmvc"
  description: "沿着尼罗河把它从头走到尾，听起来就不太可能，探险家 Levison Wood 还是这么干了，前后花了大约九个月。他穿过雨林、草原、沙漠和城市，也穿过局势不稳的地带，途中遇到的军警、牧民、渔夫和走私者构成了这条河真正的切面。它不追求极限挑战的节奏，更多是耐心地走、看、问，因此能看到旅行团绝不会经过的路段：干涸的支流、废弃的码头、靠河吃饭的小镇。适合喜欢长距离徒步旅行纪录片、对非洲有兴趣的观众，想了解这条河今天究竟是什么模样的人会收获不少一手信息，安全与运气在其中扮演的角色也交代得相当坦白。相比登顶式的探险叙事，它更接近一次耐心的地理课，看完会对这条河串起来的几个国家多一些具体的认识。整段旅程最打动人的并不是入海口，而是沿途那些把陌生人请进院子里、留他住一晚的段落，这才是河谷两岸真正的日常。｜TMDB 6.6"
  date: 2015-01-04
  added: 2026-05-02
  image: dc-034.jpg

- id: dc-033
