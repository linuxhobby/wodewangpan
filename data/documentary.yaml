  image: dc-004.jpg

- id: dc-003
  title: "二战坦克王牌"
  category: 纪录片
  tags: ["纪录片", "二战英军坦克英雄"]
  quark_url: "https://pan.quark.cn/s/9bb5e32c0a86"
  baidu_url: "https://pan.baidu.com/s/1X_UpzHrpwh8OX2swMoC64Q"
  baidu_code: "ypii"
  description: "《二战坦克王牌》把讲述权交给了英国皇家第五坦克团的六名老兵，全片几乎没有宏大的战略复盘，而是回到个人视角：坦克舱内的狭窄与闷热、遭遇德军装甲时那几秒钟的决策、战友伤亡之后漫长的沉默。因为全是当事人出镜口述，细节的质感远胜事后的情景重演，那种平静语气底下压着的东西，是任何编年史里读不到的。适合对二战装甲战、诺曼底之后西欧推进感兴趣的观众，尤其适合看完大制作战争片、想听听真实声音的人补一课。老兵讲到某个节点忽然停下来喝水的时候，比任何解说都有分量。篇幅不长，一个晚上能看完。这部片子真正的价值是时间：当年二十出头的坦克兵如今坐在镜头前，讲出来的已经不只是回忆，而是经过几十年沉淀的判断。有些细节，比如新刷油漆的味道、发动机熄火之后的寂静，是任何史料都写不出来的。喜欢口述史的观众不要错过。｜TMDB 10.0"
  date: 2013-01-06
  added: 2026-05-02
  image: dc-003.jpg

- id: dc-002
  title: "七个世界，一个星球"
  category: 纪录片
  tags: ["纪录片", "家庭", "七个世界 一个星球"]
  quark_url: "https://pan.quark.cn/s/f7f0d8c33a50"
  baidu_url: "https://pan.baidu.com/s/1AZWJdGidNutXuuBQBA9rew"
  baidu_code: "w69j"
  description: "数百万年前，不可思议的神奇力量将地壳撕扯得支离破碎，由此创造出七个蔚为壮观的大陆。时光荏苒，每个大陆都孕育了别具特色的野生动物。从郁郁葱葱的南美洲丛林深处到冰雪覆盖的亚洲山峦之巅，从欧洲熙熙攘攘的都市到非洲的广袤平原，《七个世界，一个星球》将开启一次七大洲之旅，呈现匪夷所思的动物行为，讲述鲜为人知的动物故事。我们将探索在这七个世界，丰富多样的生命如何在地球上生长繁衍，同时揭示在人类主导的世界，动物们所面临的不同挑战。｜TMDB 8.5"
  date: 2019-10-27
  added: 2026-05-02
  image: dc-002.jpg

- id: dc-001
  title: "一千零一夜的秘密"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/894225d0658a"
  baidu_url: "https://pan.baidu.com/s/1kW4Tr84x6xVZ-bEDob4ofQ"
  baidu_code: "31zc"
  description: "《一千零一夜的秘密》是一部讲《一千零一夜》从哪来的纪录片。它不打算把那些故事再讲一遍，也不假装能给出所谓深度研究，力气全花在溯源上：印度、波斯、阿拉伯世界的多重来源，民间说书人的口传传统，以及它在欧洲被翻译、改写、再创作之后的面貌。导演的态度相当清醒，承认这题材庞大到不可能在一部片里讲透，于是恰当地点到为止，能把前生今世梳理清楚已经难得。适合对世界文学源流、翻译史或阿拉伯文化感兴趣的观众，看之前不需要任何准备。"
  date: 2010-01-02
  added: 2026-05-02
  image: dc-001.jpg

