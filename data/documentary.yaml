  description: "《勇士》全系列共分六集，每集将透过历史上一起重大事件，揭开青史留名的著名将领的复杂性格，其中包括领导英明却优柔寡断的斯巴达克斯，集天才与精神变态于一身的匈奴王阿提拉，引爆内战动摇阿兹特克帝国的西班牙探险家赫曼·考梯斯，除此之外，也将重现历史上的知名战役，包括史上最大型的武士战争，十六万名士兵为了日本的前途而战；还有狮心理查率领各地基督徒组成的军队，从海上突袭雅法港，痛击库德战士萨拉丁。 这些英勇善战、充满魅力的人物各自在历史上赢得了一席之地，这是因为他们不惜为信仰而死--无论是为了上帝或黄金、追求权力或自由，或是追寻崇高的理想。这些人有军事将领、政治权谋家、残酷暴君、侠义骑士，也有艰困年代的生…｜TMDB 7.0"
