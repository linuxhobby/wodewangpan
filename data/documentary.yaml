  quark_url: "https://pan.quark.cn/s/74e746f66b03"
  baidu_url: "https://pan.baidu.com/s/1qdenaW_87rOTeJgrY72FDQ"
  baidu_code: "8zkr"
  description: "热带草原的食物链在这部日本短篇动画里彻底失效了：狮子、巨嘴鸟和蜥蜴三人同在非洲的一家公司上班，每天面对的是毫无理由的项目、不容争辩的降薪和说不通的上司。创作者把一个社畜积攒的怨念原封不动搬了过去，笑点基本靠角色一句句吐槽堆起来，节奏极快，每集时长很短。光看别名就知道它没打算认真讲生态，草原和生存竞争充其量是背景板。适合通勤路上想吃点解压零食的观众，正在上班的人看了大概格外有感；想要草原动物那种治愈画风的人就不必勉强了。开场几分钟就交代清楚了这套荒唐职场的运行逻辑。每集不到十分钟，配饭刚好，看着看着会发现它对办公室里那些荒谬规则的讽刺相当具体，并不只是卖萌那么简单。社畜题材里它算得上短小精悍的那一类。｜TMDB 5.8"
  date: 2019-10-07
  added: 2026-05-02
  image: dc-073.jpg

