- id: dc-075
  title: "鸟瞰地球"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/17a42cecd966"
  baidu_url: "https://pan.baidu.com/s/1keDe7XgfdOk5e-_rqq4Pnw"
  baidu_code: "hboz"
  description: "把摄像机绑在鸟背上，让候鸟自己带着镜头飞，这在当年近乎疯狂，BBC 用了三年把它做成了现实。摄制组把轻量设备固定在鹤、雁、海鸟和秃鹫身上，横跨六大洲四十多个国家，观众跟着走的不是拍摄队规划的路线，而是这些鸟世代相传的迁徙线。因为视角悬在半空，镜头常把地貌和动物串进同一个画面：象群在鸟翼下的平原上扬起尘土，海浪拍向崖壁的角度也正是鸟群俯冲的角度。它的另一个价值在于把地理片和动物片拧到了一起，追风光的观众和追动物的观众各取所需。技术上最难的不是拍远景，而是让设备轻到不耽误飞行。为了让这件事成立，摄制队从雏鸟阶段就让它们习惯背上的重量，放飞前反复调整重心，这套流程远比看上去笨，也解释了为什么全片准备了三年。只想挑一集看的话，跨海那一段最过瘾。｜TMDB 7.0"
  date: 2011-12-29
  added: 2026-05-02
  image: dc-075.jpg

