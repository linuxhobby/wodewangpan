- id: dc-075
  title: "鸟瞰地球"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/17a42cecd966"
  baidu_url: "https://pan.baidu.com/s/1keDe7XgfdOk5e-_rqq4Pnw"
  baidu_code: "hboz"
  description: "把摄像机绑在鸟背上，让候鸟自己带着镜头飞，这在当年近乎疯狂，BBC 用了三年把它做成了现实。摄制组把轻量设备固定在鹤、雁、海鸟和秃鹫身上，横跨六大洲四十多个国家，观众跟着走的不是拍摄队规划的路线，而是这些鸟世代相传的迁徙线。因为视角悬在半空，镜头常把地貌和动物串进同一个画面：象群在鸟翼下的平原上扬起尘土，海浪拍向崖壁的角度也正是鸟群俯冲的角度。它的另一个价值在于把地理片和动物片拧到了一起，追风光的观众和追动物的观众各取所需。技术上最难的不是拍远景，而是让设备轻到不耽误飞行。为了让这件事成立，摄制队从雏鸟阶段就让它们习惯背上的重量，放飞前反复调整重心，这套流程远比看上去笨，也解释了为什么全片准备了三年。只想挑一集看的话，跨海那一段最过瘾。｜TMDB 7.0"
  date: 2011-12-29
  added: 2026-05-02
  image: dc-075.jpg

- id: dc-074
  title: "骇客如何改变世界"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/8a6b301b90c4"
  baidu_url: "https://pan.baidu.com/s/1C9HDctrHq4TuRHBLQc0llA"
  baidu_code: "xfh9"
  description: "讲互联网上那一批被称作黑客的人：动机各不相同，有的为了抗议，有的纯属恶作剧，有的只是想证明自己进得去。片子把从早期电话飞客到匿名者这条线梳理了一遍，中间穿插当事人自述，真正讨论的问题是——当一群没有组织的人能够在网上采取一致行动，这究竟是一种新的抗议形式，还是单纯的破坏。它不提供答案，因为受访双方几乎都说得通，也正是这一点让片子值得看完。受访者里既有行动者也有追责者，两边的说法都被完整保留，没有剪辑成立场。十几年后再看，里面讨论的边界问题不但没有过时，反而更日常了。想了解匿名者这类松散组织是怎么运作的，这是份不错的入门材料。对网络行动主义的评价，片子始终维持在提问而非定论的层面。适合对网络亚文化、信息自由议题感兴趣的观众；想看技术细节的会失望，它的重心在人和社会。"
  date: 2013-07-01
  added: 2026-05-02
  image: dc-074.jpg

- id: dc-073
  title: "非洲的动物上班族"
  category: 纪录片
  tags: ["纪录片", "动画", "非洲"]
  quark_url: "https://pan.quark.cn/s/74e746f66b03"
  baidu_url: "https://pan.baidu.com/s/1qdenaW_87rOTeJgrY72FDQ"
  baidu_code: "8zkr"
  description: "热带草原的食物链在这部日本短篇动画里彻底失效了：狮子、巨嘴鸟和蜥蜴三人同在非洲的一家公司上班，每天面对的是毫无理由的项目、不容争辩的降薪和说不通的上司。创作者把一个社畜积攒的怨念原封不动搬了过去，笑点基本靠角色一句句吐槽堆起来，节奏极快，每集时长很短。光看别名就知道它没打算认真讲生态，草原和生存竞争充其量是背景板。适合通勤路上想吃点解压零食的观众，正在上班的人看了大概格外有感；想要草原动物那种治愈画风的人就不必勉强了。开场几分钟就交代清楚了这套荒唐职场的运行逻辑。每集不到十分钟，配饭刚好，看着看着会发现它对办公室里那些荒谬规则的讽刺相当具体，并不只是卖萌那么简单。社畜题材里它算得上短小精悍的那一类。｜TMDB 5.8"
  date: 2019-10-07
  added: 2026-05-02
  image: dc-073.jpg

- id: dc-072
  title: "铭记历史"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/ab856a4c13e1"
  baidu_url: "https://pan.baidu.com/s/1h71PLE2fQI3W0vWFmmYnsw"
  baidu_code: "5g92"
  description: "记忆是会变形的，这部片子关心的正是这件事。它脱胎于 BBC 在上世纪五十年代的同名系列，那一版记录的还是当时人亲身经历过的二十世纪前半叶；新版沿着同样的思路往下讲，把战争、抗议、流行文化乃至厨房里的变化都串进同一条时间线。手法上它有个明确的选择：大量使用当年的新闻影像，让当事人对着自己的旧画面重新讲述，而不是请后来的专家做总结陈词。于是同一段历史会出现两种声音——摄影机当年拍到的，和当事人如今记住的，两者之间的缝隙恰恰是这部片最有价值的地方。BBC 的影像档案本身也足够珍贵，不少画面此前很少公开。片中对口述与影像的对照相当克制，不急着指出谁对谁错。适合喜欢二十世纪史与影像资料的观众；期待紧凑叙事的人会觉得结构偏散，而素材自带的年代感是别的历史节目给不了的。"
  date: 2010-09-27
  added: 2026-05-02
  image: dc-072.jpg

- id: dc-071
  title: "铁路漫步"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/be6babd046d6"
  baidu_url: "https://pan.baidu.com/s/1gADwNmjyla1jUixVSBlI_w"
  baidu_code: "rimr"
  description: "沿着铁轨走，会看到英国的另外一个版本。主持人茱莉亚带着老铁路手册上路，顺着线路一段段走，在车站和沿线小镇落脚，拜访当地的名人异士，听他们讲这条线当年给镇子带来了什么。片子同时把铁路如何推动工业革命交代清楚：货运、通勤、度假潮怎样被几条钢轨改写，沿海支线和乡村小站又是怎样一点点被遗忘再重修。它的节奏舒缓，适合随手打开慢慢看，不必从头追。喜欢英国乡村、铁道文化和旅行人文纪录片的观众会特别受用，那些月台花圃、老售票窗和站房招牌本身就是内容的一部分。看完会有挑一条支线去坐一趟的冲动。它并没有把铁路讲成怀旧主题公园，支线被砍、货运衰退这些代价也一并提了，正因为如此，那些今天还在通车的乡村小站才显得格外不容易。｜TMDB 6.7"
  date: 2008-10-02
  added: 2026-05-02
  image: dc-071.jpg

- id: dc-070
  title: "野性南美洲"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/f5d1f9993bb7"
  baidu_url: "https://pan.baidu.com/s/1p7EYGIT2MXjDC9xDJpYdbw"
  baidu_code: "dts3"
  description: "南美大陆从赤道一直伸到南极，地貌落差大得惊人：地球最大的河系、最长的山系、最大的雨林和最干燥的沙漠都挤在这一块陆地上。六集走下来，从亚马逊盆地到安第斯雪峰，从大草原到雨林，最后收在漫长的海岸线，把各个区域特有的动物逐一拍出来。摄制组用了红外夜视设备和当时最新的拍摄手段，不少夜行、树冠层的动物是第一次被清楚记录；空中摄影则提供了另一个尺度，让这片大陆的地貌变化一目了然。整体是经典的自然史叙述方式，地理为线索、动物为主角，一集一个区域，界限清楚。解说沿用经典自然史的写法，信息密度高但不堆砌。几段捕食与求偶的段落拍得很完整，过程从头到尾没有剪断，这是它比后来者强的地方。二十多年过去，片中记录的某些栖息地已经变了样，这层时间距离反而增加了观看的分量。｜TMDB 9.0"
  date: 2000-11-06
  added: 2026-05-02
  image: dc-070.jpg

- id: dc-069
  title: "里克·斯坦的墨西哥美食之旅"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/68adee5ec199"
  baidu_url: "https://pan.baidu.com/s/1ZTAT2vwgVpMyka6LKspYhQ"
  baidu_code: "qh9g"
  description: "一趟公路旅行能记一辈子，这在里克·斯坦身上是真的。1968 年，还是年轻人的他沿着太平洋海岸公路一路开到墨西哥边境，半个世纪后他回来重走这条路：从旧金山出发南下，路边摊、家庭厨房、本地主厨的招牌菜，一路吃一路听做菜的人讲自己和食物的关系。他的方式一贯随和，不做夸张挑战也不靠量取胜，重点放在这道菜为什么这样处理、这种食材为什么只在这里长成这样。看下来能摸到墨西哥菜真正的脉络：玉米、辣椒、酸味，以及街头那一套朴素逻辑。适合喜欢美食旅行节目的人，打算沿这条路自驾的观众还能顺手记下吃单。指望刺激环节的话会失望。比起教人做菜，它更像一份关于食物为什么会变成这样的田野笔记，加州与墨西哥之间食材处理方式的差别，被他用一顿顿饭串了起来。看饿了属于正常反应，厨房里有存货的话建议先备着。｜TMDB 7.3"
  date: 2017-11-07
  added: 2026-05-02
  image: dc-069.jpg

- id: dc-068
  title: "谁在引导我们消费"
  category: 纪录片
  tags: ["纪录片", "无节制消费的元凶"]
  quark_url: "https://pan.quark.cn/s/62d55a75670f"
  baidu_url: "https://pan.baidu.com/s/1RYt-yzZzrSprAK9TwVK-fw"
  baidu_code: "zuu5"
  description: "我们为什么要买东西，是谁把世界变成了今天这个无节制消费的样子？调查记者雅克·佩雷蒂一路追下去，给出的答案有点反直觉：元凶并不只是人们习惯归咎的广告人和营销者。片子从耐用产品的刻意短命讲起，到把消费包装成身份认同、把焦虑转化成购买欲，一层层拆开制造欲望的机制，也让那些操盘的人自己开口说话。看完之后走进任何一家商场的感觉都会不一样，你会开始留意货架高度、限时标签，以及所谓新品究竟有几处是真升级。适合愿意被泼冷水的观众，想知道钱包为什么总也守不住的人尤其该看一遍。它的视角始终在往前追：欲望并非被制造给某一个人，而是先被设计成一套系统，然后让人自己走了进去。它最后留给观众的提醒很朴素：看懂这套机制之后，真正难的是下一次站在货架前的那三十秒。｜TMDB 8.0"
  date: 2014-07-12
  added: 2026-05-02
  image: dc-068.jpg
- id: dc-067
  title: "恋爱小行星"
  category: 纪录片
  tags: ["纪录片", "动画", "喜剧", "行星"]
  quark_url: "https://pan.quark.cn/s/7c64c28bfa35"
  baidu_url: "https://pan.baidu.com/s/1gei6OahOFWEjmTMELUEcFA"
  baidu_code: "1k6d"
  description: "这部日本动画把天文爱好拍得意外地可爱。高中生木之幡米拉小时候在野外露营认识了一位叫苍的少年，两人躺在草地上看星星时得知，天上有一颗和米拉同名的星——刍藁增二，却没有一颗属于苍。于是他们约定，将来一定要找到一颗小行星，把它命名为苍星。多年后米拉进入高中，发现当年的伙伴其实是女生，两人和社团里几个性格各异的成员一起，从辨认星座、使用望远镜开始，一点点走近真正的天文观测。它的优点是知识不硬塞：星座、流星雨、观测器材这些常识都长在日常对话里，顺着剧情自然带出。原作漫画里的天文考据相当认真，动画也延续了这一点，出现的星座与天体都对得上。社团日常这条线写得很扎实，从招新到准备展示，过程比结果更有意思。整体没有大起大落的冲突，靠的是日积月累的相处，适合喜欢慢节奏治愈系作品的观众。｜TMDB 6.4"
  date: 2020-01-03
  added: 2026-05-02
  image: dc-067.jpg

- id: dc-066
  title: "蓝色星球 2"
  category: 纪录片
  tags: ["纪录片", "家庭", "蓝色星球"]
  quark_url: "https://pan.quark.cn/s/780acf3f1e07"
  baidu_url: "https://pan.baidu.com/s/1g4aid_Zw0qPndSD6ix2_Ww"
  baidu_code: "59e3"
  description: "自然界里没有哪里比大海更让人神往：既狂野得令人敬畏，又因为未被看见而格外迷人。这部系列从冰雪覆盖的极地海域一路拍到色彩变幻的珊瑚礁，从风暴不断的大西洋到伸手不见五指、布满奇特生物的深海海底，把人类至今仍知之甚少的那部分海洋摊开来。作为《蓝色星球》的续作，设备和拍摄方法比当年强了不止一代，因此记录到不少此前从未被拍到的行为——猪齿鱼用工具砸开贝壳、伪虎鲸合作驱赶鱼群，都是靠长期蹲守换来的镜头。拍摄周期拉得很长，某些画面是守了几周才等到的，幕后花絮里能看到这个过程。解说依旧克制，把舞台留给画面。它也会让人意识到海洋并不遥远：塑料垃圾出现在最深的海沟里，这一点比任何说教都直接。适合零门槛的海洋题材入门观众，也适合当作给孩子看的第一部自然纪录片。｜TMDB 8.6"
  date: 2017-10-29
  added: 2026-05-02
  image: dc-066.jpg

- id: dc-065
  title: "荒野间谍"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/df15818c148e"
  baidu_url: "https://pan.baidu.com/s/1cK61V4BSZOHSrdQ0-7H7vg"
  baidu_code: "9pqd"
  description: "BBC 的「动物卧底」思路在 2017 年这一部里被推到了新高度：做一批外形逼真的假动物，把摄像机藏进身体，再混进野生动物群里贴近拍摄。机器河马、猴子、树懒这一季做得尤其精细，连眼睑和嘴角都会动，因此拿到了不少以往不可能记录的近距离互动。它聪明的地方在于没有把制作过程藏起来，幕后占了不小篇幅——怎么让假动物被族群接纳、多少次拍摄被识破、工程师如何一点点把机械感做掉。适合喜欢自然纪录片的观众，更推荐给想知道这些画面究竟怎么拍出来的人，带孩子一起看也非常合适。真正的笑点其实在动物身上：黑猩猩对着假同伴反复试探，大象会主动过来查看这个新来的家伙，这些反应比任何解说都更能说明问题。全片的调子轻松，甚至在结尾给这些机器替身安排了一句玩笑，让人愿意回头再看一遍。｜TMDB 7.0"
  date: 2017-01-12
  added: 2026-05-02
  image: dc-065.jpg

- id: dc-064
  title: "英雄列传"
  category: 纪录片
  tags: ["纪录片", "剧情"]
  quark_url: "https://pan.quark.cn/s/9c8475a8dbe3"
  baidu_url: "https://pan.baidu.com/s/1ZXAhqRnfZ8bV8CoRgi3CUA"
  baidu_code: "jd8m"
  description: "《勇士》全系列共分六集，每集将透过历史上一起重大事件，揭开青史留名的著名将领的复杂性格，其中包括领导英明却优柔寡断的斯巴达克斯，集天才与精神变态于一身的匈奴王阿提拉，引爆内战动摇阿兹特克帝国的西班牙探险家赫曼·考梯斯，除此之外，也将重现历史上的知名战役，包括史上最大型的武士战争，十六万名士兵为了日本的前途而战；还有狮心理查率领各地基督徒组成的军队，从海上突袭雅法港，痛击库德战士萨拉丁。 这些英勇善战、充满魅力的人物各自在历史上赢得了一席之地，这是因为他们不惜为信仰而死--无论是为了上帝或黄金、追求权力或自由，或是追寻崇高的理想。这些人有军事将领、政治权谋家、残酷暴君、侠义骑士，也有艰困年代的生…｜TMDB 7.0"
  date: 2007-11-11
  added: 2026-05-02
  image: dc-064.jpg

- id: dc-063
  title: "苏格兰海战"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/4dc1fe962901"
  baidu_url: "https://pan.baidu.com/s/1K_P4QuysuGYeuQ54RzQbPA"
  baidu_code: "1nql"
  description: "一战的这场海战在史书里的名字是日德兰，也是英德两支主力舰队唯一一次真正面对面。英国的对策是封锁德国的贸易线，于是把大舰队挪到苏格兰北端的锚地，北海的控制权就此成为焦点；德国若打不破封锁就只能慢慢耗死，这一仗怎么都躲不过。片子把决策、搜索和交火的经过讲得很清楚，也点出当时仍高度依赖旗语沟通带来的麻烦：关键时刻指令传不到位，战机就在迟疑中滑过去。适合想弄懂一战海战、又不想啃专业著作的观众。海图、航线和战术安排都讲得明白，完全不需要军事背景，高层对局势判断的那部分最有看头。战后双方都宣称自己赢了，这种各说各话的解读本身也相当值得玩味，片子里把两边的口径都摆了出来，由观众自己判断。真正压住全片的是水兵留下的文字，那些仓促写下的家信，比任何战报都更说明这一夜究竟发生了什么。｜TMDB 10.0"
  date: 2015-04-07
  added: 2026-05-02
  image: dc-063.jpg

- id: dc-062
  title: "脑力大挑战"
  category: 纪录片
  tags: ["纪录片", "喜剧", "真人秀"]
  quark_url: "https://pan.quark.cn/s/72aa60bba078"
  baidu_url: "https://pan.baidu.com/s/1LuAFicXnHovbuPsZ10nmqg"
  baidu_code: "elf5"
  description: "准备好让你的脑子打架——这部系列用互动实验、错觉和一点点花招，展示大脑是怎样给你制造出一整套无缝现实的幻觉：填不上的记忆、靠不住的感官、自以为集中实则漏掉大片的注意力。它讲的其实是同一件事的两面：大脑高效得惊人，也正因为高效，才必须不断地替我们填补空白。每个实验都设计得很简单，看完反倒有点不安。关于记忆的那几段最扎心：目击证词有多不可靠，被反复演示了好几次。风格偏轻松，带点综艺味和喜剧感，主持人也乐于拿自己开涮。多数实验看完可以自己在家试着做一遍，效果往往比在屏幕上更惊人。它也会提醒观众，这些错觉不是缺陷，而是大脑为了效率付出的代价。适合对心理学感兴趣的普通观众；如果你确信自己记的每件事都准确无误，这片大概会让你改主意。看完之后再碰到眼见为实这句话，会多留几分保留。｜TMDB 7.6"
  date: 2011-10-09
  added: 2026-05-02
  image: dc-062.jpg

- id: dc-061
  title: "老虎失落之地"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/d16ff0ad6562"
  baidu_url: "https://pan.baidu.com/s/1nZpjJv-VmThuYjhYJs5uAw"
  baidu_code: "o6m8"
  description: "一个原本以为已经灭绝的老虎种群，在不丹的喜马拉雅山区重新出现并成功繁衍——这条消息由 BBC 自然史摄制组拍到的画面证实。让专家意外的是，这些虎出现在此前从未被记录过的海拔高度上，适应能力比人们以为的更强。片子随后从这条线索延伸到保护议题：如果能在这一带周边建立保护区，就有希望把亚洲现存的零散虎群连成一片，从而阻止这种世界最大的猫科动物走向灭绝。摄制组架设的红外相机拍到的画面并不完美，模糊、晃动，反而更有说服力。拍摄过程本身就是看点，高海拔追踪的艰难被诚实记录下来，空手而归的日子远多于收获。它也坦率地说明了分歧：当地牧民与老虎共享同一片山地，保护方案绕不开人的生计。海拔这一点最让研究者意外，值得留意画面里植被带的对比。片中对不丹本国的保护政策也有简短介绍，能看出它与邻国的差别。｜TMDB 8.3"
  date: 2010-09-21
  added: 2026-05-02
  image: dc-061.jpg

- id: dc-060
  title: "翩翩蝴蝶：英国式迷恋"
  category: 纪录片
  tags: ["纪录片", "翩翩蝴蝶.英国式迷恋"]
  quark_url: "https://pan.quark.cn/s/ff01d11342b7"
  baidu_url: "https://pan.baidu.com/s/116wgv-HUi4uJSs9lr3ryBg"
  baidu_code: "x1cg"
  description: "英国人对蝴蝶的执着是出了名的，这部片子就从这份近乎偏执的热爱讲起：维多利亚时代拎着捕虫网满世界跑的采集者，学校里代代相传的观察记录，乡村节庆上的蝴蝶舞，以及到今天依然认真的业余爱好者。它没有只写浪漫的那一半，也把坏消息摆了出来：密集农业让不少物种失去了栖息地，气候变暖制造了一批赢家和更多的输家。片中有位坚持自己养虫放生的普通人，那段看下来最让人记得住。适合喜欢自然题材、对英国文化有兴趣的观众，看完会想在野外多认几种身边的蝶。整体节奏舒缓，午后看格外合适。它的底色其实带着惋惜，被批量改造掉的草地和树篱究竟改变了什么，片子里给的例子都很具体，也解释了为什么英国人对蝶类的记录在世界范围内算得上独一份。看完再路过草地，会忍不住多留意一眼飞过的到底是哪种。"
  date: 2010-12-17
  added: 2026-05-02
  image: dc-060.jpg

- id: dc-059
  title: "纳粹国防军"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/33639689d068"
  baidu_url: "https://pan.baidu.com/s/1k8rKndmwoEJsQAARABeZcw"
  baidu_code: "ti44"
  description: "德国国防军究竟是一群执行命令的人，还是一群手上沾血的暴徒，这个争论持续了几十年。BBC 这部五集纪录片找到了一个新入口：英国情报部门公开了一批窃听记录，关押在特伦特公园山庄的德军高级将领以为没人听得见，在闲聊里把自己的真实想法说了出来。把这些对话同战场记录逐条对照，将军们在战争不同阶段的盘算就第一次有了可靠的材料。片中最刺骨的是他们转述暴行时的那种语气，轻描淡写得让人不舒服。适合二战史爱好者，尤其适合想跳出教科书结论、亲自过一遍一手证据的人。看完对所谓军人荣誉会有新的判断。全片没有用夸张的控诉语气，而是冷静地摆证据，档案、录音和战地材料一比对，争论本身的虚伪就露了出来。看完至少会明白，所谓只是服从命令这套说法，在这些将领私下的闲聊里根本站不住。五集看下来门槛不高，也不需要军事史打底。｜TMDB 8.0"
  date: 2007-11-13
  added: 2026-05-02
  image: dc-059.jpg

- id: dc-058
  title: "植物之歌"
  category: 纪录片
  tags: ["纪录片", "种出个地球"]
  quark_url: "https://pan.quark.cn/s/fa1728ae44d3"
  baidu_url: "https://pan.baidu.com/s/1oVD6IMpT-TyvtIoqMdiRHw"
  baidu_code: "atr5"
  description: "我们习惯把人类看成地球的赢家，但真正改写这部地球史的其实是不会动的植物。所有动物都依赖植物为生，它们让第一批两栖动物摆脱对水的束缚，见证过恐龙的兴衰，也依次把昆虫、哺乳动物、鸟类乃至人类推上台前。这部系列用一个翻转过的视角重讲四十六亿年：从植物如何登陆、如何发明花与种子，到它们怎样改造大气与土壤，甚至参与把岩石变成沃土。宏大叙事之外也有很具体的段落，种子传播的那些花招尤其好玩。适合愿意暂时丢掉以动物为中心视角的观众，科普底子不需要太厚，看完再看路边的草木感觉会不一样。它另一个有意思的地方是把改变世界的功劳还给了看起来最被动的那群生物，下次走进植物园，眼里看到的就不只是好看，而是策略与竞争。对于平时完全不关心植物的观众，讲到花朵如何吸引传粉者那一段也会让人坐直起来。｜TMDB 8.3"
  date: 2012-02-07
  added: 2026-05-02
  image: dc-058.jpg

- id: dc-057
  title: "神秘的玛雅"
  category: 纪录片
  tags: ["纪录片", "历史"]
  quark_url: "https://pan.quark.cn/s/0816352118c3"
  baidu_url: "https://pan.baidu.com/s/1wZZGfTmK00oGhn1YD6ffJQ"
  baidu_code: "jn96"
  description: "这是一部专门拍给巨幕看的片子，所以叙事用了一个最简单的入口：一个住在玛雅废墟旁边的小男孩，缠着来考察的考古学家追问自己的祖先当年过着什么样的生活。顺着这条线，摄制组走访了墨西哥和危地马拉的十几处遗址，图卢姆、奇琴伊察这些熟悉的名字都在其中。巨幕的价值在这里体现得格外充分，那些被丛林吞掉一半的石阶和金字塔压到眼前时，规模感是电视画面给不了的；水下洞穴和祭祀场所的段落尤其适合大银幕。适合对玛雅文明和中美洲考古感兴趣的观众，带孩子做一次入门也很合适，节奏不拖沓，一小时出头看完。它并没有把玛雅讲成一个突然消失的谜题，而是把城市如何被丛林一步步收回去的过程摆出来，这种处理比一味强调神秘更令人信服。看之前不必做功课，片中对历法与城邦关系的交代足够清楚。巨幕带来的沉浸感远超任何小屏版本，遇到大银幕排片值得去看。｜TMDB 4.8"
  date: 1995-01-01
  added: 2026-05-02
  image: dc-057.jpg

- id: dc-056
  title: "大自然：爱登保罗爷爷带你看绝妙的蛙"
  category: 纪录片
  tags: ["纪录片", "神奇的青蛙"]
  quark_url: "https://pan.quark.cn/s/68199857edd7"
  baidu_url: "https://pan.baidu.com/s/1nbC0SadMHHfgre1FQ17OZg"
  baidu_code: "0bo1"
  description: "现存的蛙类和蟾蜍超过五千种，形状、颜色和体型的差别常常出乎意料，但它们大多伏在草丛与池塘边，很少被认真端详。大卫·爱登堡爵士这一集配合当时最新的超高清设备，用低角度、微距和延时把这些小动物拉到眼前：蜕皮、抱对、产卵、护卵和照顾幼体的过程全都看得清清楚楚，皮肤的纹理和鼓膜的颤动也是头一回这么清晰。看点是货真价实的影像本身，尤其那些很难靠运气碰上的繁殖细节。解说依旧是那位老人熟悉的节奏，不催也不赶。适合两栖动物爱好者、自然纪录片观众，也很适合陪孩子一起认识这些常被略过的小邻居。看完再路过池塘，会忍不住多蹲一会儿。影片收尾时还交代了两栖类眼下的处境：栖息地退化和疾病正让不少种类连名字都没留下就消失了，这也是为什么把这些画面拍下来本身就是件要紧事。五十分钟不长，回放一遍也不亏。｜TMDB 8.3"
  date: 2014-06-25
  added: 2026-05-02
  image: dc-056.jpg

- id: dc-055
  title: "生命循环：奇异的腐烂科学"
  category: 纪录片
  tags: ["纪录片", "生命循环 奇异的腐烂科学"]
  quark_url: "https://pan.quark.cn/s/6dbda8c3fb78"
  baidu_url: "https://pan.baidu.com/s/1vz7yQJVphAsd-xwOKCVtiQ"
  baidu_code: "95az"
  description: "我们习惯说生命始于出生、终于死亡，这部片子偏要讲另一套：生命不是一个点而是一个环，没有起点也没有终点，只有循环。腐烂从来不是生命的反面，没有分解就没有新生，真菌、细菌和食腐动物才是维持整个系统运转的那批劳作者，它们把尸体拆解成下一轮生长的原料。全片把通常让人转过头去的腐败过程认真拍给你看，配上实验室里的解释，看完会改观，对「脏」这个概念也不再那么确定。适合好奇心重、肠胃也比较结实的观众，愿意重新打量自己与自然相处方式的人会得到最多，那些长期被忽视的分解者值得一次正经的介绍。另一个收获是重新估价那些被叫作害虫和病菌的角色，它们在生态账本上的贡献，远多于我们平时愿意承认的部分。如果说片子有什么立场，那就是让人重新接受一件事实：分解不仅必要，而且相当精巧，称得上被低估的工程。｜TMDB 5.2"
  date: 2011-12-06
  added: 2026-05-02
  image: dc-055.jpg

- id: dc-054
  title: "生命博物馆"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/0106211cf269"
  baidu_url: "https://pan.baidu.com/s/1lv7XNYQNUEr8KsPUvyisCg"
  baidu_code: "vsby"
  description: "主持人吉米·多尔蒂走进英国自然历史博物馆的幕后，要回答的问题很实在：为什么要保存七千万件标本，如果它们只是堆在仓库的抽屉里，究竟还有什么用。片子和馆里的研究人员近距离聊，把看似尘封的日常与当下的现实连了起来，保护生物多样性、防治热带传染病、追踪物种的长期变化，全都依赖这些一百年前采集的样本。让人意外的还有 标本库房内部的样子，以及标本如何被借走、被重新校准的过程。适合对博物馆、标本馆和科研幕后好奇的观众，看完下次再走进展厅，看那些玻璃柜的眼神会不一样。让人意外的是这些抽屉里的东西有多忙：每年借出成千上万件标本，新的物种被定名，旧的错误被校正，一座两百年的馆藏至今仍在改变我们对自然的认识。对普通观众而言，它的价值在于把博物馆从供人参观的地方还原成一处仍在运转的研究现场。｜TMDB 0.0"
  date: 2010-03-18
  added: 2026-05-02
  image: dc-054.jpg

- id: dc-053
  title: "寄生兽：生命的准则"
  category: 纪录片
  tags: ["纪录片", "动画", "剧情", "动作冒险", "生命"]
  quark_url: "https://pan.quark.cn/s/e49f763cdd0c"
  baidu_url: "https://pan.baidu.com/s/1K6aximJr6apy5yznqj4F4A"
  baidu_code: "j34c"
  description: "某市接连发生残忍的分尸案，尸体被切得整齐，看不出凶器痕迹，凶手却不是人——一种被称为寄生兽的生物侵入人体，以寄生脑部为目标，完成后与脑细胞同化，接管这具身体，并以同物种为食。普通高中生泉新一某天被一只虫子侵入，对方吞噬了他的右手，从此他不得不与这个自称右的寄生生物共存。他不敢把这件事告诉家人和朋友，却逐渐发现喜欢的人似乎察觉到了他的变化。这部动画真正想讨论的不是打斗，而是共生之后人还剩下什么：共感消失、情感变淡，边界一点点模糊。右这个角色的设计是全片最妙的一笔，从纯粹的求生本能慢慢学会关心另一具身体。动画在还原原作方面相当克制，人物造型也保留了漫画的年代感。后期把视线从战斗转向人类在生态系统里的位置，节奏偏冷静，追问相当尖锐，结尾的处理也留了余地，不把话说死。｜TMDB 8.3"
  date: 2014-10-09
  added: 2026-05-02
  image: dc-053.jpg

- id: dc-052
  title: "弗朗西斯科玩转意大利"
  category: 纪录片
  tags: ["纪录片", "玩转意大利"]
  quark_url: "https://pan.quark.cn/s/fff962418333"
  baidu_url: "https://pan.baidu.com/s/1f1eWmcoNHRbtBcO2lCef4w"
  baidu_code: "f5lm"
  description: "2006 年夏天，BBC Two 播出这档系列时大概没料到它第二年会被安排重播。弗朗西斯科开着那辆老式敞篷跑车从意大利北端出发一路向南，把全境跑了个遍：古老的建筑、地中海沿岸层层叠叠的文化、各地形形色色的人文风俗，都被他慢慢问出来。他的路数不是打卡景点，而是跟当地人聊天、坐下来吃一顿，所以城市的性格是经由人讲出来的，而不是念出来的。适合计划去意大利、想把行程排厚一点的观众，也适合只想坐在家里看一路风景的人。中部那段关于食材和小镇节庆的内容集中度最高，北部的湖区和南部的海岸线各有各的颜色。片子对南北差异讲得很坦白，那些生活习惯上的隔阂和当地人的吐槽，普通旅行手册里通常一句也看不到。一路看下来最奢侈的其实不是车和风景，而是他愿意为一顿饭停下来聊上两个小时的那种从容。｜TMDB 6.5"
  date: 2006-06-11
  added: 2026-05-02
  image: dc-052.jpg

- id: dc-051
  title: "都铎王朝"
  category: 纪录片
  tags: ["纪录片", "剧情", "爱情", "王朝"]
  quark_url: "https://pan.quark.cn/s/79ecc41078d3"
  baidu_url: "https://pan.baidu.com/s/1A05srxYsKJeaxfeB_JX9rA"
  baidu_code: "6nk6"
  description: "16 世纪中叶，英国驻法国大使遇刺身亡，而死者正是亨利八世的叔叔，年轻的国王勃然大怒，立刻召集大臣准备兵发法兰西。红衣主教沃尔西权衡各方利益，并不赞成开战，于是想方设法让英法通过协商收场。宫里另一条线同样棘手：王后凯瑟琳只为亨利生下一个女儿，逐渐失宠，而真正让国王动心的是侍女安·博林。为了能明媒正娶，亨利与沃尔西密谋离婚，一举牵动外交与宗教格局，其间热病蔓延、全国恐慌，一场宫廷震荡随之而来。整部剧把都铎宫廷的奢靡与危险拍得相当直接，服化道下了血本，光看场面也值。后续几季的重心逐渐转向宗教改革与几位王后的命运，格局越铺越大。需要注意的是它把戏剧性放在史实严谨之前，当成历史改编剧看会更舒服。宫廷里的对话写得相当锋利，一句客气话背后往往是杀机，整体追起来也不费劲。｜TMDB 7.8"
  date: 2007-04-01
  added: 2026-05-02
  image: dc-051.jpg

- id: dc-050
  title: "狂野天气探秘"
  category: 纪录片
  tags: ["纪录片", "真人秀", "Wild Weather with Richard Hammond"]
  quark_url: "https://pan.quark.cn/s/2b71d2b41b15"
  baidu_url: "https://pan.baidu.com/s/1dJLSRNX6heUSh2hKL2Me7A"
  baidu_code: "ukqj"
  description: "《最高档》的主持人之一理查德·哈蒙德在这部片里四处跑，专挑最反常的天气现象下手：掀起龙卷风的雷暴、能把汽车掀翻的阵风、毫无征兆就淹掉整条街的暴雨。他的办法是一路追到现场，用假人、模型和小型实验把为什么会这样演示出来，不需要任何气象学底子就能看懂。整体风格热闹，偏爱大场面，也毫不掩饰对视觉冲击的追求。片中几位气象学者的解释其实相当到位，只是被夹在娱乐段落之间，容易被忽略。哈蒙德本人并不是气象专业出身，这种门外汉视角反而让提问更贴近普通观众的疑问。每集只挑一个现象讲，篇幅不长，节奏快，结尾还会落到防范与预警上，实用性不算低。想入门大气科学的话，它算是一块不错的敲门砖——先被场面勾住，再去追究原理。适合带着孩子一起看的家庭观众，或者单纯对极端天气好奇的人；期待严肃科学纪录片的会嫌它综艺味太重。｜TMDB 7.3"
  date: 2014-12-01
  added: 2026-05-02
  image: dc-050.jpg
- id: dc-049
  title: "灌丛下的生命"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/7c641d5f5187"
  baidu_url: "https://pan.baidu.com/s/1B8C6KsA4qcKdXUiIvbRypA"
  baidu_code: "q60e"
  description: "我们脚下这一层通常被忽略：草丛里、落叶下、墙缝中，藏着一个数量远超想象的世界。大卫·爱登堡在这部系列里把镜头压到离地几厘米的高度，专门讲无脊椎动物——会发光的蠕虫、吐丝手法复杂的蜘蛛、专吃蝙蝠的蜈蚣、生命周期长得离谱的蝉，还有大量连名字都没有的小角色。得益于照明、光学与电脑化机械操控的进步，摄制组第一次能以接近这些生物自身的尺度去拍摄，于是求偶、捕猎、伪装这些行为都被清清楚楚地拍了下来。拍摄难度其实高于大型动物：景深极浅、动作极快，许多镜头要反复尝试才能拿到，片中也展示了几项专门为此改造的设备。解说保持了一贯的克制，遇到尚未定论的习性会直接说明，不硬凑故事。它们个头小，生存机制却一点不简单：力量、耐力与感知方式都按另一套比例运转。看完大概再也不会用虫子这个词一概而论。｜TMDB 8.3"
  date: 2005-11-23
  added: 2026-05-02
  image: dc-049.jpg

- id: dc-048
  title: "寂静之战"
  category: 纪录片
  tags: ["纪录片", "潜艇舱内的战争与生活"]
  quark_url: "https://pan.quark.cn/s/a6afd12e4c1b"
  baidu_url: "https://pan.baidu.com/s/1MqC-RbCl4XVuXyjLSZ0w4Q"
  baidu_code: "jagq"
  description: "冷战时期水面之下还有一场战争：美国、英国与苏联的潜艇在大洋深处互相搜寻、跟踪，偶尔真的撞在一起，胜负却从不对外公开。片子把两条线拧在一起讲——一边是技术层面的猫鼠游戏，声呐、静音技术与情报比拼逐年升级；一边是潜艇兵的真实处境，在密闭的铁管里待上几个月，噪音、气味、无所事事与随时可能到来的危险并存。不少细节来自当事人的回忆，语气平静，反倒更让人绷紧。档案解密是这部片子的基础，很多细节在当年属于绝密，如今才有得讲。片中对事故与误判的记述相当克制，越克制越有分量。它也点出了技术竞赛的另一面：每一次更安静的潜艇出现，都意味着下一轮投入。片中对潜艇兵日常的那几段最扎实，餐食、作息与噪音都被拍了出来。适合对军事史、尤其冷战海战与潜艇题材感兴趣的观众。｜TMDB 6.0"
  date: 2013-12-05
  added: 2026-05-02
  image: dc-048.jpg

- id: dc-047
  title: "深蓝"
  category: 纪录片
  tags: ["纪录片", "动作冒险", "剧情"]
  quark_url: "https://pan.quark.cn/s/f0cdd1f71c66"
  baidu_url: "https://pan.baidu.com/s/1H2jseZ3VISP3isQLtIEfOA"
  baidu_code: "mczl"
  description: "《深蓝》是 BBC 自然历史组在电视系列《蓝色星球》之后推出的海洋纪录电影，由 Alastair Fothergill 与 Andy Byatt 联合执导。摄制组下潜到水下五千米，在全球两百多个海域取景：抹香鲸的洄游、鲨鱼捕食、虎鲸逐浪、北极熊涉冰，最后把七千小时素材剪成约九十分钟的银幕版本，配乐里混进了真实的海洋声响。它不是素材汇编式的科教片，而是为影院大银幕拍的观赏作品，节奏按戏剧结构安排，段落之间有明确的起落。片中对深潜设备与拍摄方式也有简短交代，能看出这些画面来之不易。画面与配乐的完成度至今仍是同类作品的标杆，大银幕上看与小屏幕上看差别不小，条件允许的话值得投到大屏。想看更系统的海洋知识可以看系列版，想看一部电影就看这个，如果只想看一部，从这一部开始最省事。｜TMDB 6.9"
  date: 2009-07-15
  added: 2026-05-02
  image: dc-047.jpg

- id: dc-046
  title: "追踪海洋巨兽"
  category: 纪录片
  tags: ["纪录片", "海洋巨兽"]
  quark_url: "https://pan.quark.cn/s/b4641a1643d2"
  baidu_url: "https://pan.baidu.com/s/15p2NLAZ9inVyfptgiAdKgA"
  baidu_code: "kzjc"
  description: "抹香鲸的智慧、黄鳍金枪鱼的速度、座头鲸那些听上去有些诡异的叫声、难得一见的蝠鲼龙卷风，面对海洋，人类的认知其实相当有限。海洋探险家帕特里克·戴克斯特拉专挑地球上人迹罕至的角落跑，去追踪那些被叫作怪兽的生物，以及围绕它们流传已久的传说。每一集跟着他深入气候恶劣的海域，一边看让人屏息的画面，一边把这则传说背后到底有没有真东西厘清。适合喜欢海洋题材和探险纪录片的观众，对传奇生物怀有好奇心的人尤其合适。拍摄地点的偏远程度本身就是看点，很多镜头光是抵达就用了好几天。看完会很想下一趟海。它的态度也相当坦白：传说大多经不起推敲，但澄清的过程往往比传说本身更有意思，因为那意味着我们对海洋的了解仍然是空白。几段下潜拍摄的画面信息量极大，能看出人与这些庞然大物真正相遇时，距离感有多悬。喜欢海的人看了会别有感触。｜TMDB 0.0"
  date: 2020-11-12
  added: 2026-05-02
  image: dc-046.jpg

- id: dc-045
  title: "法国花园"
  category: 纪录片
  tags: ["纪录片", "法国花园之旅"]
  quark_url: "https://pan.quark.cn/s/078067d74ca0"
  baidu_url: "https://pan.baidu.com/s/1KM60Zwv0PhuptF3_BXDbtg"
  baidu_code: "cxor"
  description: "法国人怎么理解一方园子？从讲究轴线与对称的古典花园，到各地人家门口既好吃又好看的菜园，再到出自艺术家之手的现代园林，园艺家蒙提·唐带着流利的法语一路走访，看这片土地上的庭园观念如何随时间更替。它不急着赶路，顺着季节和地域慢慢走，与其说是种植教程，不如说是通过花园去认识一种生活方式，在这里吃的和看的从来不是两回事。主持人一路用法语跟园丁聊天本身就很耐看。适合喜爱园艺、慢旅行和法式生活内容的观众；想在里面学具体修剪和配土技巧的话，篇幅确实有限。中部那些修道院园子的历史最厚。至于法国人凭什么能把观赏和实用塞进同一个园子，片子给出的答案不在园艺书里，而在当地人究竟怎么用这块地上。镜头里多数园子平日并不对公众开放，这一点也让它区别于常规园艺节目；跟着走完一圈，等于替自己攒了一份旅行清单。｜TMDB 7.0"
  date: 2013-02-01
  added: 2026-05-02
  image: dc-045.jpg

- id: dc-044
  title: "沉没城市"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/78487dd8faa1"
  baidu_url: "https://pan.baidu.com/s/12MaPcEZwcNSWjBWQBEOQvw"
  baidu_code: "6uth"
  description: "沿海超级城市为不被海水吞掉，砸下的钱是天文数字：威尼斯的可移动水闸、荷兰三角洲的引水槽、日本的海啸堤坝、新泽西州的风暴防御系统，每一处都是巨型工程。这部纪录片把这些项目放在一起横向对比，既展示工程本身的奇观——巨大的闸门如何立起来、围堰如何合龙，也追问更麻烦的问题：这些钱是否真的买到了安全，工程改变了当地的生态与渔业没有，几十年后又该怎么办。几处方案背后是截然不同的思路，有的选择与海共存的柔性策略，有的坚持硬挡。威尼斯那段最复杂，工程背后牵着旅游业、生态与政治三方角力，进度一拖再拖。片中受访的工程师与居民给出的答案往往不一致，这种落差本身就是看点。适合喜欢工程类纪录片、关心海平面上升的观众。几处工程的造价都相当惊人，留意数字的位数就明白了。"
  added: 2026-05-02
  image: dc-044.jpg

- id: dc-043
  title: "森林田野和天空：师法自然的艺术"
  category: 纪录片
  tags: ["纪录片", "森林田野和天空"]
  quark_url: "https://pan.quark.cn/s/f7899a670c70"
  baidu_url: "https://pan.baidu.com/s/1oCHONgFicr_VtAnZxrU87A"
  baidu_code: "jhgv"
  description: "艺术史学家 James Fox 走访英国六处景观，提出一个看着简单却很少被问到的问题：英国的艺术为什么长成这个样子。他的答案不在画室里，而在脚下的土地中，沼地、白垩丘陵、潮汐河口塑造了画家观看世界的方式。片子把康斯特勃、透纳、赫普沃思这些名字放回他们真正站过的山坡和田野里讲，画面本身就是一趟旅行。适合准备去英国、或者想入门英国艺术史的观众。期待逐幅解析作品的会失望，它讲的是人和土地之间的关系，而不是技法。出镜的那六处风景很值得照着排一趟路线，比对着挂在博物馆里的画来理解要直观得多。它的说服力来自取景：站到画家当年站的那块坡地上，天空、光线和地平线的比例一对照，笔下的颜色为什么是这样就不再抽象。挑选的几位艺术家也避开了教科书上的热门，反倒更见功力。以后再看英国的风景画，会先去找地平线在哪。｜TMDB 7.0"
  date: 2016-05-03
  added: 2026-05-02
  image: dc-043.jpg

- id: dc-042
  title: "不成功毋宁死：郎朗的故事"
  category: 纪录片
  tags: ["纪录片", "音乐", "电视电影", "朗朗的钢琴奋斗之路"]
  quark_url: "https://pan.quark.cn/s/c24c0cfa2226"
  baidu_url: "https://pan.baidu.com/s/1okXbs1yLph5pFPuPZ5qDZA"
  baidu_code: "62jr"
  description: "这部 BBC 的 Imagine 系列要回答的是一个不太好答的问题：郎朗是怎么变成郎朗的。片子从童年讲起，父亲近乎孤注一掷的投入、从沈阳一路练到北京的那些年、把必须成功当成唯一选项的家庭气氛，再回头看这套方式究竟付出了什么代价；镜头同时跟着他今天的巡演生活跑，排练厅、后台、机场连成的那条线和早年的日子并排放着，对比相当鲜明。受访的父母那段话坦率得有点意外。适合琴童家长和古典乐爱好者；只想安安静静听演奏的人要留意，这部讲的是成名背后的那一部分，而不是一场完整的音乐会。也许最值得家长看的是它的克制：片子没有替这套教育方式下结论，而是把两种叙事并排放着，让观众自己判断代价。穿插的演奏段落挑得很聪明，既撑住了节奏，也提醒人这么多年的苦练到底换来了什么。看完大概会重新掂量练琴在一个家庭里的比重。"
  date: 2012-11-12
  added: 2026-05-02
  image: dc-042.jpg

- id: dc-041
  title: "新西兰：神话之岛"
  category: 纪录片
  tags: ["纪录片", "新西兰.神话之岛"]
  quark_url: "https://pan.quark.cn/s/17a33c2813ac"
  baidu_url: "https://pan.baidu.com/s/1UyJlzW-dbpZX5wd_mqScZQ"
  baidu_code: "971y"
  description: "新西兰自恐龙时代起就和别处隔开了八千万年，结果相当出人意料：在一个缺少哺乳动物的环境里，鸟类演化出一整套属于自己的身形与生态角色，连本该会飞的蝙蝠都学会了在地面上爬行觅食。这部三集系列由演员山姆·尼尔讲述，带着观众走遍这条充满异国色彩的岛链，看这些动物如何在没有天敌的世界里活成了今天的样子。适合喜欢岛屿生态与演化题材的观众，单独看画面也很值。尼尔本人就是本地人，语气松弛，听起来相当舒服，不像在念解说词。播放顺序从北岛到南岛一路往下，跟着看完基本能拼出这个国家野生动物的全貌。最有意思的是它反复强调的那件事：这里的动物长成这样，不是因为新西兰格外仁慈，而是隔离让它们在几千万年里从没见过需要逃跑的东西。人类带来的外来物种改变了这一切，片子没有回避。看完会对岛屿生态为什么这样脆弱有个很具体的理解。｜TMDB 8.9"
  date: 2016-07-19
  added: 2026-05-02
  image: dc-041.jpg

- id: dc-040
  title: "探究班诺克本之战"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/7d32db8030b8"
  baidu_url: "https://pan.baidu.com/s/1DLxVGVkuaTePbuTBEBoyVg"
  baidu_code: "xus7"
  description: "1314 年的班诺克本战役是苏格兰与英格兰之间最著名的一场冲突，罗伯特·布鲁斯率军取胜，局面就此改写。七百年后，尼尔·奥利弗与考古学者托尼·波拉德回到那片战场，想弄清传说和史实之间到底差多少：当年兵力究竟多大、战场具体在哪一侧、那些被反复传颂的细节又有几分真。他们挖探沟、测金属残件、比对文献，也毫不客气地指出哪些记述经不起推敲。现场发掘的进展被如实记录，包括一无所获的探沟，这一点比结论更有意思。片子最有意思的是那个方法论上的对照——被写下来的历史与被挖出来的证据常常对不上，而后者往往更朴素、更不起眼。片中对中世纪兵器与战场医学的简短演示也很直观。结尾对这场战役如何被后世塑造成民族象征，也有简短的反思。即便对这段历史毫无了解也不影响观看。"
  date: 2014-06-02
  added: 2026-05-02
  image: dc-040.jpg

- id: dc-039
  title: "猎捕行动"
  category: 纪录片
  tags: ["纪录片", "剧情", "犯罪", "捕猎"]
  quark_url: "https://pan.quark.cn/s/c89565f82904"
  baidu_url: "https://pan.baidu.com/s/1VvlCncix6q0E-uNsF4pFMA"
  baidu_code: "c6f6"
  description: "一座位置保密的监狱发生爆炸，关在里面的全国最凶残的几名连环杀手趁机逃了出去。被迫回到这场游戏里的是一位早已退出的前侧写师，她必须和一支由士兵、间谍、特工拼凑起来的队伍合作，赶在那些人再次动手之前，把他们一个一个找回来。它归类在纪录片，实际是剧情化的纪实叙事，追捕场面一场接一场，几乎不给喘息的空隙；真正占篇幅的其实是侧写师这条人物线，她每一次靠近对方时所付出的心理代价，比重远远超出表面的枪战。适合喜欢犯罪题材、享受紧张节奏的观众。心脏不太好的话建议白天看。制作上它更像一部刑侦剧，纪实只是包装：地图上的推演、审讯室的对话和现场接头都按类型片的节拍走。因此不必拿纪录片的标准去要求它，把它当成一场高强度的追捕故事来看，体验会顺畅得多。适合一口气刷完，而不是一集一集慢慢补。｜TMDB 7.1"
  date: 2025-01-19
  added: 2026-05-02
  image: dc-039.jpg

- id: dc-038
  title: "挑战珠穆朗玛峰"
  category: 纪录片
  tags: ["纪录片", "挺进珠峰"]
  quark_url: "https://pan.quark.cn/s/32504f4a0d37"
  baidu_url: "https://pan.baidu.com/s/1KfBvlW_kNkHLuAvbVYVU0Q"
  baidu_code: "muz5"
  description: "珠峰被攀登过太多次了，这部片子想换个角度讲它，于是把镜头同时交给三支各走各路的探险队：一支乘热气球升到珠峰所在的空域，一支靠独木舟加徒步接近山脚，还有一支坚持不使用供氧设备登顶。三条路线、三套完全不同的准备与风险，对照出来的却是同一种执念。它把重点放在筹备和过程上，装备怎么取舍、天气窗口怎么等、队员之间的决策冲突怎么收场，而不是只在乎冲顶那几秒钟。适合喜欢登山、极限运动和探险题材的观众，也是对商业登顶这个话题有兴趣时可以拿来参考的一手资料，看完会对这条路线到底有多难有个实感。它也不回避商业攀登的另一面：路线拥堵、向导的负担、山上遗留的垃圾和氧气瓶，都留了篇幅。正因为如此，它比单纯的登顶纪录片耐看。想看壮观画面的人同样能得到满足，高海拔那几组镜头足够撑起整部片子，适合周末一口气看完。"
  date: 2013-12-28
  added: 2026-05-02
  image: dc-038.jpg

- id: dc-037
  title: "打破边界：我们星球的科学"
  category: 纪录片
  tags: ["纪录片", "打破边界.我们星球的科学"]
  quark_url: "https://pan.quark.cn/s/69321dcd9257"
  baidu_url: "https://pan.baidu.com/s/125-4PfaNdJrgyoiLfNTSdQ"
  baidu_code: "aqzf"
  description: "看过《我们的星球》的人多半会追问一句：片子里那些结论到底是怎么来的。这部影片把画面背后的科学原理摊开解释，由大卫·爱登堡爵士解说，并由提出地球界限框架的学者亲自讲解自己的模型：几条关键阈值一旦被推过，系统就可能滑向另一种状态，而这些阈值彼此相连，牵一处动全身。它既是一次科学普及，也是对自己作品的注解，把从前零散的环保印象理成了一个框架。适合关注环境议题、想知道这些说法从哪来的观众。片长不长，一口气看完刚好，留下的是一种清醒的紧迫感，而不是单纯的心情沉重。相比情绪化的环保宣传，它的说服力来自数据本身，因此更适合当作入门的第一部，而不是又一套让人看到就烦的口号。看之前不必担心门槛，片中每个结论都留了数据来源，愿意深究的观众顺着图表注释还能找到原始出处。｜TMDB 7.5"
  date: 2021-06-03
  added: 2026-05-02
  image: dc-037.jpg

- id: dc-036
  title: "意大利歌剧"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/9df81c4924c2"
  baidu_url: "https://pan.baidu.com/s/1gVRHk1pKhlawm0TBuoJgHw"
  baidu_code: "8b1j"
  description: "歌剧常被当成门槛很高的事，这部片子偏要从最容易亲近的地方讲起。由指挥家安东尼奥·帕帕诺带路，它讲：历史脉络、各时期风格的差别、站到台前的作曲家与歌手，以及戏院后台那套不为观众所知的规矩。它刻意把音乐放回日常里去讲，方言、地方剧院、教堂和节日都在其中，看过之后既能认得出几段著名咏叹调，也能明白这个国家为什么会把歌剧当成自家的东西。适合刚开始接触歌剧、想找个清晰入口的观众，穿插的现场演唱挑得恰到好处。它把歌剧为什么诞生在意大利这个问题拆成了几层：经济、方言、教会与宫廷的赞助，以及这种演唱方式本身的感染力，讲得清楚也不掉书袋。看的过程中会不断被提醒，这门艺术从一开始就是为了让听的人起鸡皮疙瘩，而不是为了显得高贵。作为入门片几乎挑不出毛病。"
  date: 2010-05-24
  added: 2026-05-02
  image: dc-036.jpg

- id: dc-035
  title: "恐龙星球"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/ed77e398e5a8"
  baidu_url: "https://pan.baidu.com/s/1cTE1-mLo53uG0iR7FbnATQ"
  baidu_code: "95ta"
  description: "过去二十年古生物学的进展，几乎改写了大众对恐龙的印象：新的化石证据显示它们遍布地球每个角落，演化出的形态比旧书里的描述古怪得多，有些种类放在一起比较，霸王龙都显得温和。这部系列做的就是这件事——用当时最先进的电脑复原技术，把这些新认识变成看得见的画面。它不是按年代罗列物种，而是按生存难题组织内容：怎么捕猎、怎么防御、怎么求偶、怎么在极端环境里活下去，每一段都从骨骼结构出发反推行为，再解释这个结论是怎么得出来的。解说对当时新发现的物种着墨不少，能看出古生物学这十来年跑得有多快。需要注意的是片中的复原带有推测成分，这一点片子自己也会说明，看上去反而更诚实。画面之外的方法论同样有意思，每一集的取舍标准也很清楚：能不能讲出一个有戏剧性的生存难题。适合对古生物有兴趣的观众。｜TMDB 7.9"
  date: 2011-09-14
  added: 2026-05-02
  image: dc-035.jpg

- id: dc-034
  title: "徒步尼罗河"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/756ec345c362"
  baidu_url: "https://pan.baidu.com/s/1vINryMrBnjOsUTqzxk84tw"
  baidu_code: "fmvc"
  description: "沿着尼罗河把它从头走到尾，听起来就不太可能，探险家 Levison Wood 还是这么干了，前后花了大约九个月。他穿过雨林、草原、沙漠和城市，也穿过局势不稳的地带，途中遇到的军警、牧民、渔夫和走私者构成了这条河真正的切面。它不追求极限挑战的节奏，更多是耐心地走、看、问，因此能看到旅行团绝不会经过的路段：干涸的支流、废弃的码头、靠河吃饭的小镇。适合喜欢长距离徒步旅行纪录片、对非洲有兴趣的观众，想了解这条河今天究竟是什么模样的人会收获不少一手信息，安全与运气在其中扮演的角色也交代得相当坦白。相比登顶式的探险叙事，它更接近一次耐心的地理课，看完会对这条河串起来的几个国家多一些具体的认识。整段旅程最打动人的并不是入海口，而是沿途那些把陌生人请进院子里、留他住一晚的段落，这才是河谷两岸真正的日常。｜TMDB 6.6"
  date: 2015-01-04
  added: 2026-05-02
  image: dc-034.jpg

- id: dc-033
  title: "巴塔哥尼亚：地球秘密乐园"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/93e6b380295c"
  baidu_url: "https://pan.baidu.com/s/1-OeuSAEdgSRKhHFIRsz53w"
  baidu_code: "gdd6"
  description: "巴塔哥尼亚地区几乎包括阿根廷本土南部的所有土地，面积约673,000平方公里，由广阔的草原和沙漠组成，从南纬37°伸展到南纬51°。其边界大约西抵巴塔哥尼亚安地斯山脉，北滨科罗拉多河，东临大西洋，南濒麦哲伦海峡；海峡南面的火地岛分别隶属于阿根廷和智利，通常也划入巴塔哥尼亚的范围内。 1519年，随麦哲伦环球旅行到达今天里瓦达维亚海军准将城附近的意大利学者安东尼奥·皮加费塔，看到当地土著居民－－巴塔哥恩族人脚着胖大笨重的兽皮鞋子，在海滩上留下巨大的脚印，便把这里命名为巴塔哥尼亚。出身于葡萄牙骑士家庭的麦哲伦，以骑士名字Patagon（Patagon是16世纪时一部著名骑士小说的主角）命名之，而“…｜TMDB 7.2"
  date: 2015-09-25
  added: 2026-05-02
  image: dc-033.jpg

- id: dc-032
  title: "宠物：内心狂野"
  category: 纪录片
  tags: ["纪录片", "宠物的天性"]
  quark_url: "https://pan.quark.cn/s/d11fe99d9541"
  baidu_url: "https://pan.baidu.com/s/16HnKyDkVDxDe92LEd7oaSg"
  baidu_code: "93ra"
  description: "猫为什么能沿墙直上直下，仓鼠为什么把吃不下的东西塞一脸，狗为什么会跳水——这些日常里的小怪癖，其实都留着野外祖先的痕迹。这部系列用隐藏拍摄的方式把答案拍出来：仓鼠爱跑轮子的执念、狗如何学会群居、猫怎样成为独来独往的猎手，都被放进了具体的场景。除了喵星人和汪星人，还有当保姆的猫、身手了得的仓鼠、被猎物戏耍的猫，相思鹦鹉为何学舌，兔子究竟为什么跳。后面还走到更远的地方：秘鲁放养的宠物狗、挖洞打洞的宠物兔、日本猫岛上的野猫。隐藏摄像机承担了大部分笑点，也顺带说明一件事：人在场与不在场，动物的表现完全是两回事。它最有价值的地方是把宠物行为还原成功能，而不是简单贴上可爱的标签。每集围绕一个主题展开，彼此不重复，随手挑一集也不乱。看完再观察自家那位，会发现不少习性能对上号。｜TMDB 8.0"
  date: 2015-01-21
  added: 2026-05-02
  image: dc-032.jpg

- id: dc-031
  title: "完美星球"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/c3ab40f8ef27"
  baidu_url: "https://pan.baidu.com/s/1oCOivIOND_FOQvNfl3jMiA"
  baidu_code: "m9mb"
  description: "地球是一颗完美的星球。大小、日地距离、自转公转、倾斜角度以及卫星等地球的方方面面都非常适合人类生存，其澎湃的自然力量完美地孕育了多彩的生命。全球气候系统的水循环将淡水输送到各个角落；洋流搅动了海底最深处的营养物质；阳光为世间万物带来温度和能量；剧烈的火山喷发形成了肥沃的土壤。因此，在我们的星球上，生命无处不在。从印度雨季潮湿的土地到夏威夷火山炽热的山坡；从巴哈马的潮汐岛屿到冰天雪地的埃尔斯米尔岛；从冬夜郊外嚎叫的北极狼群到春季结冰的身体慢慢融化的木蛙，从加拉帕戈斯群岛以吸食海鸟鲜血解渴的吸血地雀，到每年成群结队聚集在火山湖中繁殖的非洲小红鹳。《完美星球》将带领我们踏上一场无与伦比的视觉之旅，我…｜TMDB 8.7"
  date: 2021-01-03
  added: 2026-05-02
  image: dc-031.jpg

- id: dc-030
  title: "宇宙的奇迹"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/c7c0228a6e15"
  baidu_url: "https://pan.baidu.com/s/1BNmS629J2N8uZ-eHj7aJlw"
  baidu_code: "4kj2"
  description: "人类从哪来，宇宙又要往哪去——这两个问题被放在一起讲，靠的是地球上几处罕见的景观。布莱恩·考克斯教授站在这些地方，从日常能看见的现象出发，一步步推到背后的物理规律：时间为什么有方向，光速为什么是那条线，恒星的一生如何决定了我们身体里的元素。他的讲法有个特点，不回避公式背后的直觉，用极简的演示把抽象概念变得可感，因此没有理科背景也能跟上。每一集都选在地貌特殊的地方拍摄，景观本身也是论证的一部分。它反复强调的一点是：构成我们的物质来自恒星，这句话在片中被拆开讲了不止一次。考克斯本人从摇滚乐手转到粒子物理，这段跨界经历让他的讲法带点表演性。整部系列更像一场关于物理学的散步，而不是课程。适合对宇宙与物理感兴趣、又怕被术语劝退的观众，看完会重新看待头顶那片天空。｜TMDB 8.1"
  date: 2011-03-06
  added: 2026-05-02
  image: dc-030.jpg

- id: dc-029
  title: "孟买的铁路"
  category: 纪录片
  tags: ["纪录片", "孟买铁路"]
  quark_url: "https://pan.quark.cn/s/eee3608f0b93"
  baidu_url: "https://pan.baidu.com/s/1YxwCEwalJg__0ngoJneBwA"
  baidu_code: "81p8"
  description: "孟买的市郊铁路每天运送数百万人，是世界上最繁忙的通勤系统之一，而这套网络建于殖民时代，老化得厉害却仍在硬撑。影片把镜头交给它：乘客、司乘、站台上的小贩与线路维修工人，从清晨到深夜的往复被逐一记下——挤到无法转身的车厢、车厢门口挂着的通勤者、站台边自成秩序的生活。片中对事故与延误的处理也很实在：一次信号故障如何在几分钟内沿着整条线传导，站台上的秩序又是怎样自发维持的。它属于英式的社会观察纪录片，节奏克制、画面扎实，不刻意渲染苦难，也没有旅游宣传片那种浪漫化处理，更像一份写给这座城市的日常报告。几位受访者的自述撑起了情感主线，有人在这条线上跑了三十年。铁路在这里更像城市的骨架，抽掉它整座城市当天就会停摆。看的时候很难不联想到自己的通勤，这正是它跨越语言依然成立的原因。｜TMDB 1.0"
  date: 2007-07-18
  added: 2026-05-02
  image: dc-029.jpg

- id: dc-028
  title: "奥斯维辛集中营"
  category: 纪录片
  tags: ["纪录片", "犯罪", "悬疑"]
  quark_url: "https://pan.quark.cn/s/0ba35a57fa11"
  baidu_url: "https://pan.baidu.com/s/1Wuz09zpJFkhRPfjIKo2tcQ"
  baidu_code: "2ju7"
  description: "奥斯维辛是大屠杀的代名词，但它作为一个地方，在二战之前还有另一段平淡的历史。这部纪录短片从一个具体的物件切入——刺在囚犯身上的编号：先刺在胸前，后来改到左臂，据估计有约四十万个编号被刺在奥斯维辛的囚犯身上，而今天在世的幸存者只剩几千人。编号既是编号，也逐渐成了个人与集体的象征。影片用现代影像手段复现营区的设施与运作流程与囚犯抵达后的分流过程，让人看清它的规模与工业化程度，由梅丽尔·斯特里普担任讲述。幸存者的讲述被放在数字与档案之间，两者互相印证，也让这段历史不至于被抽象成统计。它不追求情绪冲击，越是平铺直叙，越能让人意识到这件事的组织化程度。时长不长，只有一集的分量，信息密度却很高，建议留出看完之后缓一缓的时间，也别把它当背景音放着看。｜TMDB 0.0"
  date: 2013-11-15
  added: 2026-05-02
  image: dc-028.jpg

- id: dc-027
  title: "天才发明家"
  category: 纪录片
  tags: ["纪录片", "动画", "家庭", "喜剧", "天才发明"]
  quark_url: "https://pan.quark.cn/s/5f24f346b255"
  baidu_url: "https://pan.baidu.com/s/1JfMsYdNxZWX36YdFSkUw0w"
  baidu_code: "g30d"
  description: "这是一部面向孩子的动画喜剧，主角崔希把聪明全用在了偷懒上：为了不用自己写作业和做家务，她先造了一台机器人代劳；为了让好朋友歇墨斯建立自信、顺利当上班长，又发明了机器人助教。每一集基本围绕一个新发明展开，笑料热闹，造型一个比一个滑稽，底下讲的其实是「耍小聪明往往把事情搞得更复杂」这个道理。孩子看热闹，大人看教训，两边都不亏。适合给学龄孩子看的家庭动画，篇幅短、节奏快，家长陪看也不费劲，每集十分钟出头，看完一集再决定要不要继续都没负担。它对小观众的尊重在于不把道理讲白，机器人每次失控的后果都由主角自己去收拾，笑点和教训都藏在结果里。动画风格朴素，配色明亮，看多了节奏飞快的作品之后，这种略慢的步调反而让人松口气。适合放假在家、想找点能陪孩子一起看的内容时打开。｜TMDB 8.2"
  date: 2002-02-18
  added: 2026-05-02
  image: dc-027.jpg

- id: dc-026
  title: "大猫"
  category: 纪录片
  tags: ["纪录片", "大猫.终极猎食者"]
  quark_url: "https://pan.quark.cn/s/51e895696567"
  baidu_url: "https://pan.baidu.com/s/1AErKkz0vddhMY4JQLXx0cA"
  baidu_code: "k02m"
  description: "一个科、四十张完全不同的脸，BBC 这部只用猫科动物撑起整季。从非洲狮、老虎、美洲豹到猎豹、云豹、雪豹、美洲狮、猞猁、豹猫、渔猫，再到黑足猫、兔狲、薮猫、沙漠猫这些难得露面的家伙，全都出场。它的编排不是按物种挨个介绍，而是把伏击、群居、攀爬、夜间潜行这些生存策略横向铺开对比，让人看清楚大体型和小体型各自的难处：一个要靠力量维持领地，一个得在捕食者的缝隙里活着，最后却演化出惊人相似的骨架与感官。适合喜欢动物纪录片的观众，猫科爱好者更是不容错过。黑足猫和兔狲那几段是极少见的影像，值得单独看一遍。拍摄层面最值得一提的是红外与高速摄影的应用，许多夜行种类根本不可能靠肉眼追踪得到。看完全季再回头看一眼家猫的脸，会对这副结构为什么长成这样多一点理解。｜TMDB 7.9"
  date: 2018-01-11
  added: 2026-05-02
  image: dc-026.jpg

- id: dc-025
  title: "老爵爷的大堡礁之旅"
  category: 纪录片
  tags: ["纪录片", "大堡礁"]
  quark_url: "https://pan.quark.cn/s/7db3b24e5fbe"
  baidu_url: "https://pan.baidu.com/s/1q4iLHAzwVuInjNU4sh_Rig"
  baidu_code: "y7lg"
  description: "大堡礁(英文：The Great Barrier Reef)，是世界最大最长的珊瑚礁群，位于南半球，它纵贯于澳洲的东北沿海，北从托雷斯海峡，南到南回归线以南，绵延伸展共有2011公里，最宽处161公里。有2900个大小珊瑚礁岛，自然景观非常特殊。 大堡礁的南端离海岸最远有241公里，北端较靠近，最近处离海岸仅16公里。在落潮时，部分的珊瑚礁露出水面形成珊瑚岛。 在礁群与海岸之间是一条极方便的交通海路。风平浪静时，游船在此间通过，船下连绵不断的多彩、多形的珊瑚景色，就成为吸引世界各地游客来猎奇观赏的最佳海底奇观。 1981年列入世界自然遗产名录。在60年后，爱登堡爵爷再次到访，利用最新科技的深水…｜TMDB 7.4"
  date: 2015-12-30
  added: 2026-05-02
  image: dc-025.jpg

- id: dc-024
  title: "Earth at Night in Colour"
  category: 纪录片
  tags: ["纪录片", "夜色中的地球"]
  quark_url: "https://pan.quark.cn/s/8369360738e5"
  baidu_url: "https://pan.baidu.com/s/11YTEjmj4KJ6TjsPt5UBk2w"
  baidu_code: "g6lw"
  description: "汤姆·希德勒斯顿担任旁白的这一系列，把摄制组送到了六大洲的夜色里。为此专门研发的夜视设备解决了过去最难的一件事：以前这类题材只能拍成一片模糊的黑白，这次终于能看到全彩的画面，羽毛的纹路、鳞片的反光、皮毛在月光下的层次都清清楚楚，连带着不少动物行为是第一次被记录下来的。解说温和，节奏舒缓，每集跟着几种动物各走一晚，像有人在你耳边压低声音讲故事，旁白的嗓音本身就贴这种夜色里的题材。适合喜欢《地球脉动》那一类自然纪录片的观众，也适合睡前看，画面够安静，也不至于越看越紧张。它和同类作品的差别在于视角的选择：讲的不是夜色有多神秘，而是动物如何在太阳落下之后依然把日子过下去。每段之前都有一段很短的技术说明，能看懂为什么这次的画面和十年前完全不同。单是极低照度下那几段画面，就足够说明投入有多实在。｜TMDB 8.2"
  date: 2020-12-04
  added: 2026-05-02
  image: dc-024.jpg

- id: dc-023
  title: "伟大的苏格兰人：那些塑造了一个民族的作家"
  category: 纪录片
  tags: ["纪录片", "塑造苏格兰的作家"]
  quark_url: "https://pan.quark.cn/s/ca58bf803ba7"
  baidu_url: "https://pan.baidu.com/s/1OCS5BGMblYk6CBP4Zjp0Qw"
  baidu_code: "xcdw"
  description: "2014 年 9 月苏格兰举行独立公投，关于苏格兰人意味着什么的讨论被推到台前。安德鲁·马尔给出的切入角度是：想知道这场争论的关键，得先认识几位来自北部的作家。他挑了跨越三个动荡世纪的人物——从博斯韦尔的日记与传记实践，到沃尔特·司各特如何一手塑造了风笛、格子裙与高地浪漫的对外形象，再到后世作家如何承接或反抗这套叙事。其中对司各特着墨最多，因为他留下的刻板印象最持久。片子讲的是文学如何反过来定义民族性格，这些影响至今仍在，好坏都有。片中穿插了对当代苏格兰作家的简短采访，让历史这条线接上了现在。公投的结果并不影响观看，它关心的是形象是怎么被一代代写出来的。整体篇幅不长，观点鲜明，片中对几位作家的生平交代得相当具体，不至于停在概念层面，也能当作一份作家入门清单。｜TMDB 9.0"
  date: 2014-08-16
  added: 2026-05-02
  image: dc-023.jpg

- id: dc-022
  title: "地球脉动"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/7558f7f6fba8"
  baidu_url: "https://pan.baidu.com/s/1h3IBxWZa7LVn36SAkqysxw"
  baidu_code: "fnsw"
  description: "如果要挑一部自然纪录片的入门作，多数人会指向这一部。摄制组花了数年，从南极到北极、从赤道到寒带，把非洲草原、热带雨林、荒凉峰顶和深海海底逐一走遍，拍到的不只是风景，更是动物在具体处境里的选择：奥卡万戈洪水涨落如何牵动整片区域的生存节奏，雪豹在漫天大雪中捕猎的珍贵画面，冰原上企鹅、北极熊与海豹之间严苛的依存关系，以及深海火山口高温环境下的奇特生物。它真正的野心是规模——用当时前所未有的拍摄周期和器材，把地球当作一个整体来讲，季节、洋流与迁徙都被串进同一套叙事。当年为了拍到雪豹那几组镜头，摄制组在高原蹲守了很久，幕后花絮本身就是一部片子。解说与配乐的分量拿捏得很好，从不多说，把判断留给画面。它对后来同类作品的影响，几乎能在之后的每一部里看到痕迹。｜TMDB 8.6"
  date: 2006-03-05
  added: 2026-05-02
  image: dc-022.jpg

- id: dc-021
  title: "地球的夜晚"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/72f77ff0031b"
  baidu_url: "https://pan.baidu.com/s/1iQo-WQcqdKPCHSI__5RTlQ"
  baidu_code: "ke83"
  description: "太阳落山之后，另一个地球才开始真正运转，而我们过去几乎没看清过它。这部纪录片用专门为弱光开发的新一代摄影设备，记录下夜里从未被认真拍到的画面：深色中的捕猎、求偶与迁徙，动物如何在没有光的环境里靠听觉、嗅觉和触觉行事，以及城市灯光之外的荒野怎么打发这十几个小时。技术突破是它最值得看的地方，过去这类题材只能拍成模糊的黑白影像，如今能看到全彩的细节，不少行为因此头一回被记录下来。适合喜欢自然纪录片、想看新鲜影像的观众，昆虫夜间活动的那几段常被单独拎出来讨论。如果你以为夜里的自然是一片沉寂，这一集会改掉这个印象：同样的山谷换了主角，白天四处躲藏的那些，往往在夜里反过来当了猎人。画面整体泛蓝不是为了好看，而是接近夜行动物真正看到的世界，这一点在技术上有过专门的说明。｜TMDB 7.4"
  date: 2020-01-29
  added: 2026-05-02
  image: dc-021.jpg

- id: dc-020
  title: "地球生灵"
  category: 纪录片
  tags: ["纪录片", "家庭"]
  quark_url: "https://pan.quark.cn/s/d066b71fe98a"
  baidu_url: "https://pan.baidu.com/s/1rH_MEuPDZiAP0oXfHCxiJw"
  baidu_code: "jyqd"
  description: "所有生物都要走完同一趟路：出生、长大、求偶、争夺、养育，最后把后代送出去。《地球生灵》（又名《原野中的一生》）由 BBC Earth 与 Magic Light 联合制作，挑了一批非常有代表性的动物，用接近故事片的方式把它们的一生剪在一起，因此节奏明显带着剧情起伏——有危险、有失去、也有温情。它和按地域或物种分类的传统自然纪录片不同，结构是跟着生命阶段走的，于是非洲象与帝企鹅会在同一段主题里相遇。不同物种之间的对照剪得很巧，同属育儿却策略完全不同，放在一起差异一目了然。配乐和镜头语言都往剧情片靠，提醒观众这些不是可爱的素材，是真的有输赢的一生。整体篇幅紧凑，一集不到一小时。这种剪法让小朋友很容易看懂，大人也不会觉得幼稚，情绪起伏比一般自然纪录片更强。｜TMDB 7.5"
  date: 2011-07-19
  added: 2026-05-02
  image: dc-020.jpg

- id: dc-019
  title: "地球上最热的地方"
  category: 纪录片
  tags: ["纪录片", "地球热极"]
  quark_url: "https://pan.quark.cn/s/0ff7d4f861ca"
  baidu_url: "https://pan.baidu.com/s/1KtbbNqC_e6fokLABcIzy6A"
  baidu_code: "lrhe"
  description: "东非大裂谷北端的达纳基尔沙漠，大概是地球上最不适宜人类居住的地方：火山与地震轮番来袭，岩浆与有害气体不断从地表裂缝里冒出来，白天的高温几乎没有喘息。可阿法尔人就在这里生活了上千年，靠采盐和赶骆驼维生。一支科学家团队进入这片区域，想弄清人在这种极端环境里是怎么活下来的——他们的日常生活、身体对酷热与缺水的适应，以及这块土地的地表之下究竟藏着什么。片子一半是地质考察，一半是人类学记录，两边互为解释。考察队在盐湖与火山口之间的移动本身就是一场硬仗，装备、饮水和时间安排都被拍了下来。它最有说服力的是那些具体细节：盐板如何开采、驼队怎样安排行程，而不是笼统的艰苦二字。看的时候会不自觉地想喝水，这大概是它最直观的说服力。它也不回避科学之外的现实：当地的矿产开采正在改变阿法尔人的生计。｜TMDB 10.0"
  date: 2009-01-01
  added: 2026-05-02
  image: dc-019.jpg

- id: dc-018
  title: "弗朗西斯科的地中海之旅"
  category: 纪录片
  tags: ["纪录片", "地中海深度探访"]
  quark_url: "https://pan.quark.cn/s/7562263f3289"
  baidu_url: "https://pan.baidu.com/s/1aQipM2uB6RnoPg5mS0eyzg"
  baidu_code: "6fm0"
  description: "出身威尼斯望族达莫斯托家族的弗朗西斯科，决定重走先祖的航路：从水城威尼斯出发，穿越亚得里亚海进入爱琴海，途经希腊的岛屿与古文明遗址，最后抵达兼跨欧亚的伊斯坦布尔。沿途他不只看遗迹，也不断上岸走进当地人的生活——渔港、集市、修道院、岛屿上的家庭餐桌与船坞，把地中海沿岸的历史层理与今天的日常并置起来。这条路线本身就是一部浓缩的交流史：腓尼基人、希腊人、罗马人、拜占庭与奥斯曼先后在这里留下痕迹，语言、宗教与饮食互相叠加，一层压着一层。几处遗迹的讲解并不深，重点放在它们与今天生活的联系上，看着轻松，不必事先做攻略。主持人并不掩饰自己是这条血脉的后代，这种私人视角让旅程多了一层对照。一集一个地点，节奏舒缓，适合慢慢看，也适合当作一趟没时间出发的旅行来看。｜TMDB 7.0"
  date: 2008-07-08
  added: 2026-05-02
  image: dc-018.jpg

- id: dc-016
  title: "南美遗失的帝国"
  category: 纪录片
  tags: ["纪录片", "南美失落王国"]
  quark_url: "https://pan.quark.cn/s/c58d7f9584d9"
  baidu_url: "https://pan.baidu.com/s/1Z-GcJN64a4Hif9SW88Bq9g"
  baidu_code: "wpbx"
  description: "由考古学者 Jago Cooper 主讲，他走访南美洲，想弄清那些已经消逝的古代文明究竟留下了什么：安第斯的城邦、亚马逊边缘的聚落、海岸线上的祭祀遗址，以及它们为什么会在相近的时间段里衰落。影片的价值在于把考古过程本身摆给你看——怎么读地层、怎样判断一处堆积是人工作用还是自然形成、结论又如何被新的证据推翻。它和猎奇式的失落文明节目不同，不急着给出神秘解释，更接近一份讲清推理过程的研究记录。几处遗址的实景拍摄相当有说服力，也能看出考古现场的琐碎与耐心；保存状况不理想的地方，影片顺带讲了文物盗掘与保护的两难。看完会明白一件事：所谓消失的文明，多半不是凭空不见了，而是换了种方式延续下来。它不提供爽快的结论，换来的是能站得住的推理过程。整体节奏偏学术，适合慢慢看。｜TMDB 9.0"
  date: 2013-01-14
  added: 2026-05-02
  image: dc-016.jpg

- id: dc-015
  title: "低地国家的高雅艺术"
  category: 纪录片
  tags: ["纪录片", "北欧艺术游"]
  quark_url: "https://pan.quark.cn/s/d40b463efe73"
  baidu_url: "https://pan.baidu.com/s/1SZiH7kfnO70EVxW1AQOLXA"
  baidu_code: "26cn"
  description: "荷兰与比利时这一小片地方，孕育了西方艺术史上密度惊人的一串名字：凡·艾克、博世、伦勃朗、鲁本斯、维米尔、梵高、蒙德里安、马格里特。安德鲁·格雷厄姆-迪克森回到欧洲，用乘船和骑车的方式穿行低地国家，把这些人和他们所处的时代串成一条线：从中世纪晚期油画的诞生，到荷兰黄金时代的市民趣味，再到超现实主义与抽象艺术这两种截然不同的现代路径。他不只讲作品，也讲这片土地本身的处境——边界一直在变、政治上长期被争夺，身份认同始终悬而未决，而艺术恰恰是在这种不确定里长出来的。行程本身也是看点，运河、田野与老城交替出现，把艺术放回它长出来的地方。他并不回避争议，比如殖民财富与黄金时代繁荣之间的关系，也点了出来。对没有艺术史基础的观众也友好，必要的背景知识都在现场讲清楚。适合对欧洲艺术史有兴趣的观众。｜TMDB 0.0"
  date: 2013-04-04
  added: 2026-05-02
  image: dc-015.jpg

- id: dc-014
  title: "加拉帕戈斯群岛"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/f08a149bf386"
  baidu_url: "https://pan.baidu.com/s/1MDw9Gm-AH-KQZZ8m1E3kqw"
  baidu_code: "ylt6"
  description: "加拉帕格斯群岛（又名科隆群岛）隶属厄瓜多尔，以其保持原始风貌的独特生物物种而闻名于世，素有“生物进化活博物馆”之称，1979年被列入世界遗产名录。 群岛总面积7882平方公里，由长达130公里的第一大岛伊莎贝拉岛、四个稍小一点的岛、以及总面积1平方公里多的14个小岛组成，才外还有许多岩礁和小礁。群岛最高处是伊莎贝拉岛上的沃尔夫火山，海拔1707米。 加拉帕格斯群岛是由四五百万年前巨大的海底火山喷发形成的，在一百多万年前浮出海面。直到现在，岛上的火山喷发还时有发生，群岛最西边的伊莎贝拉岛和费尔南迪岛上的火山一直没有消停，最近的两次喷发是在1995年和1998年。这里的火山不高，但面积很大，一座海…｜TMDB 7.5"
  date: 2006-09-29
  added: 2026-05-02
  image: dc-014.jpg

- id: dc-013
  title: "漫游世界建筑群"
  category: 纪录片
  tags: ["纪录片", "划时代建筑"]
  quark_url: "https://pan.quark.cn/s/183f0514e588"
  baidu_url: "https://pan.baidu.com/s/11CZoVBrPHcpjPk0o5R-91A"
  baidu_code: "np05"
  description: "各时期的建筑师彼此隔着几百年、几万里，做出的东西却常常不谋而合，这是主持人在看过太多例子之后才确信的事。他一路走访俄罗斯西北边陲基日岛的木结构教堂、埃及西奈的圣凯瑟琳修道院，以及印度、日本、中东的上百处建筑，把它们摆到同一条线索上比较：相似的需求会长出相似的形式，而每一处又能看出当地人对材料、气候与信仰的取舍。它并不打算教人认柱式或背年代，与其说是建筑史课，不如说是一次关于「人为什么这样盖房子」的长途旅行。适合喜欢建筑、计划和旅行完全不同的观众。看完再看身边的楼会多一层眼光。它还有一个优点是不挑观众：既不用记术语，也不需要背年代，只要对房子和人怎么住有兴趣就能看下去。主持人常年主持建筑类节目，讲东西时习惯亲手去摸材料、比划结构，这种实在劲儿比任何华丽旁白都更能说明问题。适合旅行前挑几集找灵感。｜TMDB 6.0"
  date: 2008-04-02
  added: 2026-05-02
  image: dc-013.jpg

- id: dc-012
  title: "冰河巨兽"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/13518d673ac9"
  baidu_url: "https://pan.baidu.com/s/17fd_ybJvf_ulJGlstfsnWA"
  baidu_code: "v3li"
  description: "两百五十万年前地球进入冰河时期，随之出现的是一批体型惊人的动物：比任何大象都高的猛犸象，犬齿将近十八厘米的猫科动物，还有许多今天看来相当陌生的野兽。爱丽斯·罗伯茨教授带着观众回到四万年前的欧洲，借助化石与最新的研究手段，一步步还原这些巨兽的外形、食性与迁徙路线，也解释它们最终为什么会消失。片子把推理过程摆在台面上：从一块骨头能读出什么，哪些结论只是推测，新的发现又如何推翻旧说法。她也反复回到同一个问题：这些动物的灭绝，到底有多大程度是人类造成的。现场发掘与实验室分析交替出现，能看出证据是怎么一步步积累的。画面复原做得相当克制，宁可留白也不乱补。它也提到这些巨兽与早期人类共存的那段时间，双方的关系至今仍在争论。适合对古生物与冰河时期感兴趣的观众。｜TMDB 7.3"
  date: 2013-05-19
  added: 2026-05-02
  image: dc-012.jpg

- id: dc-011
  title: "冰冻星球 2"
  category: 纪录片
  tags: ["纪录片", "家庭", "冰冻星球"]
  quark_url: "https://pan.quark.cn/s/7a091f5ce006"
  baidu_url: "https://pan.baidu.com/s/10P8v7w8sJNFmdg5sXp1pyw"
  baidu_code: "y38o"
  description: "南北两极、被雪覆盖的森林、北方的平原和遥远的山脉，这些地方看上去还没有被人类活动直接触及，因此各自保有一整套奇妙而多样的生态系统。摄制组在雪原上跟拍狼群围猎巨大的野牛，记录虎鲸代代相传的独门捕食技巧，也拍到了行踪诡秘的东北虎悄无声息地走过雪地。它在展现这些隐秘生活的同时，把正在逼近的剧变也摆上了台面，只是处理得相当克制，留白反而比喊口号更有分量。适合自然纪录片爱好者，看过第一部的老观众会多一层对照的乐趣。音乐和音效的混录做得尤其好，用大音响看得话差别很明显。摄制上的难度也值得一提：很多画面要在零下几十度守上几个星期才等到一次，镜头里风雪的质感骗不了人。它还刻意修正了这些地方仍然遥远的印象，说明即便人迹罕至，气候的影响也已经到了那里。看完多半会想在彻底改变之前再去亲眼看看。｜TMDB 8.4"
  date: 2022-09-11
  added: 2026-05-02
  image: dc-011.jpg

- id: dc-010
  title: "光的故事"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/5880ee142798"
  baidu_url: "https://pan.baidu.com/s/177jNa0h9yxL1ENR2Pv35xA"
  baidu_code: "rdvs"
  description: "这部系列穿越两千多年，讲人类怎么一点点搞懂光这件事。它把科学实验、哲学争论与技术进步拧成一条线，每一集挑一个切面切入：绘画里对光的处理、肤色与光的偏见、光与上帝、红外线、电力、万花筒、光合作用、量子理论、X 光都在其中。写法是把物理学讲成故事，不堆公式，靠演示和画面说话。主持人在演播室与实景之间来回，用简单的装置把抽象原理变得看得见。艺术家、工程师与物理学家被放在同一条线索上，说明对光的认识从来不只是实验室里的事。它反复提醒的一点是：人类对光的理解每往前一步，世界观就跟着改一次。片中也提到照明普及如何改变了城市夜生活与人的作息，这一集常被忽略。每集相对独立，从中间开始看也不影响理解。适合对科学史有兴趣、又受不了纯理论讲述的观众；想系统学光学的话它太散，当作通识入门刚刚好。"
  date: 2004-08-17
  added: 2026-05-02
  image: dc-010.jpg

- id: dc-009
  title: "你最想知道的科学"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/0ed69fbd1f61"
  baidu_url: "https://pan.baidu.com/s/1aKkliag2WTOtd3vhyesFOg"
  baidu_code: "5ohd"
  description: "很多事就发生在我们身上，我们却从没停下来问一句为什么。这一系列挑的都是被人当成理所当然、其实背后另有道理的现象：记忆为什么靠不住、眼睛看到的为什么常常不是真的、所谓的巧合概率其实高得惊人。每一段都用现场实验和演示把原理拆开讲，篇幅短、节奏快，完全不需要理科底子。它的好处是每段都有实验兜底，看完马上能复述给别人听。适合带了好奇心却不想啃专业书的观众，也很适合和孩子一起看，随手挑一集都能看下去。通勤路上塞一集刚好，随手挑，随时也能放下。全片靠真的做实验和现场演示撑起来，而不是用动画和比喻糊过去，这也是它经得起回头再看一遍的原因。它并不讳言科学家也会被直觉欺骗，几个著名实验的结论到今天仍有争论，这种坦白反倒让人更愿意相信其余部分。｜TMDB 7.5"
  date: 2011-06-20
  added: 2026-05-02
  image: dc-009.jpg

- id: dc-008
  title: "企鹅之岛"
  category: 纪录片
  tags: ["纪录片", "剧情"]
  quark_url: "https://pan.quark.cn/s/a983fd19ee61"
  baidu_url: "https://pan.baidu.com/s/1C_v-TWXYil5YDiq1TiQsHQ"
  baidu_code: "pxxx"
  description: "澳大利亚南部那座小岛既神奇又严酷，住着世界上体型最小的企鹅，这里是它们最大的一处栖息地。每天傍晚，成百上千只企鹅从海里爬上岸，摇摇晃晃穿过沙滩回到各自的洞穴育雏；同一时间游客也像潮水一样涌来，只为看这一幕。片子拍的就是这两拨生命挤在同一片沙滩上的日常，看这种极小体型如何在捕食者、繁殖节奏和人类围观之间维持平衡。叙事被处理成带剧情的样子，因此好看但并不沉重。适合喜欢动物题材、想轻松看一小时的观众，企鹅傍晚列队归巢那段是全片最动人的部分，也是这座岛每天上演的固定节目。岛上那套看台、通道和保护员的规矩同样是一条线索：人和野生动物共用一片沙滩这件事，从来不是顺其自然就能维持的。这种潮汐般的上岸节奏其实由食物决定：近海的鱼群在哪里，决定了它们每天要游多远、什么时候才回得了家。｜TMDB 6.0"
  date: 2010-07-14
  added: 2026-05-02
  image: dc-008.jpg

- id: dc-007
  title: "政府怎样花你的钱"
  category: 纪录片
  tags: ["纪录片", "他们怎样花掉你的钱"]
  quark_url: "https://pan.quark.cn/s/f5e85bfd3a60"
  baidu_url: "https://pan.baidu.com/s/17jWLCeGzDtS2kYGxTJ81og"
  baidu_code: "ii1g"
  description: "税收交上去之后去了哪里，这个问题大多数人都想过，却很少能说清楚。主持人尼克·罗宾逊拿着它一头扎进威斯敏斯特，从两头同时下手：一头追着政客和官员问钱是怎么分下去的，另一头跑到英国各地，听真正领这笔钱的人怎么说。片子揭示的压力方向挺反直觉——外界施加给政府的呼声几乎永远是再多花一点，而顶住这种呼声、以及兑现削减开支的承诺，才是政客真正的难题。它也不急着下结论，只是把一笔笔开支摊开：谁拿到了、凭什么拿到、又有多少花得稀里糊涂。镜头在议会走廊和选民家的厨房之间来回切，两边的说法常常对不上，这种对照本身就是看点。片中对浪费案例的追踪相当具体，能一路追到最后一公里。语气相当克制，不煽动愤怒，把判断留给观众。适合对公共财政、税制与政治运作好奇的人，看完再看每年预算新闻，感觉会不一样。｜TMDB 0.0"
  date: 2011-11-23
  added: 2026-05-02
  image: dc-007.jpg

- id: dc-006
  title: "从太空看地球"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/70c8ae331312"
  baidu_url: "https://pan.baidu.com/s/1rnhIY1lhWT-er_NNsTLBFw"
  baidu_code: "k4kd"
  description: "这是我们共同的家园，却从来没有人真的见过它的全貌。绕地飞行的卫星让镜头第一次有机会长期俯视整个地球，冰川的裂纹、洋流的走向、风在沙漠里留下的笔迹、灌溉农田拼出的几何图形、入夜后城市连成的灯光网络，每一帧信息量都极大。这种视角带来的冲击很直接：很多地貌和人类活动的真实规模，站在地面上根本感受不到，只有把距离拉到几百公里外才看得见整体。配上克制的解说和精心处理的环境声，观感相当接近大银幕。适合想换个高度重新认识地球的观众，几乎不需要任何背景知识，陪孩子一起看也很合适。它还有个隐性好处：不少在地面上争来争去的话题，看到卫星画面之后会变得很直观，比如沙尘怎样跨洋搬家、城市边界怎么一圈圈往外摊开。它给的其实是稀缺的那个高度：画面再贵也可以复制，站在轨道上看地球的机会却不多。｜TMDB 8.4"
  date: 2019-04-17
  added: 2026-05-02
  image: dc-006.jpg

- id: dc-005
  title: "人类宇宙"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/d3d37150ce45"
  baidu_url: "https://pan.baidu.com/s/15cx-fnTq8Il7xXMnbTNEOg"
  baidu_code: "vijt"
  description: "继《太阳系的奇迹》《宇宙的奇迹》《生命的奇迹》之后，布莱恩·考克斯教授把镜头转向了人类自己，得出的结论有点反常识：宇宙里最珍贵的存在恰恰是我们。他从语言、工具、农业一路讲到书写、望远镜和火箭，反复追问同一件事，人是怎么一步步弄清自己在宇宙中所处的位置的。考克斯的讲法一贯平实，不堆术语，遇到难处就换个比方重讲一遍；制作上却相当舍得，不少实验特意搬到开阔的场地去做，视觉上的说服力比图示强得多。追过他早期作品的观众能看到熟悉的底色，从没看过的也不必补前置知识。想从头理清人类是怎么走到今天这一步的，这一部很合适。全片最常被单独拎出来推荐的是讲书写的那一集，把文字如何改变了人类的记忆说得很透，也是整系列里最接近哲学的一段。看完再抬头看夜空，感受和开头完全不一样，这大概正是它想要的余味。｜TMDB 8.1"
  date: 2014-10-07
  added: 2026-05-02
  image: dc-005.jpg

- id: dc-004
  title: "人体奥秘"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/b677ae247c28"
  baidu_url: "https://pan.baidu.com/s/1jK42YnZmwdxJ7387Az3DNg"
  baidu_code: "e2cu"
  description: "骨头为什么既轻又结实，血液是怎么跑完全身的，吃下去的东西又去了哪里——这些问题对孩子来说既熟悉又模糊。这部系列用动画把身体内部变成可以走进去的场景，把各个部位比作不同的探险目的地，跟着小主角一路穿行：看骨骼的灵活结构、血液循环的路线、消化与呼吸系统的忙碌，也看感官如何把外界信息翻译成我们能理解的东西。语言刻意避开了教科书式的术语堆砌，讲得生动但不失真。每一节末尾还有一小段健康提示，把刚认识到的器官与生活里的习惯连起来，比如为什么要好好睡、为什么要动一动。动画的分寸把握得不错，内脏画得清楚但不吓人，家长不用太担心。作为入门材料它既不糊弄也不说教，适合学龄前后的孩子自己看，也适合家长陪着一起看，孩子问到身体怎么回事时，可以直接放给他看。｜TMDB 8.0"
  date: 2011-05-05
  added: 2026-05-02
  image: dc-004.jpg

- id: dc-003
  title: "二战坦克王牌"
  category: 纪录片
  tags: ["纪录片", "二战英军坦克英雄"]
  quark_url: "https://pan.quark.cn/s/9bb5e32c0a86"
  baidu_url: "https://pan.baidu.com/s/1X_UpzHrpwh8OX2swMoC64Q"
  baidu_code: "ypii"
  description: "《二战坦克王牌》把讲述权交给了英国皇家第五坦克团的六名老兵，全片几乎没有宏大的战略复盘，而是回到个人视角：坦克舱内的狭窄与闷热、遭遇德军装甲时那几秒钟的决策、战友伤亡之后漫长的沉默。因为全是当事人出镜口述，细节的质感远胜事后的情景重演，那种平静语气底下压着的东西，是任何编年史里读不到的。适合对二战装甲战、诺曼底之后西欧推进感兴趣的观众，尤其适合看完大制作战争片、想听听真实声音的人补一课。老兵讲到某个节点忽然停下来喝水的时候，比任何解说都有分量。篇幅不长，一个晚上能看完。这部片子真正的价值是时间：当年二十出头的坦克兵如今坐在镜头前，讲出来的已经不只是回忆，而是经过几十年沉淀的判断。有些细节，比如新刷油漆的味道、发动机熄火之后的寂静，是任何史料都写不出来的。喜欢口述史的观众不要错过。｜TMDB 10.0"
  date: 2013-01-06
  added: 2026-05-02
  image: dc-003.jpg

- id: dc-002
  title: "七个世界，一个星球"
  category: 纪录片
  tags: ["纪录片", "家庭", "七个世界 一个星球"]
  quark_url: "https://pan.quark.cn/s/f7f0d8c33a50"
  baidu_url: "https://pan.baidu.com/s/1AZWJdGidNutXuuBQBA9rew"
  baidu_code: "w69j"
  description: "同样的板块运动把地壳撕成了七块，几百万年后，每一块大陆都各自演化出别处没有的动物。这部系列就按洲来分集，从南美洲的丛林深处到亚洲的冰雪山巅，从欧洲的城市缝隙到非洲的广阔平原，一路收集那些别处看不到的行为与故事。它和一般自然纪录片最大的不同，是明确把人放了进来：每一集都会交代这片大陆上的动物正在面对什么——栖息地被切碎、气候在变、城市的边界不断外扩。结尾对保护现状的说明相当克制，没有说教，只是把取舍摆出来。镜头依旧是 BBC 自然历史组的老练水准，很多行为是第一次被拍到。配乐与解说的处理延续了这个团队一贯的水准，克制、不抢戏。各集的分量并不完全均衡，非洲与南美部分素材明显厚实，这也算是按洲分集的代价。适合已经看过《地球脉动》《蓝色星球》、想换一个组织方式的观众。｜TMDB 8.5"
  date: 2019-10-27
  added: 2026-05-02
  image: dc-002.jpg

- id: dc-001
  title: "一千零一夜的秘密"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/894225d0658a"
  baidu_url: "https://pan.baidu.com/s/1kW4Tr84x6xVZ-bEDob4ofQ"
  baidu_code: "31zc"
  description: "《一千零一夜》人人听过，却很少有人知道它是怎么长出来的。这部纪录片不打算把那些故事再讲一遍，力气全花在溯源上：印度、波斯、阿拉伯世界的多重来源，民间说书人的口传传统，故事在旅途中不断被增删的过程，以及它在欧洲被翻译、改写、再创作之后的面貌。导演的态度相当清醒，承认这题材庞大到不可能在一部片里讲透，于是恰当地点到为止，能把前生今世梳理清楚已经难得。片中走访的学者和手稿收藏提供了不少具体细节，某些故事的流传路径出人意料。几位研究者对同一段来历的判断并不一致，导演没有替他们调和，这种并置反而更接近实情。它顺带纠正了一个常见误解：所谓阿拉伯故事集，其实从一开始就是多语言、多地层的产物。整体篇幅不长，节奏也快，适合随手补一课，看完大概会想找一本全译本翻翻。"
  date: 2010-01-02
  added: 2026-05-02
  image: dc-001.jpg

