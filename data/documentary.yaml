- id: dc-078
  title: "一级方程式：疾速争胜 第七季"
  category: 纪录片
  tags: ["纪录片", "一级方程式：疾速争胜 Formula 1: Drive to Survive"]
  quark_url: "https://pan.quark.cn/s/f29da2f12e5b"
  description: "【第 7 季 · 共 10 集 · 全剧 8 季】第七季跟拍 2024 赛季，主线是格局的又一次洗牌：迈凯伦拿到 1998 年以来的第一个车队总冠军，维斯塔潘则顶住赛车后半程竞争力下滑的压力，连续第四年捧起车手总冠军，两座奖杯分属两支车队，这在近年并不多见。赛季的另一条大新闻被完整记录：汉密尔顿在年初官宣将在赛季结束后转投法拉利，围场里的反应、车迷的情绪与梅赛德斯内部的告别，都拍进了正片。场上，诺里斯与维斯塔潘的几次正面交锋火花四溅，法拉利则一路咬到最后一站，把车队冠军的悬念留到了收官。第七季的制作水准依然在线，选题也聪明：它知道观众已经看过太多红牛的胜利，于是把篇幅更多地让给了追赶者。十集看完，你会对下一年的天平怎么倒充满好奇，这大概就是一部赛季纪录片能给观众的最好礼物。｜TMDB 8.2"
  date: 2025-03-07
  added: "2026-10-12 12:25"
  image: dc-078.jpg


- id: dc-079
  title: "一级方程式：疾速争胜 第一季"
  category: 纪录片
  tags: ["纪录片", "一级方程式：疾速争胜 Formula 1: Drive to Survive"]
  quark_url: "https://pan.quark.cn/s/98e215cbc814"
  description: "【第 1 季 · 共 10 集 · 全剧 8 季】这是 Netflix 第一次把镜头真正开进 F1 的围场。摄制组跟拍 2018 赛季的十支车队，从车库里的无线电、车手会议到车队领队之间的明争暗斗，全都拍了出来。汉密尔顿在这一年拿下自己的第五个世界冠军，梅赛德斯与法拉利的军备竞赛贯穿整季，维斯塔潘还只是个脾气火爆的新人，里卡多则在这一年后选择离开红牛，把自己的未来变成了悬念。片子最聪明的地方是它不打算给车迷上课，而是把每支车队都拍成了一家各有难处的公司：有预算压力，有内部倾轧，也有把年度预算烧光仍拿不到分站的挫败，印度力量的财务崩盘就这样被拍成了整季最揪心的一段。对不熟悉赛车的观众，它是入坑 F1 的最佳起点；对老车迷，它提供的是电视转播画面之外的那一层。十集的体量不赶时间，每集聚焦一两条线，看完你记住的不是一个冠军，而是一群人在高速机器旁边怎么活着。｜TMDB 8.2"
  date: 2019-03-08
  added: "2026-10-12 12:25"
  image: dc-079.jpg


- id: dc-080
  title: "一级方程式：疾速争胜 第二季"
  category: 纪录片
  tags: ["纪录片", "一级方程式：疾速争胜 Formula 1: Drive to Survive"]
  quark_url: "https://pan.quark.cn/s/1fa2fa10e1d2"
  description: "【第 2 季 · 共 10 集 · 全剧 8 季】第二季跟拍的是 2019 赛季，主线是勒克莱尔如愿穿上法拉利红衫后的第一年。摩纳哥人在斯帕与蒙扎连下两城，主场首胜的段落拍得几乎像剧情片，围场里的狂喜与压力都写在脸上。另一边，梅赛德斯拿下连续第六个车队总冠军，汉密尔顿的稳定性依旧可怕，博塔斯在队友位置上的处境则被拍得很现实。这一季也开始把镜头分给中游车队：雷诺、迈凯伦、赛点各自的算盘，让整季的叙事不再是巨头之间的独角戏。值得一提的是片子对 F2 车手于贝尔意外离世的处理，克制、安静，没有消费悲剧，是同类题材里少见的分寸感。如果你是看了第一季才入坑，这一季能明显感觉到制作组胆子变大了：他们开始追问车队的政治，开始让镜头停留在一笔没能谈成的续约上。十集看完，你会明白 F1 的比拼从来不止在赛道上，围场里的每一份合同、每一句无线电，都在改写下一年的格局。｜TMDB 8.2"
  date: 2020-02-28
  added: "2026-10-12 12:25"
  image: dc-080.jpg


- id: dc-081
  title: "一级方程式：疾速争胜 第三季"
  category: 纪录片
  tags: ["纪录片", "一级方程式：疾速争胜 Formula 1: Drive to Survive"]
  quark_url: "https://pan.quark.cn/s/072303a7dc1d"
  description: "【第 3 季 · 共 10 集 · 全剧 8 季】第三季记录的是历史上最特殊的一个 F1 赛季：2020 年，疫情让整个赛历几乎归零，车队在隔离泡泡里辗转于空无一人的看台之间，比赛听起来像绕圈测试，看起来却比任何时候都安静。正因如此，这一季的气氛跟前后几季都不一样，围场之外的世界在停摆，围场之内的机器还在转。汉密尔顿在这一年追平了舒马赫保持的七冠纪录，梅赛德斯的统治与他在场外的发声构成双线叙事；赛点车队那台颇具争议的粉色赛车成了围场里吵得最凶的话题；而格罗斯让在巴林的那起起火事故则被完整记录下来，成为整季最震撼的十几分钟，从火里走出来的车手自己讲述那一刻，比任何解说都有力量。这一季也在提醒观众：一部体育纪录片的意义，除了记录胜负，还包括记录一个行业怎么在灾难里把比赛办完。十集看完，空看台的画面反而比喧闹的领奖台更让人难忘。｜TMDB 8.2"
  date: 2021-03-19
  added: "2026-10-12 12:25"
  image: dc-081.jpg


- id: dc-082
  title: "一级方程式：疾速争胜 第六季"
  category: 纪录片
  tags: ["纪录片", "一级方程式：疾速争胜 Formula 1: Drive to Survive"]
  quark_url: "https://pan.quark.cn/s/156284fc5df3"
  description: "【第 6 季 · 共 10 集 · 全剧 8 季】第六季跟拍 2023 赛季，这是红牛近乎完美的一年：维斯塔潘拿下破纪录的连胜并一路把单季分站冠军数刷到十九个，车队在二十二站里只让冠军旁落过一次。纪录片面对这种毫无悬念的统治，选择把叙事重心转向围场的其他角落：迈凯伦赛季中段的强势反弹、皮亚斯特里的新秀年、阿隆索在阿斯顿·马丁开局阶段的高光，以及里卡多中途回归赛道的故事，都让这一季不至于变成单人独奏。当然，维斯塔潘的部分并没有回避，只是镜头更愿意去问一个不一样的问题：当赢变成常态，一个人要怎么保持饥饿感。对比前几季的巅峰对决，这一季更像一部关于持续统治的观察报告，节奏平稳，细节扎实。对车迷来说，它是理解红牛王朝何以建立的最好注脚；对路人来说，它依然是 Netflix 惯常的高完成度体育纪录片，随手点开一集也能看进去。｜TMDB 8.2"
  date: 2024-02-23
  added: "2026-10-12 12:25"
  image: dc-082.jpg


- id: dc-083
  title: "一级方程式：疾速争胜 第五季"
  category: 纪录片
  tags: ["纪录片", "一级方程式：疾速争胜 Formula 1: Drive to Survive"]
  quark_url: "https://pan.quark.cn/s/58d17640ab7d"
  description: "【第 5 季 · 共 10 集 · 全剧 8 季】第五季跟拍 2022 赛季，规则大改让这一季成了格局重排的一年：地面效应赛车登场，红牛靠维斯塔潘与设计团队的手笔重夺话语权，法拉利开季凶猛却在策略与可靠性上接连掉链子，梅赛德斯则第一次尝到整车方向错误的苦头，汉密尔顿职业生涯第一次整年没有分站冠军入账。纪录片把这些落差拍得很诚实，尤其是法拉利维修区里那种明明握着好牌却一张张打错的无力感。中游的故事同样有戏：里卡多在迈凯伦的水土不服贯穿整季，季末离开的决定提前写好了结局；诺里斯则在这个赛季真正立住了。对看惯了梅赛德斯独大的观众，这一季是清爽的一年，榜首换人，悬念回归。十集的节奏比上一季平缓一些，但叙事的颗粒度更细，适合把它当成 F1 新规则时代的入门资料来看，看完再翻回第四季对照着看会更有味道。｜TMDB 8.2"
  date: 2023-02-24
  added: "2026-10-12 12:25"
  image: dc-083.jpg


- id: dc-084
  title: "一级方程式：疾速争胜 第四季"
  category: 纪录片
  tags: ["纪录片", "一级方程式：疾速争胜 Formula 1: Drive to Survive"]
  quark_url: "https://pan.quark.cn/s/e6dfe95b2db9"
  description: "【第 4 季 · 共 10 集 · 全剧 8 季】很多观众心目中的神作就是这一季，它跟拍的是 2021 赛季：汉密尔顿与维斯塔潘把冠军之争一路撕扯到阿布扎比的最后一圈，这是这项运动几十年来最戏剧性的一个结局，纪录片把整条冲突线完整装进了十集里。银石那次两人相撞、匈牙利与蒙扎的接连事故、红牛与梅赛德斯在规则会议室里的你来我往，全都收录在内。这一季好看不只因为结果有争议，更因为它把两个完全相反的人拍清楚了：一个是把全部人生押在这项运动上的老王者，一个是年少成名、步步紧逼的挑战者。中游车队的故事线也给了足够篇幅，加斯利、诺里斯的表现让围场下半区同样有戏。哪怕你已经知道结局，看最后一集时手心还是会出汗。要给系列挑一季先看，选它不会有错，它同时具备体育纪录片的张力和连续剧式的叙事快感。｜TMDB 8.2"
  date: 2022-03-11
  added: "2026-10-12 12:25"
  image: dc-084.jpg


- id: dc-085
  title: "朝鲜战争"
  category: 纪录片
  tags: ["纪录片", "朝鲜战争 The Korean War"]
  quark_url: "https://pan.quark.cn/s/9ad29ef2303d"
  description: "【第 1 季 · 共 10 集】这是韩国 KBS 为朝鲜战争爆发六十周年推出的十集特别企划纪录片，也是这套作品第二次以十部作的规模完整梳理这场战争。早在 1990 年，KBS 的六二五四十周年特别制作班就曾用十部作的体量回顾战争全程，那版作品后来被美国《娱乐周刊》评为世界百部最佳纪录片之一。2010 年的这一版在原有基础上重新搜集与整理档案，第一次以尽量客观的视角，把战争的起因、展开过程直至停战谈判的每一步铺开来讲：三八线怎么画下，战争怎样在几天之内推向汉城，仁川登陆如何扭转战局，中国参战后战线又如何在半岛中部反复拉锯，最后一切停在三八线附近的军事分界线上。全片没有胜者的叙事，只有三十八个月的战争与之后数十年停战状态下的紧张。大量交战各方的影像档案、口述与地图推演，让它成为华语观众了解这场半岛战争相当难得的一份材料。十集按时间顺序推进，节奏清楚，适合配合地图观看。｜TMDB 6.0"
  date: 2010-06-06
  added: "2026-10-12 12:25"
