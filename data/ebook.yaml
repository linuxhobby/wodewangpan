  description: "【pdf · epub · mobi · azw3】批判性思维领域最负盛名的入门书之一，由美国学者尼尔·布朗与斯图尔特·基利合著，原书已修订到第 12 版，中文版由机械工业出版社引进，被称为批判性思维领域的「圣经」，畅销三十余年。全书围绕一个核心能力展开：面对别人抛来的观点、论证和数据，怎样系统地提出一连串好问题，把论证拆开来看。书里给出了一套可操作的清单：论题和结论是什么、理由是什么、哪些词语有歧义、隐藏的假设在哪里、推理过程有没有谬误、证据的可信度有几成、有没有 alternative 的解释、数据有没有被选择性呈现。每一项都配了大量来自社论、广告、演讲的真实案例做示范，读完可以直接上手套用。第 12 版更新了案例素材，吸收了认知偏差研究的新进展，讨论了社交媒体时代信息过载对独立思考的新挑战。这本书不教人抬杠，教的是先弄清对方说了什么、再判断值不值得信，日常读新闻、做决策、写文章都用得上。适合学生、职场人以及任何想在信息洪流里站稳脚跟的读者。｜作者：[美] 尼尔·布朗, 斯图尔特·基利"
