  description: "《生活的赌局：看穿不确定背后的概率》是英国统计学家戴维·施皮格尔霍尔特（David Spiegelhalter）的科普作品，英文原名 The Art of Uncertainty，中文版由韩潇潇翻译，中信出版集团2026年3月出版，全书四百余页。作者是英国皇家学会院士、剑桥大学统计学荣休教授、英国皇家统计学会前会长，2016至2023年担任剑桥大学温顿风险与证据沟通中心主任，长期致力于向公众解读统计数据与风险问题。本书聚焦生活中的不确定性：人们每天在工作选择、人际关系、投资决策中不自觉地「下注」，却常把一时的好运当作实力、把偶然结果归为因果。全书分四个部分，从不确定性的本质、概率思维的构建，到风险判断与未来预测，再到不确定条件下的行动决策，内容涵盖概率与偶然性、运气、贝叶斯推理、因果关系、风险沟通与灾难管理等主题，结合大量日常生活案例，把概率逻辑转化为普通人可用的思维方法。该书入选《福布斯》《经济学人》2024年度图书榜单，被《金融时报》称为兼具哲学、数学与历史气质的作品。本资源为该书电子版文件，具体格式以盘端目录为准。"
