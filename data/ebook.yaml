  baidu_url: "https://pan.baidu.com/s/1PPgWubo6SMaq0zgDFQJbKQ"
  baidu_code: "qw87"
  description: "【epub · mobi · azw3】上海文艺出版社推出的斯蒂芬·金作品套装，共 17 册，收录《肖申克的救赎》《闪灵》《宠物公墓》《绿里》《捕梦网》《11/22/63》等长篇与中短篇。金最擅长把日常场景推到极端：小镇、公寓、医院、度假屋，普通人的困境在现实压力与超自然恐惧的交织中逐渐失控。他笔下的人物先是可信的邻居，再一步步掉进无法回头的处境，心理描写细密、节奏克制，压迫感却始终不减。这套里既有纯粹的恐怖，也有几乎不带超自然元素的《肖申克的救赎》《绿里》，放在一起看会发现他处理的其实是同一件事：人在绝境里怎么自处。想一次读完「现代惊悚小说之王」的招牌风格，这是最省事的入口，也可以按兴趣单本挑着读。套装体量大，读完需要相当长一段时间，不必强求按顺序来；电子版的检索和标注比纸质合集方便，适合随手重读。｜作者：[美] 斯蒂芬·金"
  date: 2020-03-01
  added: "2026-10-07 17:40"
  image: bk-006.jpg

- id: bk-007
  title: "明朝那些事儿（全9册）"
  category: 电子书
  tags: ["电子书", "历史", "通俗读物", "明朝那些事儿（全9册）"]
  quark_url: "https://pan.quark.cn/s/a25b3fcadbcc"
  description: "【epub】当年明月的成名作，把大明王朝两百七十六年的历史写成了九册让人停不下来的长篇故事。全书从朱元璋出身贫农、一路打到应天登基写起，历经永乐迁都、仁宣之治、土木堡之变、嘉靖修道、万历怠政，直到崇祯在煤山收场，帝王将相、权谋战事、党争变法全部串成一条主线。写作上最大的特点是把文言史料翻译成现代口语：正史《明实录》与《明史》里的记载被拆开重讲，该考证的地方引原文，该抖包袱的地方绝不板着脸，读起来像听人讲评书，但每一处大事的年份、人物与结局都有出处。九册各有侧重，朱元璋与朱棣的开国立业、于谦与王守仁的孤忠与悟道、张居正的改革与身败名裂、魏忠贤与东林党的生死缠斗，一直到袁崇焕、孙承宗守辽东的残局，人物虽多而脉络清晰。这套 2011 年浙江人民出版社版为通行版本，共 9 册，适合想系统了解明朝却读不进正史的读者，一册一个阶段，随手翻开任何一页都能接上。｜作者：[中国] 当年明月"
  date: 2011-12-01
  added: "2026-10-10 19:25"
  image: bk-007.jpg


- id: bk-008
  title: "高性价比人生指南"
  category: 电子书
  tags: ["电子书", "生活", "决策参考", "高性价比人生指南 HowToLiveBetter"]
  quark_url: "https://pan.quark.cn/s/91f6cbecbee0"
  description: "【pdf】一本开源的循证生活决策手册，原本是 GitHub 上的项目 HowToLiveBetter，后来印成了纸书，采用 Unlicense 公有领域许可，任何人都可以自由传播。全书的思路很冷静：把人生拆成寿命、时间精力、金钱、人身自由四种资源，收集六百多条可执行建议，每条都写明花掉什么、换回什么、证据有多硬，再按性价比排出先后。证据分级是它的骨架：A级来自荟萃分析、大型队列或随机对照试验，能给得出具体数字；B级有研究支撑但难以量化；C级是作者经验或普遍共识，标注坦白，连没查清的地方都直接写明。内容覆盖极广，从长寿防病、急救常识、省钱理财，到法律红线、失业兜底、恋爱婚育、出国留学与学手艺，制度性内容按中国大陆现行规定编写。它反鸡汤也反焦虑：作者反复强调这是一份按性价比排好的备选单，不是任务清单，挑走一两条就算数。头盔能降低四成死亡风险、换袋低钠盐比多数保健品划算、下午两点后的咖啡会偷走睡眠，这类具体又有出处的判断贯穿全书，适合想用最少成本把生活底层风险降下来的人当案头工具书用。｜作者：eternity4719（GitHub 开源项目 HowToLiveBetter）"
  date: 2026-10-10
  added: "2026-10-10 19:25"
  image: bk-008.jpg


- id: bk-009
  title: "摆脱内耗行动指南"
  category: 电子书
  tags: ["电子书", "视频课程", "自我成长", "沟通", "职场"]
  quark_url: "https://pan.quark.cn/s/2f4f761c830e"
  description: "【视频课程 · 共 31 讲】一套面向职场人的沟通与自我管理课程，共三十一讲，从思维、情绪、精力到具体话术逐层展开。开篇先做认知松绑：用本质思维撕掉贴在自己身上的负面标签，用情绪翻译看清发脾气背后的真实需求，再用焦虑转移走出越想做好结果越糟糕的怪圈。中段进入精力与时间的盘面：精力分配讲分工，时间清单讲借力，目标梳理回答如何摆脱职场和家庭的束缚去做自己想做的事，财富规划给出迈出第一步的四个动作。后半程是硬功夫，全部落在关系场景里：向上管理教你怎么跟老板相处、争取支持，无好处不说服拆解有效说服的底层逻辑，还有倾听的分量、开会的技巧、面试最容易掉坑的问题，以及如何通过正确发脾气达到自己的目的。课程节奏短平快，单讲多在十到三十分钟之间，适合通勤或碎片时间观看。整套内容偏实操，讲的是方法与话术，立场务实甚至有点扎心，比如职场不要假清高要真势利这类标题就很直白。适合正被沟通内耗困扰、想在职场关系里争取更多主动权的人。｜形式：视频课程（完结）"
  date: 2026-10-13
  added: "2026-10-13 07:30"
  image: bk-009.jpg

