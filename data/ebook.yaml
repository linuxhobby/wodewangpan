  quark_url: "https://pan.quark.cn/s/4ccb5202cc0a"
  description: "【视频课程 · 五大篇章】由肖然主讲的家庭身心保健课程，把身心健康这件事放回到家庭日常里讲。课程从先导片与试听开始，正式内容分五篇推进：第一篇身心健康基础篇打底，讲清身与心如何互相影响，帮助学习者建立对自身状态的基本觉察；第二篇家庭常见问题调养篇聚焦家里高频出现的健康困扰，逐一给出调养思路与方法；第三篇家庭四季养护篇按季节展开，讲不同时节的养护重点，把养生节奏对上自然节律；第四篇家庭关系处理篇把视角从身体转向关系，讨论家庭成员之间的相处与情绪如何反过来影响健康；第五篇正念减压提供一套可以日常练习的减压方法，帮人在忙碌生活里安顿情绪。课程另外附有直播录屏，可以看到主讲人现场答疑的过程。整体内容面向普通家庭，不要求医学基础，讲法温和细致，强调观察身体信号、调节情绪与生活习惯。适合关注家人健康、想系统学一点身心调养方法的观众，也适合长期压力大、想在居家场景里自我调理的人。｜讲师：肖然"
