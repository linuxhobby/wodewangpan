  description: "《麦芽国》是编剧贾东岩创作的长篇悬疑小说，中国友谊出版公司2026年6月出版，ISBN 9787505763272，全书234页。作者代表作包括《风声》《猎罪图鉴》等影视剧本。小说以东北松城国企改制为时代背景：电视编导沈乐水在北京漂泊十余年后失意返乡，打算卖掉老房子与朋友合开民宿，松啤厂厂长马国文却请她为即将出售的啤酒厂拍摄宣传片。翌日厂长横尸铁路，刑警问询时提起千禧年旧案——当年厂长企图吞下酒厂，工人集资对抗，品酒员刘雪梅被指为叛徒，在新世纪第一天冻死街头。沈乐水的镜头记录下一切，她凭纪录片《麦芽国》在本地电视圈成名，却隐匿了真相。多年后当年涉案者接连遇害，录像带被盗，年轻刑警高雪林身上也藏着秘密，沈乐水再次拿起摄影机逼近跨越十六年的谋杀与背叛。作品将悬疑命案与东北小城的时代变迁交织，采用纪录片式的纪实质感与小说叙事相融合的写法。本资源为电子书文件，盘端目录含 PDF、EPUB、AZW3、MOBI 与封面 JPG 共五个文件，具体格式以盘端为准。"
