  quark_url: "https://pan.quark.cn/s/c6e82ef20087"
  baidu_url: "https://pan.baidu.com/s/1KursGVFn_d6im2ArRc_gnw"
  baidu_code: "t9i8"
  description: "【epub】斯蒂芬·金的中篇小说，收录于《四季奇谭》。银行家安迪·杜佛兰被误判枪杀妻子及其情人，判处两次无期徒刑，进入肖申克州立监狱。他在狱中替狱警处理税务、替典狱长做假账，也用一把小锤子、几张海报和无人相信的耐心，花了近二十年凿开通往自由的隧道。金的写法在这个故事里罕见地克制，恐怖让位给日常：图书馆、唱片、屋顶上的啤酒，都是人怎么在长期囚禁里保住自己的证据。叙述者是安迪的狱友瑞德，由他来讲这件事，可信度全靠他那句「有些鸟是关不住的」。小说讲的是希望，篇幅不长，一个下午就能读完；改编电影也是很多人心里排第一的那部，但小说对监狱日常与越狱细节的交代比电影更冷静。《四季奇谭》里另外三篇的调子完全不同，这篇是唯一不带超自然元素的一个，想入门斯蒂芬·金又怕恐怖题材的，从这篇开始最稳妥。｜作者：[美] 斯蒂芬·金"
  date: 1982-01-01
  added: 2026-10-07
  image: bk-005.jpg

- id: bk-006
