  description: "《故宫博物院百年百事》由故宫博物院原院长单霁翔撰写，中国大百科全书出版社2025年10月出版，ISBN 9787520220187，定价128元，全书448页。作者1954年生，毕业于清华大学建筑学院，历任国家文物局局长、故宫博物院院长，著有《我是故宫看门人》等多部专著。1925年10月10日故宫博物院宣告成立，紫禁城由皇家私产转变为公共文化殿堂；2025年适逢故宫百年华诞，本书以时间为脉络，遴选院史百年间的一百个重要事件，结合翔实史料与珍贵照片展开叙述。目录涵盖故宫博物院开幕典礼与理事会成立、文物南迁与西迁、南京国民政府接管、《故宫物品点查报告》公布、《清明上河图》与《五牛图》的征集修复、太和殿前受降、故宫被列为全国重点文物保护单位与世界文化遗产、故宫学概念提出、古建筑整体维修保护工程、午门与西部区域开放、石渠宝笈特展引发的观展热潮，以及香港故宫文化博物馆开放、故宫博物院北院区选址建设等近年的新进展。书中既有文物南迁等历史细节，也包含《故宫日历》等文化传播内容。本资源为电子书文件，盘端目录含 PDF、EPUB、AZW3、MOBI 与封面 JPG 共五个文件，具体格式以盘端为准。"
