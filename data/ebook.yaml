- id: bk-011
  title: "朗文图解词典"
  category: 电子书
  tags: ["电子书", "英语学习", "词典", "儿童英语", "朗文图解词典 The Longman Picture Dictionary"]
  quark_url: "https://pan.quark.cn/s/bc8914cc9a60"
  description: "【pdf】朗文出版社推出的经典英语图解词典，由 Julie Ashworth 与 John Clark 编写，1989 年由 Prentice Hall 出版，面向英语初学者与儿童学习者，豆瓣评分 9.0。全书的核心思路是用画面代替翻译：每个主题场景画满街道、店铺、教室、厨房这类日常环境，图上标注对应的英文单词，读者看着画面就能把词和实物直接挂钩，绕开母语中介。词典按主题组织词汇，涵盖家庭、学校、食物、交通、动物、天气等几十个常见场景，儿童生活里能用到的词基本都有归宿。与按字母排序的传统词典不同，这种场景式的编排天然适合翻着看，孩子随手翻到一页就是一幅热闹的小镇街景，看图说话式的学习几乎没有门槛。对家长和老师来说，它也是很好的备课素材，可以按场景挑词设计游戏和问答。本次收录的是高清扫描 PDF 版本，画质清晰，色彩还原到位，打印或平板阅读都合适。适合给刚开始接触英语的孩子打底子，也适合英语启蒙班的老师当教学参考。｜作者：[英] Julie Ashworth, John Clark"
  date: 1989-02-24
  added: "2026-10-19 13:58"
  image: bk-011.jpg

- id: bk-012
