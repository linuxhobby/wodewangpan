- id: bk-001
  title: "飞越疯人院"
  category: 电子书
  tags: ["电子书", "文学", "小说", "美国文学", "飞越疯人院 One Flew Over the Cuckoo's Nest"]
  quark_url: "https://pan.quark.cn/s/d9986b7fd0bc"
  baidu_url: "https://pan.baidu.com/s/1j-g4TNlSFbJbicZz3XxCPg"
  baidu_code: "pi5u"
  description: "【epub · pdf · mobi · azw3】美国作家肯·凯西的长篇小说，故事发生在俄勒冈州一所精神病院。为逃避监狱苦役而装疯的麦克墨菲，撞上了病区里刻板冷酷的「大护士」拉契特和她那套规训机器。他带着病友出海钓鱼、打牌、放声大笑，把被磨平的人一个个唤醒，而病区里那些自愿住院的人其实比被强制收治的更走不掉。叙述者是装聋作哑多年的印第安人布罗姆登，整个故事通过他的眼睛展开，因此疯癫与清醒的边界始终模糊，读者也很难断定谁才是真的不正常。这场关于自由与尊严的角力最终以最沉重的方式落幕，而真正走出去的人并不是麦克墨菲。小说被视为六十年代反体制文学的代表作，改编的同名电影包揽奥斯卡五项大奖。篇幅适中，适合对个体与体制这个话题感兴趣的读者。书里对精神病院的日常写得极细，六十年代的语境与今天的讨论并不完全相同，读的时候可以留一点距离。｜作者：[美] 肯·凯西"
  date: 1962-02-01
  added: 2026-10-07
  image: bk-001.jpg

- id: bk-002
  title: "牧羊少年奇幻之旅"
  category: 电子书
  tags: ["电子书", "文学", "寓言", "外国文学", "牧羊少年奇幻之旅 The Alchemist"]
  quark_url: "https://pan.quark.cn/s/66e6399dcf88"
  baidu_url: "https://pan.baidu.com/s/1o5i8qFSxn-mLuySPXJPKbQ"
  baidu_code: "n976"
  description: "【epub】巴西作家保罗·柯艾略的寓言式小说。牧羊少年圣地亚哥两次做了同一个关于埃及金字塔宝藏的梦，在撒冷之王的指引下卖掉羊群，穿越地中海与撒哈拉，一路遇见骗子、水晶店老板、炼金术士和沙漠少女法蒂玛。当他终于抵达金字塔挖开沙土，才发现真正的财富藏在出发的地方。全书讲的是「天命」与「预兆」：当你真心渴望某件事，整个宇宙都会合力帮你完成。它更像一则写给成年人的童话，语言简单，象征直白，也正因为直白，喜欢和不喜欢的人态度都很鲜明。篇幅很短，两三个晚上可以读完；不同年纪重读感受差别不小——二十岁读到的是出发，三十多岁读到的多半是那些没有出发的人。它最打动人的部分其实在路上，尤其是水晶店老板那一段：一个人如何安放自己放弃了的天命。不同译本差别不小，挑口碑好的版本读会顺畅很多。｜作者：[巴西] 保罗·柯艾略"
  date: 1988-01-01
  added: 2026-10-07
  image: bk-002.jpg

- id: bk-003
  title: "你当像鸟飞往你的山"
  category: 电子书
  tags: ["电子书", "传记", "回忆录", "外国文学", "你当像鸟飞往你的山 Educated"]
  quark_url: "https://pan.quark.cn/s/04afe66367b4"
  baidu_url: "https://pan.baidu.com/s/1dzRcXLQZN41HNY1lAmmzLw"
  baidu_code: "dc2c"
  description: "【pdf】塔拉·韦斯特弗的自传体回忆录。她生长在爱达荷州巴克峰山脚下，父亲偏执地反对政府、医院与学校，七个孩子没有出生证明、没进过教室；她在废料场分拣铁皮，在母亲的草药室帮忙，还要忍受兄长的暴力。十七岁那年她靠自学考上大学，此后一路读到剑桥大学历史学博士，而教育让她重新看见了世界，也让她与原生家庭彻底撕裂。书名取自《圣经》：你当像鸟飞往你的山，去找到属于你的那座山。读的时候很难不被作者那种冷静到近乎克制的笔触带着走，她没有把这本书写成控诉，更多是在分辨记忆里哪些是真的。它真正写的是教育的另一面：知识带来的不只是上升，还有离开的代价。它也在追问一个更难的问题：当一个人的记忆被家人集体否认，她还能不能相信自己——作者自己在书里就承认了记忆并不完全可靠。｜作者：[美] 塔拉·韦斯特弗"
  date: 2018-02-20
  added: 2026-10-07
  image: bk-003.jpg

- id: bk-004
  title: "强风吹拂"
  category: 电子书
  tags: ["电子书", "文学", "青春", "日本小说", "强风吹拂 風が強く吹いている"]
  quark_url: "https://pan.quark.cn/s/a57852225df1"
  baidu_url: "https://pan.baidu.com/s/13-8BnExH-s1M5TgSfXNt_g"
  baidu_code: "yg33"
  description: "【epub】三浦紫苑的长篇小说。宽政大学破旧宿舍「竹青庄」里，十个性格各异、半数从没受过专业训练的男生，被天才跑者清濑灰二半哄半骗地拽进了箱根驿传，也就是日本新年最盛大的大学生接力赛。从零开始的长跑训练，以及各自不肯说出口的人生困局，在二十公里山道上一寸寸被跑通。小说写的是跑不动的时候为什么还要跑下去，队伍里每个人都有自己的理由：有人为了逃避，有人为了证明，有人只是不想再一个人待着。原著比改编动画细得多，配速、呼吸、脚怎么落地这些枯燥部分写得认认真真，看完大概会想出去跑一次。文字版对训练细节的耐心，是影像很难给的。曾被改编为同名动画，动画的重心在比赛本身，小说则花更多篇幅写每个人的来处与去向。它最难得的是不煽情：跑就是跑，成绩就是成绩。适合在不想读太复杂故事的时候翻开，节奏干净，人物也清楚。｜作者：[日] 三浦紫苑"
  date: 2006-01-01
  added: 2026-10-07
  image: bk-004.jpg

