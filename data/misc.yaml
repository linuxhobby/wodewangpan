  quark_url: "https://pan.quark.cn/s/03b165a21b44"
  description: "这是一部网游题材有声小说的完整合集，原著出自网络作家清酒半壶，书名《我在绝地求生捡碎片》，全书 1120 回已完结，一次收齐不用等更新。故事走游戏流爽文路线：主角活在绝地求生的世界里，别人捡枪捡甲，他偏能捡到别人看不见的碎片，凑齐之后能兑换出各种超乎想象的奖励，从此在游戏里一路开挂，从无名小卒打到人人仰望的高峰，现实生活也跟着步步登高。这类作品节奏快、爽点密，听的时候基本不用动脑，适合通勤、健身、做家务时当背景音，一集二十来分钟，正好填满一段碎片时间。资源结构很规整：开场是一段剧透向的预告音频，想先听结论的可以直接感受；正文按回目分成三个目录，0001 到 0500、0501 到 1000、1000 到 1120 完结，按顺序往下听就行。全部为 MP3 格式，手机、车机、智能音箱都能直接播放，不用额外装解码器。注意全书体量不小，1120 回完整听下来需要相当长的时间，挑着听或者开倍速都是合理用法。｜清酒半壶《我在绝地求生捡碎片》"
