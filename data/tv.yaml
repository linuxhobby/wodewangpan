  description: "【第 1 季 · 共 6 集】设定在被空气污染摧毁的反乌托邦未来：外面的空气已经不适合呼吸，普通人活着要靠氧气，而配送物资的人成了新的权力阶层——「末日骑士」就是这群手握资源的送货员。故事跟着其中一位顶尖骑士和他新来的小跟班，看这个阶层内部怎么互相倾轧，以及底层怎么想往上挤。师徒关系是它的情感主轴，一个只想活下去，一个还想往上爬，两人的分歧越来越明显。氧气配额、配送路线和通行证构成了具体的权力结构，不是空泛的设定。六集的篇幅短、节奏快，动作场面不少，末世美术做得工整，荒原和贫民区的对比一目了然。它把「呼吸权」这个前提用得很直接：谁控制了氧气，谁就控制了所有人。阶层固化被写成了具体的空间区隔，看得出设计上花了心思。六集刷完不费劲，适合周末一个下午。适合喜欢科幻感设定、又想看点直给的韩式爽剧的观众；对逻辑严密性要求不高的话，追起来很顺。｜TMDB 7.4"
