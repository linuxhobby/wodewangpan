  description: "【第 1 季 · 共 12 集】川渝小城老街，面馆老板韩栋（佟大为 饰）与妻子林美月（王佳佳 饰）看似安稳平淡的日常之下，各自背负着二十年无法见光的秘密。\n　　林美月本名李荣珍，年轻时在孙家掌控的夜场谋生，长期遭受羞辱与压榨。不堪屈辱后她策划假死，改名换姓嫁给韩栋，只想彻底埋葬过去。然而，昔日姐妹玲姐（马苏 饰）手握她当年的证据找上门来勒索，扬言要曝光她的黑历史、毁掉她的家庭。\n　　韩栋心底同样压着二十年的愧疚——当年高中同学赵晓琪（葛鑫怡 饰）遭富二代孙海涛（任重 饰）侵害后跳楼自杀。他知情真相，却因母亲（田岷 饰）急需骨髓配型、畏惧孙家权势选择沉默。如今孙海涛已是当地灰色富商，偶然发现韩栋的秘密后以此要挟，步步紧逼。\n　　夫妻二人双双被逼至绝境。林美月找到当年夜场相依为命的姐妹阿妹（江疏影 饰）联手；韩栋也终于不再逃避，决定与妻子一同搜集孙家罪证。为拿到证据，两人多次实施越界行为。最终孙家罪行被警方彻查，孙海涛及其家族骨干全部落网。韩栋与林美月却因过往的过错与反击中的过界行为，双双入狱服刑。｜TMDB 8"
