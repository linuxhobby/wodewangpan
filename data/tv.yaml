  baidu_url: "https://pan.baidu.com/s/1UhhiE0FvwOe6O2xbvoXwwA"
  baidu_code: "tmqz"
  description: "【第 1 季 · 共 13 集】二十世纪九十年代初，心怀刑警理想却被困守看守所的杜湘东，意外发现关押的犯人徐文国与姚斌彬学识非凡、精通机械制造，颇为欣赏。然而随着调查深入，两人秘密研制枪械并涉嫌杀害车间主任的案件浮出水面。转运途中发生变故，两人趁机脱逃，杜湘东竭力将姚斌彬抓捕归案，而徐文国则遁入茫茫人海。此后二十余年，杜湘东对徐文国展开了一场漫长的追捕，这场追逐逐渐渗透进他们亲人朋友的生活，甚至改变了两人命运的底色。时代洪流中，一个困守看守所的警校高材生和一个隐姓埋名、奋力求生的逃犯，在漫长的岁月里彼此追逐、相互成就。两个人的对照是它的核心：一个守着规矩原地不动，一个亡命奔逃却始终没能自由。十三集的跨度很大，时代变迁被写进了两个人的处境里，谁都没有赢。适合喜欢年代跨度大、看重人物命运的悬疑剧观众。｜TMDB 7.1"
  date: 2025-04-18
  added: 2026-10-05
  image: tv-091.jpg


- id: tv-092
  title: "树影迷宫"
  category: 电视剧
