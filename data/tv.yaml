  description: "【第 1 季 · 共 13 集 · 全剧 2 季】一个大城市的外科医生被「下放」到小镇：他从波士顿离开，回到童年度过许多个夏天的地方当起医生。技术没得挑，举止却让人受不了——说话直、没耐心，当地居民看他那副样子就皱眉。而他自己也在应付心里那些没处理好的东西，学着怎么跟人建立哪怕是普通朋友那样的关系。十三集走的不是急诊室里争分夺秒的路数，而是用一个个小病例慢慢磨软这个人：给老人看慢性病、帮邻居处理小外伤、在酒馆里被搭话。他每一次出诊其实都在重新学习怎么跟人说话，医术在这里反倒成了次要的事。小镇的风光和人情是主菜，医疗只是切口。主角的社交笨拙没有被浪漫化，剧集很清楚他让人难受，也不急着替他开脱，这种诚实让它比一般的治愈剧耐看。配角群像写得好，镇上的人各有各的麻烦，不是背景板。看下来会有一种被慢慢焐热的感觉。适合想把剧当陪伴来养的观众；期待紧张抢救场面的会觉得节奏太松。｜TMDB 7.2"
