  baidu_pwd: "2c5b"
  description: "【第 1 季 · 共 12 集】在疯狂的世界里追查神秘的重案，KNS 时事人文局《揭密最前线》团队选择义无反顾地追求正义。组长吴疏龙只懂得活在当下，她在追查一起被埋藏二十年的失踪案时，被卷入了办公室的绯闻风波。就在团队因为匿名爆料者而开始出现裂痕之际，一个以自我为中心的极端利己主义者作为新人被调了进来。《揭密最前线》的办公室日夜不停地运转，要忙着驯服这个每件小事都要跟个性鲜明的组员起冲突的新人，还要忙着调查接连发生的重案。新人那条线是喜剧担当，他的自私不断撞上团队的底线，磨合过程挺好笑。即使世界不断阻挠，他们也要寻找真相，并且有格调地用摄影机教训恶棍。十二集把新闻行业的日常拍得具体：选题会、采访被拒、稿件被压，都不是背景。失踪案本身跨度二十年，线索一点点浮现，节奏控制得住。适合喜欢媒体题材、想看一群人怎么把真相挖出来的观众。｜TMDB 8.0"
