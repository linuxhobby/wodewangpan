  baidu_pwd: "lm5o"
  description: "【全剧 3 季 · 共 25 集】故事起点是伦敦黑帮头目被杀：这一个空缺，把城里不同国籍、不同派系的势力全都搅了进来，从街头小混混到远在中东的家族，每个人都想在这笔账里分一杯。头目之死只是引子，真正的戏在于谁来接这个位置，以及代价由谁承担。几个家族之间的旧账不是靠交代性台词说清楚的，而是在一次次见面里慢慢露出来。伦敦这座城市的多元构成被写进了帮派格局里，地域、族裔和旧账互相纠缠。三季二十五集，尺度很大，近身格斗和长镜头对打是招牌——导演把他拍动作片时那套狠劲都搬了上来，打斗的真实痛感很强。服装和场景讲究，帮派之间的等级规矩拍得有模有样。多线群戏是它的结构：各派系的谈判、背叛和清算同时进行，需要一点时间理清谁跟谁。节奏前慢后快，撑过前几集的人物铺垫之后会明显提速。适合能接受高强度暴力场面、喜欢帮派群戏的观众；对血腥画面敏感的慎入。｜TMDB 7.8"
