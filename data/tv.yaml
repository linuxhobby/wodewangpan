  quark_url: ""
  baidu_url: "https://pan.baidu.com/s/10KJvC-fO7vq5tDd2wRPalQ"
  baidu_pwd: "hxvc"
  description: "【第 1 季 · 共 13 集】改编自古龙小说《大地飞鹰》的武侠剧，故事放在明朝的西北边地。大漠深处传出三十万两黄金现世的消息，传言里凡是动过寻金念头的人最后都成了厉鬼，彼此砍杀，尸骨埋在沙下。甘州卫的章家镖所一夜之间被灭门，只剩孤女章路遥活了下来。她一个人穿过戈壁，混进寻金的人堆里，一边查灭门的凶手，一边把那批黄金当成诱饵，把当年参与的人一个一个引出来。锦衣卫仆鹰奉命查案，凉州副使虞侯在官场与江湖之间两头下注，西北大汉班查带着自己的兄弟另有所图，几条线在沙暴、驿站、废弃的烽燧里反复交错。剧集把复仇写成一条明线，把黄金写成一条暗线，谁拿到金子谁就离死更近一步，人心的贪与怕比刀更锋利。辛芷蕾把章路遥的狠劲与隐忍撑住了整条复仇线，陈坤的虞侯藏得深，高伟光的班查露得直，尹昉的仆鹰在规矩和人情之间来回摇摆。十三集的篇幅不长，沙漠实景和冷硬的打斗是主要看点，节奏偏慢热，喜欢传统武侠和群像角力的观众会比较受用。｜TMDB 7.7"
  date: 2026-08-25
  added: "2026-11-03"
  image: tv-010.jpg

