  baidu_code: "yovj"
  description: "【第 1 季 · 共 12 集】改编自紫金陈的小说《坏小孩》，故事从沿海小城的三个孩子开始：他们在景区玩耍时无意间拍下了一次谋杀，那段影像既是证据，也是他们手上唯一的筹码。原本只是想把这件麻烦事处理掉，三个孩子却一步步被卷进大人的世界，几个家庭随之被打乱，所有人都在往不可预知的方向滑。十二集的篇幅不长，节奏稳，真正厉害的地方在于它始终把视角压在孩子那一侧——大人以为自己在控制局面，其实每一步都被看在眼里。画面里的南方湿暑、老旧小区和蝉鸣构成了很强的生活质感，越日常越让人发凉。三个小演员的表演撑住了全剧的分量，他们不是被当成道具，而是真正推动事情走向的人。音乐和插曲的运用也是它出圈的原因之一，几段旋律和画面咬得很紧。最后的收口值得回头再想一遍，很多细节二刷时才对得上。适合喜欢那种案情之外还要照看人心的犯罪剧的观众；只想看解谜过程的会觉得它的重心不在案件本身。｜TMDB 8.381"
