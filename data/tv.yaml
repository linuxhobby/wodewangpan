  description: "【第 6 季 · 共 10 集 · 全剧 8 季】第六季于 2016 年播出，全季 10 集，取材原著第五部《魔龙的狂舞》并加入部分原创情节。开局即解开上一季的悬念：琼恩·雪诺被梅丽珊卓以黑魔法复活，重回守夜人阵营；瑟曦在裸体游街的奇耻之后绝地反击，用野火把贝勒大圣堂连同满城政敌一并抹去，托曼接连丧子丧后，君临王权彻底易手。北境战事再起，珊莎在布蕾妮护送下与琼恩汇合，兄妹联手在「私生子之战」中击溃拉姆斯·波顿，夺回临冬城；布兰则修成正果，成为新的三眼乌鸦。狭海对岸，丹妮莉丝被多斯拉克人擒获后凭巨龙与胆识脱身，随行的提利昂、瓦里斯等人帮她整肃奴隶湾，最终一支庞大的舰队扬帆西渡，向维斯特洛发起反攻。系列由 HBO 制作，改编自乔治·R·R·马丁的小说《冰与火之歌》，本目录为第 6 季全集，1080p 蓝光压制，内封中文字幕。｜TMDB 8.3"
