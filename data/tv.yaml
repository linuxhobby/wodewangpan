  baidu_code: "1oef"
  description: "【全剧 2 季 · 共 16 集】改编自杰克·卡尔的同名小说：海豹突击队员詹姆斯·里斯带队执行一项高风险秘密任务，结果全队落入埋伏，活着回来的几乎只有他自己。他带着说不通的记忆回到家，发现自己可能正成为某种掩盖的对象；新的证据出现之后，危险已经不只是冲着他，而是冲着他的妻女。他要面对的不是一个敌人，而是一整条互相掩护的链条。全剧偏写实，武器和战术细节考究，动作场面偏硬，不靠花哨剪辑糊弄，喜欢军事题材的观众会注意到不少专业细节。剧集在通讯、掩护、撤离这些环节上下了功夫，看得出有顾问参与。主角的行动逻辑始终围绕「弄清那天到底发生了什么」，这条线比复仇更稳固。它真正的主题是一个人对体制的信任如何一点点耗尽。节奏前慢后快，撑过前两集之后会明显提速。适合喜欢军事惊悚剧的观众；期待家庭温情的话，家人戏基本是作为压力来源存在的。｜TMDB 8.0"
