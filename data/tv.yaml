- id: tv-051
  title: "企鹅人"
  category: 电视剧
  tags: ["电视剧", "剧情", "犯罪", "企鹅人.The.Penguin.S01"]
  quark_url: "https://pan.quark.cn/s/7d8bde078af1"
  baidu_url: "https://pan.baidu.com/s/1VyL-xjHaZOoxXszbW9ge_Q"
  baidu_pwd: "l1v6"
  description: "【第 1 季 · 共 8 集】作为《新蝙蝠侠》的衍生剧，时间接在电影之后：哥谭因一场变故出现权力真空，奥斯瓦尔德·科布看准机会，一步步往上爬，要从众多势力手里夺下这座城市的犯罪帝国。八集的重心不在超级英雄式的对决，而是黑帮家族之间互相算计、彼此拉锯，谈判和背叛远比打斗多。奥兹的野心与自卑写得很足——他想被当回事，这份渴望驱动了他所有的动作，也让他一次次露怯。身边每个配角也都有自己的盘算，没人只是跟着混。剧集对这座城市的权力结构写得很耐心，谁跟谁结盟、谁在背后捅刀，都有交代。家族内部的母子关系尤其复杂，控制与依赖缠在一起，比外部争斗更让人不适。城市被拍得阴湿破败，和人物的处境是一致的，整体基调几乎不给人喘息。适合看过《新蝙蝠侠》、想接着看哥谭往哪走的观众；即使没看过电影也能看进去，但预先认识一下人物会更省劲。｜TMDB 8.4"
