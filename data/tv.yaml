  description: "【第 1 季 · 共 8 集】开场是一桩带着仪式味的凶杀：案件在一个平静的小镇炸开，手法异常、条理清晰，像是精心设计过的布置。负责调查的侦探不得不请来一位早已退休的老警察搭伙，因为案子最后指向的地方，和两个人各自的过去都有扯不清的联系。仪式感的布置让人忍不住去猜凶手想表达什么，而不只是想掩盖什么。八集的基调阴郁，线索推进扎实，叙事重点在「为什么会变成这样」而不是单纯的谁是凶手。它给观众的信息始终是吝啬的，需要几集才能真正进入状态，节奏偏慢，但每一步都踩得实。「曼陀罗」这个意象贯穿全剧，既指案件现场的布置，也暗示那种有毒却好看的诱惑。新老两代警察的搭档关系写得有层次：一个靠经验，一个靠流程，冲突不是代沟而是方法论之争。小镇的封闭感是它最重要的氛围来源，人人都认识人人，也人人都藏着话。适合喜欢慢节奏犯罪剧、不介意花时间等待的观众；想看快节奏的会嫌它闷。｜TMDB 7.2"
