  baidu_url: "https://pan.baidu.com/s/1X70OdumRrGgkkcynbpzDwg"
  baidu_code: "i9wb"
  description: "【第 1 季 · 共 10 集】韩国是个几乎见不到枪的国家，这也是这部剧最有力的设定前提：枪支管制极严，却开始出现来源不明的非法武器和接连不断的枪击案。两个男人各自因为不同的理由握住了枪，也因此被推到彼此的对立面。他们的社会位置相差很远，握枪的理由也因此完全不同。十集的紧张感来自这种反差——在一个几乎听不到枪声的社会里响起枪声，本身就是强烈的信号。叙事偏双线对照，重点不在追查谁开的枪，而在交代一个人为什么会走到持枪那一步。剧集没有急着审判谁，而是先把每个人的处境摆够，观众会在两边之间不断换边站。剧集对警方办案流程也写得不敷衍，取证、协同、舆情压力一层层叠上来。枪在这里不只是凶器，更是一种象征——当正常的申诉渠道失效，人会去够什么。适合喜欢社会议题与犯罪悬疑结合的观众；只想看动作场面的话，它的文戏比重会超出预期。｜TMDB 8.1"
