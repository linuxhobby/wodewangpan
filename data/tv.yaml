  quark_url: "https://pan.quark.cn/s/13fcc745ab9c"
  description: "【第 1 季 · 共 40 集】民国年代爱情剧《玉簟秋》把情感放进上世纪二十年代的军阀混战里，乱世替这段关系铺出最残酷的底色。丞磊饰演的少帅虞昶轩手握兵权，身处权力与枪声的中心；徐若晗出演的女学生叶平君受过新式教育，原本与他的世界没有交集，两人却因一次意外相遇被牢牢牵在一起。身份悬殊、立场相左，家族旧怨与前线战事层层压来，这段感情从开始就注定难以平静。剧集以战火为经、情爱为纬，写二人在阴谋与硝烟之间如何守住彼此，也把个人的取舍一点点并入信仰与家国的选择，沙场局势和儿女情长互相推动。本作由中国大陆出品，普通话对白，第一季共40集，2026年10月12日开播，上线后热度持续走高，节奏绵密、情感浓度高，适合偏爱年代传奇与强冲突爱情线的观众。｜TMDB 8.0"
