  baidu_code: "q3gv"
  description: "【全剧 4 季 · 共 32 集】故事从五位刚毕业的年轻人迈进伦敦一家知名投行的那一刻开始：他们要在极短的时间里证明自己值得留下，而这家机构本身也在高压运转。剧集把镜头贴得很近——入职培训、凌晨的工位、交易大厅的喊单，还有华丽衣着背后那些说不出口的压力。它写的不是金融知识，而是人在这种环境里会被塑成什么样：睡眠、自尊、私人关系全都被折算成绩效。几位新人出身背景各异，面对同一套规则的反应差别很大，这也是群戏最好看的地方。所谓精英门槛，说到底是谁能扛住被羞辱这件事，剧集把这一层挑明了。职场霸凌、越界与性向议题都有涉及，写得直接，不粉饰。它不提供职场晋升的爽感，几乎每个人的代价都大于收获。节奏快，对话密，较量几乎不留空隙。喜欢《继承之战》那种权力与金钱题材的观众会对上频率；想看懂每一步金融操作的话，它并不打算解释清楚。｜TMDB 6.8"
