  description: "【全剧 3 季 · 共 22 集】这大概是近十年传播最广的韩剧：一群走投无路的人收到奇怪的邀请，去参加据说能赢下巨额奖金的游戏，到了地方才发现那是几道童年游戏改造的生死关，输即是死。它的冲击力来自极简的视觉符号——粉衣士兵、椪糖、木头人——以及把贫富差距直接摆到台面上的叙事。参赛者不是抽象的数字，每个人都有具体的债：赌债、医疗费、被骗走的积蓄，被逼到这一步的理由都写得清楚。淘汰的残酷和游戏的童真形式反差极大，这也是它最令人不适也最有效的地方。三季的篇幅里第一季结构最完整，单独看完也没问题。如果你还没看过，建议别先搜任何剪辑，开场那几场戏需要自己在毫无准备的情况下撞上去；看过的人回头重看，往往会发现不少当初漏掉的伏笔。适合能接受高强度暴力场面、想看点关于人性与金钱的极端实验的观众。｜TMDB 7.9"
