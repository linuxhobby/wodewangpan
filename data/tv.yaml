  baidu_url: "https://pan.baidu.com/s/1fLM-9pBStea28klnyb7rlw"
  baidu_code: "or7s"
  description: "【第 1 季 · 共 15 集】故事以一桩“雨夜悬案”拉开序幕。刑警姜光明（马伊琍 饰）和新人警察石落（高至霆 饰）在调查一起独居女性被害案时，意外发现知名作家顾己鸣（佟大为 饰）的最新小说《黑雨》中所描绘的犯罪现场，与他们正在调查的案发现场惊人地重合。虚构与现实的交错，为警方的调查打开了新的突破口，但也将他们引向了更深的迷局。 随着调查的深入，一个关乎“案中案”的真相被层层揭开。表面上光鲜亮丽的作家顾己鸣，其背后却隐藏着一段不为人知的黑暗过往。为了成名，他不惜利用前女友江娜（郑水晶 饰）的感情与帮助，窃取作家唐寻（王劲松 饰）的手稿作为创作灵感。当他发现江娜可能成为其飞黄腾达的障碍时，竟痛下杀手，背上人命。而在这一连串的事件背后，刑警姜光明也因丈夫的背叛，陷入了婚姻与事业的双重危机。 最终，在警方的缜密调查下，顾己鸣的罪行昭然若揭，在婚礼上被绳之以法。而姜光明也在经历这一切后，选择勇敢面对生活，开启新的人生。｜TMDB 7.4"
  date: 2024-07-11
  added: 2026-10-05
  image: tv-084.jpg


- id: tv-085
