  baidu_url: "https://pan.baidu.com/s/1IIr0VT1K0LEgefK-IF_aIQ"
  baidu_code: "ognl"
  description: "【第 1 季 · 共 13 集】主线是一桩凶杀案：女警察冉咚咚带着专案组查线索、审嫌疑人、一点点把人揪出来；副线则是她自己的婚姻——丈夫是否有外遇这件事像背景噪音一样挥之不去，加上长期高压带来的情绪问题，让她的判断时不时晃动一下。十三集里两条线互相施压，看点在于她如何在快要撑不住的时候还得做出正确判断。审讯段落写得细致，一句口供的松动往往要靠几集的铺垫。婚姻线不是点缀，它和案件形成对照——两件事都需要判断力，也都缺乏确定答案。婚姻的处理不靠抓奸和争吵，而是靠一次次说不通的对话，这比戏剧冲突更磨人。案件本身不算花哨，落脚点始终在人身上。剧集对这份职业的消耗写得实在：长期加班、见惯了最坏的情况，回到家还得维持正常生活。节奏偏慢，但人物写得扎实，看完会有回味。适合喜欢关注人物心理状态、而不只看谁是真凶的观众。｜TMDB 7.5"
  date: 2023-03-16
  added: 2026-10-05
  image: tv-102.jpg


- id: tv-103
  title: "淘金"
  category: 电视剧
  tags: ["电视剧", "犯罪", "剧情", "悬疑"]
  quark_url: "https://pan.quark.cn/s/a18ad561ee3c"
  baidu_url: "https://pan.baidu.com/s/13WqtUaot-dbmza8XyBwHlA"
  baidu_code: "vfbk"
  description: "【第 1 季 · 共 12 集】拱马国淘金区四木场，淘金客们要赶在雨季来临前淘到更多的砂金。金老板武建超为退休上岸积攒了数年的砂金被人摸走，又遭遇河段将被吞并的危机，背后操控这一切的是一个绰号为「猫头鹰」的神秘金贩。淘金新手陈保金为追寻哥哥意外死亡的真相，孤身来到拱马，却深陷迷局。突如其来的「洗场」让淘金客们一季的辛苦与期冀付之东流，众人孤注一掷，奔向荒废数十年的姊妹岭老金场做最后一搏。淘金客们闯入深山老林，死亡的阴影一路伴随，而「猫头鹰」也逐渐浮出水面。人物关系在利益面前不断重组，昨天的伙伴今天可能就是对手，这一点写得实在。十二集的魅力在于那个行当本身：规矩、黑话、分金的算计，都被写得具体。荒山和河滩的实景拍摄给了它粗粝的质感，人显得格外渺小。适合喜欢冒险题材、想看点国产剧里少见的行当故事的观众。｜TMDB 8.0"
  date: 2022-01-18
  added: 2026-10-05
  image: tv-103.jpg


- id: tv-104
  title: "乌云之上"
  category: 电视剧
  tags: ["电视剧", "悬疑", "剧情", "犯罪"]
  quark_url: "https://pan.quark.cn/s/dd3d59bdb0b3"
  baidu_url: "https://pan.baidu.com/s/1zkFSahROiti-mjtowqSbaA"
  baidu_code: "9vzx"
  description: "【第 1 季 · 共 17 集】韩青（孙俪 饰）是三合刑侦队的女警官，工作上一丝不苟，被同事们称为“不高兴”。她与搭档钟伟（罗晋 饰）合作多年，默契十足，然而在一次跟踪嫌疑人的任务后，钟伟离奇失踪，近两个月杳无音信。\n2017年夏天，一场暴雨席卷南方小城后，惊现碎尸。韩青一边全力侦办这起碎尸案，一边持续寻找失踪的搭档钟伟。随着调查的深入，她通过蛛丝马迹发现新命案与钟伟的失踪有着千丝万缕的联系。见习警员林嘉嘉（丁冠森 饰）的加入，为案件侦破带来新的视角。在追查过程中，罪犯总能快人一步，让警方怀疑警局内部有人泄露消息，甚至惊觉有“内鬼”存在。\n面对重重阻力，韩青始终没有放弃。随着调查推进，警方发现这起碎尸案背后暗藏着一个庞大的贩毒集团，而钟伟的失踪也与该贩毒案紧密关联。最终，三合刑侦队抽丝剥茧，发现了失踪、杀人、贩毒三件大案的内在联系，一个精心构建的犯罪网络慢慢浮出水面。全体成员群策群力，拨开重重迷雾，一举破获全案，将犯罪分子悉数落网。｜TMDB 7.6"
  date: 2025-04-03
  added: 2026-10-05
  image: tv-104.jpg


- id: tv-105
  title: "八角亭谜雾"
  category: 电视剧
  tags: ["电视剧", "犯罪", "家庭", "悬疑"]
  quark_url: "https://pan.quark.cn/s/7a5d9601a632"
  baidu_url: "https://pan.baidu.com/s/1_dn4Mj_tzkqtf_t3c2BV0A"
  baidu_code: "91jp"
  description: "【第 1 季 · 共 12 集】一个家族的旧伤，是这部剧的全部起点：十七年前，玄家小妹玄珍离奇被害，案子一直悬着，孪生姐姐玄珠多年没有回过家。十七年后镇上又出了命案，线索再次绕回玄家，哥哥玄梁成了嫌疑人，病重的母亲把四散的家人重新聚到一起。玄家四散的兄妹各有各的算盘，这次重聚不是温情，而是新一轮的互相试探。十二集的篇幅里案件和家庭纠葛是一体两面——每逼近真相一步，这个家就裂得更深一点。小镇的湿气、老宅的压抑感，和人物之间说不清的怨一起构成了它的气质，很多情绪是靠沉默传出来的。剧集对「失去一个孩子之后，一个家还能不能算是家」这个问题写得相当克制，没有煽情，但后劲足。演员阵容整体偏稳，长镜头和留白用得多，需要一点耐心。适合喜欢家庭悬疑那一类的观众；想看纯粹刑侦的会觉得它太慢，因为破案从来不是它唯一在意的事。｜TMDB 5.6"
