  baidu_url: "https://pan.baidu.com/s/1VZ-B3JYzmuQna4xqTpau2g"
  baidu_code: "7t1c"
  description: "【第 1 季 · 共 12 集】绿藤市，游戏工作室老板于海突遭投资人沈辉撤资，沈辉的冷酷让他咽不下这口气。他意外遇见沈辉的女儿路婕，两人合谋了一场假绑架想报复沈辉，事情却在过程中变了味——本该是算计，两个人却陷了进去。多日之后路婕被发现死亡，警察介入侦破，随着调查推进，藏在一切背后的危险逐渐浮出水面。十二集的结构很有意思：前半段是骗局如何搭起来，后半段是它如何塌掉，时间线来回跳。同一个场景会从不同人的视角再演一遍，看的时候需要留意细节上的差别。它真正写的是贪念——每个人都在算，却没人算得清自己要付多少。几位主演的对手戏有分量，谈判和审讯的段落台词密度高。绿藤这座虚构城市的氛围做得很足，湿冷压抑，和故事的调子一致。结尾留有回味的余地，看完会想倒回去再看一遍开头。适合喜欢结构精巧、愿意跟着时间线拼图的观众。｜TMDB 8.4"
