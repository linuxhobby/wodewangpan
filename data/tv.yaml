  baidu_url: "https://pan.baidu.com/s/10b67CSLEHlfJcqjwxBqY2g"
  baidu_code: "6fi0"
  description: "【第 1 季 · 共 16 集】故事的时间锚点是世纪之交的一座江边小城：因为上游水利工程要蓄水，整座城即将沉到水底，居民忙着迁走，新城的脚手架同时立起来。所有人都在告别旧生活的时候，一桩离奇的杀人案把警方拽进了另一条时间线——死去的情人、消失多年又复生的丈夫，身份在凶手与死者之间来回翻转。追查越深，越牵出一段被埋了多年的旧事，而当年在场的人几乎都选择了沉默。追凶线和小城搬迁的倒计时并行，两条线互相给对方增压，谁都等不起。值得一提的是它的空间感：暴雨、江面、即将被淹没的街巷一起构成了一种压迫性的潮湿氛围，人性与真相的命题借此落地，而不是靠台词讲出来。结尾的落点不在于抓到谁，而是那些即将被水淹掉的东西还能不能说出来。适合喜欢国产年代悬疑、愿意跟着人物一点点往回翻旧账的观众；它不靠快节奏取胜，胜在把一个地方的消失和一群人的秘密绑在了一起。如果偏好两集一案的爽剧节奏，这部会显得慢。｜TMDB 7.5"
  date: 2025-08-28
  added: 2026-10-05
  image: tv-088.jpg


- id: tv-089
  title: "再见，那一天"
