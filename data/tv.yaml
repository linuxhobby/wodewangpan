  description: "【全剧 5 季 · 共 103 集】纽约地铁上，几个小混混无端挑衅一个衣着褴褛的流浪汉，却不想被他狠狠收拾了一顿，众人全部被带回警局。警官卡特（塔拉吉·P·汉森 Taraji P. Henson 饰）对这个神秘的流浪汉充满兴趣，正当调查处一丝线索，不想流浪汉竟然被人保释。原来流浪汉是一个曾经接受过中央情报局特殊训练的特工里瑟（詹姆斯·卡维泽 James Caviezel 饰），而保释他的则是拥有无限的财富的富翁芬奇（迈克尔·爱默生 Michael Emerson 饰）。芬奇曾为政府研发了一种可识别罪犯犯罪意识的程序，却被政府认为大材小用而关闭了一部分程序。而现在芬奇希望借助里瑟的能力和这一套程序进行“法外执法”，维持正义、制止犯…｜TMDB 8.1"
