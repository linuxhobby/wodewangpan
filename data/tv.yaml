  description: "【全剧 2 季 · 共 16 集】这是从电影《自杀小队》里拎出来的角色衍生的剧集：那个满脑子信念、嘴上没门的雇佣兵被塞进一支新队伍去执行任务，要实现他挂在嘴边的和平，就不得不面对外面的敌人和自己那笔没算清的旧账。笑点很密而且相当不正经，台词和场面都往尴尬里写，几乎不留体面。但底下压着一个「被父权阴影毁掉的人能不能重来」的故事线，几处真情实感的段落意外地扎实，笑完之后会有点堵。它也敢于让角色真的承担后果，不是吵一架就和好。配角们也不是陪衬，每个人都有明确的功能和笑点，队伍的化学反应挺好。动作场面拍得热闹，血肉横飞里带着明显的玩闹劲儿。它对待暴力的态度很随意，这一点能劝退一部分观众，也正是另一部分人喜欢它的原因。整体不适合严肃看待，但人物写得比表面看起来认真。适合能接受荒诞暴力与低俗幽默的观众；冲着超级英雄正片来的话，可能会觉得这群人太不体面。｜TMDB 8.2"
