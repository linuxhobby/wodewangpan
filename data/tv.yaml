  description: "【第 3 季 · 共 8 集 · 全剧 3 季】「母狮」项目仍在运作，第三季继续跟着克鲁兹和乔这对组合：新的目标更难接近，代价也更高，这一季更直接地逼主角做选择——完成任务和保住自己的人，只能选一边。八集的篇幅短，节奏紧凑，动作戏比重比前两季大，潜入和撤离的段落拍得更硬，调度利落，看得出预算花在了哪里。乔这条线也在收束，她要在上级压力和手下人的安全之间反复权衡，几场对话的分量并不比动作戏轻。上级只要结果，执行者却要面对活生生的人，这道裂缝是这一季最沉的部分。它真正想说的是：一个被训练成工具的人，最后还能不能把自己要回来。克鲁兹这几季的变化是连着的，从前两季看下来，她的每一次妥协都会在这一季显形。单独抽出来看主线还能跟上，但情绪厚度会少一层。整体基调比前两季更冷。适合已经入了这个系列、想知道结局怎么收的观众。｜TMDB 8.3"
