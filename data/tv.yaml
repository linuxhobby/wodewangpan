- id: tv-135
  title: "神探狄仁杰 第一部"
  category: 电视剧
  tags: ["电视剧", "剧情", "悬疑", "神探狄仁杰 第一部 Amazing Detective Di Renjie"]
  quark_url: "https://pan.quark.cn/s/5e058a54a082"
  description: "【第 1 季 · 共 30 集 · 全剧 5 季】2004 年开播的国产古装悬疑剧，由钱雁秋执导，梁冠华、张子健、吕中主演，是「神探狄仁杰」系列的开山之作。全季由《使团惊魂》《蓝衫记》《滴血雄鹰》三个既独立成篇又暗线相连的单元组成，一次看完等于三个完整的案子。开篇《使团惊魂》把时间放在武周年间：突厥战争刚刚结束，举国上下正迎接议和使团入京，使团却在逗留期间接连爆出震惊朝野的大案，内忧外患逼得武则天急调狄仁杰火速进京破案，庙堂之高与江湖之远的角力由此铺开。《蓝衫记》转入乡野，狄仁杰与贴身护卫李元芳微服暗查民情，一天之内连发两起命案，两人顺藤摸瓜，牵出的水比想象中深得多。《滴血雄鹰》则从一幅用鲜血绘成的滴血雄鹰图起笔，诡异氛围在三个单元里最重。剧集的看点不在打斗而在推理与对话：狄仁杰层层设问、以人证物证反推全局的桥段贯穿始终，李元芳的武功与忠义则是行动线的支点。全剧台词密度高、逻辑闭环扎实，武则天与狄仁杰之间的君臣互信也写出了分量，堪称国产推理剧的标杆之作，多年后仍被剧迷反复回味。｜TMDB 9.0"
  date: 2004-08-05
  added: "2026-10-10 19:25"
  image: tv-135.jpg


- id: tv-136
  title: "喜剧之王"
  category: 电视剧
  tags: ["电视剧", "喜剧", "爱情", "喜剧之王 King of Comedy"]
  quark_url: "https://pan.quark.cn/s/7ea4d02b226e"
  description: "【第 1 季 · 共 24 集】2026 年 10 月上线的都市喜剧，把经典 IP《喜剧之王》落地成了福建渔村里的内容创业故事。沙浦村地处沿海，位置偏远、人口流失严重，面对开发商黄总抛出的拆迁方案，村民大多已经动摇，只有阿珍（杨超越 饰）和哥哥嘉豪（张弛 饰）坚决不肯签字。兄妹俩为村子争到七天喘息之机，打算借《喜剧之王》这个 IP 的知名度做内容自救，他们请来有经验的内容人周可（蒋龙 饰）和表姐林细妹（蒋诗萌 饰）帮忙操盘。周可临危受命却状况不断：首波视频意外爆红，账号却突然被封，一番醉酒操作反倒引来文旅部门的关注。眼看形势好转，侵权风波接踵而至，对手船澳村又盗用他们的账号，村子再次被逼到墙角。主线之外，周可和阿珍在并肩作战中逐渐升温的感情，以及误解与阴谋的层层升级，让这部喜剧既有笑点也有悬念。全剧用小人物对抗大资本的套路致敬原作内核：努力未必立刻兑现，但总得先把今天的戏演好。开播数日口碑迅速走高，是近年少有的把短视频生态写进正剧节拍的国产喜剧。｜TMDB 9.0"
  date: 2026-10-06
  added: "2026-10-10 19:25"
  image: tv-136.jpg


