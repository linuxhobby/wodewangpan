  description: "【第 1 季 · 共 8 集 · 全剧 2 季】改编自同名网络漫画，讲的是两个靠打拳谋生的年轻人怎么一步步卷进放贷这行：他们替人追债，跟着一位心软的放贷人做事，结果发现真正可怕的不是欠钱的人，而是那些专挑走投无路的人下手的高利贷组织。八集的最大卖点是近身搏斗——动作戏靠实打实的编排而不是特效堆出来，看着就有疼感，两个主角的拳击底子也用上了。感情线点到为止，看点在两个年轻人从挨打到还手的成长：他们不是变强了，而是终于不再忍。放贷人这个角色提供了道德坐标，让整部剧不至于只剩拳头。两个主角的兄弟情写得实在，吵架和替对方挡拳都是真的。催债这条线提供了具体的社会切面，每一单背后都是一个被逼到绝路的人。情节不绕弯，谁坏谁更坏一目了然，看得痛快。节奏直来直去，没有复杂的布局。适合喜欢动作剧、不要求剧情过分弯绕的观众；对暴力场面敏感的话需要留意。｜TMDB 8.5"
