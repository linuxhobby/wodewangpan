  baidu_code: "clp1"
  description: "【第 1 季 · 共 8 集】在幅员广大、艳阳高照的新墨西哥沙漠地带，有一座名为「退休镇」的优美社区，吸引众人在此安享晚年。然而对刚搬来的山姆来说，这片天堂更像是冰冷的牢笼。某天晚上，一场可怕的遭遇让他惊觉看似干净的小巷其实藏着骇人听闻的真相。地方官员对他的警告视若无睹，认为他只是老了胡言乱语，但他意外招来了一群同样被视为异类的邻居：睿智犀利的前记者、追寻心灵救赎的探索者、愤世嫉俗的音乐经纪人，以及走投无路的天才医生。这群被人看扁的边缘人必须联手揭开退休镇深藏的黑暗秘密。八集把悬疑和黑色幽默搭在一起，养老社区的明媚阳光和底下的阴私形成了强烈反差。几位老演员的表演是它最大的底气，台词节奏好，几场群戏很有看头。它真正想说的是：被当成无用的老人，反而没人防备他们。适合喜欢群像探案、不介意节奏偏轻松的观众。｜TMDB 7.1"
  date: 2026-05-21
  added: 2026-09-24
  image: tv-009.jpg

