  baidu_url: "https://pan.baidu.com/s/1IJg2kXCImNVibuwYMap5mw"
  baidu_code: "8eic"
  description: "【全剧 3 季 · 共 18 集】当监控画面可以被修改，我们还敢相信自己的眼睛吗——这是《真相捕捉》反复追问的问题。士兵肖恩·埃默里因为视频证据存在缺陷，被撤销了在阿富汗的谋杀罪名，带着女儿回到伦敦重新开始；可一段闭路电视录像流出之后，他转眼又成了通缉对象。接手调查的警探蕾切尔·凯里越查越不确定，因为她看到的「真相」取决于画面是怎么剪的。全剧节奏紧，把技术焦虑写得很具体：不是遥远的未来设定，而是当下已经在用的系统。剧集的聪明之处在于始终不给观众一个稳固的立足点，你以为看清了，下一集就被推翻。它讨论的其实是权力——谁掌握了影像，谁就掌握了叙述。没有科幻设定，全是现实技术，这一点反而让它更让人不安。适合喜欢《疑犯追踪》式题材的观众；如果反感角色被反复推翻证词，会觉得有些绕。｜TMDB 7.6"
