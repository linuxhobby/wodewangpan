- id: tv-164
  title: "天作不合的我们 第一季"
  category: 电视剧
  tags: ["电视剧", "喜剧", "剧情", "天作不合的我们 第一季 Nobody Wants This S01"]
  quark_url: "https://pan.quark.cn/s/ffe9215e9c02"
  description: "【第 1 季 · 共 10 集 · 全剧 3 季】两位主角一开始就站在信仰的两端：乔安是做性话题播客的主持人，说话直白、习惯把私生活当素材；诺亚则是刚结束一段感情的拉比，站在会堂里讲道，也活在家人的期待里。吸引来得很快，麻烦也来得很快，十集基本都在处理「两个人要不要为对方改变」这件事。乔安得面对一整套她从未接触过的宗教规矩与家庭礼仪，诺亚则要应付教众、父母和哥哥萨沙投来的目光。妹妹兼播客搭档摩根提供了大量吐槽与侧面观察，让这段关系不至于只剩下甜。它把犹太家庭内部的张力拍得很具体：餐桌、节日、会堂，每一处都是考验。克里斯汀·贝尔与亚当·布罗迪的对手戏撑住了全剧，台词密度高，喜剧节奏靠人物性格冲突而不是段子堆砌。主创艾琳·福斯特把自己的跨文化经历写进剧本，细节扎实。整体是轻喜剧外壳下的一段关系观察，节奏明快，十集一口气能看完。｜TMDB 8.0"
  date: 2024-09-26
  added: "2026-10-23 10:35"
  image: tv-164.jpg

- id: tv-165
  title: "天作不合的我们 第二季"
  category: 电视剧
  tags: ["电视剧", "喜剧", "剧情", "天作不合的我们 第二季 Nobody Wants This S02"]
  quark_url: "https://pan.quark.cn/s/dace9812cc97"
  description: "【第 2 季 · 共 10 集 · 全剧 3 季】进入第二季，热恋期已经过去，问题从「能不能在一起」变成「怎么一起过日子」。乔安与诺亚开始真正踏进对方的生活圈：见朋友、过节日、协调各自的工作节奏，摩擦点从信仰差异扩散到未来规划、家庭边界和与朋友的相处方式。十集里几个关键节点都落在具体场合，一顿晚餐会、一次情人节、一场关于「怎样才算好拉比」的比较，矛盾不再是抽象的观念分歧，而是生活里躲不开的安排。诺亚要在教众期待与个人选择之间权衡，乔安则在要不要为这段关系改变自己上反复犹豫；摩根与萨沙依旧提供不同的声音，把同一个问题拆成好几种立场。相比第一季的相遇与试探，这一季更松散也更日常，笑点仍在，情绪落点更靠近成年人关系的取舍。两位主演把吵而不散演得可信，首季建立起来的化学反应延续了下来。第三季已经排上日程，这条线接下来还有得看。｜TMDB 7.9"
  date: 2025-10-23
  added: "2026-10-23 10:36"
  image: tv-165.jpg

