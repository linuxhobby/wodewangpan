  baidu_url: "https://pan.baidu.com/s/1oo5kcSFh090QbOKlEDjnyQ"
  baidu_code: "tzdo"
  description: "【第 1 季 · 共 6 集】上世纪九十年代，热血不羁的钢厂大院才子胡广来，跟刚调来的社区民警全党愿惺惺相惜，情同弟兄。因姐姐被流氓强暴，胡广来激愤下失手杀死对方被判死缓，彻底绝望。全党愿毅然担起了他与这个世界之间的纽带，在他不断的坚持和感化下，胡广来认真改造减刑，重拾了生活的尊严和希望。就在刑期将满前，胡广来惊闻全党愿被人打死的噩耗。去世前，癌症晚期的全党愿把他托付给了干女儿梅湘。在梅湘帮助下胡广来学会自食其力，也开始和她一起秉承全党愿的遗志，帮助那些刑满回乡人员重新开始生活。全党愿这个角色是整部剧的支点，他不讲大道理，靠的是一直不放弃。刑满回乡人员这条线写得难得，社会对他们的冷眼比监狱更难熬。六集的篇幅很短，情感却很足，重点不在案情而在「一个人怎么被拉回来」。适合喜欢温情现实主义、想看点朴素人物故事的观众。｜TMDB 0"
