  baidu_code: "f6l7"
  description: "【第 1 季 · 共 10 集】作为《斯巴达克斯》系列的首部衍生剧，设定接在《复仇》第二季结尾：亚述没有死在维苏威山——他因为协助罗马人镇压奴隶起义、间接造成斯巴达克斯之死，换来了原本属于巴蒂亚塔斯的那座角斗士学院。故事就从他接手这份沾血的产业开始，看他怎么在罗马人的权力网络里立住脚跟：要讨好赞助人、要压住角斗士、还要防着同僚下黑手。十集的篇幅里血腥与权谋并重，暴力场面继承了原剧的风格。这个角色的魅力在于他毫不掩饰自己的投机：他不谈荣誉，只谈生存和往上爬，反而比很多正面人物更真实。他走的每一步都踩在别人的尸体上，他自己清楚这一点，也毫不在意。角斗士学院的日常被拍得细致，训练、下注、人事调度构成了另一条看不见的战线，想看权谋斗争的观众会比想看角斗的更过瘾。适合看过原剧、想知道「如果活下来的是亚述会怎样」的观众；没看过也能跟，但少了那层前史会打折。｜TMDB 7.3"
