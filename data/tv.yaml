  baidu_url: "https://pan.baidu.com/s/1CWB7BnjYt3tn1tyEzXKehg"
  baidu_code: "wc6a"
  description: "【第 1 季 · 共 8 集】朝鲜时代的深宅是这部古装剧的舞台：出身名门的赵氏夫人不甘心一辈子困在里面，她与城里出了名的风流人物赵元展开了一场彼此设局、胜负难料的爱情游戏，而被拉进这场赌局的熙妍渐渐发现自己也不是旁观者。八集的服化道讲究，服饰、器物和宅院陈设都下了功夫。情感的推进带着明显的算计感——每一次靠近都可能是布局，每一次退让也可能是诱敌。它真正有意思的地方在于把这场猎艳游戏反过来写：谁在引诱谁，到最后并不好说。三位主演的对手戏撑住了这场博弈，眼神和台词的空隙里都是话。赌局一开始就有人输不起，到后面谁也谈不上赢，这个走向比单纯的爱情故事更有味。剧集对女性处境的着墨比同类古装剧重，困住她们的既有礼法，也有自己的算计。整体气质偏冷，浪漫里带着不甘。适合喜欢朝鲜时代背景、或者看过电影《丑闻》想看长剧版的观众；期待现代剧节奏的话会慢。｜TMDB 7.1"
  date: 2026-09-18
