  baidu_url: "https://pan.baidu.com/s/1aK1eiukWAypcm1YTJnItBg"
  baidu_code: "tdnw"
  description: "【第 1 季 · 共 12 集】一桩二十年没能破解的少女被害案，在二十年后以几乎相同的方式再次发生，把一座看似平静的江边小城重新拖回记忆里。当年还是少年的山峰如今成了警察，回到这座城；无法抹去的痛苦记忆逼着他重新追凶，而在寻找真相的过程中他发现，不只是自己，所有当年牵涉其中的人都被这桩旧案改写了人生。十二集的篇幅里，夜色、江雾和湿冷的空气构成了它的视觉基调，追凶的过程同时也是一场对人性的反复拷问。剧集在「时间如何改变人」这一点上着力最深：二十年前后的同一批人，立场和说辞全都不再一样。案件的推进靠的是反复回访和证词比对，属于慢工出细活的那一类。想要快节奏破案的观众会觉得拖，但对喜欢心理博弈的人来说，这种慢恰恰是它最有力的地方。适合喜欢国产悬疑、愿意跟着人物在灰色地带里走一遭的观众。｜TMDB 6.8"
  date: 2020-08-18
  added: 2026-10-05
