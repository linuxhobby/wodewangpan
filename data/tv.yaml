  description: "【第 1 季 · 共 10 集】把它当成一部海岛风光片来看也不亏：故事落在一座以草莓种植为生的日本小岛上，一边是刚经历人生清零、从城市里逃出来的韩国空间规划师，一边是把全部心思都扑在自家草莓地里的当地姑娘。两个语言不通、生活节奏完全不同的人，被迫在同一块土地上相处，从互相看不顺眼到慢慢听懂对方在说什么。剧情走的不是强冲突路线，而是把恋爱藏在农活、节庆、邻里往来这些日常缝隙里，甜里带着生活本身的涩。农活、天气、收获的周期成了两个人相处的节拍器，感情推进得慢但扎实。岛屿的自然光和农田质感拍得很干净，看的时候很容易放松下来。跨文化设定没有被当成噱头，而是真实地制造了不少误会与笑点。它想让人看的是两个人怎么从陌生走到依赖，而不是误会与和解的套路。适合想在下班后看一部不用动脑、节奏舒缓的爱情剧的观众；期待强情节反转的话，它的乐趣主要在氛围和两个人相处的细节上。｜TMDB 9.0"
