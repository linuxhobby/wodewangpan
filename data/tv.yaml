  added: 2026-10-05
  image: tv-095.jpg


- id: tv-096
  title: "风中的火焰"
  category: 电视剧
  tags: ["电视剧", "剧情", "悬疑"]
  quark_url: "https://pan.quark.cn/s/dd228f13a27c"
  baidu_url: "https://pan.baidu.com/s/1HTuL3dP4qdgnxr7AwYiKyA"
  baidu_code: "aymj"
  description: "【第 1 季 · 共 24 集】二〇〇三年宁夏的一座矿区小镇，是这部剧的全部场域：动迁在即，警局门前出现一具被焚烧的女尸，作案方式与十年前当地那桩没结的恶性案子几乎一样。即将退休的老刑警褚志强和因过失被下调到此地的张韬成了搭档，一边查案一边看着小镇被拆散，也逐渐揭开当年留下的那场悲剧。二十四集的基调粗粝干旱，风沙、矿区和空掉的街道一起构成了人与镇共同散架的感觉。剧集在「一个资源型小镇如何走向终结」这件事上花了不少笔墨，拆迁、失业、人口外流都不是背景，而是案件的一部分。两位主角的处境互为镜像：一个要体面地收尾，一个要在边缘重新证明自己。节奏慢，但环境与人物的咬合很紧，看进去之后后劲足。适合喜欢国产现实主义悬疑、不着急看到答案的观众；想看紧凑破案的会觉得它的生活流段落偏多。｜TMDB 7.7"
  date: 2024-12-26
  added: 2026-10-05
  image: tv-096.jpg


- id: tv-097
  title: "不可告人"
  category: 电视剧
  tags: ["电视剧", "悬疑", "犯罪"]
  quark_url: "https://pan.quark.cn/s/ac3f01667dec"
  baidu_url: "https://pan.baidu.com/s/1ZrzZdHzfWCwukveckFnXAg"
  baidu_code: "6ra9"
  description: "【第 1 季 · 共 12 集】一次失败的行动，改变了他的一生。\n　　即将退休的老警察郑英（陈楚翰 饰）伪装境外商人与刘青（刘奕君 饰）团伙交易，内有卧底多年的年轻警察高阳（欧豪 饰）接应，外有默契搭档的队长李登元（赵阳 饰）布控，却在成功收网时离奇失踪，生不见人，死不见尸。\n　　卧底警察高阳为了寻找郑英的线索，始终没有恢复身份。隐姓埋名，混迹团伙，藏身黑暗之中，目送爱人远去。\n　　痛失父亲的郑冬雨（李一桐 饰）一夜长大。那个骄纵、飞扬的青春少女，成了斗争在罪恶前线的女警。支撑她的唯一信念就是：找到父亲，哪怕只剩枯骨！\n　　六年之后，雷乃武（张国强 饰）——当年刘青团伙的关键人物，也是最后一个见过郑英的人——出狱了。少女案、持枪杀人案、非法洗钱案相继爆发，风波再起。一名没有姓名、甚至没有指纹的神秘杀手出现，欲将雷乃武置于死地。危机时刻，高阳冒险救下雷乃武，雷乃武告诉他：这个杀手，就是杀害郑英的真凶。\n　　黑暗中的对决就此展开，每个人的不可告人的秘密，终将被真相照亮。｜TMDB 5.4"
  date: 2024-05-08
  added: 2026-10-05
  image: tv-097.jpg


- id: tv-098
  title: "谁是凶手"
  category: 电视剧
  tags: ["电视剧", "犯罪", "剧情", "悬疑"]
  quark_url: "https://pan.quark.cn/s/9d7c4293b191"
  baidu_url: "https://pan.baidu.com/s/1Jbo0X60r212cRACplb1tzA"
  baidu_code: "0rb4"
  description: "【第 1 季 · 共 16 集】一桩沉了十六年的连环案，是这部剧的地基：南方小城海舟市，当年那个让人不敢夜行的案子最终没能查实，与它有牵连的人各自带着秘密散落在这座城里。新的线索出现之后，他们再次被拽到一起——每个人都想让真相停在某个位置，于是「查出真相」和「藏住自己」成了同一件事。十六集的节奏不快，气氛压抑，重点在写涉案者的心理而不是解谜本身。剧集把城市拍得像一个封闭的容器：潮湿、狭窄、谁都认识谁，秘密在这里几乎不可能真正藏住。人物各自的社会身份差异很大，他们面对同一桩旧案时的反应，构成了这部剧最主要的张力。结尾的揭晓不靠反转取胜，而是把前面埋下的犹豫和回避一次性解释清楚。适合喜欢那种着重人物幽暗面的观众；想看严密推理的会觉得它的案件推进偏慢，力气都花在了人的状态上。｜TMDB 7.3"
