  description: "【全剧 3 季 · 共 24 集】改编自中情局一项真实存在的项目：招募女兵渗透进恐怖组织内部，从里面把这些网络拆掉。故事跟着海军陆战队出身的克鲁兹走——她经验不足但冲劲十足，被选中加入这支小队，在训练与任务之间不断被推到极限；负责带队的乔是一条硬线，既要保护手下的姑娘，也要向上面对交代结果。克鲁兹每次回到日常都要重新学着做普通人，这段落差写得很扎人。全剧偏写实，训练和潜入的细节拍得细，潜入者要付出的代价被写得很具体：不是英勇，而是长期的自我消耗。训练营的段落占了不小篇幅，枯燥但必要。剧集最大的分量在于它不断提醒观众，这些人被派出去之后，回来的往往不是原来那个人。乔这个角色提供了另一重视角：执行者在道德与任务之间做选择，而代价由别人承担。动作戏不多但拍得实在，重心始终在人物的心理磨损上。适合喜欢《杰克·莱恩》《国土安全》那一类谍战剧的观众。｜TMDB 8.3"
