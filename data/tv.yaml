  baidu_code: "s84c"
  description: "【第 5 季 · 共 10 集 · 全剧 8 季】第五季于 2015 年播出，全季 10 集，糅合原著第四部《群鸦的盛宴》与第五部《魔龙的狂舞》的情节。泰温死后，瓦里斯带着提利昂渡海东逃，沿途为他物色新的投奔对象；瑟曦以太后之身把持朝政，扶植教团武装对付政敌，结果反被教团架空，酿成她此生最大的失算。多恩方面，红毒蛇的情妇艾拉莉亚·沙德决意为亡夫复仇，与沙德家族的女儿们一起搅动多恩与君临的关系。北境，琼恩·雪诺在山姆威尔·塔利的推举下出任守夜人总司令，面对异鬼威胁做出让全军哗然的决定；史坦尼斯挥师北上，把战火烧到临冬城外。狭海对岸，丹妮莉丝在弥林推行统治却处处掣肘，巨龙失控伤人，让她第一次直面统治的代价。系列由 HBO 制作，改编自乔治·R·R·马丁的《冰与火之歌》，本目录为第 5 季全集，1080p 压制，粤英双音轨，内封简繁英字幕。｜TMDB 8.2"
