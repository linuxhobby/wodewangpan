  description: "【第 2 季 · 共 4 集 · 全剧 2 季】第二季紧接着小镇医生的故事往下写：这位从波士顿来的外科医生手上有公认的好技术，却在人情世故上一塌糊涂——嘴上没遮拦、对谁都不客气，好心办坏事是常态。这一季篇幅更短，只有四集，冲突集中在几段关系上：他要一边照看病人的身体，一边学着处理自己那个怎么也理不顺的家。家庭线着墨更多，父亲留下的东西比想象中更难收拾。他能在手术台上保持冷静，却搞不定一顿家常饭，这种反差既是这一季的笑点也是痛点。四集的长度让每件事都推进得很快，没有注水，情绪反而更集中。小镇依然是那个小镇，邻居们的麻烦事照旧，但主角已经不再是完全的局外人。节奏轻快，一晚上就能看完，适合当作睡前剧。喜欢看人物慢慢变好的观众会得到满足，它不追求戏剧性转折；期待医疗抢救场面的人，会觉得这座小镇安静得过头。｜TMDB 7.2"
