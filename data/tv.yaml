- id: tv-160
  title: "赛博朋克：边缘行者 第2季"
  category: 电视剧
  tags: ["电视剧", "动画", "动作冒险", "科幻", "犯罪", "赛博朋克：边缘行者 第2季 Cyberpunk: Edgerunners Season 2"]
  quark_url: "https://pan.quark.cn/s/792399fb193f"
  description: "【第 2 季 · 共 10 集 · 全剧 2 季】夜之城的故事在时隔四年后重新开张。TRIGGER 与 CD PROJEKT RED 再度联手打造的这部动画剧集，自 2022 年第一季播出后就把《赛博朋克 2077》的世界观从游戏搬上了屏幕，让全球观众记住了这座霓虹与铁锈交织的城市。第二季延续了只管奔跑的底色，但主角换了一批人：落魄的赛博朋克传奇人物 Weak Kingsley，如今被迫在没有义体的世界里求生，一个人人改造身体的狂热时代早已把他抛在身后，他要在被遗忘的处境里重新找到活下去的意义。另一边，致命的流浪者 D 踏上了复仇之路，一路逼近那些本不该被任何人发现的公司秘密，两条线在夜之城的暗处逐渐交汇。本季依旧由系列发起人拉法乌·亚基主导，利根健太朗为 Weak Kingsley 配音，内山昂辉为 D 献声，寺泽百花与鬼头明里也在主要阵容之中。十集的体量，动画、动作冒险、犯罪与科幻元素全部在线，赛博格改造、公司阴谋与底层挣扎一个不落。没看过第一季的观众建议先补前作，认得夜之城的规矩之后，第二季的狠劲才更容易尝出味道。｜TMDB 8.5"
  date: 2026-10-20
  added: "2026-10-20 18:12"
  image: tv-160.jpg

