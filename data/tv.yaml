  baidu_url: "https://pan.baidu.com/s/15GxoYc4ORQIGaENgJrEJPA"
  baidu_code: "s6iw"
  description: "【第 1 季 · 共 8 集】设定很有意思：一位普通公务员姜常雄意外获得超能力，但能力的强弱跟他的钱包直接挂钩——钱越多越强，用完薪水的那一刻，英雄也就跟着变弱了。于是出现一种相当荒诞的处境：要救人就得先算清楚这次出手值多少钱。八集的重心放在喜剧感与社会讽刺上，而不是超级英雄对决：房租、饭钱、人情往来全成了战斗力的一部分，荒唐里带着对现实的一点尖锐。主角的窘迫是真实可感的——不是英雄缺钱，而是普通人本来就在为钱发愁。动作场面拍得有想象力，能力的强弱变化让打斗有了预算感。每一场营救都伴随着一次算账，笑点和讽刺是同时发生的。配角群像热闹，几场闹剧的节奏控制得不错。它不打算正经，但讽刺的点踩得挺准，八集一口气刷完很轻松。适合喜欢轻松搞怪、又想看点新鲜设定的观众；期待严肃的超级英雄叙事的话，这部从一开始就不打算正经。｜TMDB 7.3"
