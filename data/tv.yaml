- id: tv-108
  title: "致命愿望"
  category: 电视剧
  tags: ["电视剧", "剧情", "悬疑", "Sci-Fi & Fantasy"]
  quark_url: "https://pan.quark.cn/s/a8af00342a3f"
  baidu_url: "https://pan.baidu.com/s/1wW_uQdpWOKoYTmC73vlQBA"
  baidu_code: "t0hm"
  description: "【第 1 季 · 共 12 集】一款叫 Wisher 的应用，毫无征兆地出现在一群大学生的手机里：向它许愿，再完成它随机派下来的简单任务，愿望就会成真。听起来像天上掉馅饼，代价却是这些年轻人被自己的欲望牵着走，像推倒的多米诺骨牌一样收不住。每个派下来的任务看着都像随手给的，代价却一次比一次大。中年记者那多和几个年轻人开始追查背后究竟是谁在操控这一切。十二集的篇幅里悬疑与轻科幻各占一半，它真正想讨论的是愿望本身——一个人到底能不能承受自己想要的东西变成现实。剧集把任务设计得看似无害，越往后越能感到那种被操控的寒意，这是它最抓人的部分。年轻演员的群戏撑住了前半段的轻快感，不需要太多前置知识，第一集就能进入状态。适合喜欢「科技许愿」这类设定的观众，也适合一口气刷完；人物动机有些地方处理得比较粗糙，看设定比看人物更划算。｜TMDB 5"
  date: 2021-11-03
  added: 2026-10-05
  image: tv-108.jpg


- id: tv-109
  title: "绿灯军团"
  category: 电视剧
  tags: ["电视剧", "剧情", "悬疑", "Sci-Fi & Fantasy", "绿灯军团 Lanterns"]
  quark_url: "https://pan.quark.cn/s/57ff561213ad"
  baidu_url: "https://pan.baidu.com/s/13S87tMHw4ane4mkPeoAgBQ"
  baidu_code: "5kfp"
  description: "【第 1 季 · 共 8 集】主角是两位绿灯侠：老资格哈尔·乔丹和新晋加入的约翰·斯图尔特，两人奉命去查美国小镇上的一桩神秘凶案，结果发现案子背后的东西远远超出本地——牵扯到外星势力，也牵扯到他们对「秩序」这件事的理解。八集走的是侦探线多于宇宙战争线：两个人一边查案，一边被各自的信念反复考验，一个凭经验办事，一个更讲规矩，摩擦不断。把故事放在小镇是聪明的选择——在一个谁都认识谁的地方查外星相关的凶案，反差本身就是看点。能力被收得很紧，戒指更多是工具而不是解围的万能钥匙。两人对秩序的理解分歧是全剧的主心骨，这条线比案情更持久。两位主角的关系推进比案件更好看，从互相看不惯到勉强信任，走得扎实。美术和特效收着用，太空场面不多，重心始终在地面上。适合喜欢 DC 宇宙、但不想一上来就被塞满彩蛋的观众；纯超英爽剧爱好者会觉得节奏偏慢。｜TMDB 8.3"
  date: 2026-08-16
