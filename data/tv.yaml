  baidu_url: "https://pan.baidu.com/s/1qKZIvWcQMbyDLlUNQYadCg"
  baidu_code: "9zd1"
  description: "【第 1 季 · 共 7 集】这是对约翰·史坦贝克同名经典的全新改编：故事跟着特拉斯克家族跨越数代，讲述兄弟之间延续到下一代的那场争斗，镜头特别留给凯茜——一个几乎不带道德感、也从不打算为自己的行为道歉的女性角色。剧集把那条古老的兄弟线索搬到了美国西部的农场与小镇上，善恶不是选项，而是性格的副产品。凯茜这条线是全剧最有争议也最有意思的部分：她不解释自己，也不求原谅。两代人的对照是结构上的关键，父辈的选择会在下一代身上重演。农场、小镇和加州的谷地提供了开阔又空旷的背景，人物在其中显得格外孤立。七集的篇幅不长，气质是克制的家族长卷，节奏偏慢，人物关系的张力大于情节的起落。场景和服装都花了力气，山谷的风光和时代质感立得住。它不提供安慰，看完会有点堵。适合喜欢文学改编、愿意看人物而非追逐情节的观众；想看轻松娱乐剧的话，这部会显得沉。｜TMDB 7.9"
