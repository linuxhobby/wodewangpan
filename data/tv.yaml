  baidu_url: "https://pan.baidu.com/s/1Iu8BMk9m6BRjVFc5MC9C0g"
  baidu_code: "9fy6"
  description: "【全剧 2 季 · 共 17 集】接着 Netflix 版的世界往下走：马修·默多克继续当他的律师，把白天留给法庭，把夜晚留给街头；而当年的黑帮头目威尔逊·菲斯克这次换了赛道，往纽约的政治场上钻。两个老对手都以为自己已经翻篇，结果过去那层身份被一点点掀开，谁也逃不开下一轮的冲突。菲斯克这条政治线给剧集换了气质：权力运作的方式变了，对抗方式也得跟着变。他白天在法庭上争取的东西，晚上又用另一种方式推翻，这个矛盾一直没被解决。它的看点是拳拳到肉的近身打斗，长镜头和贴身缠斗保留了原来的味道，以及「法律到底管不管用」这条一直没放下的追问。城市的官僚系统和舆论场被写进了主线，冲突不再只是两个人的事。基调沉，暴力场面有分量，不适合下饭。适合看过《夜魔侠》Netflix 版的观众；完全没接触过也能跟，但少了那份前史会淡一些。｜TMDB 8.2"
