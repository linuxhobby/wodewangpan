- id: tv-162
  title: "幻视任务"
  category: 电视剧
  tags: ["电视剧","科幻","奇幻","剧情","漫威","幻视任务 VisionQuest"]
  quark_url: "https://pan.quark.cn/s/979b74138dd5"
  description: "【第 1 季 · 共 8 集】漫威影业出品的科幻剧集，也是《旺达幻视》之后幻视个人故事的延续。白幻视在基地重启苏醒后选择隐姓埋名，混进人群里过起了低调日子。但他体内并不太平：系统里同时驻留着星期五、伊迪丝、贾维斯等多段人工智能意识，甚至连恶名昭彰的奥创也藏在其中。为了弄清自己究竟算什么，他开始逐个与这些AI对话，试图在机器与人的夹缝里找到生命的新意义。平静很快被一笔悬赏令打破，赏金猎人与各方势力闻风而动，幻视不得不带着神秘少年托马斯·谢泼德踏上逃亡之路。这个少年身上的秘密远比看上去复杂，他的身世可能与幻视的过去有着直接关联。一路逃亡，一路自省，幻视既要躲开四面八方的追捕，又要抵抗体内奥创的低语与侵蚀，还要解开身边这位年轻同伴的谜团。剧集把科幻设定与公路冒险的气质揉在一起，在追问何以为人的老命题里，给出属于幻视自己的答案。保罗·贝坦尼回归出演，为这台白色人形机器注入了近乎人的脆弱与温度，让整部剧在动作与悬念之外多了一层沉静的思考感。｜TMDB 8.8"
  date: 2026-10-13
  added: "2026-10-21 22:28"
  image: tv-162.jpg

- id: tv-163
  title: "小城良方"
  category: 电视剧
  tags: ["电视剧", "剧情", "小城良方 小城良方"]
  quark_url: "https://pan.quark.cn/s/3005f471af3d"
