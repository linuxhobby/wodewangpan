- id: tv-129
  title: "恋爱充电中"
  category: 电视剧
  tags: ["电视剧", "Sci-Fi & Fantasy", "喜剧", "恋爱充电中 나를 충전해줘"]
  quark_url: "https://pan.quark.cn/s/e23e059884c8"
  description: "【第 1 季 · 共 10 集】这是一部把超能力当恋爱道具来用的韩剧：财阀三代白浩朗依赖人工心脏存活，却面临电池即将耗尽的危机；电视剧编剧罗宝培小时候遭过雷击，身上带着电流，也因此无法与人亲近。两人偶然发现，只要待在一起，人工心脏就能自动充电。于是有了一份为期三个月的「身体接触契约」，故事就从这个荒唐的约定开始。两位主角的处境互为镜像：一个身体随时可能停摆，一个连牵手都做不到，这种对称让契约关系有了情感基础。契约的期限设定也帮了忙，三个月这个时间让关系必须往前走，不能一直停在试探。十集的调子是奇幻加浪漫喜剧，设定听着离谱，实际被处理得挺轻快。节奏明快，没有太多虐心的弯弯绕，属于解压那一类。副线人物不算复杂，但提供了几处轻松的笑点。对科幻设定不必较真，它从头到尾都在谈恋爱。适合想看点轻松、不费脑的甜剧的观众。｜TMDB 0.0"
  date: 2026-10-09
  added: 2026-10-10
  image: tv-129.jpg

- id: tv-130
  title: "黑道家族 第二季"
  category: 电视剧
  tags: ["电视剧", "犯罪", "剧情", "黑道家族 第二季 The Sopranos"]
  quark_url: "https://pan.quark.cn/s/8f5fca8d08cd"
  description: "【第 2 季 · 共 13 集 · 全剧 6 季】第二季从首季结尾那场未遂刺杀之后说起，东尼·沙普蓝诺在家养伤，心里却清楚：想杀他的人还在，卖他的人也还没有浮出水面。姐姐珍妮丝从西雅图回到新泽西，满口禅意却寸步不让，很快把年迈的母亲和整个家族搅得不得安宁；同期出狱的老派人物里奇·阿普里尔火气更旺，处处看不惯东尼的做派，对头把交椅另有所图，帮内新旧两套规矩正面相撞。街面生意与地下秩序的摩擦之外，联邦调查局的线人网越收越紧，谁在暗中给警方递情报，成了贯穿整季最大的悬念。这一季延续首季黑帮与家庭双线并行的路子，詹姆士·甘多费尼的表演依旧撑起全剧，人物关系比第一季更纠缠，季末的收束干净利落，也为后续几季埋下了重要的伏笔。帮派内外的新面孔轮番登场，多条支线交错推进，整体观感比首季更沉稳。｜TMDB 8.1"
  date: 2000-01-16
  added: "2026-10-10 11:05"
  image: tv-130.jpg


- id: tv-131
  title: "黑道家族 第三季"
  category: 电视剧
  tags: ["电视剧", "犯罪", "剧情", "黑道家族 第三季 The Sopranos"]
  quark_url: "https://pan.quark.cn/s/9f9dd3072cdb"
  description: "【第 3 季 · 共 13 集 · 全剧 6 季】第三季在一片紧张气氛中开场，上一季末尾的枪声让整个家族重新掂量安全与忠诚的分量。本季的重头戏落在帮内新旧势力的碰撞上：行事狠辣、不按老规矩出牌的拉尔夫·西费雷托在生意场上风头越来越劲，与东尼的关系时好时坏，成为家族里最不安定的因素。家庭这边，大女儿梅多升入大学开始独立生活，父女之间的信任被接连的秘密消磨；小儿子安东尼步入叛逆期，妻子卡梅拉则在金钱与婚姻的体面之间越发力不从心。联邦调查局的手始终没有松开，监控与线人双管齐下，东尼每一次出行都得多个心眼。这一季在心理刻画上走得更深，节奏不算快，但张力全压在人物关系里，几场关键冲突的处理相当见功力。几场家庭餐桌戏的调度尤其见水准，把一个既要当好父亲又要当好老板的中年人演得可信又可叹。｜TMDB 8.2"
  date: 2001-03-04
  added: "2026-10-10 11:05"
  image: tv-131.jpg


- id: tv-132
  title: "黑道家族 第四季"
  category: 电视剧
  tags: ["电视剧", "犯罪", "剧情", "黑道家族 第四季 The Sopranos"]
  quark_url: "https://pan.quark.cn/s/0780264ae556"
  description: "【第 4 季 · 共 13 集 · 全剧 6 季】第四季的焦点从街面转向屋檐之下：东尼与妻子卡梅拉的婚姻走到最脆弱的一段。表面上这个家依旧富足体面，新房、派对、孩子的开销样样不缺，但信任早已被无数谎言蛀空，两人之间的裂痕在本季被一步步推到摊牌的边缘。帮内生意同样不顺，经济上的压力让东尼不得不四处筹措，体面与算计轮番上演；拉尔夫掌管的工程接连出状况，两人的合作与摩擦贯穿全季。姨姐珍妮丝依旧不肯安分，在家族事务里搅起不少风波。这一季明显收敛了火并的密度，把笔墨更多放在人心的账本上，艾迪·法柯的表演尤其出彩，季终那场夫妻摊牌戏被普遍认为是全剧最好的段落之一。本季的配乐运用也值得一提，多首经典摇滚用在关键场景里，情绪推得恰到好处；整体节奏从容，适合按季连看。｜TMDB 8.1"
  date: 2002-09-15
  added: "2026-10-10 11:05"
  image: tv-132.jpg


- id: tv-133
  title: "黑道家族 第五季"
  category: 电视剧
  tags: ["电视剧", "犯罪", "剧情", "黑道家族 第五季 The Sopranos"]
  quark_url: "https://pan.quark.cn/s/cdb3112a3997"
  description: "【第 5 季 · 共 13 集 · 全剧 6 季】第五季迎来一位重量级新面孔：史蒂夫·布西米饰演的托尼·布伦代托，他是东尼的表哥，刚从漫长的牢狱生活中出来，一心想在新时代里重新找到自己的位置，两个东尼之间从亲厚走向裂痕，是本季最动人的一条线。老一辈的人物陆续回归，街头的老江湖们出狱的出狱、复出的复出，新泽西的权力版图重新洗牌，纽约家族的内斗也不断向新泽西蔓延，两大家族的摩擦越积越深。家庭线上，东尼与卡梅拉处于分居状态，两人隔着一条车道勾心斗角又藕断丝连；孩子的学业、珍妮丝的算计，依旧让这个家不得清静。上一季埋下的线人线索在本季收网，代价惨烈，季末的走向直接把故事推向最终季。布西米的加盟让整季多了一层陌路同源的悲凉感，两位东尼越亲近，走向对立时的代价就越重，几位回归的老角色也各有交代。｜TMDB 8.3"
  date: 2004-03-07
  added: "2026-10-10 11:05"
  image: tv-133.jpg


- id: tv-134
  title: "黑道家族 第六季"
  category: 电视剧
  tags: ["电视剧", "犯罪", "剧情", "黑道家族 第六季 The Sopranos"]
  quark_url: "https://pan.quark.cn/s/ae5dacc30b3d"
  description: "【第 6 季 · 共 21 集 · 全剧 6 季】全剧的最终季，篇幅也最长，共 21 集，2006 年开播，剧情延续到 2007 年完结。开场不久东尼再次中枪，昏迷中的段落让全剧从黑帮现实滑进一场漫长的梦境与哲思，叔叔朱尼奥与东尼一家的恩怨、家族内部的接班问题随之浮出水面。后半段，纽约与新泽西两大家族的全面开战步步紧逼，菲尔·雷奥纳多与东尼之间的仇怨尤其血腥，每个主要人物都在这条路上迎来自己的结算。家庭方面，孩子们各自长大成人，卡梅拉重新审视这段婚姻，东尼则在心理治疗师梅尔菲的诊室里完成了全剧的最后一次谈话。季终那场餐厅戏以最平静的方式收束了整部剧，也成了电视史上被讨论最多的结局之一。分两段播出的安排当年引发不少讨论，如今连起来看，前后呼应完整，是少有能撑住体面收场的长寿剧。｜TMDB 8.2"
  date: 2006-03-12
  added: "2026-10-10 11:05"
  image: tv-134.jpg


- id: tv-135
  title: "神探狄仁杰 第一部"
  category: 电视剧
  tags: ["电视剧", "剧情", "悬疑", "神探狄仁杰 第一部 Amazing Detective Di Renjie"]
  quark_url: "https://pan.quark.cn/s/5e058a54a082"
  description: "【第 1 季 · 共 30 集 · 全剧 5 季】2004 年开播的国产古装悬疑剧，由钱雁秋执导，梁冠华、张子健、吕中主演，是「神探狄仁杰」系列的开山之作。全季由《使团惊魂》《蓝衫记》《滴血雄鹰》三个既独立成篇又暗线相连的单元组成，一次看完等于三个完整的案子。开篇《使团惊魂》把时间放在武周年间：突厥战争刚刚结束，举国上下正迎接议和使团入京，使团却在逗留期间接连爆出震惊朝野的大案，内忧外患逼得武则天急调狄仁杰火速进京破案，庙堂之高与江湖之远的角力由此铺开。《蓝衫记》转入乡野，狄仁杰与贴身护卫李元芳微服暗查民情，一天之内连发两起命案，两人顺藤摸瓜，牵出的水比想象中深得多。《滴血雄鹰》则从一幅用鲜血绘成的滴血雄鹰图起笔，诡异氛围在三个单元里最重。剧集的看点不在打斗而在推理与对话：狄仁杰层层设问、以人证物证反推全局的桥段贯穿始终，李元芳的武功与忠义则是行动线的支点。全剧台词密度高、逻辑闭环扎实，武则天与狄仁杰之间的君臣互信也写出了分量，堪称国产推理剧的标杆之作，多年后仍被剧迷反复回味。｜TMDB 9.0"
  date: 2004-08-05
  added: "2026-10-10 19:25"
  image: tv-135.jpg


- id: tv-136
  title: "喜剧之王"
  category: 电视剧
  tags: ["电视剧", "喜剧", "爱情", "喜剧之王 King of Comedy"]
  quark_url: "https://pan.quark.cn/s/7ea4d02b226e"
  description: "【第 1 季 · 共 24 集】2026 年 10 月上线的都市喜剧，把经典 IP《喜剧之王》落地成了福建渔村里的内容创业故事。沙浦村地处沿海，位置偏远、人口流失严重，面对开发商黄总抛出的拆迁方案，村民大多已经动摇，只有阿珍（杨超越 饰）和哥哥嘉豪（张弛 饰）坚决不肯签字。兄妹俩为村子争到七天喘息之机，打算借《喜剧之王》这个 IP 的知名度做内容自救，他们请来有经验的内容人周可（蒋龙 饰）和表姐林细妹（蒋诗萌 饰）帮忙操盘。周可临危受命却状况不断：首波视频意外爆红，账号却突然被封，一番醉酒操作反倒引来文旅部门的关注。眼看形势好转，侵权风波接踵而至，对手船澳村又盗用他们的账号，村子再次被逼到墙角。主线之外，周可和阿珍在并肩作战中逐渐升温的感情，以及误解与阴谋的层层升级，让这部喜剧既有笑点也有悬念。全剧用小人物对抗大资本的套路致敬原作内核：努力未必立刻兑现，但总得先把今天的戏演好。开播数日口碑迅速走高，是近年少有的把短视频生态写进正剧节拍的国产喜剧。｜TMDB 9.0"
  date: 2026-10-06
  added: "2026-10-10 19:25"
  image: tv-136.jpg


- id: tv-137
  title: "Doctor X：白色黑手党时代"
  category: 电视剧
  tags: ["电视剧", "悬疑", "剧情", "犯罪", "Doctor X：白色黑手党时代 닥터X: 하얀 마피아의 시대"]
  quark_url: "https://pan.quark.cn/s/089cf55f449b"
  description: "【第 1 季 · 共 12 集】医院题材的日剧里，这部把矛盾摆得格外直接：一所大学附属医院内部派系林立，医生们关心的是晋升、站队和面子，病人往往排在最后。主角是一位不隶属于任何科室的自由外科医生，只接别人判定为做不了的手术，准时上下班、不参加应酬、对上级也不留情面，唯一认真对待的是手术台本身。她的做派在这所医院里格格不入，却正好照出周围人的荒唐。故事以单元结构推进，每集基本围绕一台手术展开——诊断被推翻、方案被管理层压制、最后靠真本事把人从死亡线上拉回来。真正的爽感来自「技术碾压权力」的痛快，也来自它对医疗体制毫不客气的冷嘲：推诿、腐败、论文至上都被摆到台面上。想看点不憋屈的职业剧的话，它几乎是解压首选：主角从不自我感动，也不为谁牺牲，只是把活干漂亮然后走人。医疗细节不必较真，重心始终在人物姿态与体制讽刺上。整体观感爽利，节奏也不拖沓。｜TMDB 7.7"
  date: 2026-10-09
  added: 2026-10-11
  image: tv-137.jpg


- id: tv-138
  title: "我不是大师"
  category: 电视剧
  tags: ["电视剧", "剧情", "悬疑", "我不是大师"]
  quark_url: "https://pan.quark.cn/s/f5347add097c"
  description: "【第 1 季 · 共 24 集】这是一部把骗局当武器使的复仇题材悬疑剧，2026 年 9 月 24 日开播。故事的核心设定很有张力：上官诚明的全家被一个叫天相派的组织设局害得家破人亡，而对方用的手法不是刀枪，是骗局。正常的路子讨不回公道，他索性钻进敌人的逻辑里：隐姓埋名潜伏下来，让自己变成局中人，再用一个个精心设计的连环骗局，把当年加害者惯用的手段原样奉还。剧情走双线互咬的路子，明线是他一步一步逼近天相派的核心，暗线则是骗局背后那张控制人心的网，受害者被套牢、被洗脑、被当成工具，等回过神来早已抽不了身。随着复仇推进，骗术行当的黑幕被一层层揭开，观众跟着主角一起拆解每一场局的机关，也看着他在以恶制恶和守住善念之间反复拉扯。全剧 24 集，节奏偏快，每段骗局自成一个小局，又共同服务于最后的总反杀，结局落在瓦解天相派、解救被困之人上，惩恶扬善的落点很正。喜欢悬疑复仇题材，想看骗子反被骗子治的观众，这部值得追完。｜TMDB 6.8"
  date: 2026-09-24
  added: "2026-10-11 11:45"
  image: tv-138.jpg


- id: tv-139
  title: "全城追缉"
  category: 电视剧
  tags: ["电视剧", "犯罪", "剧情", "动作", "全城追缉"]
  quark_url: "https://pan.quark.cn/s/e30b533e1205"
  description: "本片取材于佛山公安英模林伟光与刑警八大队的真实事迹，是一部写实风格的公安题材作品，2026 年 7 月 11 日在中国大陆公映，由崔景宣执导，凌潇肃、余男、郭晓东、吴若甫等主演，片长约 97 分钟。故事回到本世纪初，那时街头飞车抢夺横行，民众人人自危，佛山公安为此组建了全国第一支专门打击街面双抢的专业队伍，也就是刑警八大队。副队长林伟带着队员骑着摩托车冲在一线，与飞车劫匪展开长达十一年的生死追缉，十一年间全队抓获嫌疑人两万余名，林伟本人三十多次负伤，数次重伤，甚至有过从高架坠落后仍坚守岗位的经历。影片用写实手法还原了惊险的追凶与抓捕现场，摩托追逐、街巷围捕的段落拍得生猛扎实，同时也细腻呈现了警嫂默默守候的温情日常，让英雄叙事落回到具体的人身上。整体气质硬朗，既有大案要案的紧张感，也有平凡守护的动人底色，适合喜欢真实事件改编与刑侦题材的观众。｜TMDB 0.0"
  date: 2026-07-11
  added: "2026-10-11 11:45"
  image: tv-139.jpg


- id: tv-140
  title: "无可替代"
  category: 电视剧
  tags: ["电视剧", "剧情", "都市", "无可替代"]
  quark_url: "https://pan.quark.cn/s/cfae11bc592b"
  description: "【第 1 季 · 共 20 集】都市职场剧《无可替代》2026 年 9 月 28 日开播，把镜头对准咨询行业，讲一个关于不被替代的故事。少女徐迟年少时目睹母亲因离婚走向绝路，从那一刻起她发誓，这一生绝不要成为随时会被替换的弱者。没有名校光环傍身，她凭着超出常人的拼搏与机敏，从普通院校毕业生一路打磨成专业出色的咨询顾问。业界精英合伙人叶信之则另有心事，他在职业生涯起步阶段曾被上司构陷，隐忍多年布下复仇计划，并力邀自己早早看好的徐迟出任助手，以良师益友的身份不断指点，帮她更上层楼。两人共事之中经历暧昧与试探，各自的目标渐次达成，关系也随之升温。然而就在此时，叶信之突遇事业重大波动，徐迟却迎来直升公司高层的机会，命运把一道选择题摆到两人面前：是守住这段彼此成就的关系，还是抓住各自苦等多年的出路。全剧以职场博弈为骨、情感线为脉，既写写字楼里的规则与算计，也写两个不肯认输的人如何在互相试探中靠近，节奏紧凑，适合喜欢职场成长与成年人情感线的观众。｜TMDB 8"
  date: 2026-09-28
  added: "2026-10-11 19:55"
  image: tv-140.jpg



- id: tv-141
  title: "消失的丹麦女孩：这位朋友，那位凶手"
  category: 电视剧
  tags: ["电视剧", "纪录", "犯罪", "消失的丹麦女孩 En ven, en morder"]
  quark_url: "https://pan.quark.cn/s/e37c9164904c"
  description: "【第 1 季 · 共 3 集】这是一部来自丹麦的真实犯罪纪录片，2026 年 3 月上线，全季 3 集，以受害者朋友的视角切入一桩震动丹麦的连环案件。故事发生在丹麦的一座小镇，八年时间里，连环袭击与恶性案件接连发生，恐慌像雾一样罩在街区上空，居民夜里不敢独行，警方却始终抓不到那个来去无踪的作案者。直到凶手终于落网，三位当事人阿曼达、尼古拉斯和基里才发现，这个让全镇寝食难安的人，竟然是从小与他们相识的好友。更让人脊背发凉的是，回溯彼此相处的那些年，对方的袭击、绑架乃至谋杀罪行，就藏在一次次聚会、闲聊与结伴出行的日常之间。本片没有走快节奏办案的路子，而是大量采用当事人的口述与档案影像，把「身边人作恶」这件事拆开细讲：他们什么时候开始起疑，哪些反常细节被当成了玩笑，友情与愧疚如何互相撕扯，都是叙述的重点。对喜欢真实案件与犯罪心理题材的观众来说，它的价值不在悬疑反转，而在于诚实呈现了信任被辜负的全过程。资源为 Netflix 1080p WEB-DL 版，全 3 集收录，杜比音轨。｜TMDB 7.3"
  date: 2026-03-05
  added: "2026-10-12 04:10"
  image: tv-141.jpg



- id: tv-142
  title: "百日谎言"
  category: 电视剧
  tags: ["电视剧", "动作冒险", "剧情", "百日谎言 100일의 거짓말"]
  quark_url: "https://pan.quark.cn/s/7fe74637d991"
  description: "【第 1 季 · 共 16 集】韩国年代谍报爱情剧《百日谎言》（100일의 거짓말）2026 年 10 月 10 日开播，故事设定在日本殖民统治时期的朝鲜半岛。女主角佳景是个凭一双手吃饭的天才扒手，为了活下去，她冒名顶替混进朝鲜总督府当差，摇身一变成了体制里的「密探」。不过这个身份从头到尾都是假的，她瞒天过海，一装就是一百天。装着装着，假的也成了真的：她开始真正卷入情报的传递与危险的周旋，从冒牌密探一步步长成真正的暗线人物。与她命运纠缠在一起的是朝鲜翻译官泰雄，两人各怀目的互相试探，又在乱世里交出了真心，谍报线的紧绷与爱情线的悸动交替上演。本剧的动作冒险底色很足，扒手出身的设定让女主角的身手戏有独特看点，总督府内的权力倾轧则为剧情提供了持续的压力源。16 集的体量，适合喜欢年代谍战气质又想看言情线的观众；剧集刚开播，评分尚未开出，可以先看前几集再决定追不追。资源目录按 Season 1 结构存放。｜TMDB 0.0"
  date: 2026-10-10
  added: "2026-10-12 04:10"
  image: tv-142.jpg


- id: tv-143
  title: "金银岛"
