  quark_url: "https://pan.quark.cn/s/8f5fca8d08cd"
  description: "【第 2 季 · 共 13 集 · 全剧 6 季】第二季从首季结尾那场未遂刺杀之后说起，东尼·沙普蓝诺在家养伤，心里却清楚：想杀他的人还在，卖他的人也还没有浮出水面。姐姐珍妮丝从西雅图回到新泽西，满口禅意却寸步不让，很快把年迈的母亲和整个家族搅得不得安宁；同期出狱的老派人物里奇·阿普里尔火气更旺，处处看不惯东尼的做派，对头把交椅另有所图，帮内新旧两套规矩正面相撞。街面生意与地下秩序的摩擦之外，联邦调查局的线人网越收越紧，谁在暗中给警方递情报，成了贯穿整季最大的悬念。这一季延续首季黑帮与家庭双线并行的路子，詹姆士·甘多费尼的表演依旧撑起全剧，人物关系比第一季更纠缠，季末的收束干净利落，也为后续几季埋下了重要的伏笔。帮派内外的新面孔轮番登场，多条支线交错推进，整体观感比首季更沉稳。｜TMDB 8.1"
  date: 2000-01-16
  added: "2026-10-10 11:05"
  image: tv-130.jpg


- id: tv-131
  title: "黑道家族 第三季"
  category: 电视剧
  tags: ["电视剧", "犯罪", "剧情", "黑道家族 第三季 The Sopranos"]
  quark_url: "https://pan.quark.cn/s/9f9dd3072cdb"
  description: "【第 3 季 · 共 13 集 · 全剧 6 季】第三季在一片紧张气氛中开场，上一季末尾的枪声让整个家族重新掂量安全与忠诚的分量。本季的重头戏落在帮内新旧势力的碰撞上：行事狠辣、不按老规矩出牌的拉尔夫·西费雷托在生意场上风头越来越劲，与东尼的关系时好时坏，成为家族里最不安定的因素。家庭这边，大女儿梅多升入大学开始独立生活，父女之间的信任被接连的秘密消磨；小儿子安东尼步入叛逆期，妻子卡梅拉则在金钱与婚姻的体面之间越发力不从心。联邦调查局的手始终没有松开，监控与线人双管齐下，东尼每一次出行都得多个心眼。这一季在心理刻画上走得更深，节奏不算快，但张力全压在人物关系里，几场关键冲突的处理相当见功力。几场家庭餐桌戏的调度尤其见水准，把一个既要当好父亲又要当好老板的中年人演得可信又可叹。｜TMDB 8.2"
  date: 2001-03-04
  added: "2026-10-10 11:05"
  image: tv-131.jpg


- id: tv-132
  title: "黑道家族 第四季"
  category: 电视剧
