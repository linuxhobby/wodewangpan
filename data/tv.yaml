  description: "【全剧 6 季 · 共 86 集】这部剧把黑手党生活、美国家庭与意裔美国人社群放在同一个屋檐下：主角东尼是新泽西一个犯罪组织的头目，白天要处理生意上的账目和人事纠纷，晚上回家面对的是妻子、孩子和一堆同样难缠的家务事。两条线不断互相渗透，暴力支配的世界与道德的灰色地带被写进了日常。它最有意思的地方在于主角同时看心理医生——一个惯于用暴力解决问题的人，坐下来谈论自己的焦虑和母亲，这种反差构成了全剧最独特的味道。剧集几乎不给出道德判断，观众会在同情和厌恶之间反复摇摆，这种不适感是它刻意制造的。它也被认为是后来那批反英雄剧集的源头之一，很多手法至今仍被反复模仿。对白写得极好，鸡毛蒜皮的争吵里藏着人物关系的全部信息。六季八十六集的篇幅很长，节奏从容，人物写得厚。适合愿意长时间跟一群不完美的人待在一起的观众；想看快节奏犯罪剧的话，它的乐趣是慢出来的。｜TMDB 8.7"
  date: 1999-01-10
  added: 2026-09-13
  image: tv-014.jpg

- id: tv-013
  title: "黑帆"
  category: 电视剧
  tags: ["电视剧", "剧情", "动作冒险"]
  quark_url: "https://pan.quark.cn/s/e374eb03990c"
  baidu_url: "https://pan.baidu.com/s/1RPfXzvQL4ydrWCmdM6CTNw"
  baidu_code: "mbmp"
  description: "【全剧 4 季 · 共 38 集】弗林特是文学史上最著名的海盗角色之一，也是海盗黄金时代的代表人物。他与其他人在新普罗维登斯岛上建立了被称为「海盗天堂」的无政府社区，并为守护这座岛而与各方敌对势力交战。在这座罪犯的避风港里，除了来自四面八方的海盗，还有形形色色的妓女、强盗、小偷和寻宝者。酒馆老板娘埃莉诺在黑白两道都人脉通达，一边为底层海盗销赃，一边为有权有势的名流举办舞会；范恩船长是弗林特的竞争对手；而传说中的水手约翰·西尔弗当时还默默无闻。岛上没有法律，却有规矩，谁该分多少、谁说了算，每一件事都要谈。人物关系的背叛与结盟几乎是常态，今天的朋友可能是明天的对手。四季三十八集的篇幅里，这座岛的生存逻辑被一点点摊开：民主、背叛、补给和赏金令，全都是政治。海战和登船的场面拍得有分量，不靠特效堆。适合喜欢海盗题材、愿意看权力博弈的观众。｜TMDB 7.6"
  date: 2014-01-25
  added: 2026-09-07
  image: tv-013.jpg

- id: tv-012
