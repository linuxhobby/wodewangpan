  description: "【第 1 季 · 共 10 集】改编自同名网络漫画：主人公金部长只想安安静静当个父亲，真实身份藏得严严实实，直到女儿突然失踪，他不得不把自己藏了半辈子的东西重新翻出来，只为把她找回来。十集的动作戏干净利落，父女关系是它区别于同类特工剧的地方——每一次动手都是为了回家，不是为主义，也不是为国家。剧集把「父亲」这个身份写得比「特工」更重：他真正害怕的不是任务失败，而是女儿不再需要他。剧集在动作设计上偏实打实，长镜头和贴身格斗居多，看得出演员花了功夫。女儿这条线没有被当成单纯的动机道具，两人之间的隔阂与和解占了不小的篇幅。整体风格爽快，不绕弯子，看得很顺，一季十集不拖泥带水，适合周末一口气刷完。适合喜欢「身手了得但心里只有一个家」这种设定的观众；期待高智商谍战的话，它的路数更直接，靠的是执行力而不是布局。｜TMDB 8.5"
