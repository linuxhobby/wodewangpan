  baidu_pwd: "ricp"
  description: "【第 1 季 · 共 8 集 · 全剧 2 季】一对父女各自把真实身份藏了二十多年，直到在一次任务中撞了面才发现，原来两人同为中央情报局探员——过去那些父子温情底下，全是没说出口的谎。这个设定本身很好猜，好玩的地方在于看他们怎么继续瞒下去。八集的篇幅里动作场面有实感，家庭部分的喜剧味很足，两条线互相给对方添乱。父女俩互相拆台的场面是全剧最好笑的部分，任务的紧张反倒成了配菜。阿诺·施瓦辛格首次主演剧集是最大卖点，他演的正是那种「明明身手还在、却被当成退休老人」的父亲。剧集对「家人之间到底了解彼此多少」这个老问题做了不少轻松化处理，吵嘴的段落甚至比任务戏更有意思。整体不烧脑，看个热闹正合适，周末一口气刷完也没有追长剧的负担；追求硬核谍战质感的话，这部主打的是笑料和家庭关系，而不是谍报细节。｜TMDB 6.6"
