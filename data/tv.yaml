  description: "【第 1 季 · 共 12 集】设定自带喜感：国家情报院特工郑海成在一次行动出事之后被降职，接到一件听起来不太体面的任务——追查高宗皇帝失踪金条的下落，线索指向一所高中。他只好收起年龄和身份去当插班生，跟比自己小二十岁的同学一起上课，同时应付那位尽职到让人头疼的班主任。十二集的动作和校园喜剧混着来，比例大致对半：前半段闹腾，后半段逐渐动真格。校园部分的笑料基本来自年龄落差——一个习惯了命令别人的中年人，被迫重新经历考试、值日和排队打饭。金条这条主线的悬疑成分不算重，但足够支撑剧情往前走，不是纯搞笑。校园里的人际关系写得意外认真：霸凌、升学压力和家庭期待都占了不少篇幅。几位学生配角各有特点，几段友情戏意外地真诚。动作戏拍得实在，主角不是靠开挂取胜，年纪带来的劣势一直都在。适合想看点轻松搞笑、又不想完全放弃拳脚场面的观众。｜TMDB 8.0"
