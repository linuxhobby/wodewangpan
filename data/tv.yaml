  baidu_code: "sxof"
  description: "【全剧 2 季 · 共 30 集】设定一目了然：一个含着金汤匙出生、平时只想着玩的财阀三世，因为一场意外被塞进重案组，从此用最不合规的方式办案——比有钱人更有钱，比有背景的人背景更硬，警方碰不到的案子他倒是有办法。两季共三十集，属于轻松的爽剧路线，看点是主角怎么用钞能力绕过程序：收买线人、包下整层楼当临时指挥所、动用私人资源追嫌疑人，荒唐里带着一种直白的痛快。笑料不少，配角们也各有各的毛病。它偶尔会认真一下，讲讲钱买不回来的东西，但很快又回到搞笑的节奏上。主角并非毫无成长，几桩案子让他看见了自己从没接触过的那部分生活。他与重案组同事的关系是温情的部分，一群讲规矩的人被迫接受一个完全不守规矩的搭档。节奏快，单集基本自成单元，随时插进去看也不影响。适合想看点不用动脑的宣泄式警察剧的观众；期待严谨刑侦细节的话，这部从头到尾都在开玩笑。｜TMDB 7.7"
  date: 2024-01-26
  added: 2026-08-24
  image: tv-007.jpg

