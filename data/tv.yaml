  description: "【第 1 季 · 共 16 集】韩国年代谍报爱情剧《百日谎言》（100일의 거짓말）2026 年 10 月 10 日开播，故事设定在日本殖民统治时期的朝鲜半岛。女主角佳景是个凭一双手吃饭的天才扒手，为了活下去，她冒名顶替混进朝鲜总督府当差，摇身一变成了体制里的「密探」。不过这个身份从头到尾都是假的，她瞒天过海，一装就是一百天。装着装着，假的也成了真的：她开始真正卷入情报的传递与危险的周旋，从冒牌密探一步步长成真正的暗线人物。与她命运纠缠在一起的是朝鲜翻译官泰雄，两人各怀目的互相试探，又在乱世里交出了真心，谍报线的紧绷与爱情线的悸动交替上演。本剧的动作冒险底色很足，扒手出身的设定让女主角的身手戏有独特看点，总督府内的权力倾轧则为剧情提供了持续的压力源。16 集的体量，适合喜欢年代谍战气质又想看言情线的观众；剧集刚开播，评分尚未开出，可以先看前几集再决定追不追。资源目录按 Season 1 结构存放。｜TMDB 0.0"
