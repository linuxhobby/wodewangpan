  description: "【第 1 季 · 共 6 集】《暗潮之下》把犯罪故事搬到了北大西洋的寒冷海岸。故事发生在纽芬兰的一个渔业小镇，这里的生计全靠大海，居民彼此知根知底，也正因为如此，任何风吹草动都藏不住。一桩命案打破平静，而现场逃逸的方向并不指向人——某种不该出现在近海的巨大海洋生物，成了笼罩整个社区的威胁。坚韧的渔夫一家被推到风口浪尖：他一方面要设法保护家人，另一方面也比任何人都清楚，这片海一旦翻脸意味着什么。剧集最突出的气质是地域感：湿冷的空气、木质码头、浓重的口音与渔业行话都相当扎实，群像写得也算立体，镇上的每个人似乎都跟那桩事有一点牵连。悬念铺设偏稳，不追求一集一个反转，而是让压力慢慢累积。六集体量短小精悍，适合一口气看完。推荐给喜欢《猎鹿季》《边桥谜案》那种「地方感很强 + 罪案推动群像」的剧，也适合对海洋、怪物传闻题材有兴趣的观众。｜TMDB 7.3"
