  description: "【第 2 季 · 共 8 集 · 全剧 2 季】一场史诗般的26世纪人类与被称为‘星盟’的外来威胁间的冲突。改编自同名游戏。《光环》系列讲述了26世纪时，人类与外星种族之间的史诗级宇宙战争。核心人物士官长Master Chief，他是人类阻止外星大军「星盟」毁灭文化的唯一希望。16岁的Quan Ah，精明﹑胆大的她在殖民星的关键时刻遇上士官长。Catherine Halsey博士创造了超级士兵 - 斯巴达战士，人造智能Cortana可能是人类能否生存下去的关键，Soren-066是个道德观复杂的私掠船船长，即将与在军中时的军士长兼前好友士官长有所冲突。Margaret Parangosky上将是美国海军情报局的领导。斯巴达战士Vannak-134，有强化神经机器的他是个童年时期就被征召的超级士兵，士官长的副手斯巴达战士Riz-028，她是个专注﹑专业的士兵，犹如杀戮机器一般，还有有胆识﹑好奇心重的斯巴达战士新人Kai-125。｜TMDB 8.2"
