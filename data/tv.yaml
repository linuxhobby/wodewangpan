  quark_url: "https://pan.quark.cn/s/f1add3110cb1"
  description: "【第 5 季 · 共 8 集 · 全剧 5 季】亚马逊高分纪实剧第五季回归，杰里米·克拉克森的迪丽斯库阿特农场迎来新一轮麻烦。本季开局恰逢英国政府发布引发农业社区强烈反弹的预算调整，杰里米决定对农场动一次大手术：作物改用高科技方式种植，地里添置了最前沿的新设备，升级版「迪丽斯库阿特农场2.0」就此上路。可设备买得到，天气与运气买不到，手术、风暴、出行、更新、斩首、精疲力竭、病倒，八集标题排开，像一份农场主的受难日程表，直到最后一集才轮到正题上的收获。相比前四季，这一季的变化更大，挑战也更严峻，幽默之外继续如实记录英国农业在政策挤压下的真实处境。全剧五季每季都是8集，本季2026年6月开播，是英式纪实喜剧的招牌之作。｜TMDB 8.3"
