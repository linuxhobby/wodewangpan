  description: "【第 4 季 · 共 10 集 · 全剧 8 季】第四季于 2014 年播出，全季 10 集，对应原著第三部《冰雨的风暴》的后半段。血色婚礼之后，兰尼斯特家族虽坐稳铁王座，实际却四面受敌：乔佛里在自己的婚宴上暴毙，提利昂被控弑君，一场大审判把君临的权斗推向顶点；号称「多恩红毒蛇」的奥柏伦·马泰尔替旧情人讨还公道，与魔山的生死决斗是全剧最著名的单场戏之一。长城防线告急，守夜人以数百之众死守堡垒，硬撼曼斯·雷德麾下的野人大军，琼恩·雪诺只身出城执行刺杀任务；布兰一行则继续向北，寻找传说中的三眼乌鸦。狭海对岸，丹妮莉丝在三条巨龙与无垢者大军的护卫下兵临弥林，奴隶湾最大的城市陷入长期攻防。系列由 HBO 制作，改编自乔治·R·R·马丁的小说《冰与火之歌》，彼特·丁拉基凭提利昂一角多次拿下艾美奖，本季正是该角色戏份最重的段落之一。本目录为第 4 季全集，1080p 蓝光压制，内封中文字幕。｜TMDB 8.5"
  date: 2014-04-06
  added: "2026-10-09 21:45"
