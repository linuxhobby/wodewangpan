  quark_url: "https://pan.quark.cn/s/3bc64abcdc3d"
  baidu_url: "https://pan.baidu.com/s/1iZRaFDOExNY4Iz65WUWXFA"
  baidu_code: "0y4o"
  description: "【第 1 季 · 共 18 集】一对互相看不顺眼的搭档，是这部剧的骨架：老民警冉曦办案靠的是几十年在片儿区攒下的直觉与人情，刚从公安大毕业的赵赶鹅则带着书本上的那套规范。两人从互不买账到被迫协作，又因为一桩横跨十八年的胡同悬案走到反目边缘。井底的红色高跟鞋、怎么也抓不住的胡同杀手，线索全都散落在老城的日常里——早点摊、棋摊、邻居的闲话。老城的拆迁与改造不断改变着线索的地形，昨天走过的路今天已经不通了。十八集的长度决定了它不可能走快节奏，市井里长出来的人情味和悬疑是混在一起的。两人关系的转折不是靠一场戏完成的，而是在一次次蹲守和走访里慢慢挪动。廖凡和尹昉的表演是一大看点，一个松弛世故、一个紧绷较真，两人的对手戏里有大量不靠台词传递的信息。适合愿意跟着人物走过十几年、喜欢慢慢铺陈的观众；指望两集一案的节奏会失望。｜TMDB 7.3"
  date: 2025-11-01
  added: 2026-10-05
