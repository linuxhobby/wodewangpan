  baidu_code: "pzb2"
  description: "【第 1 季 · 共 12 集】美术老师安允秀原本过着平静的日子，却在结婚十周年之际成为丈夫遇害案的唯一嫌疑人，生活瞬间翻覆。此时身份神秘、患有精神疾病的慕恩主动靠近她，自称能看透别人的杀意，愿意替她承担罪责，代价是一个危险的交换条件。负责案件的检察官白东勋不信这套说辞，他以自己的信念和组织的名声为赌注，非要挖出两个女人背后藏着的秘密。三个人各怀目的，谁先露出破绽，故事就往谁那边倒。十二集的篇幅里真相一层层往回退，观众跟随的视角也在不断被推翻，对同一件事的判断会被反复修正。剧集没有把精神疾病简单处理成噱头，而是让它持续影响证词的可信度，这一点值得肯定。全度妍与金高银的对手戏是最大看点，一个压抑克制、一个飘忽难测，两人同框时空气都是紧的。适合喜欢心理悬疑、享受「谁的话都不能全信」这种不确定感的观众。｜TMDB 7.9"
