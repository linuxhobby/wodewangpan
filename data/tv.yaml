  description: "【第 1 季 · 共 8 集】这个被改编过多次的故事，新版把时间搬到了当下：父亲的突然离世让嘉莉转进一所并不友好的公立高中，校园霸凌、社交媒体时代的放大效应，以及家里近乎封闭的教养方式，一起把她逼到墙角。也是在疼痛最集中的时候，她身上那种说不清的意念能力开始苏醒。八集的气质比过去几个电影版更慢，也更在意「一个被孤立的人在爆发之前经历了什么」——欺凌不是背景板，而是一点点累积的过程。被拍下来、被转发、被起哄，这种羞辱在今天比任何拳头都更难躲。母女关系是写得最用力的部分，控制与依赖缠在一起，很难简单说谁对谁错。整体节奏偏慢，但压抑感积累得很到位。结尾的爆发拍得有分量，前面压得越久，后面越让人坐不住。适合喜欢心理惊悚、对校园暴力题材不反感的观众；只想看超能力场面的会觉得前几集铺垫太长。｜TMDB 7.5"
