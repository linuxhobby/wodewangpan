  baidu_pwd: "hh4u"
  description: "【第 2 季 · 共 8 集 · 全剧 4 季】第一季的风波之后，哈珀·斯特恩（米哈拉·赫罗德 饰）在皮尔庞特纽约新高层的手下被迫回到交易桌前，办公室气氛比前一季更紧绷。本季舞台在伦敦、纽约与柏林之间来回切换：哈珀缺席一场会议本想争口气，结果适得其反；雅丝敏疏远的父亲再度现身，家族财富的惊人真相被摊开；罗伯特继续追求妮可，手段越来越不留余地。里肯医疗中心的投资人活动上，哈珀被夹在客户布鲁姆与上司费林中间，还成了交易主管艾瑞克的标靶；随后柏林一行、法斯艾德的轧空风波、纽约接管伦敦办公室的权力重组，把四个年轻人的处境越收越紧。收尾一集「耶路撒冷」里，哈珀、艾瑞克、丹尼和里仕联手向竞争对手银行推销自己，为一个可能改变人生的机会押上全部筹码。全季 8 集自 2022 年 8 月 1 日起在 HBO 播出，每集约一小时，台词密、节奏快，镜头盯着交易大厅光鲜表皮之下的创伤与代价：金融危机后的资本集中、职场里的性别角力，以及一代人用整个自我换留场的焦灼。没看过第一季也能进，连着看更入味。｜TMDB 6.9"
