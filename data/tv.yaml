  baidu_code: "3zyv"
  description: "【第 1 季 · 共 12 集】张海峰曾经是刑警队长，独生女儿朵朵意外离世之后，家庭随之散架，他整个人陷在浑浑噩噩里。城里忽然出现的连环凶案却总带着朵朵那件事的影子，他被卷进去之后才发现，等着自己的不只是复杂的案情，还有一种不断回到同一天的处境。时间循环在这部十二集的剧里不只是叙事机关：它既是破解案件的钥匙，也是逼他一遍遍重历丧女之痛的刑具。每一次重启，他都得多记住一点、多承受一点，也在不同的人身上多看见一点东西，包括他自己不愿承认的部分。剧集对丧亲之痛的描写相当克制，没有大哭大闹，反而更难挨。结构上不是简单重复同一天，而是让信息差一点点累积，看到后面会有拼图合拢的快感。适合喜欢悬疑加轻科幻设定的观众，尤其是能接受主角长期处在低谷、情绪压抑的人；想要轻松爽剧的话，这部底色很苦。｜TMDB 5.5"
