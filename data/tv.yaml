  description: "【第 2 季 · 共 7 集 · 全剧 2 季】改编自同名网络漫画，第二季继续跟着那两个靠拳击谋生的年轻人：他们缺钱，于是成了替人要债的「猎犬」，跟着一位心地不坏的放贷人做事。名义上是催债，实际每次都撞进更深的泥潭——把人逼到绝路的高利贷集团、把暴力当生意的组织。两位主角的分工很清楚，一个更稳、一个更冲，性格差异在打斗里也看得出来。他们接的每一单背后都是具体的人：还不上钱的小生意人、被套牢的老人，剧集没有把这些背景一笔带过。放贷人这条线提供了道德坐标，让催债这件事不至于变成单纯的暴力表演。爽点很直接：借钱的人被欺负到没路走，就有人替他们打回去，底下其实有股气——对那些靠别人的困境发财的人，这部剧毫不客气。这一季篇幅比第一季更短，动作比重反而更高，拳拳到肉的近身打斗依旧是招牌。节奏紧凑，七集一口气刷完最舒服。建议两季连着看，人物关系才连贯。｜TMDB 8.5"
  date: 2023-06-09
  added: 2026-09-27
