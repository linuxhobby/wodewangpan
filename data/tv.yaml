  description: "【第 1 季 · 共 34 集】毒品流通猖獗，缉毒队长白桦带着庄严、李潇等一批青年警员扎进这条线：潜伏、卧底、跟毒贩周旋，每一步走错都可能暴露。剧集把重心放在「人」而不是「案」——卧底身份带来的撕裂、同事之间无法挑明的试探、家里人等不到的那通电话，这些比枪战更难扛。三十四集的篇幅够它把一条从街头零售到上游网络的链条慢慢铺开，线索一环扣一环，不是一集一案的快节奏。白桦这条线最见功力：他要在毒贩面前维持一个可信的身份，同时还得护住身边经验尚浅的年轻人，判断慢半拍就是人命。庄严、李潇代表新人视角，冲劲有余、经验不足，成长代价写得很实在。对手也不是脸谱化的亡命徒，谈生意、讲规矩、留后手，让人相信这条链子真有这么运转。节奏偏稳，前几集在铺人物关系，耐心看完后面的收网才有力。适合喜欢写实刑侦、能接受慢热铺垫的观众；只想看密集爆点的可能嫌前段温。｜TMDB 8.0"
