  quark_url: "https://pan.quark.cn/s/fe95145c3cfc"
  description: "【第 1 季 · 共 6 集】改编自罗伯特·路易斯·史蒂文森的经典冒险小说。年轻的吉姆·霍金斯和母亲贝斯得到一张传说中的海盗藏宝图，由此踏上横渡大西洋的致命航程。面对叛变、暴力与背叛，吉姆必须在危机四伏的旅途中成长，而这段经历也将彻底改变他的人生。｜TMDB 4.0"
