  baidu_url: "https://pan.baidu.com/s/1rCKqO-PUj3_g6CY6p-hyvQ"
  baidu_code: "q6gx"
  description: "【全剧 2 季 · 共 18 集】背景是美国海军海豹突击队第六分队，剧集讲述他们在成功击杀一名阿富汗塔利班领导人之后，却发现竟然有美国公民与恐怖分子合作。这剧根据现实发生过的任务改编，每季的地点都不一样，首季设在非洲，灵感来自当地真实发生的学生绑架案。它的重心不只是行动本身，更在于队员回国之后的日子：家庭关系的裂痕、长期部署留下的心理负担，以及「下一次还要不要去」的犹豫。家庭线占了不小篇幅，配偶和孩子承受的压力被认真对待，不是陪衬。战术细节是它的强项，突击、掩护、撤离都拍得像回事，看得出有顾问参与。队伍内部的兄弟情谊写得实在，也正因为写得太实在，牺牲的分量才重。叙事不追求华丽，靠的是扎实，改编自真实任务的底子让细节站得住。适合喜欢军事题材、想看任务之外那一面的观众；期待纯粹爽快动作片的会觉得文戏偏多。｜TMDB 7.3"
