- id: tv-013
  title: "黑帆"
  category: 电视剧
  tags: ["电视剧", "剧情", "动作冒险"]
  quark_url: "https://pan.quark.cn/s/e374eb03990c"
  baidu_url: "https://pan.baidu.com/s/1Ws_FbtHRxmpncPDZ-5O8mA"
  baidu_pwd: "gxvq"
  description: "【全剧 4 季 · 共 38 集】弗林特是文学史上最著名的海盗角色之一，也是海盗黄金时代的代表人物。他与其他人在新普罗维登斯岛上建立了被称为「海盗天堂」的无政府社区，并为守护这座岛而与各方敌对势力交战。在这座罪犯的避风港里，除了来自四面八方的海盗，还有形形色色的妓女、强盗、小偷和寻宝者。酒馆老板娘埃莉诺在黑白两道都人脉通达，一边为底层海盗销赃，一边为有权有势的名流举办舞会；范恩船长是弗林特的竞争对手；而传说中的水手约翰·西尔弗当时还默默无闻。岛上没有法律，却有规矩，谁该分多少、谁说了算，每一件事都要谈。人物关系的背叛与结盟几乎是常态，今天的朋友可能是明天的对手。四季三十八集的篇幅里，这座岛的生存逻辑被一点点摊开：民主、背叛、补给和赏金令，全都是政治。海战和登船的场面拍得有分量，不靠特效堆。适合喜欢海盗题材、愿意看权力博弈的观众。｜TMDB 7.6"
