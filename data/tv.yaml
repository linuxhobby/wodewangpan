  baidu_code: "nr4e"
  description: "【第 1 季 · 共 15 集】市检察院资深检察官段鸿山在办理一桩「被家暴女性杀夫」案件时，省检察院青年检察官方灵渊被派来协助办案。两人发现该案与十四年前段鸿山办理的「校园防卫过当案」息息相关。一桩是家暴受害人反杀案，另一桩是十四年前的校园伤人案，两起看似毫无关联的案件，在调查深入后悄然交错，彼此映照。十四年的时间跨度让两条线互为镜像，当年的判断影响了几个人此后的一生。十五集的篇幅里，剧集把「正当防卫」这个法律概念拆开来讲：什么算正在进行、什么算超过必要限度，每一个判断都牵着一个人的一生。家暴这条线写得克制，不煽情，但细节足够让人难受。它没有把答案简化成口号，而是把天理、人情、国法三层摆在一起让人为难。两位检察官的分歧也是看点，一个更重经验，一个更重条文。检察系统内部的流程也写得到位，不靠戏剧化夸张。适合喜欢法治题材、愿意跟着推理慢慢走的观众。｜TMDB 6.7"
