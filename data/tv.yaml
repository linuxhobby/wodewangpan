  baidu_code: "b1w8"
  description: "【第 1 季 · 共 12 集】一起看似简单的自杀案，背后藏着一个不可告人的秘密；为了揭开它，一群人历经七载，付出无数代价，甚至赌上性命。曾有大好前途的检察官江阳因受贿贪污入狱三年，再次出现在公众视野里，竟是蜷缩在行李箱中的尸体；运送他尸体的是当地著名律师张超。案件引发全市关注，刑警严良介入负责，与张超正面交锋——张超承认犯罪，却在法院宣判时当场翻供，并拿出不在场证据，案件陷入死局。十二集的结构是三条时间线并行推进，越往后越能看出它们是怎么咬合的，看的时候留意年份提示会顺很多。三位主角分属不同身份，却为了同一件事各自押上了人生，这种分工让结构很稳。它真正写的是代价：一群普通人为了一个真相，把自己的生活一点点赔进去。它不提供爽感，看完会有一种闷在胸口的堵。适合喜欢那种沉住气、看到最后才明白前面所有铺垫的悬疑剧观众。｜TMDB 8.476"
