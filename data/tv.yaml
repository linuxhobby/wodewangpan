  baidu_url: "https://pan.baidu.com/s/1_XUrfyAXYLz9HjuuvxVDFQ"
  baidu_code: "kapz"
  description: "【第 1 季 · 共 16 集】上世纪九十年代，一个雷电交加的夜晚，一个叫照阳的小县城里，少年被神秘追杀，生死不明。与他一起失踪的另外两名少年也同样人间蒸发。三年后，其中一个少年突然变身小扒手，佯装失忆回归家庭。认亲成功的背后，真相究竟是破镜重圆还是将错就错？看似再次团聚的家庭背后竟还藏着秘密和杀机。老警察暗中调查，一场猫鼠追逐之后，另外两名失踪少年的下落也出现端倪，多起失踪案、拐卖人口案、误杀与谋杀案件的真相逐渐浮出水面。老警察的执念是主线驱动力，他查的不只是案子，还有自己当年没做完的事。认亲之后的家庭戏份最让人不安，温情底下随时可能翻脸。谜底揭开之际，老警察和「失踪少年」也实现了双向救赎，成就这个包裹在悬疑外衣之下的亲情故事。十六集把九十年代的县城质感拍得具体，街道、游戏厅和家属院都有年代味。适合喜欢年代悬疑、愿意看人物关系的观众。｜TMDB 6.7"
