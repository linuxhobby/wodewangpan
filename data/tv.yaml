  description: "【全剧 4 季 · 共 30 集】开场给了一个很抓人的设定：白宫地下室有部永远不会响的专线电话，男主角的工作就是每天守着它。某天凌晨电话真的响了，听筒那头是在求救——从此他被卷进牵扯政府内部的阴谋，唯一能帮他的是一个做网络安全的姑娘，两人隔着半座城市分工配合。它的气质是标准的爽剧：反转密集、节奏很快、不太经得起推敲，但追起来非常顺。男主角的优势不是身手，而是那份规矩到近乎固执的职业习惯，他每次行动前都要确认流程，这种刻板反而成了他活下来的理由。两人隔着耳机配合的段落是它最有意思的设计，看不见彼此却要互相托付。反派的身份并不难猜，看点是他怎么在各方之间周旋。整季三十集的体量刚好，追起来没有负担，也不会因为太长而失去耐心。适合想找一部不必动脑、能一口气往下刷的动作剧的人，周末消遣相当合适。｜TMDB 7.7"
