  description: "【第 2 季 · 共 13 集 · 全剧 6 季】第二季从首季结尾那场未遂刺杀之后说起，东尼·沙普蓝诺在家养伤，心里却清楚：想杀他的人还在，卖他的人也还没有浮出水面。姐姐珍妮丝从西雅图回到新泽西，满口禅意却寸步不让，很快把年迈的母亲和整个家族搅得不得安宁；同期出狱的老派人物里奇·阿普里尔火气更旺，处处看不惯东尼的做派，对头把交椅另有所图，帮内新旧两套规矩正面相撞。街面生意与地下秩序的摩擦之外，联邦调查局的线人网越收越紧，谁在暗中给警方递情报，成了贯穿整季最大的悬念。这一季延续首季黑帮与家庭双线并行的路子，詹姆士·甘多费尼的表演依旧撑起全剧，人物关系比第一季更纠缠，季末的收束干净利落，也为后续几季埋下了重要的伏笔。帮派内外的新面孔轮番登场，多条支线交错推进，整体观感比首季更沉稳。｜TMDB 8.1"
