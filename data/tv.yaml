  description: "【第 1 季 · 共 14 集】主角是缉毒队的王牌警监，却被一个身份不明的人强行注射毒品，从此被握住了把柄。紧接着高中死党离奇身亡，留下一笔五十亿韩元的保险金——为了弄清这个人为什么会死，他一层层往回翻二十年里两人之间的旧事，结果发现当年的友谊根本不是他以为的样子。他必须一边戒断一边办案，身体状态和判断力都在下滑，这让每个决定都多了一层不确定性。十四集的主线是葬在一代人之间的秘密，风格偏沉重，几乎没有轻松的段落。片名所指的既是毒品带来的依赖，也是那群高中同学之间剪不断的牵扯，两条线到最后会合到一起。它最特别的地方在于主角从头到尾都在被动挨打：身体被控制、记忆被动摇、信任被推翻。年代跨度大，演员需要同时处理青年和中年两个阶段，表演上的对照也是看点之一。适合喜欢慢慢抽丝剥茧、能接受主角长期处于劣势的观众；想看爽快反击的话，这部会让人憋屈。｜TMDB 7.7"
