  quark_url: "https://pan.quark.cn/s/fb4c2e652171"
  baidu_url: "https://pan.baidu.com/s/1MmifHy0LDETMuQ-YVN43kA"
  baidu_code: "ibum"
  description: "【全剧 2 季 · 共 12 集】舞台是二十世纪七十年代的韩国：白基泰游走在情报机构与地下生意之间，靠着权势一点点往上爬；站在他对面的是检察官张建荣，一个认死理、非要看看权力背后藏了什么的人。两条线不断交锋，把那个年代的动荡和欲望摊在台面上。两条线的推进节奏并不一样——一个在扩张，一个在逼近，交汇处火花很足。篇幅不长，叙事密度却不低，服饰和街景还原得很细，年代的质感靠美术而不是靠台词讲出来，喜欢年代感的观众会看得满足。剧集真正写的是「一个人怎么被时代塑形」：白基泰不是天生的恶人，他的每一步选择都嵌在当时的规则里。检察官这条线提供了对照——在一个规则由权力书写的年代，坚持程序本身就是一种冒险。对韩国现代史不熟也能看懂，但了解背景的人会多读出几层意味。适合喜欢历史背景与权力题材的观众；想看轻松娱乐的话，它的基调相当沉，人物几乎没有喘息的时刻。｜TMDB 8.1"
  date: 2025-12-24
  added: 2026-09-13
  image: tv-012.jpg

