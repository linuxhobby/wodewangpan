  baidu_code: "usyb"
  description: "【全剧 2 季 · 共 16 集】作为《黄石》的衍生剧：凯西·达顿离开牧场，加入美国法警队，把在军队里学到的那一套和在牧场磨出来的牛仔本事，一并带到蒙大拿的执法日常里。麻烦在于，这份工作带来的精神压力和家里的事并不能分开——他得一边追捕嫌疑人，一边处理婚姻和父亲留下的期待。全剧节奏偏稳，荒野和公路的镜头占的比重很大，摄影和配乐都延续了《黄石》的味道，空旷的风景几乎成了另一个角色。蒙大拿的荒野既是风景也是压力来源，人在其中显得很小，问题也显得更硬。追捕的段落拍得实在，不靠花哨的枪战，靠的是追踪、蹲守和判断。它不算传统的警匪剧，追捕只是框架，重心是这个人怎么跟自己和解。它真正想写的是一个人离开熟悉的土地之后，还能不能守住自己那套规矩。适合看过《黄石》、想知道凯西那条线往哪走的观众；没看过原剧也能直接看，只是人物关系的分量会轻一些。｜TMDB 7.9"
