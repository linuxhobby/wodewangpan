  description: "本片取材于佛山公安英模林伟光与刑警八大队的真实事迹，是一部写实风格的公安题材作品，2026 年 7 月 11 日在中国大陆公映，由崔景宣执导，凌潇肃、余男、郭晓东、吴若甫等主演，片长约 97 分钟。故事回到本世纪初，那时街头飞车抢夺横行，民众人人自危，佛山公安为此组建了全国第一支专门打击街面双抢的专业队伍，也就是刑警八大队。副队长林伟带着队员骑着摩托车冲在一线，与飞车劫匪展开长达十一年的生死追缉，十一年间全队抓获嫌疑人两万余名，林伟本人三十多次负伤，数次重伤，甚至有过从高架坠落后仍坚守岗位的经历。影片用写实手法还原了惊险的追凶与抓捕现场，摩托追逐、街巷围捕的段落拍得生猛扎实，同时也细腻呈现了警嫂默默守候的温情日常，让英雄叙事落回到具体的人身上。整体气质硬朗，既有大案要案的紧张感，也有平凡守护的动人底色，适合喜欢真实事件改编与刑侦题材的观众。｜TMDB 0.0"
