  description: "【第 1 季 · 共 120 集】这是一部篇幅很长的家庭剧，故事围着两位性格完全相反的妈妈展开：一位一辈子活成家庭的配角，另一位则理直气壮地为自己而活，两个家庭、尤其是两家的孩子纠缠在一起，吵吵合合地往前过。一百二十集属于典型的日日剧节奏——每天一段小风波，人物关系慢慢长出来，家长里短里藏着几代人观念的碰撞。它不追求强悬念，靠的是日积月累的熟悉感：看久了会像真的认识这些人一样。两位母亲的对照是主线驱动力，一个牺牲到失去自己，一个坚持到被人指责，谁也没法完全说服谁。孩子们这条线则把两种教育方式的后果摆在一起比较。演员阵容庞大，日常对话写得很生活化，不会有硬造的戏剧冲突。它真正讨论的是「一个母亲有没有权利先为自己活」，这个问题在剧里反复出现。适合习惯长篇家庭剧、想找部能长期当背景放着看的观众；追求快节奏和强悬念的话，这个篇幅可能会让人望而却步。｜TMDB 0"
