  baidu_code: "0akk"
  description: "【第 1 季 · 共 12 集】为了找回流失在海外的文物，文化遗产部门、公务员系统和警察厅的智能犯罪小组被硬凑成一支队伍，目标是把被贪心人藏在暗处的国宝夺回来。男主角黄大明白天是个不起眼的公务员，夜里干的是像盗墓一样的活儿。队伍内部的互相提防比夺宝本身更有看头，谁都不肯先亮底牌。十二集的调子是动作混搞笑，看着热闹，逻辑别太较真。它的乐趣主要来自「白天上班、晚上劫富」这种双面设定，以及一帮各怀心思的人被迫合作时的化学反应。剧集对每一件文物的来历都做了通俗化处理，即便完全不了解那段历史，也能跟上主线。节奏偏快，几乎没有冷场，适合周末连着刷。想认真考据细节的人可能会失望，但想放松的人会挺满意。适合想看点轻松盗宝题材的观众；期待严谨文物考据或高智商对抗的话，它更像借了个壳子的娱乐片。｜TMDB 4.3"
