  baidu_code: "bidk"
  description: "【全剧 2 季 · 共 17 集】这是 Netflix 的职场喜剧，灵感来自美国成立太空军的现实新闻：一名踌躇满志的四星上将被派去领导这支新军种，开幕就有一种「说好的星辰大海，结果先应付预算和办公室政治」的荒诞感。他不得不和一位古怪的科学家合作，一边应付上级视察，一边处理家里青春期女儿的事。笑点偏美式讽刺，不靠夸张的肢体，更多是官僚体系本身的荒唐：开会、立项、推诿，每一环都能制造尴尬。主角不是蠢，只是被放在了一个不适合他的位置上，这种错配是笑料的主要来源。科学家那条线提供了另一种荒诞——纯粹的聪明和纯粹的不通人情放在一起。家庭线则是它的软垫，让主角不至于只是个笑话。第二季把视角稍微往外扩了一些，团队的磨合比第一季更顺。适合喜欢《副总统》《公园与休憩》那种职场讽刺喜剧的人；期待军旅硬核题材的话会失望——它从头到尾就是在开玩笑。｜TMDB 6.5"
