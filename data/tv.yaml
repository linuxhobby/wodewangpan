  baidu_code: "7yjf"
  description: "【第 1 季 · 共 36 集】背景是民国时期的京城：赵少商和元鸿两个教育背景、出身经历完全不同的人，被一连串案件推到一起，在一次次合作里互相偷师——一个靠书本和规矩，一个靠市井和直觉，彼此看不上，又彼此离不开。三十六集的篇幅很长，案件是一个接一个的小单元，主线则是两人关系的推进和那个大时代的暗流。它的乐趣在于那种旧式的探案方式：走访、蹲守、验尸、套话，没有现代技术手段可以依赖。两人性格上的互补写得清楚，一个讲证据链，一个信直觉，谁在哪个案子上对往往是交替的。服化道和街景还原得细，京味儿的对白也下了功夫。单元案的质量有起伏，但主线那条关系线始终稳。当作下饭的长篇剧来看很合适，不必每集都紧盯。适合喜欢双男主探案、不介意慢热的观众；希望一个案件两集解决的话，这个长度需要点耐心。｜TMDB 8.0"
  date: 2026-07-05
