  baidu_url: "https://pan.baidu.com/s/1DifMM5SY5pjtMSXKxEdqsQ"
  baidu_code: "qb98"
  description: "【第 1 季 · 共 19 集】曾经朝气蓬勃的国营大厂旭日厂内，一具断足女尸在废弃污水池中被意外发现，死者是厂职工子女、品学兼优的大学生沈小舟（杨肸子 饰）。外丧内热的中年刑警连海平（陈建斌 饰）与毛躁热血的“菜鸟”警察石强锋（陈若轩 饰）意外成为搭档，虽互有嫌隙但须联手寻找真凶。\n随着一个个嫌疑人进入调查视野，二人发现，在外表白衣胜雪的大学生受害者背后，竟触及到了违规排污、整容贷骗局、网络暴力等诸多出人意料的社会层面。与此同时，一桩与两人牵绊至深的陈年旧案也逐渐浮出水面——石强锋怀疑连海平当年抛弃了其母亲，二人的关系因“一桩旧案”“一段往事”变得扑朔迷离。\n案件悬而未决之际，断足女尸案接连发生，给往日充满了烟火气的旭日厂蒙上了一层阴影。连海平也警觉地发现有一股势力在刻意引导着警方的调查方向。迷雾似见光明，暗潮早已涌动……｜TMDB 6"
