  baidu_pwd: "qm0s"
  description: "【第 1 季 · 共 12 集 · 全剧 2 季】这是星球大战系列里气质最不一样的一部：没有绝地武士，也没有光剑对决，镜头给的是帝国统治下的普通人。卡西安起初只是个在废船场讨生活的人，被帝国一层层加码的压迫推着往前走，最后走上通往义军的那条路。十二集的节奏偏慢热，前几集几乎都在铺陈，但那种压抑的政治氛围、监狱段落的设计，以及后几集的爆发力，让它在星战迷里口碑很高。监狱那条线是全季最好的部分，流水线和编号把人变成了零件，压迫感不靠武力也能立住。它把「反抗是怎么发生的」讲得很具体：不是某个英雄觉醒，而是无数人被逼到没有退路。官僚系统的日常运作被写成了真正的反派，文件、流程和上级指令比任何武器都有效。前几集的慢是必要的，它在积累一种无处可逃的氛围。看完再回头看《侠盗一号》，开场那几分钟会完全不一样。适合愿意把星战当战争片看的观众；对星战没有感情的话，前几集会有点门槛。｜TMDB 8.3"
