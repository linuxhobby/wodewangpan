  baidu_url: "https://pan.baidu.com/s/15u7wvAda8_zId7UZbVeFDA"
  baidu_code: "uqtt"
  description: "【第 1 季 · 共 24 集】一次审讯意外，让三大队刑警程兵入狱服刑，队友受牵连脱警、降职，曾经的三大队就此分崩离析。十年牢狱之后程兵重获自由，信仰崩塌，热血化为沉默，他失去了一切，而案件的犯罪嫌疑人依旧在逃。穿一天警服，终身是正义——三大队需要交代，不甘化作执着，程兵和兄弟们重新集结踏上追凶之路，在孤独而漫长的旅途中配合警方千里追凶。二十四集的篇幅给了这段苦行僧式的历程足够的空间，追凶的过程既是找人，也是他重新给自己找一个能站住的位置。几位队友出狱后的处境各不相同，有人认命、有人还想再搏，这些选择构成了群像的厚度。追凶跨越多年，环境在变，人的执念没变，这种对照很有力量。它不靠案情反转取胜，靠的是那种「明明可以算了，但就是算不了」的执拗。适合喜欢现实主义刑侦、愿意陪人物熬的观众。｜TMDB 8.1"
  date: 2023-12-21
  added: 2026-10-05
