  baidu_code: "1wt9"
  description: "【第 1 季 · 共 12 集】故事从一个蚁族白领切入：他只是想保护自己心爱的姑娘，没想到就此被卷进一桩杀人案，成了头号嫌疑人。原本死水一样的生活瞬间崩开，警方和黑帮同时找上门，求生的本能把人性里那些不太体面的东西一点点挤出来。十二集的气质偏冷，雪夜和冰的意象贯穿始终，暴力写得直接，不给人缓冲。雪一直在下，整座城市像被封住了出口，天气本身就是叙事的一部分。它属于社会派的路子：重点不是凶手是谁，而是一个普通人被逼到什么程度才会做那些事。剧集在冰天雪地的环境里拍出了一种独特的灰白质感，视觉上和它的道德困境是同构的。人物没有非黑即白的划分，警察、律师、混混各自都有不能说的理由。它不提供安慰，看完会有一种被冷水浇过的感觉。适合喜欢这类推理、愿意看「好人被逼坏」这条线的观众；只想轻松看个破案过程的话，这部会让人压抑。｜TMDB 8.4"
