  description: "【全剧 4 季 · 共 24 集】以色列出品的谍战剧，主角塔玛是摩萨德的黑客兼特工，用假身份潜入德黑兰，任务是协助破坏伊朗的核设施。真正的戏肉从任务失败开始：她被困在敌境，任何一步走错都会把还留在伊朗的亲人一起拖下水。全剧节奏紧，几乎不给喘息，人物也没有太多豪言壮语，更像一连串具体而麻烦的现实选择——怎么甩掉跟踪、怎么拿到通行许可、要不要相信刚认识的陌生人。剧集几乎没有什么大场面，紧张感全靠细节堆出来，更像在记录一份工作而不是拍一部英雄片。剧集对德黑兰这座城市的日常着墨不少，街头、家庭、检查站都拍得具体，敌境不是抽象的背景板。主角的双重身份带来的最大代价不是危险，而是她必须不断对善意的人撒谎。喜欢看职业细节的人会满意。适合喜欢把谍战写得琐碎且压抑那一类的观众；想看热闹的动作片的话，它的调子相当冷。｜TMDB 7.5"
