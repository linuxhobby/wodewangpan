  quark_url: "https://pan.quark.cn/s/c8b3f9c90dee"
  description: "【第 1 季 · 共 12 集】江南小镇玄家藏了十七年的秘密被一桩新案从土里翻出来。十七年前小妹玄珍离奇被杀，凶手至今成谜，她的双生姐姐玄珠远走他乡，父母守着旧伤勉强过日子。十七年后另一宗凶杀把玄家重新拖回漩涡：哥哥玄梁成了嫌疑人对象，玄母命悬一线，四分五裂的一家人被迫在故乡重聚。段奕宏、郝蕾、祖峰、吴越等组成的成年演员班底撑起剧的心理密度，穿插十七年前的少女视角与当下的审讯视角，两条时间线彼此映照。十二集篇幅不追逐破案爽点，而是把创伤如何在一家人之间代际传递一层层剥开，母亲的溺爱、父亲的沉默、兄妹的旧账与女儿的青春期反叛，都随着旧案真相浮出水面一一炸开。整体调性偏文艺悬疑，画面走江南水汽路线，节奏慢但情绪浓度高。爱奇艺迷雾剧场 2021 年 10 月 13 日首播。｜TMDB 5.6"
