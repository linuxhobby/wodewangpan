  description: "【第 1 季 · 共 10 集 · 全剧 8 季】第一季于 2011 年开播，全季 10 集，剧情对应原著第一部《权力的游戏》。北境守护艾德·史塔克在临冬城过着安稳日子，首相琼恩·艾林猝然离世的噩耗打破了平静：老友国王劳勃·拜拉席恩亲赴临冬城，力邀艾德出任首相辅佐朝政。艾德携女儿们南下君临，凭着一股较真劲儿追查艾林之死的真相，渐渐摸到兰尼斯特家族与王室之间那桩不可告人的秘密，也一步步走进权力漩涡的中心。与此同时，绝境长城之外异鬼重现的传闻得到证实，私生子琼恩·雪诺加入守夜人军团寻找自己的位置；狭海对岸，流亡王女丹妮莉丝被兄长嫁给多斯拉克首领卓戈卡奥，从任人摆布到逐渐觉醒，三颗龙蛋为她日后的崛起埋下伏笔。全剧由 HBO 制作，改编自乔治·R·R·马丁的小说《冰与火之歌》，宫廷权谋与家族恩怨从这一季全面铺开，是整个系列故事的起点。本目录为第 1 季全集，1080p WEB-DL 压制，内封简繁英字幕。｜TMDB 8.4"
