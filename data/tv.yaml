  quark_url: "https://pan.quark.cn/s/22076bb1538b"
  description: "【第 1 季 · 共 24 集】从一封匿名举报信开始：警察张一昂被派到三江口调查一件看起来不值一提的小事，结果当地一群水平低得离谱的蟊贼不断帮倒忙，反倒把他一步步推到了连环杀人案的边上，最终指向富商周荣的团伙。这部剧最特别的地方是它的笑点结构——真凶冷血、蠢贼搞笑，两种气质硬生生被放在同一条线上，反差本身就制造了大部分喜剧效果。改编自同名小说的荒诞感几乎是从原著里带出来的：一群自以为聪明的笨人，反而成了推动真相的齿轮。二十四集的篇幅给了它足够的空间去铺那些笨拙的巧合与误打误撞。王骁和王传君的对手戏是核心看点，一个装傻、一个真狠，两人碰面时的张力撑住了整季。适合喜欢黑色幽默、想看一部不太正经的犯罪剧的观众；追求严密推理的话，这里的案件逻辑是服务笑料的，别拿放大镜看。｜TMDB 7.8"
