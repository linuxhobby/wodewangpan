  quark_url: "https://pan.quark.cn/s/bb095bdcf206"
  baidu_url: "https://pan.baidu.com/s/17OklnSUQ5yR5ojhdNlnBKg"
  baidu_pwd: "ww6o"
  description: "【第 1 季 · 共 12 集】一个前黑帮分子盯上了一栋新建的大型公寓楼，想把它变成自己的提款机，于是跑去竞选居民自治会会长。他本想捞一笔就走，却在跟业主、物业、开发商打交道的路上，一点点揭开了这栋楼里更脏的东西，最后稀里糊涂地成了大家眼里的英雄。业主大会、公告栏和业主群成了新的战场，刀早就收起来了。十二集的讽刺矛头对着韩国人最敏感的住房与管理处文化：维修基金、停车纠纷、业委会选举，每一件小事背后都有具体的利益。笑点密集，但底下是真的在生气，笑过之后会发现这些荒唐事离现实并不远。剧集把公寓楼拍成了一个微型社会：邻居之间既有温情也有算计，谁都不是纯粹的受害者。主角的身份错位制造了持续的喜感——一个习惯用拳头解决问题的人，被迫学着开会和拉票。适合喜欢那种「荒唐社会剧里藏着愤怒」的观众；只想看黑帮动作的话，它的战场是业主大会而不是街头。｜TMDB 8.6"
