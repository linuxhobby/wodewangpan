  baidu_pwd: "jw8s"
  description: "【全剧 5 季 · 共 100 集】这是蝙蝠侠诞生之前的故事：年轻的詹姆斯·戈登带着一腔正气走进一个警察系统已经烂透的城市，一边查案，一边跟少年布鲁斯·韦恩建立起联系。与此同时，那些日后会把自己化妆成小丑、企鹅、谜语人的角色，正一个个在这座城里生根。五季一百集的篇幅很长，风格从写实慢慢滑向漫画式的夸张，越到后面越不按常理出牌。看点是看这些反派怎么从普通人变成符号，以及戈登在腐败系统里究竟能守到什么程度——他的正直在这座城里既难得又笨拙。美术和摄影是这部剧的强项，城市被拍得像一座永远在下雨的舞台，气氛很足。不必是漫画迷也能看，但熟悉这些角色名字的人，会在他们第一次出现时多一层会心。追到后面会明显感到风格的放飞。适合对反派起源有兴趣、且有大把时间的观众；想看连贯紧凑的剧情的话，中途的单元案会有明显的重复感。｜TMDB 7.6"
