  description: "【第 1 季 · 共 6 集】背景是澳大利亚内陆：世界上最大的养牛场继承人悬而未决，世代积下的矛盾被一次性引爆，罗森家族眼看就要散架。周围的几股势力闻着味就动了——同业对手、沙漠中的帮派、原住民长老、开矿的亿万富翁，全都在赌这个家族倒下之后谁先接到好处。六集的篇幅短，属于现代西部剧：土地、家族、枪和牛群，冲突直接，不绕弯子。家族内部的兄弟姐妹各有盘算，遗产之争只是导火索，真正的裂缝早就存在。节奏偏快，六集塞进了不少事件，几乎每集都有新的势力登场。原住民长老与矿业资本这两条线让它不止于家族内斗，土地的归属本来就是更复杂的问题。它最特别的地方是那片土地本身——红色荒原、无尽的距离、烈日下的牧场，摄影是它的一大卖点。人物动机都很直白，看的是冲突怎么升级。适合喜欢《黄石》那种家族与土地题材的观众，这部澳大利亚版更野一些。｜TMDB 6.9"
