  description: "【第 1 季 · 共 9 集】《政盗鲁邦》是一部以政界为舞台的日式怪盗题材剧集，设定在一个虚构国家。被称为史上最强女鲁邦的怪盗如月弥生（石原里美 饰）盯上的不是富豪的珠宝，而是潜流涌动的权力场上那些见不得光的政治黑金。她潜入暗流涌动的政坛，与精英议员们斗智斗勇，把一笔笔运作不端的资金华丽夺走、一网打尽。另一条主线上，深陷政坛风波的政客之女雅（河合优实 饰）与弥生相遇，两人之间并非简单的敌友关系，而是在对立中互相吸引，展开一段微妙且充满变数的女性情谊。剧集融合剧情与犯罪两种类型底色，重心不在缉凶与定罪，而在呈现正义的灰色地带与智力博弈的娱乐性，节奏明快，适合喜欢高智商犯罪戏的观众。｜TMDB 7.0"
