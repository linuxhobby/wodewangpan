  baidu_code: "47gi"
  description: "【第 1 季 · 共 24 集】一桩隔了十三年的旧案，是这部剧的核心结构：一九九七年没能侦破的特殊杀人案在十三年后重现，手法几乎一模一样。当年一直没抓到凶手的刑警卫峥嵘备受打击，离开了办案一线；那时刚入行的新人陆行知已经磨成心思缜密的骨干。案件的重重巧合把师徒二人重新拉到一起。二十四集的篇幅里，一半是查案，一半是两个时代警察的对照——从走访摸排到技术手段的变化，被写进了办案方式里。十三年间技术手段在变，办案要面对的人情阻力却一点没变。剧集对九十年代的复原很用心：街道、服装、办案条件都带着那个年代特有的笨拙，这也是前几集的看点。师徒关系的推进比案件本身更好看，两代人对「什么算办成了案」的理解完全不同，两位主演的对手戏沉稳，撑得住大段文戏。节奏稳，不煽情，属于越看越有味道的那一类。适合喜欢踏实做案头功夫的刑侦剧观众；期待强反转的会觉得它太规矩。｜TMDB 7.8"
