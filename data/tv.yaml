  baidu_code: "ylx5"
  description: "【全剧 3 季 · 共 23 集】这是加拿大制作的犯罪悬疑剧：一名纽芬兰的警察因为揭露了政客的腐败，被变相发配到法属圣皮埃尔和密克隆群岛——大西洋上属于法国的一小块领土。在这里他被迫与一位办案风格完全相反的当地警官搭档，两人一边互相看不惯，一边处理这座看起来像度假地的岛屿底下的重案。田园风光与冷案的组合是它最特别的地方：明信片一样的海岸线底下埋着真正的暴力。被发配这件事本身就是它的潜台词——说实话的人要付代价，这个主题一直没放下。两位主角办案风格的碰撞贡献了不少摩擦与笑点，一个讲流程，一个凭直觉，磨合的过程本身就有看头。岛上法式与北美两种习惯交错，语言、饮食和办事规矩都制造了摩擦。岛屿的封闭感让案件无处可躲，熟人社会的包庇比证据更难对付。案件本身写得扎实，不是靠风光撑起来的。适合喜欢地域感强的犯罪剧、看重搭档之间从互怼到默契这条线的观众。｜TMDB 5.8"
