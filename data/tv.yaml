- id: tv-081
  title: "平原上的摩西"
  category: 电视剧
  tags: ["电视剧", "剧情", "犯罪", "悬疑"]
  quark_url: "https://pan.quark.cn/s/826fe76b46d8"
  baidu_url: "https://pan.baidu.com/s/1xXer_UyC6KJ4uwzMLd5Qww"
  baidu_code: "8wc1"
  description: "【第 1 季 · 共 6 集】改编自双雪涛的同名小说，从一起出租车司机被杀案起笔：叛逆少年庄树长大后成了刑警，接手调查七年前的旧案，线索却一点点指向童年时给自己留下美好记忆的邻家父女。全季只有六集，篇幅很短，气质是文学改编里少见的克制——大雪、废弃工厂、久远的下岗潮，都成了案情的一部分，而不是氛围装饰。它的推进靠的是记忆而不是线索，人物在不同时间层里来回出现，需要一点耐心才能拼齐。镜头语言偏静，长镜头和空镜用得多，北方的冬天被拍得又冷又干净。下岗潮那一段被写进了人物的命运里，不是怀旧，而是解释他们为什么会变成现在这样。六集的体量反而成了优点，没有注水，每一场都有用。适合读过原著、或者喜欢《漫长的季节》那种时代氛围的观众；指望快节奏破案的话不适用，因为答案早就藏在人物的处境里了。｜TMDB 7.5"
  date: 2023-01-16
  added: 2026-10-05
  image: tv-081.jpg


- id: tv-082
  title: "除恶"
  category: 电视剧
  tags: ["电视剧", "犯罪", "悬疑"]
  quark_url: "https://pan.quark.cn/s/24187400687b"
  baidu_url: "https://pan.baidu.com/s/1Au9yaJcPkhRGht65rhWLsQ"
  baidu_code: "wv5p"
  description: "【第 1 季 · 共 16 集】一个偏僻闭塞的沿海小镇，被一袋消失的毒品打破了沉寂。故事跟着几条线同时展开：意外卷进毒品交易现场的女刑警、为救女儿不计代价的普通父亲、一心想逃离小镇的年轻人，还有被毒品拖着走的一对姐弟。他们的处境各不相同，却被同一件事拽到一起——欲望和贪念织成的网细密地困住每一个人，没人能全身而退。十六集的气质偏冷，海边小镇的封闭感被拍得很实，熟人社会里的互相包庇比外来威胁更棘手。它不把毒品写成抽象的恶，而是写它怎么一点点渗进一个地方的日常。几种人的困境各不相同，但都被逼到同一个窄口上，谁也没有更好的选择。几位主演的表演都往内收，一个在职责里挣扎，一个在底线外狂奔。节奏不算快，但几条线收拢时的力道足。十六集看下来会觉得沉，但人物写得实在。适合喜欢群像犯罪剧、能接受压抑基调的观众；对暴力场面有一定尺度，敏感者留意。｜TMDB 7.8"
  date: 2026-02-23
  added: 2026-10-05
