  baidu_code: "u81c"
  description: "【全剧 10 季 · 共 218 集】上了联邦调查局通缉名单几十年的传奇罪犯雷蒙德·雷丁顿，某天自己走进大楼投案，说愿意交出一串更危险的名字，唯一的条件是指定刚入职的菜鸟探员莉兹当他的联络人。为什么偏偏是她，这个答案被拖了整整十季。全剧二百多集，以单元案为主，每集基本解决一个黑名单上的名字，主线则一点点往外渗。每集登场的罪犯各有各的活法，不少单集的质量相当能打，主线则靠人物关系维系而不是靠线索。最大的魅力来自雷丁顿这个人物本身——他优雅、博学、随时能讲一段掌故，把整部剧的气质都带起来了。单元结构也意味着可以随时从任何一季切入，不必从头补起，追起来没有心理负担。想看严密连贯的长线叙事会有些挫败，但把它当成一部「每周认识一个新罪犯」的剧会轻松很多。适合喜欢一头个性鲜明的角色撑起全局的观众；受不了反复吊胃口的话，中段会有点考验耐心。｜TMDB 7.6"
