  description: "【第 1 季 · 共 8 集】2026 年上线的律政题材剧集，原名 WAR，故事设在伦敦，两家顶级律所因为一桩轰动全城的离婚案正面相撞。这场官司的筹码远不止输赢：巨额财产、公众声望与合伙人之间的权力洗牌，全都被押在案卷上。两边各派主力应战，法庭内外针锋相对，谈判桌上每一次让步背后都藏着算计，取证、挖旧账、策反证人，手段一层比一层深。剧作重点不在推理破案，而在人与人之间的博弈：野心家借案子往上爬，老江湖一面保住体面一面暗中布局，年轻律师则要在立场与良知之间选边站。案件越滚越大，原本的职业较量逐渐烧成私人恩怨，结盟与背叛反复洗牌，没有谁完全干净。节奏偏快，几乎一集一个新转折，八集的体量刚好讲完一个完整战场。喜欢精英职场剧、看人物过招多过看动作场面的观众，值得排在片单靠前的位置。｜TMDB 8.0"
