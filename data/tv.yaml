  baidu_code: "x5s6"
  description: "【第 1 季 · 共 16 集】这部韩剧从一场空难起笔：特技演员车达建的侄子死于飞机失事，他不相信这只是一次意外，一路追查下去，撞进了军火贸易与政商勾结的漩涡；追查过程中遇见秘密特工高海丽，两人从互相利用到一起把真相挖出来。十六集的制作规格在当时的韩剧里算高的——跨国取景、大量实拍动作、机舱和航线的戏都做得扎实，动作场面不用替身糊弄。反派不是脸谱化的坏人，他们的算计有清晰的商业逻辑，这让对抗更有分量。空难家属这条线写得很重，几个家庭的悲痛没有被当成背景。感情线与悬疑主线并行，前半程铺得略长，后半程发力明显，撑过前几集之后节奏会快起来。它把个人丧亲之痛和大范围的利益网络接在一起，落点始终在「为什么没人肯说实话」。想看点大制作的韩式动作悬疑，这部够规格。适合喜欢动作与悬疑混着言情看的观众；只想看紧凑谍战的会觉得感情戏占的比重偏大。｜TMDB 8.3"
