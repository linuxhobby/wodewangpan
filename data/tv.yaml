  description: "【第 1 季 · 共 11 集】开场是十年前的一桩旧案：当时还是孩子的异罗目睹了叔叔的死亡，多年后她成为犯罪侧写师回到这座城，目的只有一个——弄清楚那天发生了什么。重案组刑警瀚泉则认为她本身就是疑点最大的嫌疑人。第一块拼图在十年后送来，同样的作案手法重新出现，两人被迫合作阻止下一桩。十一集的线索铺得很细，拼图既是作案手法也是叙事结构——每集给出一小块，最后才看到全貌。侧写这条线让它区别于一般刑侦剧：重点不只在谁做的，而在为什么会以这种方式做。每块拼图都对应着一段被藏起来的关系，拼到最后人物的动机才完整浮出来。两位主角从互相怀疑到被迫协作，推进得慢但合理。时间线在十年前后反复切换，童年段落的分量不轻，小时候的证词和成年后的判断互相打架，这也是全剧最不安的地方。适合喜欢慢工出细活、能忍受线索一点点给的观众。｜TMDB 7.9"
