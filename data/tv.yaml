  description: "【第 1 季 · 共 14 集】改编自同名网络漫画，设定本身就带着反差：一位有着普通职场身份的妈妈，真实身份是从未被生活磨掉的杀手，她要在接送孩子、应付家长会和那些不能说的任务之间维持平衡。十四集走的是动作掺家庭喜剧的路线——一边执行任务，一边处理家里的鸡毛蒜皮，两种画风切换得很熟练。看点在两头：一部分是干净利落的动作场面，另一部分是她怎么把两种完全不同的生活勉强糊住，以及秘密被身边人逼近时的手忙脚乱。母女关系是全剧最动人的部分：她越想保护女儿，就越得说谎。职场身份这条线没有被浪费，办公室的琐碎和任务的紧张互相打断，笑点由此而来。它最有趣的地方在于，家庭里的难题并不比任务好解决，家长会的压力有时比对手更实在。动作戏编排得利落，不靠血腥取胜。适合想看点轻松、不太压抑的动作喜剧的观众；期待严肃谍战的话，它从设定起就不打算正经。｜TMDB 8.3"
  date: 2026-07-31
  added: 2026-08-24
  image: tv-003.jpg

