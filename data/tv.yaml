  description: "【第 7 季 · 共 7 集 · 全剧 8 季】第七季于 2017 年播出，全季 7 集，此时剧情已越过已出版的原著，编剧在原作者乔治·R·R·马丁参与下大量展开原创情节。三条故事线在本季全面合流：丹妮莉丝携无垢者、多斯拉克大军与三条巨龙终于登陆维斯特洛，提利昂出任她的首相；琼恩·雪诺巩固北境统治后南下，与龙母从试探走向结盟；占据铁王座的瑟曦四处拉拢盟友，把佣兵黄金团收入麾下。本季看点在于各方力量的此消彼长：龙焰焚毁兰尼斯特辎重，巨龙第一次被巨弩射落，一支小队远征塞北捕捉异鬼，换来人类与死神的正面对决；夜王的死人军团撞塌长城，剧终一幕宣告维斯特洛最寒冷的冬天正式到来。全季篇幅虽短，制作规格与场面规模却是系列之最。HBO 出品，本目录为第 7 季全集，1080p 蓝光压制，内封简繁英字幕。｜TMDB 8.2"
