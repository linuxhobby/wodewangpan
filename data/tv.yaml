  description: "【第 1 季 · 共 40 集 · 全剧 1 季】赵本山时隔多年重回荧屏担纲的民国群像喜剧，由腾讯视频出品，王小利分饰王老五与马德兵两角，蒋依杉、葛珊珊、程野等喜剧演员共同坐镇。故事发生在民国年间的伏虎县：硬派军人马德兵受督军委派赴任县长，庆功宴上却被日本特工毒害，生死未卜；兽医贾归田的外甥孙子王老五与他容貌酷似，被仓促抓来顶替这桩杀头的差事，三天之内必须走马上任。委任状半路被土匪劫走、寻人启事被爆改成通缉令、献给日军的地图阴差阳错混进包裹，一桩接一桩的乌龙把小人物一步步推向县公署的刀尖。他先是连自身安危都护不住，继而硬着头皮整顿税收、收拾地方豪强，在乱世里一路披荆斩棘。剧集以荒诞喜剧的壳讲小人物的成长，40 集每集 28 到 33 分钟，2026 年 11 月 2 日开播仍在更新，笑点密而不吵，适合轻松下饭。｜TMDB 9.0"
