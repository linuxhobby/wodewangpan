  description: "【第 1 季 · 共 10 集】主角韩东洙是那种替人跑腿的边缘律师，日常勉强糊口。一次意外让他被黑社会出身的徐道英套住，被迫去给赌博网站做设计——没想到他在这件事上表现出了连自己都没见过的本事，也第一次看清了自己心里那点野心。十集看的是一个老实人怎么一点点往下滑，却不觉得羞耻：每一次妥协都有具体的理由，每一次得手都让他更相信自己选对了。申河均把那种从畏缩到从容的转变演得很细，人物不是变坏，是找到了自己擅长的事。赌博网站这条线提供了具体的行业细节，不是抽象的犯罪背景。他每拿到更多钱，就离原来的生活更远一步，这种位移被拍得很清楚。它不靠突然的转折，而是让变化发生在日常选择里，也不给主角安排良心发现的机会。节奏稳，没有强行制造高潮。适合喜欢「一步步黑化」叙事的观众；两位主演的对手戏撑起了大半场子。｜TMDB 8.0"
