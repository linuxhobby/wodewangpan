  description: "【第 1 季 · 共 24 集】这是一部把骗局当武器使的复仇题材悬疑剧，2026 年 9 月 24 日开播。故事的核心设定很有张力：上官诚明的全家被一个叫天相派的组织设局害得家破人亡，而对方用的手法不是刀枪，是骗局。正常的路子讨不回公道，他索性钻进敌人的逻辑里：隐姓埋名潜伏下来，让自己变成局中人，再用一个个精心设计的连环骗局，把当年加害者惯用的手段原样奉还。剧情走双线互咬的路子，明线是他一步一步逼近天相派的核心，暗线则是骗局背后那张控制人心的网，受害者被套牢、被洗脑、被当成工具，等回过神来早已抽不了身。随着复仇推进，骗术行当的黑幕被一层层揭开，观众跟着主角一起拆解每一场局的机关，也看着他在以恶制恶和守住善念之间反复拉扯。全剧 24 集，节奏偏快，每段骗局自成一个小局，又共同服务于最后的总反杀，结局落在瓦解天相派、解救被困之人上，惩恶扬善的落点很正。喜欢悬疑复仇题材，想看骗子反被骗子治的观众，这部值得追完。｜TMDB 6.8"
