  description: "【第 1 季 · 共 12 集】开设定得很乐：三个当年各自呼风唤雨的男人，因为十年前的一场事件集体跌到底——国情院的特工躲在岛上当中餐厅主厨，朝鲜间谍失忆之后成了洗车行里最好欺负的那个人，黑帮二把手则开着便利店天天跟邻居寒暄。他们以为日子就这么过下去了，直到尘封的旧事重新浮上来，三个带着一身旧伤的中年人只好再次披挂上阵。十二集的篇幅里动作和喜剧各占一半，笑点主要在身份落差上：一群曾经狠角色的人，现在要为房租和邻居的脸色发愁。三人凑到一起时的化学反应是最大看点，各自的老本事一点点回来，过程热闹。三人各自的旧身份在关键时刻陆续显形，观众会被不断提醒他们曾经是什么人。动作戏拍得利落，年纪带来的体能劣势没有被藏起来，反而成了设计的一部分。情节不必较真，看的是热闹和那点中年人的不甘。适合想看点轻松、又不太纠结逻辑的观众。｜TMDB 6.3"
