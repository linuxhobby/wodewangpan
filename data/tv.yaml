  description: "【第 1 季 · 共 8 集】故事发生在费城：一对交情很深的朋友想出了自以为万无一失的发财路——假扮缉毒局探员去抢那些不敢报警的小毒贩。这个计划在选错目标那天彻底失控，他们捅到了大型贩毒集团，从此由劫掠者变成被追杀的对象。八集的紧张感主要来自不断升级的处境：每一次想收手，都会被新的麻烦拖得更深。它更像一部被逼到墙角的犯罪惊悚剧，而不是爽快的劫案片，笑料很少，压力很实。两人之间被压力磨出来的裂纹，和外部的追杀一样重要——友情在钱和风险面前并不坚固，但也不是说断就断。他们每次决定再干一票，理由都听起来很充分，这也是最让人揪心的地方。剧集对费城的街区拍得具体，不是那种光鲜的都市背景，而是真正的生活现场。节奏紧凑，一集接一集，几乎没有喘息。适合喜欢那种「一步错步步错」叙事的观众；想看成功劫案的会觉得它全程都在收拾烂摊子。｜TMDB 6.5"
