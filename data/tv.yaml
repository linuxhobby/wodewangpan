  description: "【第 1 季 · 共 8 集 · 全剧 2 季】《异能研究所》改编自史蒂芬·金的同名畅销小说，由《迷失》导演杰克·本德执导、《大小谎言》编剧大卫·E·凯利执笔，是一部把悬疑与超自然能力揉在一起的科幻惊悚剧。故事从十二岁的男孩卢克开始，他在一个夜里醒来，发现自己离开了熟悉的家，被关进一座名叫研究院的隐秘设施。和他一起被囚的，是几个同样拥有念力或读心天赋的孩子。机构以科学研究为名，日复一日地测试并榨取这些少年大脑里的异能，同时切断他们与外界的一切联系。卢克慢慢拼凑出这座建筑深处的真相，也意识到自己并不是第一个、也不会是被困的最后一个。他借助残存的对外联系，与同伴一点点策划逃脱，并试图带设施里其他孩子一起离开。全剧以孩子对抗成人世界的黑暗为主线，延续了史蒂芬·金作品里成长、恐惧与友情相互缠绕的底色，节奏紧凑、悬念层层递进。第一季共八集。｜TMDB 7.5"
