  description: "【全剧 3 季 · 共 20 集】舞台是西德克萨斯一座因为油井而暴富的小镇：一边是踩着钻井架、拿命换钱的基层工人，一边是敢赌敢下注的亿万富翁，两种人一起推动了这场足以改写经济乃至地缘格局的繁荣。它的写法是把宏观议题塞回具体的人身上——每个人都只是在为自己多挣一点，合起来却像一列刹不住的车。剧集对工人群体写得不敷衍：事故、债务、家庭破裂都摆在台面上，不是浪漫化的硬汉形象。几条线并行推进，家族、资本和地方政治互相牵扯，需要一点耐心理清关系。油价、贷款和土地租约这些枯燥的东西，被写成了决定人物命运的具体变量。全剧节奏不快，人物群像铺得开，荒原上的井架和烈日几乎占了叙事的一半。德州口音、尘土和卡车电台构成了很强的地域质感。适合《黄石》《亿万》那类题材爱好者；想要紧凑商战对抗的话，它花在日常和风景上的时间会超出预期。｜TMDB 8.2"
