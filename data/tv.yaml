  baidu_code: "sj8n"
  description: "【第 1 季 · 共 8 集】类型混搭得很跳：赏金猎人哈布·哈罗兰被人干掉之后，被魔鬼复活，条件是替地狱去抓那些越狱逃出来的恶魔。他因此得以回家——那群跟他并不亲近的家人既是帮手也是拖累；而在一次次追猎之中，他逐渐弄清自己的灵魂为什么会在地狱的名单上。八集的篇幅里血腥场面和乡村公路的幽默混在一起，看点多在这份不协调感：上一秒还在讲地狱的规矩，下一秒就是一家人坐在厨房里拌嘴。它真正有意思的地方在于把超自然设定放进了一个再普通不过的南方家庭，荒诞和家常彼此冲撞，谁也不让谁。主角的处境也提供了持续的动力——他不是英雄，只是想弄清楚自己为什么会被带走，这条路越走越不好笑。动作戏拍得干脆，怪物造型带着刻意的粗糙感，和整体的调性是一致的。几段乡村音乐插曲意外地好听，算是额外的彩蛋。整体轻松，不必做任何功课就能看进去。适合能接受暗黑搞怪风格的观众；期待严肃恐怖的话会觉得它太闹。｜TMDB 7.2"
