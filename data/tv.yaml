  description: "【全剧 2 季 · 共 11 集】盖·里奇把那位著名侦探拉回他还没成名的年纪：那时的福尔摩斯血气方刚、嘴上没把门，推理的天分已经有了，判断力却还欠火候，常常因为自负付出代价。这个设定最大的好处是让角色有了犯错的空间——他不是在展示聪明，而是在学怎么聪明。全剧兼顾动作与推理，画面和剪辑都带着导演标志性的利落劲儿，探案过程不走坐下来讲解的路线，线索基本靠跑、靠打、靠现场观察串起来。维多利亚时代的街景和打斗调度都下了功夫，视觉上比一般侦探剧热闹得多。案件本身不算复杂，看的是他怎么从一堆不相干的细节里拽出线头。篇幅只有十一集，追起来没有负担，年轻演员之间的化学反应也不错，配角不是纯背景板。适合既喜欢推理题材、又受不了纯文戏的观众；如果你是原著考据派，可能会觉得这个版本相当大胆，当作少年冒险来看会很愉快。｜TMDB 7.8"
