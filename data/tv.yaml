  description: "【全剧 2 季 · 共 12 集】故事以圣诞节的伦敦为背景，讲的是一个关于友情与牺牲的故事。主角海伦表面上是机灵、务实又刻苦耐劳的妻子和母亲，实为深不可测的职业间谍。她的丈夫身在政界，十年来她持续将丈夫的秘密泄露给她效命的神秘组织。海伦的地下情人遇刺身亡后，难以捉摸的上司为了保她平安，找来她的老友山姆协助。两人一起执行任务，调查凶手与动机，却揭露出盘根错节的庞大阴谋——原来见不得光的伦敦地下世界，竟与迫在眉睫的地缘政治危机有所牵扯。节奏紧凑，几乎不留空隙。圣诞节的伦敦本该是团圆的背景，被用来反衬地下世界的冷，这个对比很有效。海伦与丈夫之间的日常戏份是隐藏的张力来源，最亲的人恰恰是最不能说真话的人。它最抓人的地方在于她的双重处境：每一次对家人的隐瞒都在累积代价。适合喜欢谍战题材、看重人物关系而不是单纯任务推进的观众。｜TMDB 7.0"
