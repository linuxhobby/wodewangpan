- id: tv-093
  title: "仿生人间"
  category: 电视剧
  tags: ["电视剧", "剧情", "犯罪", "悬疑", "Sci-Fi & Fantasy"]
  quark_url: "https://pan.quark.cn/s/4c8ed18673da"
  baidu_url: "https://pan.baidu.com/s/10BcYcqMY8iJSLf87YO6lEA"
  baidu_code: "oemh"
  description: "【第 1 季 · 共 12 集】设定落在仿生人已经跟真人难以分辨的近未来：技术成熟了，公众的不安却越积越厚，于是有了专门处理仿生人相关案件的「明眸」组织。程诺冷静、只认证据，安秋更善于共情、习惯先看见对方是什么人，一个用数据说话一个凭直觉判断，凑在一起查接连发生的仿生人被害案。查得越深越发现，被改写的也许不只是机器人的命运，还有人给自己编的那套说法。「明眸」内部也不是铁板一块，仿生人究竟该算人还是算物，这道分歧贯穿始终。十二集的体量让它在悬疑推进之外留出了讨论空间：当「像人」和「是人」的界线失效，我们要用什么标准对待彼此。案件之外，它也在问人凭什么认定自己是人。画面和美术偏冷色调，工业感强，与它讨论的主题是契合的。不需要补任何前置设定，剧集把世界观交代得清楚，直接从第一集进入也不费劲。科幻只是外壳，落点始终是人。适合喜欢轻科幻加悬疑的观众。｜TMDB 6.5"
  date: 2023-10-18
  added: 2026-10-05
  image: tv-093.jpg


- id: tv-094
  title: "昨夜将至"
  category: 电视剧
  tags: ["电视剧", "悬疑", "剧情"]
  quark_url: "https://pan.quark.cn/s/c647876dc3b6"
  baidu_url: "https://pan.baidu.com/s/1uHBmFJz9mHNjF1ezDpbY-g"
  baidu_code: "rzmt"
  description: "【第 1 季 · 共 12 集】川渝小城老街，面馆老板韩栋（佟大为 饰）与妻子林美月（王佳佳 饰）看似安稳平淡的日常之下，各自背负着二十年无法见光的秘密。\n　　林美月本名李荣珍，年轻时在孙家掌控的夜场谋生，长期遭受羞辱与压榨。不堪屈辱后她策划假死，改名换姓嫁给韩栋，只想彻底埋葬过去。然而，昔日姐妹玲姐（马苏 饰）手握她当年的证据找上门来勒索，扬言要曝光她的黑历史、毁掉她的家庭。\n　　韩栋心底同样压着二十年的愧疚——当年高中同学赵晓琪（葛鑫怡 饰）遭富二代孙海涛（任重 饰）侵害后跳楼自杀。他知情真相，却因母亲（田岷 饰）急需骨髓配型、畏惧孙家权势选择沉默。如今孙海涛已是当地灰色富商，偶然发现韩栋的秘密后以此要挟，步步紧逼。\n　　夫妻二人双双被逼至绝境。林美月找到当年夜场相依为命的姐妹阿妹（江疏影 饰）联手；韩栋也终于不再逃避，决定与妻子一同搜集孙家罪证。为拿到证据，两人多次实施越界行为。最终孙家罪行被警方彻查，孙海涛及其家族骨干全部落网。韩栋与林美月却因过往的过错与反击中的过界行为，双双入狱服刑。｜TMDB 8"
  date: 2026-06-24
  added: 2026-10-05
  image: tv-094.jpg


- id: tv-095
  title: "回来的女儿"
  category: 电视剧
  tags: ["电视剧", "剧情", "犯罪", "悬疑", "家庭"]
  quark_url: "https://pan.quark.cn/s/0f7dcef07163"
  baidu_url: "https://pan.baidu.com/s/1QtCL0BYemLfZtE5IzGjPYQ"
  baidu_code: "05d5"
  description: "【第 1 季 · 共 12 集】九十年代的小镇潭岭，是这部剧最重要的舞台：街道、录像厅、家属院都被拍得很具体，那种熟人社会的气氛几乎从第一个镜头就立住了。孤女陈佑希为了寻找失踪的好姐妹，冒用李家多年前走丢的女儿这个身份，闯进了李家的生活。她被这个家的温暖包围，慢慢放下戒备，直到发现那份温暖底下压着谎言、阴谋和死亡——而她自己也已经站在险地中央。李家内部的权责关系写得很细：谁说了算、谁在忍、谁在装糊涂，都有迹可循。十二集的篇幅里悬疑和家庭伦理缠得很紧，越往后越让人不敢信任眼前的和睦，也很难不替陈佑希捏把汗。剧集在「外来者视角」上做得聪明：观众跟着她一起被接纳、一起起疑，代入感很强。结尾几集信息量集中，前面铺的细节都会回收。适合喜欢把秘密藏在家庭内部那一类悬疑剧的观众；基调沉，不适合想轻松下饭的人。｜TMDB 6.9"
