  description: "【第 2 季 · 共 3 集 · 全剧 2 季】《法警小队》是《黄石》的衍生剧，主角凯西·达顿离开牧场后加入了美国法警队，把军旅生涯里练出来的那套本事和牛仔出身的老底子，一并带到蒙大拿的执法一线。这个设定在第二季里继续展开：追逃、押送、跨州捉人是法警队的正经活儿，荒野、公路和小镇构成了剧的主要画面，州界之内要抓的人，往往比案卷上写的更难对付。工作带来的精神压力始终是这条线的底色，家事和公事在凯西身上分不开，这也是他区别于一般罪案剧主角的地方：他不是在办案，他是在办案的同时想办法把自己撑住。本剧整体节奏偏稳，不喜欢快剪快切的观众反而容易入戏；荒野和公路的镜头占比很大，摄影和配乐都延续了《黄石》的味道。本季官方登记为 3 集，体量不长，适合补完第一季之后接着看；直接从本季入场的观众也能看懂案子本身，只是人物关系的分量会轻一些。｜TMDB 7.9"
