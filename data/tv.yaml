  description: "【第 8 季 · 共 6 集 · 全剧 8 季】第八季是全剧终章，于 2019 年播出，全季 6 集。北境迎来决战：人类残存的军队与野人部队在临冬城并肩布防，迎击夜王的死人军团，「长夜之战」一集以近一小时的持续夜战成为美剧史上规模最大的战场戏之一，艾莉亚完成对夜王的致命一击，长城以北的威胁就此终结。胜利的代价惨重，丹妮莉丝随后挟巨龙西进，在君临做出屠城的决定，与琼恩之间的身世之争也随之摊牌：铁王座的归属、坦格利安血脉的正义与疯狂，在最终集有了答案。这一季口碑虽呈两极，但临冬城大战与君临焚城的制作规格仍属电视工业的巅峰水准，横扫八年的史诗随之落下帷幕。HBO 出品，改编自乔治·R·R·马丁的小说《冰与火之歌》，本目录为第 8 季全集，1080p 蓝光压制，内封简繁英字幕。｜TMDB 6.2"
