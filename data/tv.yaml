  baidu_code: "i1ic"
  description: "【全剧 2 季 · 共 18 集】时间点放在一九四六年：美国队长离开之后，佩吉·卡特留在战略科学储备局做着不被当回事的工作，一边偷偷替霍华德·斯塔克洗刷被陷害的罪名，一边应付那个年代对女性同事最直白的轻视。它属于漫威影视里气质偏复古的一部——服化道讲究，动作戏干净，整体是轻快的谍片节奏，没有灭世危机要处理。她身边那位管家型的搭档是很好的调剂，两人的配合默契又有分寸。剧集真正写的不是任务，而是一个人在不被需要的环境里怎么坚持把事做对，那句「我可以自己来」不是口号而是日常。反派的设定也不脸谱，动机有自己的道理，这让对抗更值得看。动作戏讲究的是干净，没有夸张的慢镜头，打完就走。全剧两季共十八集，篇幅短，没有后续拖沓的负担，整体气质轻快，适合周末放松看。适合喜欢二战后谍战氛围的观众，以及对「女性在一个不需要她的环境里证明自己」这条线有共鸣的人。｜TMDB 7.5"
