  baidu_code: "5jnb"
  description: "【第 1 季 · 共 6 集】改编自真实事件，故事落点在南美：一个再普通不过的企业主，被卷进协助韩国政府执行机密任务的局里，目标是抓捕藏在苏里南的一名韩国籍大毒枭。全剧六集，篇幅不长，异国取景的氛围是它最不一样的地方——湿热的气候、关系盘根错节的侨民圈子、谁也不完全信谁的谈判，都不是韩剧常见的背景。节奏偏稳，戏剧冲突主要靠两边人物的互相试探推进，每一次见面都像是摸底。毒枭那边也不是被动等待，他同样在试探来人的底细，两边都在演。主角不是职业特工，他的笨拙和犹豫反而让这场卧底显得更危险。当地政商势力的纠缠被写得很具体，不是靠几句台词交代清楚的背景。六集的体量让它没有注水，对那段背景不熟也不影响观看。适合喜欢真实事件改编、以及想看韩国影视里少见题材的观众；期待紧凑动作场面的话，它的力气主要花在谈判和周旋上。｜TMDB 7.7"
