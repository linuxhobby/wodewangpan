  baidu_pwd: "8p01"
  description: "【全剧 6 季 · 共 36 集】故事讲的是战后伯明翰地区传奇黑帮家族的故事。时间要追溯到一九一九年，家族成员有一大嗜好，就是将剃刀刀片缝进帽子的帽檐之间，这也是这个帮派名称的由来。家族兄弟的领袖汤米是一个残酷的黑帮分子，嗜血无情，却也是那个时代里少数看得清局势的人。在那个年代，退伍军人、革命者和罪犯都在社会底层挣扎求生，而贝尔法斯特的警方负责人介入之后，汤米和他的势力制造出的恐怖统治开始倾斜。六季三十六集的篇幅里，家族的生意从街头一步步做到议会，对手也从地痞变成了国家机器。汤米这个角色的魅力在于他既冷酷又清醒，每一次暴力都是算过账的。服化道和配乐是它的招牌，剪裁讲究的西装和工业城市的烟尘构成了强烈反差，现代摇滚配上二十年代的街道意外地合拍。适合喜欢家族黑帮史诗、能接受慢节奏铺陈的观众。｜TMDB 8.5"
