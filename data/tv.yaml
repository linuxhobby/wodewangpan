  quark_url: "https://pan.quark.cn/s/029d139672a7"
  baidu_url: "https://pan.baidu.com/s/15XaVAe3BCa6hG0wQa-AeGQ"
  baidu_code: "kuwj"
  description: "【第 1 季 · 共 12 集】大学实验室是这部剧不太常见的舞台：民宰曾是游泳选手，因病失去一条腿之后转到学术路上，如今是博士生；宥真走过一段迷路的日子，重新出发成为硕士生。两个都带着旧伤的人，在一间冷冰冰的机器人实验室里慢慢靠近，从互相别扭到一起认真谈一场恋爱。两个人都不太擅长开口，于是误会和靠近几乎是同时发生的。十二集的基调是苦甜交织的轻喜剧，不靠撕扯和误会推进，而是把力气花在两个人怎么相处上——谁先开口、怎么接受帮助、什么时候该退一步。整体没有狗血桥段，靠的是分寸感。剧集对身体障碍的处理相当克制，没有把它写成需要被治愈的缺陷，而是生活的一部分。实验室里的道具和日常细节增加了真实感，看得出是认真搭过的场景。想找一部不制造焦虑的爱情剧，这部是稳妥的选择。适合想看点温柔、想把「两个受过伤的人怎么互相照顾」看仔细的观众；期待强情节的人会觉得它太淡。｜TMDB 10.0"
  date: 2026-10-05
