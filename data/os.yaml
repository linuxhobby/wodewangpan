- id: os-003
  title: "Fedora 44 Workstation"
  category: 操作系统
  tags: ["操作系统", "Linux", "Fedora", "Workstation", "x86_64", "Fedora 44 Workstation Fedora 44 Workstation"]
  quark_url: "https://pan.quark.cn/s/3644a3c0d76e"
  baidu_url: "https://pan.baidu.com/s/1nTb17FogSFxcvAXmklT31g"
  baidu_code: "lzdm"
  description: "资源是 Fedora 44 Workstation 的官方 Live 镜像，文件名 Fedora-Workstation-Live-44-1.7.x86_64.iso，2026 年 4 月 28 日发布，写入 U 盘后可以直接启动体验或者安装。Fedora 由 Red Hat 赞助，是 RHEL 的上游发行版，红帽的新特性大多先在它身上落地，所以内核、GNOME 与图形栈的版本比 Debian、Ubuntu LTS 新不少。Workstation 版使用接近原生的 GNOME 桌面，默认跑 Wayland 与 PipeWire，只做了少量自家调整，日常办公和开发环境都很顺手。官方仓库只收自由软件，装多媒体解码器、NVIDIA 驱动需要自行添加 RPM Fusion 源。Live 模式的好处是先进入完整桌面看硬件识别情况，满意后再点安装，Anaconda 安装器支持自动分区与手动分区两条路径，双系统也照常处理。需要注意 Fedora 每个版本的支持周期大约 13 个月，到期要滚动升级到新版本。适合想要较新内核与桌面体验，或者给开发环境做上游兼容性验证的用户。｜Fedora Project"
  date: 2026-04-28
  added: "2026-10-09 16:02"
  image: os-003.jpg

- id: os-004
  title: "Debian 13.7"
  category: 操作系统
  tags: ["操作系统", "Linux", "Debian", "trixie", "amd64", "Debian 13.7 Debian 13.7"]
  quark_url: "https://pan.quark.cn/s/50881ca98a54"
  baidu_url: "https://pan.baidu.com/s/1ZDh9W807-oPAr3GQOLTJrg"
  baidu_code: "1tft"
  description: "资源是 Debian 13.7 的 amd64 DVD-1 镜像，目录里目前放的是对应的 torrent 种子文件，用 qBittorrent、Transmission 等任意 BT 客户端打开即可下载完整 ISO。13.7 是代号 trixie 的稳定版在 2026 年 9 月 12 日发布的点版本，主要把安全补丁与关键错误修复打包进来，安装介质随之刷新，已经在用 13.x 的系统正常升级即可，不需要重装。DVD-1 是第一张安装盘，内含安装器、基础系统和常用桌面环境与软件包，断网也能装出一套能用的桌面，缺的包之后再通过 apt 补上。Debian 以稳定、干净、完全由社区治理著称，适合不想频繁折腾的桌面与服务器环境，代价是软件版本偏保守，只求可靠不求新。默认软件源全是自由软件，闭源固件和常见解码器要另外启用 non-free 仓库。｜Debian Project"
  date: 2026-09-12
  added: "2026-10-09 16:01"
  image: os-004.jpg

- id: os-005
  title: "Ubuntu"
  category: 操作系统
  tags: ["操作系统", "Linux", "Ubuntu", "x86_64", "Ubuntu"]
  quark_url: "https://pan.quark.cn/s/4ddc76eaa376"
  baidu_url: "https://pan.baidu.com/s/1yzVOhv4e3_gOcAxXDZWBMw"
  baidu_code: "zw7w"
  description: "这一条目录里目前还没有实际文件，先把位置占住，资源转存进来后会出现在同一个分享里。这里先交代一下 Ubuntu 本身：它由 Canonical 维护，是最流行的 Linux 发行版之一，基于 Debian 的不稳定分支定期冻结发布，每年 4 月与 10 月各出一个版本，其中逢偶数年份的 4 月版是 LTS 长期支持版，提供五年安全更新，普通版本的支持期只有九个月。桌面默认 GNOME，配色、图标与字体做了自家定制，近年的安装器换成了基于 Flutter 的新界面，向导式分区比老版本直观不少。软件侧 snap 与 deb 两套包格式并存，主流开发工具链、服务器组件基本都能直接用 apt 装好，中文文档与社区问答的数量也远多于小众发行版，新手遇到问题比较容易搜到答案。适合第一次接触 Linux，或者需要长期稳定的桌面与服务器环境的用户。｜Canonical"
  date: 2026-10-09
  added: "2026-10-09 16:00"
  image: os-005.jpg


- id: os-006
  title: "openSUSE Tumbleweed"
  category: 操作系统
  tags: ["操作系统", "Linux", "openSUSE", "Tumbleweed", "x86_64", "openSUSE Tumbleweed openSUSE"]
  quark_url: "https://pan.quark.cn/s/8002157040c5"
  baidu_url: "https://pan.baidu.com/s/1UvQztRjnuiQFlJCV5FB0Ig"
  baidu_code: "x83s"
  description: "资源是 openSUSE Tumbleweed 的 DVD 安装镜像，文件名 openSUSE-Tumbleweed-DVD-x86_64-Snapshot20261007-Media.iso，对应 2026 年 10 月 7 日构建的快照，x86_64 架构，约 4.4GB，写入 U 盘即可启动安装或直接体验。Tumbleweed 是 openSUSE 的滚动发行分支，采用经过 openQA 自动化测试的快照持续推送更新，装一次就能一直滚动到最新，不需要隔年重装，软件仓库里的包普遍比传统固定版本发行版新。桌面默认提供 KDE Plasma 与 GNOME 等多种选择，DVD 镜像在安装器里即可切换桌面环境；YaST 控制中心是它最有辨识度的部分，分区、引导、防火墙、软件源都有图形界面可管，对不熟悉命令行的用户相当友好。系统使用 zypper 做包管理，支持 Btrfs 快照配合 Snapper 做系统回滚，升级失手也能退回上一个可用状态。适合想要滚动更新、软件较新，又希望有成熟图形化管理工具的桌面与工作站用户，装好后建议定期滚动更新保持系统处于最新快照。｜openSUSE Project"
  date: 2026-10-07
  added: "2026-10-09 19:41"
  image: os-006.jpg


- id: os-007
  title: "CMCC RAX-3000M OpenWrt 刷机套件"
  category: 操作系统
  tags: ["操作系统", "OpenWrt", "刷机", "CMCC", "RAX-3000M", "CMCC RAX-3000M OpenWrt 刷机套件 CMCC RAX-3000M OpenWrt"]
  quark_url: "https://pan.quark.cn/s/6a6b5b50d3bb"
  description: "这套目录面向中国移动 RAX-3000M 路由器的第三方固件刷机，核心内容是 bl-mt798x 引导程序的 2024 年 11 月 15 日发布版本，另附一个 etc 配置目录。RAX-3000M 搭载联发科 MT7981 方案，是刷机圈里性价比很突出的一台千兆路由，刷入 bl-mt798x 的 U-Boot 之后，可以在不开盖、不接 TTL 线的情况下从路由器管理界面直接刷入 OpenWrt 固件，就算刷坏了也能靠引导程序兜底救回，是公认的稳妥路线。刷成 OpenWrt 之后能解锁完整 SSH、自由安装软件包，旁路由、内网穿透、多拨、无线中继、广告过滤这些原厂固件阉割或缺失的玩法基本都能补回来，可玩性比原厂系统高出一个档次。目录里的 etc 部分是配套的配置文件，动手前建议先备份原厂固件，并确认自己手上的机器是免拆版本，全程照教程走基本不会有风险。适合想给家里路由升级 OpenWrt、折腾软路由玩法但又不想动烙铁的朋友。｜bl-mt798x 项目"
  date: 2024-11-15
  added: "2026-10-23 17:15"
  image: os-007.jpg


- id: os-008
  title: "黑群晖 DS918 刷机套件"
  category: 操作系统
  tags: ["操作系统", "群晖", "DSM", "黑群晖", "DS918", "黑群晖 DS918 刷机套件 Synology DSM Loader"]
  quark_url: "https://pan.quark.cn/s/e9ebba3f88fe"
  description: "这套目录是给黑群晖玩家准备的 DS918 刷机全家桶：核心是 DS918-701-42962.img 引导镜像，对应群晖 DSM 7.1.1（构建号 42962），另附三款在 Windows 上制作刷机盘会用到的工具，分别是检测 U 盘主控的芯片无忧、把镜像写入 U 盘的 Win32DiskImager，以及用来修改镜像内容的 WinImage。黑群晖的思路是用一台普通 PC 或准系统，写入 DS918 的引导镜像伪装成群晖官方机型，再安装 DSM 系统，从而用便宜硬件获得快照、Drive、Photos 等官方套件的完整体验。42962 是 DSM 7.1 系列里维护时间很长的一个稳定构建，兼容性好、资料多，新手遇到问题也容易搜到答案。使用流程大致是：先用芯片无忧确认 U 盘主控，再用 Win32DiskImager 把引导镜像写入 U 盘，需要改 sn 与 mac 时用 WinImage 编辑镜像文件，最后插盘启动安装 DSM 即可。适合手头有闲置主机、想低成本体验群晖系统的用户。｜Synology 社区"
  date: 2022-09-27
  added: "2026-10-23 17:15"
  image: os-008.jpg

