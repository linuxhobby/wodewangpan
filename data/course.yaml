  quark_url: "https://pan.quark.cn/s/41f971cfbf41"
  description: "【视频课 · 配套 PDF 讲义】这是一套按年级和学期切好的初中语文提分体系，主打阅读公式、文言文精讲、作文素材模板与全程陪跑四个核心模块，重方法也重落实。网盘内容按学习阶段分为七个部分：2025秋六升七课程、七升八课程、八升九课程、七上期末复习、八上课程加期末复习、八上期末复习，以及 2026 春的八下期末复习，从小学升初中的衔接一直覆盖到八年级下学期，链条完整。课程不做零散的资料堆砌，而是分专题拆解：名著阅读逐讲精讲《朝花夕拾》《西游记》等重点篇目，梳理情节与考点；文言文从《世说新语》讲到《论语》《诫子书》《狼》，逐篇拆字词、句式与翻译；阅读理解按概括、赏析、人物形象、句段作用、标题作用等题型给答题公式；作文板块覆盖立意、选材与素材模板，直接对应校内考试题型。每讲视频都配 PDF 讲义，可以先看课再做题，也可以直接拿讲义做考前梳理。主讲小蓝老师有多年一线语文培优经验，高考语文 140 分以上，专业成绩第一考入中山大学，教学讲究讲练结合，适合想系统补短板、跟上校内节奏或提前衔接下学期内容的中学生。资源按年级分类存放，路径清晰，转存后即可按阶段使用。｜主讲：小蓝"
  date: 2025-09-01
  added: "2026-10-13 15:38"
  image: cs-001.jpg


- id: cs-002
  title: "职场高手的12堂工作汇报术"
  category: 课程
  tags: ["课程", "职场", "沟通表达", "工作汇报", "向上管理", "职场高手的12堂工作汇报术"]
  quark_url: "https://pan.quark.cn/s/feda0e19ea67"
  description: "【视频课 · 共 13 讲】这是一套专讲工作汇报的职场沟通课，由 CEO 演讲教练贺嘉主讲，先导课加十二堂正课，每集约 25 到 30 分钟。贺嘉曾任腾讯云技术布道者，担任过长江商学院 CEO 班培训导师，也为柳岩、邹市明等做过演讲私教，累计培训过华为、网易、今日头条、中广核等五百强企业的上千位高管，讲的正是怎样把做得好的事说得清楚、讲进领导心里。课程按三大模块推进：第一模块融情认同汇报术，讲汇报前的准备、面对不同性格上级的因人制宜沟通、如何抓住领导布置工作的重点，以及怎样汇报才能给项目争取到人手和预算；第二模块效率倍增汇报术，覆盖两分钟、十分钟、三十分钟三种时长的口头汇报，邮件、微信、PPT 的书面汇报设计，日报月报与项目里程碑的进度汇报，还有项目不顺时如何扭转负面印象；第三模块关键进阶汇报术，落到年终总结怎么写、向高层汇报的要点、如何通过汇报成为团队里不可替代的人，以及竞聘升职的演讲方法。整体偏实操，每课给出可直接套用的结构与话术，适合工作卖力却总得不到认可、汇报平淡不出彩、想在公司争取更多资源，或者正准备年终述职与竞聘的职场人。视频按课序排列，从先导课看到第十二课即可完整跟完。｜主讲：贺嘉"
  date: 2020-03-26
  added: "2026-10-13 15:38"
  image: cs-002.jpg

