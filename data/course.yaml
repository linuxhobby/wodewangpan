  description: "【视频课 · 附提示词资源包】一套面向新手的 AI 漫剧全流程实操课，网盘里包含两套视频讲解与一个创作资源包。视频部分分两个批次：第一批 20 讲从工具介绍与安装、智能体添加、繁星 AI 大模型的使用讲起，依次过掉小说授权获取、剧本创作、人物三视图、背景图、道具图、分镜头、视频提示词，再到用豆包与即梦生成视频、过人脸的三种办法、水印去除、版权与暴力擦边问题的规避、剪映剪辑漫剧、封面制作与视频穿帮后的提示词修改；第二批 17 讲按同样的工序再完整走一遍，讲法更紧凑，适合当作第二遍复习。资源包按用途分成四个目录：漫剧创作指南提示词、AI 漫剧人物提示词、AI 创作指令（大模型通用）以及 AI 漫剧分镜与运镜提示词合集，可以直接改字就用。整门课的思路是把漫剧拆成剧本、角色、场景、分镜、生成、剪辑六个环节，每一讲只解决一个具体问题，配合提示词资源包，从小说或故事文本到成片输出的路径都能对上号，适合想用 AI 工具批量做短剧、漫剧内容的创作者。"
