  description: "【PDF 话术手册 · 共 210 页】一本按场景编排的高情商接话速查手册，网盘里是一份红皮书 PDF，通篇采用问答体：先给一个真实发生的对话场景，再给出一句可以直接照用的参考回话，并附上简短的思路说明。全书按十多个场景分篇，包括一句话高情商话术、夸人篇、回夸篇、领导篇、拒绝领导篇、同事篇、回怼篇、公众讲话篇、送礼篇、社交篇、聊天破冰篇、面试篇与拜年篇，每篇下面再按具体情境编号展开，条目数以百计。随手翻几条就能感受到它的路数：饭局上客人说菜点多了怎么接，公司聚餐大老板问你是哪个部门的怎么接，别人夸你衣服漂亮怎么接，被说反应慢半拍怎么接，每条回话都遵循先接住情绪、再抬对方一手的路子，既不硬顶也不谄媚。手册适合当工具书用，遇到具体场合翻对应篇目即可，也适合通勤时随手读几条积累语感。需要提醒的是，话术只是骨架，真正的分寸感还要在实际使用中打磨。"
