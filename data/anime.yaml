  quark_url: "https://pan.quark.cn/s/dd9c80cb419c"
  baidu_url: "https://pan.baidu.com/s/1QEFnx96CgLSYZqOtqxf23Q"
  baidu_code: "7qzw"
  description: "柯南一行人到横滨参加摩托车庆典——小兰、园子和小五郎，再加上来说话就说话的世良真纯，本该是趟轻松的短途。开场却是一台横冲直撞的神秘「黑色摩托车」：追着它跑的是神奈川县警交通机动队的萩原千速，一个习惯骑着警用摩托在城里追风的女骑手。片子把高速追车和推理拧在一起——一边是贴地的摩托追逐，一边是「黑色堕天使」为何要这样做的原因。公路上的追逐场面不少，是这部剧场版最热闹的部分，镜头贴着地面跑，速度感比前几部做得更足。适合系列粉丝补片；第一次看也能跟得上，案件本身不依赖前作设定，人物关系在片中会顺带交代。摩托元素在这部里占了很大比重，追车戏的调度比推理部分更用心，整体是系列里偏动作向的一部。配音与配乐保持了剧场版一贯的水准，人物之间的互动比案件本身更有看头。｜TMDB 7.4"
  date: 2026-04-10
  added: 2026-10-02
  image: an-001.jpg

- id: an-003
  title: "降世神通：最后的气宗 第一季"
  category: 动漫
  tags: ["动漫", "动作冒险", "Sci-Fi & Fantasy", "剧情", "家庭", "降世神通：最后的气宗 Avatar: The Last Airbender"]
  quark_url: "https://pan.quark.cn/s/e877ff19091c"
  description: "【第 1 季 · 共 8 集 · 全剧 2 季】《降世神通：最后的气宗》是 2024 年 2 月 22 日上线的真人改编剧集，底本来自 2005 年的同名动画。设定上，水、土、火、气四国原本和平共存，各方势力由唯一能精通四种元素之力的神通王来维系平衡，直到烈火国发动攻势、歼灭大气牧族，局势被彻底打破，而这还只是对方征服计划的第一步。更麻烦的是，这一代神通王迟迟没有现身，世界眼看就要陷入绝望，黑暗中亮起了一道光：大气牧族最后的传人还在。第一季共 8 集，全剧合计 2 季 15 集，这一季的任务很明确：让这位避世的少年重新走进战局，一边补齐四种元素的力量，一边接受「神通王」这个名字要承担的东西。作为真人改编，这一版把动画里的设定落成了实拍画面，四个部族的视觉风格区分得相当清楚，人物选角也照顾到了原作的神态。看完这一季可以无缝接第二季，两季加起来体量不大，一个周末就能刷完。｜TMDB 7.8"
  date: 2024-02-22
  added: 2026-10-11
  image: an-003.jpg

- id: an-004
  title: "降世神通：最后的气宗 第二季"
  category: 动漫
  tags: ["动漫", "动作冒险", "Sci-Fi & Fantasy", "剧情", "家庭", "降世神通：最后的气宗 Avatar: The Last Airbender"]
  quark_url: "https://pan.quark.cn/s/4deaf3f569d4"
  description: "【第 2 季 · 共 7 集 · 全剧 2 季】第二季接着第一季的结尾往下推进，篇幅 7 集，比第一季略短，全剧合计 2 季 15 集。核心设定不变：世界由水、土、火、气四个部族构成，能够同时驾驭四种元素的少年被称作神通王，他要在战乱里把尚未掌握的力量逐一补齐。这一季继续沿着少年一行人的旅途往前走，篇幅短了，节奏也就更紧，留给几位同伴的段落依旧不少，队伍之间的相处是串联两季的一条重要线。术法对决依旧是这个系列的招牌，画面延续真人版的路数，水、土、火、气的呈现强调重量与实感。想看完整故事的话建议按顺序从第一季开始，两季的铺垫与承接是连着的；喜欢原版动画的观众也可以把这版当作另一种讲法来看，两部对照着看，还能看出真人改编在节奏与取舍上跟动画版的差别。｜TMDB 7.8"
  date: 2024-02-22
  added: "2026-10-11 12:06"
  image: an-004.jpg

- id: an-005
  title: "哪吒之魔童闹海"
  category: 动漫
  tags: ["动漫", "动画", "动作", "奇幻", "冒险", "哪吒之魔童闹海"]
  quark_url: "https://pan.quark.cn/s/52fda1b6137d"
  description: "动画电影《哪吒之魔童闹海》是 2019 年《哪吒之魔童降世》的正统续篇，由饺子继续执导，2025 年 1 月 29 日大年初一上映。故事紧接前作结尾：天劫之后，哪吒和敖丙的灵魂虽然得以保全，肉身却在天雷中尽毁，两人面临魂飞魄散的绝境。为了救下这对生死与共的少年，太乙真人决定借助七色宝莲为他们重塑肉身，然而重塑过程波折不断，肉身迟迟难以稳定，一场牵动陈塘关、龙族与阐教各方的新危机随之而来。劫后本应迎来新生的哪吒与敖丙，再一次被推到命运的十字路口，一个要为自己争一条活路，一个被家族重任与朋友性命两头拉扯。影片在前作世界观上继续展开，把「我命由我不由天」的命题往前推了一步：成见依旧在，这一次哪吒要对抗的不只是天命，还有借天命行事的局。动作场面全面升级，妖兽大军压境与肉身重塑之战都极具冲击力，笑点与燃点交替推进。该片上映后连破中国影史纪录，登顶中国电影票房榜首，成为国产动画的又一里程碑。｜TMDB 8.2"
  date: 2025-01-29
  added: "2026-10-11 19:55"
  image: an-005.jpg

- id: an-006
  title: "哪吒之魔童降世"
  category: 动漫
  tags: ["动漫", "动画", "奇幻", "冒险", "哪吒之魔童降世"]
  quark_url: "https://pan.quark.cn/s/6e0dcb0fffcc"
  description: "动画电影《哪吒之魔童降世》由饺子自编自导，取材自《封神演义》，2019 年 7 月 26 日上映。天地灵气孕育出一颗能量巨大的混元珠，元始天尊将其炼化为灵珠与魔丸：灵珠转世将肩负重任，魔丸则会孕育出为祸人间的魔王。为除后患，元始天尊施下天劫咒，三年后天雷将至。太乙真人奉命把灵珠托生到陈塘关李靖之子哪吒身上，不料阴差阳错，灵珠与魔丸竟被掉包。本该是灵珠英雄的哪吒，生来就成了众人眼中的魔童，从出生起就被误解与排斥，却始终怀着一颗成为英雄的心。父亲的沉默、母亲的陪伴、百姓的成见与申公豹的暗中作梗，把他的成长步步推向悬崖；唯一把他当朋友的敖丙，身负龙族翻身重担，两人注定要在天劫之下正面相对。面对命中注定的天劫与世人的偏见，哪吒喊出「我命由我不由天」，向自己的命运发起挑战。影片以颠覆式改编重塑经典人物，笑泪交织，上映后口碑票房双收，刷新当时国产动画电影票房纪录，成为国漫崛起的标志性作品。｜TMDB 7.9"
  date: 2019-07-26
  added: "2026-10-11 19:55"
  image: an-006.jpg

- id: an-007
  title: "时光代理人"
  category: 动漫
  tags: ["动漫", "动画", "Sci-Fi & Fantasy", "悬疑"]
  quark_url: "https://pan.quark.cn/s/580431708bac"
  description: "【第 4 季 · 共 12 集 · 全剧 5 季】国产动画《时光代理人》的新一季继续围绕那家门庭冷落的时光照相馆展开。程小时与陆光这对搭档拥有特殊能力：程小时可以在委托指定的时间里进入照片，附身于照片拍摄瞬间的当事人身上，陆光则留在现实一侧为他导航与把关。两人靠着这种能力接下形形色色的委托，替人找回遗物背后的真相、弥补来不及说出口的遗憾，但每一次进入照片都伴随着代价，事情的发展也常常偏离他们的预期。这一季延续了系列最招牌的结构：单元委托负责情感与泪点，贯穿全季的主线负责悬念与收束，前几季埋下的线头会在这里继续接上。画面与配乐依旧在线，悬疑段落的信息量也给得比一般国漫更密。追了几季的观众可以放心续上；如果是新观众，建议从第一季开始，这个故事对观看顺序有要求，直接从中间看会损失很多分量。｜TMDB 8.2"
  date: 2021-04-30
  added: 2026-10-12
  image: an-007.jpg

- id: an-009
  title: "极恶老大"
  category: 动漫
  tags: ["动漫", "动画", "喜剧", "剧情", "极恶老大 Helluva Boss"]
  quark_url: "https://pan.quark.cn/s/bd81459d0522"
  description: "【第 3 季 · 共 7 集 · 全剧 3 季】在地狱的社会金字塔里，小恶魔是阶层最低的那一拨，天生被人踩在脚下，可偏偏有只小恶魔不认命，拉起一支专接暗杀生意的团队，把地狱生意做得风生水起。这一季继续跟着这群不走寻常路的地狱杀手，看他们如何在恶魔贵族、人类客户和彼此的烂摊子之间来回蹦跶。任务一个比一个离谱，笑点与血腥齐飞，职场毒打和亲情羁绊交织，把黑色幽默拍成了地狱版创业喜剧。它用夸张的画风包装的，其实是一群被轻视的小人物如何互相兜底、在糟糕的世界里硬挤出一点温情，反差感正是这个系列最上头的理由。当雇佣关系撞上血缘，当生意遇上真心，这群恶魔反而比许多活人更懂什么叫讲情义。看他们手忙脚乱地顾家顾生意，反倒比正经职场剧更有人情味。一群恶魔讲起情义来，竟比人间更像人间。｜TMDB 7.5"
  date: 2020-10-31
  added: 2026-10-14
  image: an-009.jpg

- id: an-010
  title: "南方公园"
  category: 动漫
  tags: ["动漫", "喜剧", "动画", "南方公园 South Park"]
  quark_url: "https://pan.quark.cn/s/d6c528455321"
  description: "【第 29 季 · 共 6 集 · 全剧 29 季】科罗拉多州南方公园小镇上，斯坦、凯尔、卡特曼和肯尼四个孩子照例是全镇的主角，他们天真又毒舌，总被卷进超自然事件、社会冲突和各种荒诞危机里。这一季延续了招牌式的无厘头，用孩子的眼睛去戳成年人世界里的政治、宗教、文化和社会议题，什么热点都能被它拿来做成一集笑料。四个人的友情在鸡飞狗跳里稳如老狗，卡特曼的作妖、肯尼的死亡循环、斯坦和凯尔的互怼，依旧是每集的定心丸。它能在播出近三十年后还让人追着看，靠的就是那种谁都敢嘲、什么都不当回事的劲儿，把严肃话题揉碎了塞进一集二十分钟的闹剧里。新一季依旧刀刀见血，连自家人都不放过。它从不在乎得罪谁，只管把成年人的伪善摊开，让小孩来戳破。笑过之后回头一想，被它戳中的全是大人们不愿认的账。｜TMDB 8.3"
  date: 1997-08-13
  added: 2026-10-15
  image: an-010.jpg

- id: an-011
  title: "航海王"
  category: 动漫
  tags: ["动漫", "动作冒险", "喜剧", "动画", "航海王 ワンピース"]
  quark_url: "https://pan.quark.cn/s/df77b3919b64"
  description: "【第 23 季 · 共 25 集 · 全剧 23 季】拥有财富、名声、势力，站在世界顶点的海贼王哥尔·D·罗杰，在临刑前留下一句话，把全世界男人都撩得心痒：想要我的财宝吗，想要的话可以全部给你，去找吧，我把所有财宝都放在那里。这句话点燃了大海贼时代，无数男子汉涌向伟大的航路，只为追逐那个传说中的秘宝 One Piece。本季跟着路飞一伙继续破浪，新岛屿、新强敌与更大的谜团接连登场，伙伴之间的羁绊在一次次死战里越烧越旺。它把热血冒险拍成了关于自由与约定的长诗，古怪的角色、夸张的战力和永不停歇的冒险欲，让这部连载多年的国民漫改始终保有最初的冲劲。当草帽团的船驶向更深的未知，关于大秘宝的真相也终于开始松动。路飞那顶草帽底下藏着的，从来不是宝藏，而是一群人绝不松手的约定。｜TMDB 8.8"
  date: 1999-10-20
  added: 2026-10-16
  image: an-011.jpg

- id: an-013
  title: "死神"
  category: 动漫
  tags: ["动漫", "动作冒险", "动画", "Sci-Fi & Fantasy", "死神 BLEACH"]
  quark_url: "https://pan.quark.cn/s/ee85fc50d9f7"
  description: "【第 2 季 · 共 50 集 · 全剧 2 季】高中生黑崎一护意外获得死神之力，从此被拽进现世、尸魂界与虚圈之间绵延不休的纷争里。他本只是个想护住身边人的普通少年，却一次次被推到风暴中心，挥刀对抗吞噬灵魂的虚，也在尸魂界的规矩与偏见中撞得头破血流。这一季里，一护在守护同伴的死战里逐渐揭开自己的身世，那股潜藏的力量与血脉的来处，一点点浮出水面，而他终将迎来决定三界命运的最终决战。作品把热血战斗与青春成长拧在一起，斩魄刀的对撞、羁绊的试炼与失去的代价层层堆叠，让这场跨越现世与彼岸的战斗，始终带着少年意气的滚烫。当斩魄刀的光芒照亮尸魂界的夜，一护也终于弄懂，所谓强大从来不是为了赢，而是为了护住身后的人。虚的咆哮再响，也压不过一个少年为了保护同伴而攥紧的拳头。｜TMDB 8.4"
  date: 2004-10-05
  added: 2026-10-18
  image: an-013.jpg
- id: an-014
  title: "冰川时代"
  category: 动漫
  tags: ["动漫", "动画", "冒险", "喜剧", "冰川时代 Ice Age"]
  quark_url: "https://pan.quark.cn/s/b48406f74617"
  description: "两万年前的地球正处在冰河时期，寒潮与冰川步步紧逼，各类动物不得不成群结队向南方迁徙。就在这场大迁徙中，三个本不该有交集的家伙凑到了一起：沉默寡言的长毛象曼尼，话痨又没心没肺的树獭希德，以及浑身透着危险气息的剑齿虎迭戈。起因是一个人类婴儿被遗落在迁徙路线上，希德和曼尼决定把孩子送回他的部落，而迭戈起初接过的是另一份任务：把这对护送搭档引进族群设下的伏击圈。一路上有雪崩，有饥荒，也有冰洞里藏着的地底世界，三个性格南辕北辙的伙伴在患难中慢慢处出了信任。当迭戈真正动心想守住这个孩子时，剑齿虎的天性与同伴的情义终于摆上了台面。作为蓝天工作室的成名之作，影片把动物角色做出了扎实的人物弧光，希德负责搞笑，曼尼负责沉默的温柔，迭戈承担转折，配上一段用肢体语言讲完的滑稽蒙太奇，让它在2002年上映后成为全家老少都能看进去的经典冒险喜剧。｜TMDB 7.4"
  date: 2002-03-14
  added: "2026-10-19 17:05"
  image: an-014.jpg
- id: an-015
  title: "冰雪奇缘2"
  category: 动漫
  tags: ["动漫", "动画", "奇幻", "冒险", "冰雪奇缘2 Frozen II"]
  quark_url: "https://pan.quark.cn/s/fbf16b875dbb"
  description: "阿伦黛尔王国恢复了平静，艾莎的冰雪魔法也早已不再是无解的谜题，可夜深人静时，总有一个歌声穿过海风飘进她的耳朵，除了她自己，没有人听得见。歌声在召唤她，也在提醒她：关于魔法的来处，关于父母当年出海的真相，还压着太多没有揭开的答案。于是艾莎循声启程，安娜、雪宝、克斯托夫和驯鹿斯文再度整队出发。这一次的目的地是传说中的魔法森林，浓雾散开后，四大自然之灵逐一现身，风、火、水、土轮番考验着这支小队。旅途越往深处走，真相越惊人：北方人的旧怨、父亲留下的航海日志、祖父当年在森林里做过的事，一层层拼出一个与艾莎魔法根源直接相关的秘密。安娜则要独自面对人生里最黑暗的一段隧道，学着在失去依靠之后依然做出正确的选择。影片延续了前作的家庭内核，把视角从个人接纳扩展到人与自然的和解，美术上那段水灵尼罗德追逐戏堪称全片最亮眼的段落，主题曲 Into the Unknown 也延续了传唱度极高的音乐水准。｜TMDB 7.2"
  date: 2019-11-20
  added: "2026-10-19 17:05"
  image: an-015.jpg
- id: an-016
  title: "功夫熊猫"
  category: 动漫
  tags: ["动漫", "动画", "动作", "喜剧", "功夫熊猫 Kung Fu Panda"]
  quark_url: "https://pan.quark.cn/s/4bfb4fa2fc03"
  description: "和平谷里人人都会两招功夫，唯独熊猫阿宝只会守着他爸的面馆做梦。他是功夫迷到骨子里的那种人，盖世五侠的名号倒背如流，连自己胖成什么形状都不妨碍他比划两下。偏偏命运开起玩笑来毫不手软：乌龟大师指认的神龙大侠，落地时正好砸在阿宝脸上。浣熊师父想尽办法想把这只连台阶都爬不动的熊猫劝退，盖世五侠里的小虎更是从头到尾不给他好脸色。可乌龟大师留下一句话，世上没有意外，师父只能硬着头皮换一种方式教学，发现把食物当奖励，这只熊猫能爆发出惊人的潜能。另一边，关押多年的大龙越狱而出，那只当年被师父亲手养大、后来黑化成魔的雪豹，正一路杀回和平谷索要神龙秘笈。梦工厂把中国元素揉进美式喜剧里，面馆、筷子、包子训练课拍得妙趣横生，动作场面的调度在2008年也属一流，是一部把励志故事讲得毫不说教的合家欢动作喜剧。｜TMDB 7.3"
  date: 2008-06-04
  added: "2026-10-19 17:05"
  image: an-016.jpg
- id: an-017
  title: "头脑特工队"
  category: 动漫
  tags: ["动漫", "动画", "剧情", "喜剧", "头脑特工队 Inside Out"]
  quark_url: "https://pan.quark.cn/s/66b486c62f0d"
  description: "每个人的脑子里都住着一支情绪小队，11岁的莱莉也不例外。乐乐是队长，一心要让她每天开心，怒怒、怕怕、厌厌各司其职，只有忧忧无事可做，碰什么都要抹上一层蓝色。莱莉随父母从明尼苏达搬去旧金山，新家空荡，卡车晚点，学校里的披萨还冒犯了她的家乡味，情绪总部乱成一团。乐乐为了不让核心记忆被忧忧染上悲伤，抱着记忆球和她一起被吸出了总部，两人流落在莱莉浩瀚的脑海世界里。留在总部的三种情绪越帮越忙，莱莉在现实里变得麻木易怒，甚至决定离家出走。而乐乐在记忆深处遇到莱莉幻想出来的粉色大象冰棒，也第一次发现，那些她拼命隔离的忧伤记忆，恰恰连着莱莉最需要的情感支持。皮克斯用这部2015年的作品完成了一次对成长的精妙拆解：允许难过，才是完整的健康。创意的视觉设定加上真诚的情感落点，让它拿下当年奥斯卡最佳动画长片。｜TMDB 7.9"
  date: 2015-06-17
  added: "2026-10-19 17:05"
  image: an-017.jpg
- id: an-018
  title: "寻梦环游记"
  category: 动漫
  tags: ["动漫", "动画", "音乐", "冒险", "寻梦环游记 Coco"]
  quark_url: "https://pan.quark.cn/s/50407ce3a955"
  description: "墨西哥小镇的鞋匠世家有一条雷打不动的家规：不许碰音乐。可少年米格偏偏是那个例外，他白天帮家里擦鞋，晚上偷偷在天阁楼里照着偶像德拉库斯的录像自学吉他，他相信自己的血脉里流着音乐。亡灵节当晚，因为一把吉他，米格误打误撞跨进了亡灵世界，那里灯光万丈，骷髅们过着比人间更热闹的日子。活着的人要在日出前得到家人的祝福才能回去，而他的曾曾祖母留下的祝福附带一个条件：从此放弃音乐。米格不肯，转而去寻德拉库斯讨要认可，路上拉上了落魄乐手埃克托帮忙，条件是把他的照片带回人间，让他能在亡灵节看看自己的女儿。这一路越走越深，米格渐渐摸到了家族音乐禁令背后真正的伤口：有人被遗忘了，有人被辜负了，还有人一直在等一首没唱完的歌。影片以 Remember Me 贯穿全篇，把死亡拍成了温柔的挂念，2017年上映后打动了全球无数家庭，也拿下奥斯卡最佳动画长片。｜TMDB 8.2"
  date: 2017-10-27
  added: "2026-10-19 17:05"
  image: an-018.jpg
- id: an-019
  title: "心灵奇旅"
  category: 动漫
  tags: ["动漫", "动画", "奇幻", "音乐", "心灵奇旅 Soul"]
  quark_url: "https://pan.quark.cn/s/d23cbae4df32"
  description: "乔·加德纳在中学教了半辈子乐队课，梦想是站上真正的爵士舞台。机会终于砸下来：与多萝西娅四重奏同台演出，他兴奋得当天就想冲回家排练，结果一脚踩空，灵魂直接出窍，飘进了生之彼岸的通道。他不肯走，逆流逃进了生之来处，那里的灵魂导师们正忙着给新灵魂配火花，好让他们领了通行证降生地球。乔阴差阳错成了灵魂22的导师。22是个有名的问题学生，从古至今的名师都没能让她对地球产生兴趣，她觉得活着这事毫无吸引力。为了赶回自己的身体，乔带着22在人间寻找火花，却意外发现22借着他的身体体验了披萨的香气、地铁口的风、一片旋转飘落的枫叶。皮克斯在这部2020年的作品里没有大反派，也没有拯救世界，它讨论的是一个非常柔软的问题：如果人生的意义不是某个宏大的目标，而是走路时踩到地面的那种踏实，你会怎么活。配乐由爵士与古典两条线交织，是皮克斯近年最耐看的思想之作。｜TMDB 8.1"
  date: 2020-12-25
  added: "2026-10-19 17:05"
  image: an-019.jpg
- id: an-020
  title: "怪兽电力公司"
  category: 动漫
  tags: ["动漫", "动画", "奇幻", "喜剧", "怪兽电力公司 Monsters, Inc."]
  quark_url: "https://pan.quark.cn/s/15f6d3a5589c"
  description: "在怪物世界里，电力不是烧煤发的，是靠孩子的尖叫声。怪兽电力公司就是全国最大的发电企业，旗下的惊吓专员每晚从衣柜门钻进人类世界，把小孩吓哭再收集尖叫。毛怪苏利文是公司的业绩冠军，蓝紫色的大块头配上满身绒毛，实际上心软得很，搭档是绿眼睛的大眼怪麦克，嘴上功夫一流。一场例行上班出了岔子：一个两岁的人类小女孩阿布跟着毛怪溜回了怪物世界。在怪兽的认知里，人类小孩是剧毒污染源，全城如临大敌，公司高层里还有人正憋着见不得光的新方案。毛怪从吓人的专业标杆瞬间切换成拼命护崽的老父亲，麦克负责吐槽和掩护，两人在千门万柜的机器档案室、雪山荒原与追捕之间连轴转。皮克斯这部2001年的作品把衣柜怪兽的童年恐惧反转成了温柔的守护故事，结尾从尖叫到笑声的能源革命，是这个系列最亮的一笔。｜TMDB 7.9"
  date: 2001-11-01
  added: "2026-10-19 17:05"
  image: an-020.jpg
- id: an-021
  title: "怪兽大学"
  category: 动漫
  tags: ["动漫", "动画", "喜剧", "家庭", "怪兽大学 Monsters University"]
  quark_url: "https://pan.quark.cn/s/2e3e05164d6f"
  description: "很多人以为毛怪天生就是惊吓界的王者，这部前传讲的是他跟大眼仔在怪兽大学的青葱岁月。大眼仔麦克·华斯基从小学起就把惊吓专员当信仰，可惜天赋这件事从没眷顾过他，他靠背书和钻研把惊吓学理啃得滚瓜烂熟，进了名校的惊吓学院。同宿舍的毛怪詹姆士·苏利文则是标准的别人家的孩子，惊吓世家出身，块头天生占优，躺着就能拿高分，压根不屑于用功。两个不对付的人斗到期中考试，双双被哈德斯克莱博院长逐出惊吓学院。不肯认输的大眼仔抓住最后的机会，拉起一支全是边缘怪的杂牌队报名惊吓游戏，毛怪阴差阳错成了队友。从被嘲笑的垫底队一路拼到决赛圈，比赛越往后越凶险，两个人也在这个过程中看清了彼此真正的价值：一个有天赋却欠打磨，一个没天赋却把整个行业的知识装进了脑子里。皮克斯把大学兄弟会喜剧和怪兽设定揉在一起，讲了一句很适合讲给孩子听的话：路不止一条，认清自己比赢更重要。｜TMDB 7.1"
  date: 2013-06-19
  added: "2026-10-19 17:05"
  image: an-021.jpg
- id: an-022
  title: "怪物史瑞克"
  category: 动漫
  tags: ["动漫", "动画", "奇幻", "喜剧", "怪物史瑞克 Shrek"]
  quark_url: "https://pan.quark.cn/s/53750e06fb13"
  description: "怪物史莱克只想在自家沼泽里安安静静过日子，坏就坏在一群童话角色找上了门。昏君罗德爵士把童话王国里的妖怪、巨人、三只小猪、匹诺曹统统驱逐出境，难民们浩浩荡荡挤进了史莱克的沼泽。为了换回清净，史莱克和喋喋不休的驴子踏上了交易之路：替罗德爵士从火龙看守的高塔里救出菲奥娜公主。这一路把传统童话的桥段挨个拆了个遍：骑士救援被改成互相嫌弃，真爱之吻的设定更是被彻底玩坏。梦工厂用这部2001年的作品给动画行业来了记釜底抽薪，反讽密集又不失温情，剧本底子扎实到拿下第一届奥斯卡最佳动画长片，主角配音的迈克·迈尔斯和艾迪·墨菲贡献了大量即兴笑料。影片真正立住的是主题：别人眼里的怪，恰恰可能是刚好合适的那个形状，接纳自己比套进童话模板重要得多。｜TMDB 7.8"
  date: 2001-05-18
  added: "2026-10-19 17:05"
  image: an-022.jpg
- id: an-023
  title: "机器人总动员"
  category: 动漫
  tags: ["动漫", "动画", "科幻", "家庭", "机器人总动员 WALL-E"]
  quark_url: "https://pan.quark.cn/s/28bf182aa648"
  description: "公元2805年，地球被垃圾堆成了一颗不再适合居住的星球，人类早就整体搬上巨型飞船真理号，把清扫工作留给了一支垃圾机器人部队。七百年过去，机器人们陆续报废，只剩下最后一台瓦力还在日复一日把垃圾压成立方体。漫长的独居把他磨出了性格：他会把有趣的小玩意收进分格箱，会跟着老录像带学跳舞，养了只打不死的蟑螂当宠物，连他自己都不知道，他早已越过了程序设定的边界。某天一艘飞船降落，送来探测机器人伊芙，她受命在地球上寻找植物生命的迹象。瓦力对她一见钟情，把自己收藏的灯泡、魔方、影片一股脑献宝似的掏出来，直到那株藏在旧靴子里的幼苗让伊芙自动休眠，随后被飞船回收。瓦力扒着飞船追向了太空。皮克斯用近乎默片的开场半小时立住了这对机器人搭档，前半段的孤独美学与后半段飞船上的群像讽刺形成奇妙对比，2008年上映后横扫各大奖项，也常被认为是皮克斯技术上最大胆的一部。｜TMDB 8.1"
  date: 2008-06-26
  added: "2026-10-19 17:05"
  image: an-023.jpg
- id: an-024
  title: "狮子王"
  category: 动漫
  tags: ["动漫", "动画", "剧情", "冒险", "狮子王 The Lion King"]
  quark_url: "https://pan.quark.cn/s/4a4a8dcc5639"
  description: "荣耀石上，动物王国的子民朝拜新出生的小王子辛巴。叔叔刀疤对王位垂涎已久，他设计让辛巴和娜娜闯进大象墓园，又勾结土狼布置杀局，国王穆法沙两次救下儿子。真正的陷阱在峡谷：角马群受惊狂奔而下，穆法沙把辛巴推上高岩，自己却被刀疤推下悬崖。刀疤把父亲的死算在辛巴头上，让年幼的王子背着愧疚流亡。荒漠里奄奄一息的辛巴被狐獴丁满和野猪彭彭救下，一句Hakuna Matata教他把过去全部放下，无忧无虑地长大。直到娜娜找到他，直到猴子拉飞奇逼他直面水中的倒影：父亲的影像告诉他，你理应记得自己是谁。迪士尼这部1994年的手绘巅峰把哈姆雷特的故事化进了草原生态，配乐与经典曲目贯穿全片，飞奔角马那场戏的作画至今仍被反复研究。它也是很多人第一次在电影院里为动画流泪的记忆。｜TMDB 8.3"
  date: 1994-06-15
  added: "2026-10-19 17:05"
  image: an-024.jpg
- id: an-025
  title: "玩具总动员"
  category: 动漫
  tags: ["动漫", "动画", "喜剧", "冒险", "玩具总动员 Toy Story"]
  quark_url: "https://pan.quark.cn/s/c7ec98828c64"
  description: "牛仔玩偶胡迪是安迪房间里无可争议的大哥，玩具们每次搬新家都由他调度排兵，谁是生日礼物重头戏他一清二楚。安迪生日会上，一个太空人玩偶巴斯光年降落了：激光、翅膀、语音盒，全身上下都是新鲜玩意，瞬间抢走了全屋的崇拜。胡迪的醋意越积越深，一场意外让巴斯摔下书桌，家庭内讧升级成被隔壁恶童阿薛抓走的危机。那只一度坚信自己是真太空骑警的巴斯，在阿薛的折磨中不得不面对最残酷的真相：他只是个玩具，会飞的不是他，是弹射器。胡迪则在营救路上发现，被信任的滋味比自己想象的更值得在乎。玩具不能动、不能说话的铁律，只在人类看不见时才被打破，这个设定让无数孩子开始认真怀疑自己玩具的目光。1995年这部作品是影史第一部全电脑动画长片，皮克斯用技术革命起手，靠的是剧本里那份对玩具们江湖情义的认真，从此开启了一个时代。｜TMDB 8.0"
  date: 1995-11-22
  added: "2026-10-19 17:05"
  image: an-025.jpg
- id: an-026
  title: "疯狂动物城"
  category: 动漫
  tags: ["动漫", "动画", "喜剧", "冒险", "疯狂动物城 Zootopia"]
  quark_url: "https://pan.quark.cn/s/e49beb2779c7"
  description: "在哺乳动物共居的现代化都市疯狂动物城，小兔子朱迪从小立志当警察，所有人都告诉她兔子只配种胡萝卜，她偏从警校垫底的泥里爬出来拿了第一。到任第一天，牛局长却把她打发去贴停车罚单。城中接连有动物离奇失踪，朱迪抢下四十八小时限期破案的军令状，唯一线索指向狐狸尼克，一个靠树懒办事、把爪爪冰棍倒卖转行的街头老油条。一兔一狐从互相提防到被迫组队，案情越挖越深：失踪的全是食肉动物，且一个个性情狂暴化，恐惧在城市里发酵，食草与食肉的旧偏见被有心人当成了燃料。影片表面是侦破喜剧，内核是对刻板印象与群体恐惧的一次漂亮拆解，树懒车管所那段戏成了现象级笑点，2016年上映后全球票房与口碑双收，是迪士尼近年现实寓言路线的高峰之作。｜TMDB 7.8"
  date: 2016-02-11
  added: "2026-10-19 17:05"
  image: an-026.jpg
- id: an-027
  title: "精灵旅社"
  category: 动漫
  tags: ["动漫", "动画", "奇幻", "喜剧", "精灵旅社 Hotel Transylvania"]
  quark_url: "https://pan.quark.cn/s/c2949fc16671"
  description: "吸血鬼德古拉在幽灵森林深处建了座尖叫旅社，明面上是怪物世界的度假胜地，真正用途只有一个：把独生女儿梅菲丝护在里面，远离伤害过他妻子的人类。梅菲丝118岁生日，狼人、木乃伊、科学怪人、隐形人齐聚古堡。怕女儿惦记外面的世界，德古拉布好戏码假装人间凶险，偏偏阴差阳错，一个背着登山包的人类少年乔纳森闯了进来。德古拉手忙脚乱把活人包装成怪物，套上假獠牙、涂绿皮肤混进派对，可梅菲丝偏偏对这个见过外面的世界的家伙产生了好奇。索尼动画这部2012年的作品把怪物片拍成了合家欢喜剧，德古拉那种控制欲极强的老爸形象，笑点之下其实很能戳中家长。酒店从庇护所变成开放场所的转折，对应的是父女之间关于成长边界的谈判，节奏轻快，怪物群像各有各的萌点，适合全家一起看。｜TMDB 7.0"
  date: 2012-09-20
  added: "2026-10-19 17:05"
  image: an-027.jpg
- id: an-028
  title: "美食总动员"
  category: 动漫
  tags: ["动漫", "动画", "喜剧", "家庭", "美食总动员 Ratatouille"]
  quark_url: "https://pan.quark.cn/s/3391c81390be"
  description: "巴黎的下水道里住着一只天赋异禀的小老鼠雷米，嗅觉与味觉天生就是大师级别，偶像是从不低头的美食教父古斯托。命运给他的剧本很刁钻：一只老鼠，梦想进厨房。一场意外把雷米冲进了巴黎市区，他鬼使神差地来到古斯托餐厅楼下，眼看着往日的圣殿落魄到靠罐头汤度日。店里的小帮工林奎尼笨手笨脚闯了祸，雷米出手救汤，从此两人达成了一份奇妙的合作：林奎尼负责站在灶台前当门面，雷米藏在帽子底下掌勺。一夜成名的清汤让餐厅起死回生，刻薄的主厨想抢功，而全巴黎最毒舌的食评家伊戈也嗅着名声上门。皮克斯这部2007年的作品借那只老鼠讲了句漂亮的话：不是人人都能成为伟大的艺术家，但伟大的艺术家可能来自任何地方。厨房大战、老鼠军团与伊戈那口让人瞬间沉默的杂菜煲，都成了动画史上的名场面。｜TMDB 7.8"
  date: 2007-06-28
  added: "2026-10-19 17:05"
  image: an-028.jpg
- id: an-029
  title: "虫虫危机"
  category: 动漫
  tags: ["动漫", "动画", "冒险", "喜剧", "虫虫危机 A Bug's Life"]
  quark_url: "https://pan.quark.cn/s/e8a4f379e9b0"
  description: "蚂蚁王国的收获季年年都被蝗虫集团勒索，这次出岔子的又是发明家菲力，他那个滚谷机器把献给蝗虫的贡品全部抖进了水里。恼羞成怒的蝗王霍柏限期双倍缴纳粮食，菲力自告奋勇出城找帮手，结果误打误撞把一队马戏团昆虫当雇佣兵请了回来：走钢丝的毛毛虫、独角戏的瓢虫夫妇、会魔术的螳螂，个个身怀绝技却没有一项能打仗。骗局很快穿帮，蚂蚁们却在一次配合中发现了自己真正的底牌：蚂蚁的数量远超蝗虫，怕的只是从来没人敢第一个站出来。皮克斯1998年的这部作品把伊索寓言借蚁灭蝗翻成了群像喜剧，马戏团那帮废柴最后的反杀干净利落。它是皮克斯的第二部长片，技术比玩具总动员更上层楼，尤其是雨中蚁穴决战的场面调度，在当年的动画工业里相当惊人。｜TMDB 7.0"
  date: 1998-11-25
  added: "2026-10-19 17:05"
