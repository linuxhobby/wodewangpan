- id: an-012
  title: "玩具总动员5"
  category: 动漫
  tags: ["动漫", "动画", "家庭", "喜剧", "玩具总动员5 Toy Story 5"]
  quark_url: "https://pan.quark.cn/s/aa9566d31b02"
  description: "胡迪、巴斯光年、翠斯等“元老级”玩具将跟随小主人邦妮的成长脚步，共同迎接数字时代下的全新挑战。随着无所不能的科技产品逐渐走进童年世界，一批充满科技感的崭新角色也随之重磅亮相：青蛙造型的智能平板小荷、憨态可掬的导航玩具小不丢、活力十足的抓拍好手小拍侠，以及自带笑点的臭屁小机灵。当身边的同龄朋友们开始沉浸在科技玩具带来的“电子陪伴”中，而玩具伙伴们也迎来了前所未有的生存难题：在屏幕占据注意力的时代，玩具的时代真的结束了吗？在“被取代”危机的当下，这群玩具伙伴还能否携手，帮助邦妮找回属于自己的真实友谊与快乐？｜TMDB 8.3"
  date: 2026-06-17
  added: 2026-10-17
  image: an-012.jpg
