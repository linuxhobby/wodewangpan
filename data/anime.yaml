- id: an-030
  title: "赛车总动员"
  category: 动漫
  tags: ["动漫", "动画", "冒险", "喜剧", "赛车总动员 Cars"]
  quark_url: "https://pan.quark.cn/s/bb03daca9584"
  description: "闪电麦坤是个把速度当信仰的新秀赛车，只认冠军不讲人情，连服务团队都换了一茬又一茬。活塞杯收官战，他与老将车王、黑马路霸同时冲线，组委会安排加州加赛定胜负。麦坤连夜赶路，半路跟运输卡车走散，横冲直撞闯进了66号公路边一个快被时代遗忘的小镇水箱温泉镇，还把镇上唯一的柏油路犁了个稀巴烂。法官蓝天博士罚他留下修路，拖车板牙、老板娘莎莉、没牌照的意大利叉车等一票居民轮番登场。麦坤满脑子都是逃离，可就在一段一段铺路的重复里，他慢慢听说了小镇当年的辉煌，也头一次体会到有人等着你跑完比赛是什么滋味。皮克斯把这部2006年的作品拍成了一封写给66号公路的情书，赛车的速度感与小镇的慢生活形成鲜明对照，讲的是每个追赶名次的人迟早要面对的问题：赢了之后呢。｜TMDB 7.1"
  date: 2006-06-08
  added: "2026-10-19 17:05"
  image: an-030.jpg
- id: an-031
  title: "超能陆战队"
  category: 动漫
  tags: ["动漫", "动画", "动作", "冒险", "超能陆战队 Big Hero 6"]
  quark_url: "https://pan.quark.cn/s/e172b074227c"
  description: "未来都市旧京山，天才少年小宏14岁就拿出惊动全场的发明：一群能自行组合的微型磁力机器人。哥哥泰迪带他参观实验室，他当场折服，为此赶制新作品参加入学展示会。一场大火烧掉了会场，泰迪在救援中丧生，小宏的机器人也毁于一炬。消沉的小宏碰伤了胳膊，唤醒了哥哥留下的医疗机器人大白，那个白白胖胖、说话慢吞吞的护理专员，用一板一眼的体检流程和拥抱把他从谷底慢慢捞了起来。直到小宏发现有个戴着面具的人正在批量生产他的微型机器人，怒火瞬间点燃。他给大白装上战斗装甲，哥哥的朋友们也各自升级成超级英雄，一支草台班子直指事件背后的真凶。迪士尼与漫威合拍的这部2014年作品把超级英雄片拍出了治愈系底色，大白凭借一个拥抱成了现象级角色，影片也拿下当年奥斯卡最佳动画长片。｜TMDB 7.7"
  date: 2014-10-24
  added: "2026-10-19 17:05"
  image: an-031.jpg
- id: an-032
  title: "飞屋环游记"
  category: 动漫
  tags: ["动漫", "动画", "冒险", "喜剧", "飞屋环游记 Up"]
  quark_url: "https://pan.quark.cn/s/67204f87081b"
  description: "卡尔和艾莉的缘分从一间废弃的老屋开始，两个孩子因为探险家的共同偶像成了终生搭档。他们把冒险梦想攒进了那本贴满照片的冒险手册，又把一生过成了柴米油盐，仙境瀑布的旅行计划一推再推，直到艾莉先行离开。老人卡尔守着满是回忆的房子不肯搬进养老院，在拆迁令生效的清晨，他解开上万只气球，把整栋房子连根拔起，向着南美仙境瀑布飞去。敲门声打破了独自冒险的美梦，误打误撞挂在门廊上的童子军小罗成了甩不掉的同伴。旅途上两人捡到一只色彩斑斓的大鸟凯文，又收留了一条会说话的金毛犬逗逗，最终撞上卡尔少年时代的偶像、如今偏执疯狂的探险家蒙兹。皮克斯这部2009年的开场十分钟被公认为影史最动人的无声段落之一，用人生蒙太奇把一老一少的冒险托举起来，也把遗憾与放手讲给了所有年龄的观众。｜TMDB 8.0"
  date: 2009-05-28
  added: "2026-10-19 17:05"
  image: an-032.jpg
- id: an-033
  title: "飞机总动员"
  category: 动漫
  tags: ["动漫", "动画", "冒险", "喜剧", "飞机总动员 Planes"]
  quark_url: "https://pan.quark.cn/s/08867c598867"
  description: "小镇农用喷洒机达斯蒂有个跟他的身份八竿子打不着的梦想：参加环球飞行大赛。更麻烦的是，他还有恐高症，一飞高就天旋地转，这对志在环球竞赛的飞机来说是致命短板。没人看好他，维修站的老搭档们一边帮他调引擎，一边劝他认清现实，可达斯蒂认准了就要往上冲。预选赛险险过关后，他一头扎进了国际赛道，对手里有傲慢的卫冕冠军，也有各国风格迥异的飞行好手，赛程一路打到最后的决胜轮。他在夜航中坠海，被拖回后经历的不只是引擎维修，还有心态重建：克服恐高的关键不是不再害怕，而是找到愿意陪你重飞一遍的人。这部2013年的作品出自迪士尼动画工作室自己操盘的航空世界观，与赛车总动员共享同一宇宙，把赛车场的速度与热闹原样搬上了云端，讲述小人物打破自身极限的老派励志故事，画面明亮，赛制紧凑，适合孩子看个痛快。｜TMDB 5.9"
  date: 2013-08-09
  added: "2026-10-19 17:05"
  image: an-033.jpg

