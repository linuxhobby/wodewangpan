- id: an-041
  title: "JOJO的奇妙冒险 飙马野郎"
  category: 动漫
  tags: ["动漫", "动画", "动作冒险", "Sci-Fi & Fantasy", "JOJO的奇妙冒险 飙马野郎 Steel Ball Run"]
  quark_url: "https://pan.quark.cn/s/dcd395a34213"
  description: "【第 6 季 · 共 12 集 · 全剧 6 季】飙马野郎篇把舞台从欧洲搬到 1890 年的美国大陆，JOJO 系列第七部的故事由此展开。下半身瘫痪的前赛马天才乔尼·乔斯达，在赌上一切的看台上撞见骑着马、带着神秘铁球的骑手杰洛·齐贝林，为了重新站起来，他跟着对方一起报名参赛。所谓 STEEL BALL RUN，是一场横跨北美大陆、从圣迭戈一路奔向纽约的超长距离赛马，总奖金七千五百万美元，报名者五百名，赛道本身就是绞肉机。比赛开始后乔尼才弄清楚，杰洛那些铁球里藏着名为「回旋」的技术，而赛事真正的幕后赞助人史提尔总统看中的不是马，是散落在北美大陆各处的圣人遗体，据说集齐可以换来统治国家的力量。赛段推进的同时，祊玢一家、迪亚哥·布兰度、奥耶哥摩巴这些同样盯上遗体的对手接连登场，替身战从马背打到看台，再打到沙漠与关卡。这一季的动作调度明显比前面的篇章更放开，摄影与分镜大量使用横向移动去表现速度与旷野，二十五分钟的单集长度让规则杀与心理博弈有地方铺陈。坂田将吾配乔尼、阿座上洋平配杰洛，石川界人接迪亚哥·布兰度，高桥李依演露西·史提尔。制作仍是 David Production，系列监督加藤敏幸、系列构成小林靖子、角色设计津曲大介、配乐菅野祐悟。2026 年 3 月 19 日在 Netflix 开播，全季规划 12 集。｜TMDB 8.5"
  date: 2012-10-06
  added: "2026-10-25 11:16"
  image: an-041.jpg

