- id: an-037
  title: "名侦探柯南：30号杀人事件"
  category: 动漫
  tags: ["动漫", "动画", "动作", "悬疑", "犯罪", "名侦探柯南：30号杀人事件 名探偵コナン 30号殺人事件"]
  quark_url: "https://pan.quark.cn/s/d23274f9f219"
  description: "【剧场版】新版一万日元纸币刚刚发行，社会上的新钞热度还没散去，一桩罕见的假钞案就找上了门。柯南跟着少年侦探团、阿笠博士、小兰和园子，一起到日本纸币印刷局长野工厂参观，本来是一场轻松的课外见学，谁料警视厅那边同时拉响了警报：佐藤和高木侦办的杀人案里，查获的一万日元新钞竟被文书鉴定技官里见透子判定为假钞。警方随即成立搜查本部，因为这是日本境内发现的第 30 种伪造纸币，本案被通称为「30号事件」，这批以假乱真的新钞也被命名为 Ultra 30。新版纸币上市没多久就出现假钞流通，这则史无前例的消息一经曝光，整个社会乱成了一锅粥。柯南与服部平次动身前往大阪，追查疑似印制这批假钞的工厂，调查的触角同时伸向静冈、神奈川、长野、群马等地的纸币工厂，横沟参悟、横沟重悟、大和敢助、诸伏高明、上原由衣、山村操等各县警力悉数登场，黑田管理官、目暮、佐藤、高木与公安部的风见裕也在搜查本部坐镇。一场由假钞引发的国家危机全面铺开，柯南史上最大规模的全明星阵容集结，全力以赴迎战隐藏在钞票背后的真相。｜TMDB 6.2"
  date: 2026-10-02
  added: "2026-10-22 05:42"
  image: an-037.jpg

- id: an-038
  title: "小黄人与大怪兽"
  category: 动漫
  tags: ["动漫", "冒险", "动画", "喜剧", "家庭", "奇幻", "小黄人与大怪兽 Minions & Monsters"]
  quark_url: "https://pan.quark.cn/s/f5313f9f56c2"
  description: "小黄人又回来了，这次它们盯上的不是香蕉，而是一部怪兽电影。这群穿着蓝色背带裤的黄色小家伙向来闲不住，为了拍出心中理想的怪兽电影，它们四处奔波物色演员，结果阵仗越拼越大，竟然真的集齐了各式各样的怪兽，一场脑洞大开的疯狂乱斗就此上演。作为小黄人系列的全新作品，本片延续了这一系列最招牌的喜剧配方：体型迷你的小家伙们，对着体型悬殊的庞然大物摆开架势，反差感拉满，笑点密集又不失童趣。全片走合家欢路线，冒险、奇幻、喜剧元素一个不少，动画场面明快热闹，怪兽们的登场既唬人又逗趣，小黄人依旧用它们吹里咕噜的独特语言和永远乐天派的态度，把一场眼看要失控的片场风波，变成了一场谁都不忍心错过的大乱斗。不管是家里的小朋友，还是单纯想被无厘头喜剧治愈一下的大人，都能在这部作品里找到属于自己的快乐。｜TMDB 7.6"
  date: 2026-06-24
  added: "2026-10-22 05:42"
  image: an-038.jpg

