  category: 动漫
  tags: ["动漫", "动作", "动画", "悬疑", "犯罪", "名侦探柯南"]
  quark_url: "https://pan.quark.cn/s/dd9c80cb419c"
  baidu_url: "https://pan.baidu.com/s/1QEFnx96CgLSYZqOtqxf23Q"
  baidu_code: "7qzw"
  description: "柯南一行人到横滨参加摩托车庆典——小兰、园子和小五郎，再加上来说话就说话的世良真纯，本该是趟轻松的短途。开场却是一台横冲直撞的神秘「黑色摩托车」：追着它跑的是神奈川县警交通机动队的萩原千速，一个习惯骑着警用摩托在城里追风的女骑手。片子把高速追车和推理拧在一起——一边是贴地的摩托追逐，一边是「黑色堕天使」为何要这样做的原因。公路上的追逐场面不少，是这部剧场版最热闹的部分，镜头贴着地面跑，速度感比前几部做得更足。适合系列粉丝补片；第一次看也能跟得上，案件本身不依赖前作设定，人物关系在片中会顺带交代。摩托元素在这部里占了很大比重，追车戏的调度比推理部分更用心，整体是系列里偏动作向的一部。配音与配乐保持了剧场版一贯的水准，人物之间的互动比案件本身更有看头。｜TMDB 7.4"
  date: 2026-04-10
  added: 2026-10-02
  image: an-001.jpg

- id: an-002
  title: "大唐妖探"
  category: 动漫
  tags: ["动漫", "喜剧", "动画", "悬疑", "大唐妖探"]
  quark_url: "https://pan.quark.cn/s/9a5450570998"
  description: "《大唐妖探》是一部 2026 年 8 月上映的国产动画电影，把喜剧、悬疑与奇幻探案揉在一起。故事发生在一座齿轮机关交织的大唐长安城，飞檐翘角之下，人类与妖怪比邻而居，市井烟火里透着机关术的巧思。主角是两个性格相反的年轻搭档：天才少年狄少一心想当长安第一神探，破案功力一流，毒舌属性更甚；初出茅庐的狼妖捕快阿萨武力不凡却心地纯良，办案全凭一腔热忱。一桩离奇命案让这对冤家被迫组队，一路笑闹互怼，从街头巷尾一路查到城市核心，探案的进程也一步步逼近长安城背后藏着的惊天秘密。片子节奏轻快，双人拌嘴式的喜剧桥段密集，悬疑线索负责把故事拽住，结局收在欢乐日常与惊天秘密的交汇点上，适合想看轻松国风探案动画的观众。｜TMDB 6"
  date: 2026-08-08
  added: "2026-10-10 11:05"
  image: an-002.jpg


- id: an-003
  title: "降世神通：最后的气宗 第一季"
  category: 动漫
  tags: ["动漫", "动作冒险", "Sci-Fi & Fantasy", "剧情", "家庭", "降世神通：最后的气宗 Avatar: The Last Airbender"]
  quark_url: "https://pan.quark.cn/s/e877ff19091c"
  description: "【第 1 季 · 共 8 集 · 全剧 2 季】《降世神通：最后的气宗》是 2024 年 2 月 22 日上线的真人改编剧集，底本来自 2005 年的同名动画。设定上，水、土、火、气四国原本和平共存，各方势力由唯一能精通四种元素之力的神通王来维系平衡，直到烈火国发动攻势、歼灭大气牧族，局势被彻底打破，而这还只是对方征服计划的第一步。更麻烦的是，这一代神通王迟迟没有现身，世界眼看就要陷入绝望，黑暗中亮起了一道光：大气牧族最后的传人还在。第一季共 8 集，全剧合计 2 季 15 集，这一季的任务很明确：让这位避世的少年重新走进战局，一边补齐四种元素的力量，一边接受「神通王」这个名字要承担的东西。作为真人改编，这一版把动画里的设定落成了实拍画面，四个部族的视觉风格区分得相当清楚，人物选角也照顾到了原作的神态。看完这一季可以无缝接第二季，两季加起来体量不大，一个周末就能刷完。｜TMDB 7.8"
  date: 2024-02-22
  added: 2026-10-11
  image: an-003.jpg

- id: an-004
  title: "降世神通：最后的气宗 第二季"
  category: 动漫
  tags: ["动漫", "动作冒险", "Sci-Fi & Fantasy", "剧情", "家庭", "降世神通：最后的气宗 Avatar: The Last Airbender"]
  quark_url: "https://pan.quark.cn/s/4deaf3f569d4"
  description: "【第 2 季 · 共 7 集 · 全剧 2 季】第二季接着第一季的结尾往下推进，篇幅 7 集，比第一季略短，全剧合计 2 季 15 集。核心设定不变：世界由水、土、火、气四个部族构成，能够同时驾驭四种元素的少年被称作神通王，他要在战乱里把尚未掌握的力量逐一补齐。这一季继续沿着少年一行人的旅途往前走，篇幅短了，节奏也就更紧，留给几位同伴的段落依旧不少，队伍之间的相处是串联两季的一条重要线。术法对决依旧是这个系列的招牌，画面延续真人版的路数，水、土、火、气的呈现强调重量与实感。想看完整故事的话建议按顺序从第一季开始，两季的铺垫与承接是连着的；喜欢原版动画的观众也可以把这版当作另一种讲法来看，两部对照着看，还能看出真人改编在节奏与取舍上跟动画版的差别。｜TMDB 7.8"
  date: 2024-02-22
  added: "2026-10-11 12:06"
  image: an-004.jpg


- id: an-005
  title: "哪吒之魔童闹海"
  category: 动漫
  tags: ["动漫", "动画", "动作", "奇幻", "冒险", "哪吒之魔童闹海"]
  quark_url: "https://pan.quark.cn/s/af849227b6fc"
  description: "动画电影《哪吒之魔童闹海》是 2019 年《哪吒之魔童降世》的正统续篇，由饺子继续执导，2025 年 1 月 29 日大年初一上映。故事紧接前作结尾：天劫之后，哪吒和敖丙的灵魂虽然得以保全，肉身却在天雷中尽毁，两人面临魂飞魄散的绝境。为了救下这对生死与共的少年，太乙真人决定借助七色宝莲为他们重塑肉身，然而重塑过程波折不断，肉身迟迟难以稳定，一场牵动陈塘关、龙族与阐教各方的新危机随之而来。劫后本应迎来新生的哪吒与敖丙，再一次被推到命运的十字路口，一个要为自己争一条活路，一个被家族重任与朋友性命两头拉扯。影片在前作世界观上继续展开，把「我命由我不由天」的命题往前推了一步：成见依旧在，这一次哪吒要对抗的不只是天命，还有借天命行事的局。动作场面全面升级，妖兽大军压境与肉身重塑之战都极具冲击力，笑点与燃点交替推进。该片上映后连破中国影史纪录，登顶中国电影票房榜首，成为国产动画的又一里程碑。｜TMDB 8.2"
  date: 2025-01-29
  added: "2026-10-11 19:55"
  image: an-005.jpg


- id: an-006
  title: "哪吒之魔童降世"
  category: 动漫
  tags: ["动漫", "动画", "奇幻", "冒险", "哪吒之魔童降世"]
  quark_url: "https://pan.quark.cn/s/6a5e6fe234f0"
  description: "动画电影《哪吒之魔童降世》由饺子自编自导，取材自《封神演义》，2019 年 7 月 26 日上映。天地灵气孕育出一颗能量巨大的混元珠，元始天尊将其炼化为灵珠与魔丸：灵珠转世将肩负重任，魔丸则会孕育出为祸人间的魔王。为除后患，元始天尊施下天劫咒，三年后天雷将至。太乙真人奉命把灵珠托生到陈塘关李靖之子哪吒身上，不料阴差阳错，灵珠与魔丸竟被掉包。本该是灵珠英雄的哪吒，生来就成了众人眼中的魔童，从出生起就被误解与排斥，却始终怀着一颗成为英雄的心。父亲的沉默、母亲的陪伴、百姓的成见与申公豹的暗中作梗，把他的成长步步推向悬崖；唯一把他当朋友的敖丙，身负龙族翻身重担，两人注定要在天劫之下正面相对。面对命中注定的天劫与世人的偏见，哪吒喊出「我命由我不由天」，向自己的命运发起挑战。影片以颠覆式改编重塑经典人物，笑泪交织，上映后口碑票房双收，刷新当时国产动画电影票房纪录，成为国漫崛起的标志性作品。｜TMDB 7.9"
  date: 2019-07-26
  added: "2026-10-11 19:55"
  image: an-006.jpg
