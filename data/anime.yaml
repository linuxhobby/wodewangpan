  description: "柯南一行人到横滨参加摩托车庆典——小兰、园子和小五郎，再加上来说话就说话的世良真纯，本该是趟轻松的短途。开场却是一台横冲直撞的神秘「黑色摩托车」：追着它跑的是神奈川县警交通机动队的萩原千速，一个习惯骑着警用摩托在城里追风的女骑手。片子把高速追车和推理拧在一起——一边是贴地的摩托追逐，一边是「黑色堕天使」为何要这样做的原因。适合系列粉丝补片；第一次看也能跟得上。公路上的追逐场面不少，是这部剧场版最热闹的部分。｜TMDB 7.4"
