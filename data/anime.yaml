- id: an-002
  title: "大唐妖探"
  category: 动漫
  tags: ["动漫", "喜剧", "动画", "悬疑", "大唐妖探"]
  quark_url: "https://pan.quark.cn/s/9a5450570998"
  description: "《大唐妖探》是一部 2026 年 8 月上映的国产动画电影，把喜剧、悬疑与奇幻探案揉在一起。故事发生在一座齿轮机关交织的大唐长安城，飞檐翘角之下，人类与妖怪比邻而居，市井烟火里透着机关术的巧思。主角是两个性格相反的年轻搭档：天才少年狄少一心想当长安第一神探，破案功力一流，毒舌属性更甚；初出茅庐的狼妖捕快阿萨武力不凡却心地纯良，办案全凭一腔热忱。一桩离奇命案让这对冤家被迫组队，一路笑闹互怼，从街头巷尾一路查到城市核心，探案的进程也一步步逼近长安城背后藏着的惊天秘密。片子节奏轻快，双人拌嘴式的喜剧桥段密集，悬疑线索负责把故事拽住，结局收在欢乐日常与惊天秘密的交汇点上，适合想看轻松国风探案动画的观众。｜TMDB 6"
  date: 2026-08-08
  added: "2026-10-10 11:05"
  image: an-002.jpg


- id: an-003
  title: "降世神通：七净土"
  category: 动漫
  tags: ["动漫", "动画", "动作冒险", "Sci-Fi & Fantasy", "降世神通：七净土 Avatar: Seven Havens"]
  quark_url: "https://pan.quark.cn/s/8ee5dbb595ea"
  description: "【第 1 季 · 共 13 集】作为《降世神通》系列的最新一部动画剧集，故事落在科拉之后的时代：一场灾难性的巨变把旧有的世界格局彻底掀翻，人类与灵体之间的关系也随之崩坏。主角是一名年轻的土御术师，她在剧变中被认定为继科拉之后的新一任神通，身份揭晓并没有带来荣光，反而把她推到了风口浪尖。在这个时代，人们把神通当成人类文明的毁灭者而不是救世主，追捕她的人类与灵体同样不留余地。她身边最可靠的同伴是失散多年的双胞胎姐妹，两人既要合力查明各自的身世之谜，也要赶在文明最后的避难所七净土彻底崩溃之前找到挽救的办法。全季共 13 集，2026 年 10 月 9 日首播，延续系列的动作冒险与奇幻设定，并把「神通在世人眼中究竟是救星还是灾星」这条矛盾摆到了台面上。看过《最后的气宗》《科拉传奇》的观众可以接着这部往下追，新一代神通与身边人的关系线是全剧最主要的看点。｜TMDB 8.8"
  date: 2026-10-09
  added: 2026-10-11
  image: an-003.jpg

- id: an-004
  title: "降世神通：最后的气宗 第二季"
  category: 动漫
  tags: ["动漫", "动作冒险", "Sci-Fi & Fantasy", "剧情", "家庭", "降世神通：最后的气宗 Avatar: The Last Airbender"]
  quark_url: "https://pan.quark.cn/s/4deaf3f569d4"
  description: "【第 2 季 · 共 7 集 · 全剧 2 季】《降世神通：最后的气宗》是 2024 年上线的真人改编剧集，底本来自同名动画。世界观建立在四个元素部族之上，水、土、火、气各有传承，而能够同时掌握四种元素之力的少年被称作神通王，剧中那位被寄予厚望的少年正是唯一有望终止漫长战乱的人。第二季共 7 集，全剧合计 2 季 15 集，延续第一季的叙事节奏继续推进这条主线。真人版的看点集中在两处：一是把动画里的术法对决落成了有实感的画面，水、土、火、气的视觉呈现比动画更强调物理质感；二是保留了原作里少年几人结伴同行的日常段落，紧张的任务与相互打趣的相处交替出现。想要完整体验的话，建议按顺序从第一季看起，人物关系与世界观的铺垫都在前面。适合看过原版动画、想换个方式重温的观众，也适合完全没接触过这个系列的人当作入门。｜TMDB 7.8"
  date: 2024-02-22
  added: "2026-10-11 12:06"
  image: an-004.jpg
