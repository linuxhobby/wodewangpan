  quark_url: "https://pan.quark.cn/s/5ce84da11985"
  description: "《宝可梦 盾》由 Game Freak 开发、The Pokémon Company 与任天堂发行，2019 年 11 月 15 日与《宝可梦 剑》同步登陆 Switch，是系列正统第八世代作品，封面神兽为藏玛然特。舞台伽勒尔地区以英国为原型，田园、工业城市、密林与雪山并存，人与宝可梦共同支撑起当地产业，对战是全民娱乐，联盟以锦标赛形式决定下一任冠军。结构上最大的变化是旷野地带：可以自由调整视角，天气随时间与地点改变，遇到的宝可梦也随之不同，散布其间的巢穴会冒出红色光柱，凑齐四人即可挑战极巨化野生宝可梦并尝试收服。战斗中的极巨化与超极巨化会改变体型与招式，只有三个回合可用，时机要提前算好。主线之外还有露营、宝可梦打工、地区形态与大量新面孔，盾版独占的包括伽勒尔火马。2020 年分两波推出的扩展票补上铠岛与冠之雪原，带来熊徒弟与武道熊师、极巨冒险，以及冠军丹帝主持的星锦标赛。网盘这份是美区中文数字版拆分包，含本体 v1.0.0、升级档 v1.3.2，以及 DLC 目录里的两个扩展票 NSP，需在大气层等自制系统下安装运行，请仅用于体验你合法拥有的游戏。"
