  description: "《静谧田园》是日本一软件旗下《夜廻》团队转攻农场模拟题材的作品，由 NIS America 发行，PC 版 2026 年 7 月底先行推出，Switch 与 Switch 2 版在 10 月 27 日跟上。故事从一场荒诞的意外开始：主角为追一只走失的小鸡掉进深坑，再睁眼时已经过去十年，自己却一天都没有变老，反倒成了村里口耳相传的神隐传说。他被安置在彼津村外的一块荒地上，背着巨额贷款，一边翻土、播种、畜牧、钓鱼、设陷阱打猎、下矿，一边要把这块地重新经营起来。真正特别的地方在夜晚：白天是熟悉的种田循环，入夜后游戏换成超自然恐怖，宵禁之后外出要面对游荡的妖怪，靠勾玉在神社献纳换取能力，倒下也不会没收已拿到手的道具。村里立着八条规矩，而剧情推进要求你把它们逐条打破。手绘等距视角、十余人团队、两年开发周期，官方原本预估卖出七万份，到九月底累计销量已突破二十五万。网盘这份是 Switch 数字版拆分包，含港版繁体中文本体 v1.0.0 与升级档 v1.2.0，另附 Monologue 制作的简体汉化补丁和安装说明，需在大气层等自制系统下安装运行，请仅用于体验你合法拥有的游戏。"
