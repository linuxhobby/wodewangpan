  baidu_url: "https://pan.baidu.com/s/1dPpV_RwM1zvWTS4HF3mWlg"
  baidu_code: "bvbz"
  description: "这是一份红色警戒系列的大合集，把国内玩家最常玩的几个版本基本凑齐：根目录带两个安装包，一个是玩家口碑最高的共辉版，一个是红色警戒2 加尤里复仇的整合版；子目录里还有初代红警（注明需在 XP 系统下运行）、红警2 与红警3 的安装包、MOD 版本合集，以及一个红警大礼包目录和战网下载地址说明，整体规模相当全。红色警戒是西木工作室在命令与征服引擎上做出的即时战略经典，采集、造电、暴兵、坦克海的对战节奏爽快直接，尤里复仇资料片加入的尤里阵营把心理控制玩成了独特流派，共辉版则是国内社区在原版基础上调整单位与平衡的魔改版本，当年在网吧的流行度甚至超过原版。安装时注意目录内的提示，别直接下载文件夹，先点进对应目录找安装包；想联机对战可以看战网说明里的入口。适合怀念老派 RTS、想一口气集齐全系列慢慢补课的玩家。"
  date: 2026-10-09
  added: "2026-10-09 19:37"
  image: game-005.jpg


- id: game-006
  title: "塞尔达传说：王国之泪"
  category: 游戏
  tags: ["游戏", "动作冒险", "开放世界", "塞尔达传说：王国之泪 The Legend of Zelda: Tears of the Kingdom"]
  quark_url: "https://pan.quark.cn/s/b68dd70e3ccb"
  baidu_url: "https://pan.baidu.com/s/17hBOU52ddtzTS1eA8TkwJQ"
  baidu_code: "hud0"
  description: "《塞尔达传说：王国之泪》是任天堂 2023 年推出的开放世界动作冒险大作，也是《旷野之息》的正统续作。本目录收录的是 1.21 究极版整合包，单个压缩包约 17.6GB，整合了游戏本体与模拟器运行所需的组件，解压后按说明配置即可使用。游戏沿用海拉鲁大陆的开放地图，但把舞台同时铺到了天空岛屿与地底世界，立体纵深是系列之最；核心玩法围绕左纳乌科技展开，究极手可以把随处捡到的材料拼成载具、机关与武器，余料建造则让武器组合几乎不设上限，同一个谜题有一百种解法，实验感和成就感都远超一般开放世界游戏。主线讲林克在天地之间寻找失踪的塞尔达，四地区贤者任务穿插其中，神庙与呀哈哈等收集要素的密度依旧惊人。该作原生于 Switch 平台，整合包需配合模拟器运行，电脑配置建议在推荐线以上，具体设置见包内说明，并请仅将其用于体验自己合法购买的游戏内容。适合想以更高画质与更稳帧率体验本作的玩家。"
  date: 2023-05-12
  added: "2026-10-09 19:38"
  image: game-006.jpg


- id: game-007
  title: "YUZU 模拟器"
  category: 游戏
  tags: ["游戏", "模拟器", "Switch", "YUZU模拟器 YUZU Emulator"]
  quark_url: "https://pan.quark.cn/s/e9a382d55d8c"
  baidu_url: "https://pan.baidu.com/s/1ry5mzo6nYVNoEvN8q3fo7w"
  baidu_code: "rskq"
  description: "YUZU 是曾经最流行的开源 Switch 模拟器，用 C++ 编写，以性能和兼容性著称，鼎盛时期可以流畅运行大部分 Switch 大作。这份资源收录的是 4176 版本的两个全汉化整合包，分别搭配 18.0.1 与 18.1 固件，zip 与 7z 各一份，解压即用，省去了自己找固件、装汉化补丁的麻烦。汉化版把原本英文的设置界面全部翻成中文，帧数上限、分辨率拉伸、GPU 精度、手柄映射这些常用选项都配了中文注释，新手照着说明调就能跑起来。需要说明的是，YUZU 项目已应任天堂的法律行动停止开发，此后不再有官方更新，这份 4176 版属于停更前的较新存档，稳定性经过大量用户验证，日常跑 2D 与中等强度 3D 游戏依然够用。运行前需要配置固件与密钥，包内有说明文件，按步骤放置即可。同时提醒，请只将其用于运行自己合法拥有的游戏。适合想在本机体验 Switch 游戏库、又希望界面全中文开箱即用的玩家。"
  date: 2026-10-09
  added: "2026-10-09 19:39"
  image: game-007.jpg


- id: game-008
