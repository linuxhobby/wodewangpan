- id: game-001
  title: "文明6"
  category: 游戏
  tags: ["游戏", "策略", "macOS", "文明6 Civilization VI"]
  quark_url: "https://pan.quark.cn/s/66efd2f2a056"
  baidu_url: "https://pan.baidu.com/s/159KeDvBfdDKudIUdAwmCHQ"
  baidu_code: "230q"
  description: "《席德·梅尔的文明VI》由 Firaxis Games 制作，2016 年发行。玩法其实一句话说得清：从公元前经营到近未来，探图、占城、拉奇观、搞科技、议外交，最后从文化、科技、宗教、统治中选一种取得胜利。这一代新加的「区域」系统把各功能的建筑从市中心挪到了城市外围街区，于是版图规划变得像在下棋——学院靠山、工业区凑一起吃加成，每一块地怎么用都要提前盘算。城市因此第一次有了形状，摊大饼不再是最优解。节奏偏慢，一局往往要好几晚才能打完，中途的蛮族、邻国与灾害也足够让人分心。适合喜欢深谋远虑、享受一步步铺开的玩家；只想快速来一局的会被时长劝退。资料片与平衡性调整改过好几轮，现在的版本和首发时差别不小，老玩家回坑会认不出一些机制。多人局要提前约好时间，一局拖很久是常态。｜Steam 2016"
  date: 2016-10-20
  added: 2026-10-02
  image: game-001.jpg

- id: game-002
  title: "文明7"
  category: 游戏
  tags: ["游戏", "策略", "模拟", "macOS", "文明7 Civilization VII"]
  quark_url: "https://pan.quark.cn/s/03deff44f4c2"
  baidu_url: "https://pan.baidu.com/s/17LtOUuv-oLS5H8-KbfIBtQ"
  baidu_code: "va4w"
  description: "《席德·梅尔的文明VII》是 Firaxis Games 推出的系列新作，玩法跟以往一样：从一处定居点起步，探地图、建城市、拉奇观、搞科技、谈外交，把一座城、一个帝国、一种文明一路经营到现代。这一代的调整主要在「时代」上——文明会随着时代推进而演进或延续，每一次更替都要重新决定这个国家往哪走，因此中盘的取舍比前作更难，前期积累的优势未必能一路带到终局。指挥官与传承机制也把单局之外的成长带进了流程。它依然是那种一局就能吃掉一整个周末的策略游戏。适合愿意花点时间上手、享受慢慢铺开的玩家；老玩家可能需要先接受这套新的时代规则，再谈喜不喜欢。画面与界面比前作清晰，新手引导也更细，是系列里上手门槛相对友好的一代；不过内容分层带来一些争议，入手前值得先看清版本差异。｜Steam 2025"
  date: 2025-02-10
  added: 2026-10-02
  image: game-002.jpg

- id: game-003
  title: "龙神模拟器"
  category: 游戏
  tags: ["游戏", "模拟器", "Switch", "龙神模拟器 Ryujinx"]
  quark_url: "https://pan.quark.cn/s/5ab948cd04b7"
  baidu_url: "https://pan.baidu.com/s/16h0tdxpaQGQJoTAFSxFk6g"
  baidu_code: "j0du"
  description: "龙神模拟器是 Switch 模拟器 Ryujinx 的常见中文叫法，用 C# 编写，以兼容性和稳定性见长，是 Switch 模拟玩家目前的主力选择之一。本次目录里放的是 10.10 版安装包，并附带 19.0.1 固件与密钥文件：先装模拟器，再把固件与密钥按说明放进对应目录，之后加载游戏镜像即可开玩。Ryujinx 对配置的要求不算苛刻，中端硬件就能跑大多数 2D 与轻量 3D 游戏，配置更高还可以开启分辨率拉伸，把画面拉到远超掌机原生的清晰度。手柄支持 XInput 与键盘映射，存档、金手指等常用功能一应俱全，个别游戏的兼容问题也有社区补丁可以解决。需要提醒的是，项目官方版本现已应版权方要求停止分发，网上流传的多为社区存档版本，使用前请自行确认本地法规与游戏版权归属，只用于体验自己合法拥有的游戏。适合想在 PC 上以更高画质重温 Switch 游戏库的玩家，具体游戏的兼容情况建议先查社区兼容列表再下手。"
  date: 2026-10-09
  added: "2026-10-09 19:35"
  image: game-003.jpg


- id: game-004
  title: "Switch 模拟器"
  category: 游戏
  tags: ["游戏", "模拟器", "Switch", "Switch模拟器"]
  quark_url: "https://pan.quark.cn/s/700951691c5b"
  baidu_url: "https://pan.baidu.com/s/1-eJkfMKxdyRGTUZIxhrK-w"
  baidu_code: "m1he"
  description: "这份资源是一个 Switch 模拟器的打包合集，按平台分成 PC 端与手机端两个目录，另有文档汇总了 Switch 游戏的下载地址，相当于把模拟玩家最常找的几样东西凑到了一处。PC 端收录主流的桌面级模拟器，手机端偏向安卓平台常用的移动版本，按自己的设备挑一个装就行。模拟器本体只是运行环境，还需要配套的固件、密钥与游戏镜像才能工作，目录里的说明对这些前置条件有交代，第一次接触模拟器的用户建议按步骤来：先装模拟器，再放固件与密钥，最后加载游戏。性能方面，PC 端中端配置即可流畅运行大部分作品，手机端对处理器与内存要求较高，旗舰级芯片体验更好。同时提醒，模拟器本身合法，但游戏镜像请只用于自己拥有的正版卡带或数字版，尊重版权方权益。适合预算有限、想先在手机或旧电脑上试试 Switch 游戏库，再决定要不要入手主机的玩家。"
  date: 2026-10-09
  added: "2026-10-09 19:36"
  image: game-004.jpg


- id: game-005
