  quark_url: "https://pan.quark.cn/s/2065a8aa83a5"
  description: "《八方旅人2》（Octopath Traveler II）是 Square Enix 开发的 HD-2D 回合制 JRPG，2023 年 2 月 24 日登陆 Switch、PS4、PS5 与 PC，是 2018 年《八方旅人》的正统续作，本站此前也收录了前作（game-038）。沿用前作「八位旅人、八条篇章」的框架，新作把舞台换到东西方文化交汇的索里斯提亚大陆，八位主角——剑士、商人、舞娘、学者、猎人、药师、神官、盗贼——各自在全新地图上展开独立的序章故事，剧情线之间不再是完全孤立，队伍同行时会触发双人剧情（Crossed Paths），把角色关系真正织进主线里。战斗延续弱点破防与增幅（BP）的回合制体系，新增潜能（Latent Power）与昼夜差分玩法：切换白天与夜晚，同一座城镇的 NPC 与可执行的场景指令都会改变，探索与队伍搭配的选择随之翻倍。HD-2D 画面技术在续作里进一步打磨，像素角色、景深光影与水面折射的结合被普遍认为是该风格的最高水准。网盘这份是 Switch 数字版拆分包，含 xci 整合版 v1.1.1 与非整合版、金手指 v1.1.1 及配套插件、画质 MOD，需在大气层等自制系统下安装运行，请仅用于体验你合法拥有的游戏。"
