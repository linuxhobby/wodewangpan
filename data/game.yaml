  baidu_url: "https://pan.baidu.com/s/1Ias8FT9iDAP6biCcUQOUSQ"
  baidu_code: "zhlp"
  description: "暴雪游戏客户端是 Blizzard 官方的启动器与游戏管理平台，原名 Battle.net，是玩魔兽世界、暗黑破坏神、守望先锋、炉石传说、星际争霸、魔兽争霸等暴雪系游戏的必装入口。本目录提供 Windows 与 macOS 两个平台的官方安装包：Windows 是一个小体积的在线安装向导，运行后自动下载完整客户端；macOS 是打包好的 app，拖进应用程序文件夹即可使用。客户端的功能不限于启动游戏，还包括账号登录与安全设置、游戏更新与修复、区域与语言切换，以及好友、语音等社区功能，暴雪全家桶的游戏都在这一个界面里管理和启动。国服自暂停后已恢复运营，本安装包与官方渠道一致，属于原版程序，安装后首次登录需要战网账号，没有的话按引导注册即可。适合新装系统后需要补齐暴雪全家桶，或者想在 Mac 上玩炉石、暗黑的玩家，国内用户下载前建议确认客户端区域设置与自己的账号归属一致。"
  date: 2026-10-09
  added: "2026-10-09 19:40"
  image: game-008.jpg

