  description: "《宝可梦传说 阿尔宙斯》由 Game Freak 开发、The Pokémon Company 与任天堂发行，2022 年 1 月 28 日登陆 Switch，是《宝可梦》系列的前传性质作品。舞台是尚未命名「神奥」的古代「银河地区」，玩家加入「银河队」，以完成地区第一本图鉴为目标在野外自由活动。玩法与正传差别很大：地图更接近半开放世界，宝可梦会主动攻击训练家，收服前要先观察其行为、用道具或自身闪避来应对；图鉴的完成靠捕捉与对战反复充实条目，而不是单纯升级。战斗在回合制基础上加入即时动作要素，招式可手动选择释放时机，被击中会中断行动，还引入「头目」与「群居宝可梦」这类特殊遭遇。阿尔宙斯作为核心传说宝可梦贯穿主线，整体基调比正传更成人向、更具探索感。网盘这份是 Switch 数字版拆分包，含本体与升级档，需在大气层等自制固件下安装运行，请仅用于体验你合法拥有的游戏。"
