  baidu_code: "qlqp"
  description: "1941 年太平洋战争打响，穿过山东的津浦铁路成了日军运送兵员物资的命脉，枣庄这一段尤其要紧。就在这条线周边，活跃着一支不太像队伍的抗日力量：成员清一色是枣庄火车站的铁路工人，带头的马原是站里的搬运工工头。白天他们在日军管着的车站低头干活，装作顺民；天一黑就换了一副面孔，靠着对铁轨、道岔和列车时刻的熟悉，扒火车、开火车，用最土的办法跟装备精良的日本正规军来回周旋。当地老百姓给这支队伍起了个响亮的名号，叫铁道飞虎队。影片把故事架在真实历史背景上，走的是群像加动作喜剧的路子，几场扒车与车厢搏斗的戏拍得紧凑，看得出是想把小人物的机灵劲儿做出彩。整体基调偏轻松，战争场面做了类型化处理，没有往惨烈里走，更像是一部拍给全家看的抗战题材动作片，2016 年上映后走的依然是成龙一贯的合家欢路线。｜TMDB 6.1｜TMDB 6.1"
