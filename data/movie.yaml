  tags: ["电影", "动作", "喜剧", "西部", "侠盗魅影 Bandidas"]
  quark_url: "https://pan.quark.cn/s/08d7e6eba486"
  description: "十九世纪八十年代的墨西哥，萨拉（萨尔玛·海耶克 饰）是当地一位银行家的女儿，从小被培养成标准的欧洲淑女，却一身豪气侠胆。家里财产被夺走之后，她开始武装抢劫那些银行。玛丽亚（佩内洛普·克鲁兹 饰）是农户的女儿，父亲被打伤，仇恨点燃了她的火，她也走上了同样的路。两个女孩在一次抢劫银行时偶遇，从此结束单打独斗，联手行动。影片属于西部片与动作喜剧的混搭：骑马、抢劫、爆破，节奏明快，两位女主角的搭档关系是它最主要的东西。两位演员的组合是这部当年最大的卖点，互动的节奏相当好。它的动作场面偏卡通化，爆炸和枪战都不打算让人紧张，对历史背景的处理也相当通俗，不追求严谨。外景和服装做得很用心，视觉上是这部最舒服的部分。适合喜欢女主角搭档、想看点轻松抢劫片的观众。｜TMDB 6.1"
  date: 2006-01-18
  added: 2026-09-30
