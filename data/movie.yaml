- id: mv-296
  title: "蛇形刁手"
  category: 电影
  tags: ["电影", "动作", "喜剧", "蛇形刁手 蛇形刁手"]
  quark_url: "https://pan.quark.cn/s/79ba9cf0b082"
  description: "鹰爪门与蛇形门在江湖上斗了几代，谁都想把对方连根拔起。一个月黑风高的夜里，鹰爪门突袭，蛇形门满门遭难，只有长老白长天逃了出来。从此他隐姓埋名缩在市井里，连头都不敢多抬。某天他在街上被无赖围住，是武馆里一个叫简福的打杂替他解了围。这一出手反倒惹了祸，白长天的行藏露了馅，鹰爪门的伏击紧跟着就到，又是简福碰巧路过，把他从鬼门关拽了回来。白长天看出这个年轻人是块料，决定把蛇形拳传给他。简福学得快，也不死守规矩，练着练着在蛇形拳的路数里加进了自己的东西，另创出一门蛇形刁手。等鹰爪门再次找上门，已经轮到这个当年的打杂站到师傅前面去了。1978 年的这部片子是成龙真正打出名堂的起点，谐趣功夫的路子在这里基本成型，师徒二人插科打诨的段落与最后那场硬仗搭配得相当利落。｜TMDB 7.3｜TMDB 7.3"
  date: 1978-03-01
  added: "2026-10-09 15:23"
  image: mv-296.jpg

- id: mv-297
  title: "广东小老虎"
  category: 电影
  tags: ["电影", "动作", "喜剧", "剧情", "广东小老虎 刁手怪招"]
  quark_url: "https://pan.quark.cn/s/27f98be1e0b1"
  description: "龙从小就爱看别人练拳，家里拿不出学费，他就蹲在墙头、趴在窗边，一点一点地偷师。运气来的一次，他撞见一个其貌不扬的老叫花，出手才知道是真有本事的人，死缠烂打拜了师。十年寒来暑往，当年的野孩子练出了一身实打实的功夫，回到街坊里，见着不平的事总忍不住要管一管。麻烦也就这么来了。某次出手，他跟一个地痞结下梁子，对方咽不下这口气，转头把师父搬了出来。等到两边真正站到一处，龙才看清，站在对面的那个人，正是当年害死他父亲的仇家。偷学十年、苦练十年，原来绕来绕去，全是为这一刻做准备。这部 1973 年的片子属于成龙出道初期的作品，制作朴素，剧情走的是最传统的复仇路子，拳脚也是那个年代硬桥硬马的规矩打法，能看得出他早年身手最原本的样子。｜TMDB 5.2｜TMDB 5.2"
  date: 1973-03-31
  added: "2026-10-09 15:23"
  image: mv-297.jpg

- id: mv-298
  title: "飞鹰计划"
  category: 电影
  tags: ["电影", "动作", "冒险", "犯罪", "飞鹰计划 飛鷹計劃"]
  quark_url: "https://pan.quark.cn/s/af86a3529cc1"
  description: "刚从非洲土著的追杀里脱身，飞鹰 Jackie 还没喘匀气，伯爵的急电就追到了，要他马上去西班牙。事情要追溯到二战末期：自知来日无多的纳粹，把从欧洲劫掠来的数万吨黄金藏进了撒哈拉沙漠深处的一处秘密基地。伯爵要 Jackie 配合一位冷艳的考古专家 Ada，再赴非洲把这笔黄金找出来，路上又多了个同行者，藏金副官的外孙女 Elsa。三个人各有各的心思，一路往沙漠腹地扎。等他们终于在一场意外中撞开藏金基地的大门，还没来得及高兴，一个神秘大汉就横在了面前，最后一场生死搏斗由此展开。这部 1991 年的作品是成龙野心最大的一次远征，剧组真的开进非洲拍，沙漠、废堡与地下基地全是实景，几场搏命的特技放在今天的工业水准看依旧惊人，属于他个人作品序列里制作规格最高的一部。｜TMDB 7.3｜TMDB 7.3"
  date: 1991-02-07
  added: "2026-10-09 15:23"
  image: mv-298.jpg

- id: mv-299
  title: "霹雳火"
  category: 电影
  tags: ["电影", "动作", "惊悚", "霹雳火 霹靂火"]
  quark_url: "https://pan.quark.cn/s/904ddb16dd97"
  description: "阿火在车房里修车为生，脾气一点就着，手上功夫和脚下油门都利落得没话说，只因家里穷，赛车手这个念头一直停在念头阶段。转机来得突然：警方找上门，请他帮忙抓偷车集团的头目库克。那家伙车技极高，警察设了一次又一次路障，次次被他溜掉。阿火二话没说接了下来，靠着一身本事总算把人送进了拘留所。可库克没待多久就被同伙劫走，报复跟着就到：车房被砸，他侥幸躲过，两个妹妹却重伤进了医院。这口气再也咽不下去了。库克随后加入日本一支车队，点名要在赛道上跟他分个高下，阿火收拾东西就去了日本。1995 年的这部片子把成龙的动作戏整个搬到了赛车场上，追车、漂移与近身搏斗交替推进，情绪比他同期那些轻喜剧要硬，属于他少有的带点狠劲的作品。｜TMDB 6.5｜TMDB 6.5"
  date: 1995-08-05
  added: "2026-10-09 15:23"
  image: mv-299.jpg

- id: mv-300
  title: "醉拳"
  category: 电影
  tags: ["电影", "动作", "喜剧", "醉拳 醉拳"]
  quark_url: "https://pan.quark.cn/s/1b1c0d6895d0"
  description: "黄麒英是广东武术界有头有脸的人物，儿子黄飞鸿从小被他按着练功，偏偏这孩子心浮气躁，学了点皮毛就往外跑，惹是生非的本事比功夫长得快。终于有一次，他在人前被人打得爬不起来，连带着受了一顿羞辱。这一顿打倒把他打醒了，飞鸿发誓要拜苏乞儿为师，踏踏实实学点真东西。苏乞儿本就懒得收徒，更信不过这个毛头小子的品性，于是开出一串近乎刁难的条件。飞鸿咬着牙一条条应下，又一条条做到。老叫花看在眼里，终于松了口，把醉拳传给了他。从那以后，那个只会用三脚猫功夫闯祸的少年，慢慢长成了敢在街头上出手护人的年轻人。1978 年的这部片子是谐趣功夫片的开山之作，把喜剧节奏嵌进了扎实的南派拳脚里，袁小田饰演的苏乞儿更是成了港片里最经典的师父形象之一。｜TMDB 7.4｜TMDB 7.4"
  date: 1978-10-05
  added: "2026-10-09 15:23"
  image: mv-300.jpg

- id: mv-301
  title: "杀手壕"
  category: 电影
  tags: ["电影", "动作", "喜剧", "杀手壕 The Big Brawl"]
  quark_url: "https://pan.quark.cn/s/857a75bd900c"
  description: "阿龙的父亲在芝加哥开了一家餐馆，生意刚有起色，当地黑帮就上门收保护费。阿龙咽不下这口气，把来人狠狠揍了一顿。这一打反而暴露了他的身手，黑帮头目盯上了他，硬要他代表自己参加那场名叫「杀手壕」的地下格斗赛，去争冠军。为了让阿龙就范，他们绑走了他哥哥的未婚妻，还安排一个假女人顶替回去复命，条件是：出赛，赢了就放人。阿龙没有别的选择。赛场上他一路往上打，先拿下摩洛哥红毛王，再过铁头僧这一关，最后站到他对面的是杀人王老李。这一场靠的不只是拳脚，还得靠脑子。片子 1980 年上映，是成龙第一次主演的英语电影，也是他进军好莱坞的早期尝试，打斗保留了港式的灵活与节奏感，只是整体风格为了迁就海外市场做了不少调整，属于他生涯里一段值得留意的过渡期。｜TMDB 5.9｜TMDB 5.9"
  date: 1980-08-18
  added: "2026-10-09 15:23"
  image: mv-301.jpg

- id: mv-302
  title: "炮弹飞车"
  category: 电影
  tags: ["电影", "动作", "喜剧", "家庭", "炮弹飞车 The Cannonball Run"]
  quark_url: "https://pan.quark.cn/s/5e8507343cb7"
  description: "一群来自各地的赛车手聚到了一起，为的是一场根本不合法的比赛：从美国东岸一路横穿到西岸，谁先到谁赢。规则只有一条，就是没有规则。参赛的人各怀鬼胎，一路上互相使绊子、抢路线，斗得比车速还急。麻烦不止于此，有人反对办这场比赛，干脆把一位政客的助理绑走了，事情闹大，警察随即介入追查。这一下原本各自为战的车手们反倒被推到了同一条船上，合力冲破警方设下的一道道路障。影片 1981 年上映，走的是全明星群戏加公路闹剧的路子，笑料密集，人物繁多，成龙在片中饰演日本车队的一员，戏份不算多，但动作与喜剧段落都相当出彩。这部片子在当年北美票房表现不俗，也是他早期在好莱坞露面最广的一次，能看到港式身手被塞进美式公路片之后的样子。｜TMDB 6.2｜TMDB 6.2"
  date: 1981-06-19
  added: "2026-10-09 15:23"
  image: mv-302.jpg

- id: mv-303
  title: "威龙猛探"
  category: 电影
  tags: ["电影", "动作", "犯罪", "威龙猛探 The Protector"]
  quark_url: "https://pan.quark.cn/s/45e64e75b795"
  description: "纽约的夜里，华人警察黄比利和同事在酒吧庆祝来美十周年，一群劫匪突然闯进来，同事当场丧命。比利悲愤之下当场击毙凶手，却因此触怒上司，被发配去给大亨沙比路的时装展维持秩序，明摆着是惩罚。偏偏时装表演那天，沙比路的女儿罗娜被人绑走。比利查下去发现蹊跷：沙比路的保镖宾尼此前多次往香港打电话，种种迹象指向沙比路与香港头号毒枭高伟洛之间早有合作，这起绑架很可能是两方反目的结果。为了查清真相，比利带着搭档丹尼直飞香港，找到高伟洛昔日的两名合作伙伴李兴与何天的女儿何美芳。线索刚有眉目，高伟洛的人已经杀到，对方要一次性清掉所有知情者。比利在重重围堵中撕开口子，摸到对方老巢，带着搭档发起了最后那一击。这部 1985 年的作品是成龙进军好莱坞的第二次尝试，动作戏拍得很硬，风格偏写实，跟他同期的香港作品明显不是一个调子。｜TMDB 5.9｜TMDB 5.9"
  date: 1985-06-15
  added: "2026-10-09 15:23"
  image: mv-303.jpg

- id: mv-304
  title: "一招半式闯江湖"
  category: 电影
  tags: ["电影", "喜剧", "动作", "一招半式闯江湖 招半式闖江湖"]
  quark_url: "https://pan.quark.cn/s/cfea1339fb7f"
  description: "江涛是个在江湖边上打转的小人物，没什么真本事，英雄梦倒做得比谁都勤。他在一处庄园里当杂役，某天撞破总管的女客人在练五毒邪功，吓得夺路就逃。他不知道的是，这位女客正是五毒教掌门苗春花，正与总管盘算着半路截下神威镖局护送的万年活玉与九转返魂丹。逃亡路上又生枝节：江涛碰上神鞭大侠与采花贼同归于尽，干脆冒了神鞭大侠的名去领悬赏，这一冒名反倒引来一个神秘老乞丐的注意。五毒教的人追上来时，是老乞丐出手救了他。江涛索性拜了师，老乞丐交给他一件信物，让他去找押送宝物的神威镖局总镖师方威。见到镖局众人，他又对方威的女儿一见钟情，于是铁了心跟着队伍护宝上路。这一路强敌一个接一个，比他想象的要难走得多。1978 年的这部片子是成龙早期谐趣武侠的代表，武功设计半是真功夫半是胡闹，笑料密度大，跟他后来都市题材的动作片完全是两种趣味。｜TMDB 6.2｜TMDB 6.2"
  date: 1978-06-30
  added: "2026-10-09 15:23"
  image: mv-304.jpg

- id: mv-305
  title: "神话"
  category: 电影
  tags: ["电影", "动作", "冒险", "喜剧", "神话 神話"]
  quark_url: "https://pan.quark.cn/s/df580148092d"
  description: "秦将蒙毅奉命护送朝鲜公主玉漱入秦为妃，途中遭叛军伏击，为护住玉漱，他握着她的手随战车一起坠下万丈瀑布。两千年过去，考古学家 Jack 反复做着同一个梦，梦里那个白衣女子的脸越来越清晰，也让他对秦朝古物越来越着迷。好友 William 是个痴迷超自然能量的科学家，他拉上 Jack 去印度，看一座悬在半空的灵棺。William 一时手痒摘下祭坛上的宝石，灵棺当场坠地粉碎，两人被守墓侍卫与信众一路追杀，逃散途中 Jack 被印度少女 Samantha 带到高僧处暂避，老和尚一眼看出他困在一段前世的缘分里。回到西安，Jack 与 William 重逢，却也发现对方已经变了：William 把那颗能抵御地心引力的浮力宝石据为己有，还投靠了借学术之名盗墓走私的古先生。两个曾经出生入死的朋友，因为信念不同彻底决裂。Jack 独自乘直升机飞到郦山上空，纵身跳进那条与梦境一模一样的瀑布，隧道尽头是悬浮的天宫，还有等了他两千年的玉漱。可古先生带人接管天宫，妄图在此长生；混乱中 William 撬走机关上的宝石，天宫失去浮力，成千上万的兵马俑从空中坠落，水银四涌。影片 2005 年上映，走的是穿越与宿命的路子，把动作、奇幻与爱情揉在一起，是成龙中后期少见的带有史诗气质的作品。｜TMDB 6.4｜TMDB 6.4"
  date: 2005-05-11
  added: "2026-10-09 15:23"
  image: mv-305.jpg

- id: mv-306
  title: "新少林寺"
  category: 电影
  tags: ["电影", "动作", "剧情", "新少林寺 新少林寺"]
  quark_url: "https://pan.quark.cn/s/eb4adc67fdc0"
  description: "军阀少帅侯杰能征善战，也横征暴敛，直到被自己当兄弟看待的副官曹蛮出卖。一夜之间，妻子颜夕离他而去，女儿死在乱兵之中，曾经呼风唤雨的人只剩下满腔恨意。走投无路之际，他躲进了少林寺，在厨房里遇见了那个煮了一辈子饭的僧人悟道。悟道话不多，对佛法的领悟却深，日复一日的相处里，侯杰心里的那团火一点点被浇熄，也慢慢看明白了自己前半生究竟造了什么。寺中三位年轻僧人净能、净海、净空，起初与他并不对付，后来也成了可以托付的伙伴。大彻大悟之后，侯杰剃度出家。可外面的战火没有停：曹蛮带着手下索降图步步紧逼，灾民涌入寺中避难。昔日的少帅选择站在山门前，带着僧众护住这座寺和这些人。影片 2011 年上映，成龙在片中饰演悟道，戏份不重却是点题的那个人，整体基调沉郁，与他常见的喜剧路子差别明显。｜TMDB 6.8｜TMDB 6.8"
  date: 2011-01-20
  added: "2026-10-09 15:23"
  image: mv-306.jpg

- id: mv-307
  title: "一个好人"
  category: 电影
  tags: ["电影", "犯罪", "动作", "喜剧", "一个好人 一個好人"]
  quark_url: "https://pan.quark.cn/s/975269009225"
  description: "在墨尔本，华裔厨师积奇算得上小有名气，隔三差五上电视教人做菜，日子过得安稳。变故起于一场黑帮火并：毒枭金·卡洛清除了敌对帮派安插的卧底，又带人在仓库里大打出手，整场枪战被记者戴安娜的摄像机完完整整拍了下来。逃命路上戴安娜撞见积奇，积奇二话不说引开追兵救了她，可分手时两人拿错了袋子，戴安娜带走的是积奇的烹饪节目录像带，真正的证据反倒留在了他手上。戴安娜的住处很快被找上门，一无所获的歹徒顺藤摸瓜转向积奇。偏偏这时女友美琪远道而来，还特意去了节目录制现场，贩毒集团干脆把围捕搬到了摄影棚前。一场街头苦战之后积奇脱了身，可黄雀在后，敌对帮派掳走了美琪，点名要用那盘录像带换人。一盘带子，把积奇、警方和两个犯罪集团全卷了进来。这部 1997 年的作品在澳大利亚实景拍摄，动作戏与喜剧节奏延续了成龙的招牌配方，街头追逐与工地搏斗几段拍得相当漂亮。｜TMDB 6.6｜TMDB 6.6"
  date: 1997-01-31
  added: "2026-10-09 15:23"
  image: mv-307.jpg

- id: mv-308
  title: "风雨双流星"
  category: 电影
  tags: ["电影", "动作", "惊悚", "风雨双流星 風雨雙流星"]
  quark_url: "https://pan.quark.cn/s/88f2b51c0a4b"
  description: "江湖上提起梅星河，没人不怕他的夺命流星。这一日，剑侠柳青衣找上门来，邀他同去拜访另一位高手天魔星花无病。花无病的武功深不可测，日子却过得比谁都窝囊：妻子花雨夫人为了让他服帖，早在他身上下了毒，每年毒发时痛不欲生，只能低声下气去求解药，人对他也就予取予求。为了挣脱这根绳子，花无病请来梅星河，想借他的手除掉花雨夫人，把解药夺回来。可花雨夫人本身功夫了得，身边还围着满天星、鬼道士一干高手，这一战想不流血是不可能的。梅星河这边另有一层身份：他其实是朝廷刑部的密捕，多年前宫中遗失的如意七宝，嫌疑正落在花无病身上。上头授意他将计就计，答应下来，一边当刺客一边查案。江湖上的仇与宫里的宝，两条线就这么缠到了一起。这部 1976 年的片子属于成龙成名之前的古装武侠作品，那时他演的还是反派配角，身手已经相当利落。｜TMDB 4.8｜TMDB 4.8"
  date: 1976-08-21
  added: "2026-10-09 15:23"
  image: mv-308.jpg

- id: mv-309
  title: "蛇鹤八步"
  category: 电影
  tags: ["电影", "动作", "剧情", "蛇鹤八步 蛇鶴八步"]
  quark_url: "https://pan.quark.cn/s/e2cc04363a08"
  description: "武林中八大门派的掌门人聚到一处，合力钻研出一套前所未有的拳法，取名蛇鹤八步。拳法成了，人也出事了：八位掌门在功成之后尽数暴毙，那本拳谱也随之不知去向。侠客徐英风机缘巧合拿到了拳谱，从此麻烦缠身。各门各派认定东西在他手上，一路追杀不断；其中最难缠的是黑龙帮主钱狮，此人阴狠且不择手段，为了夺谱什么事都做得出来。徐英风腹背受敌，一边要应付整个武林的围堵，一边还想弄明白当年那八个人到底死在谁手里。拳谱是死的，凶手是活的，两件事搅在一起，每一步都踩在刀口上。这部 1978 年的作品是成龙早期主演的古装功夫片之一，故事走的是传统武侠的路数，拳脚设计扎实，蛇形与鹤形两种身法在片中有明确的区分，能看到他那时对动作细节的讲究，属于他谐趣风格成型之前的一次认真尝试。｜TMDB 6.5｜TMDB 6.5"
  date: 1978-03-08
  added: "2026-10-09 15:23"
  image: mv-309.jpg

- id: mv-310
  title: "英伦对决"
  category: 电影
  tags: ["电影", "动作", "惊悚", "犯罪", "英伦对决 The Foreigner"]
  quark_url: "https://pan.quark.cn/s/9734f85f4055"
  description: "关玉明在伦敦唐人街开着一家小餐馆，起早贪黑，日子过得本本分分。一场恐怖袭击把这一切炸得粉碎：女儿死在那场爆炸里，活生生的人只剩下一张照片。更让他寒心的是有关部门的推诿与不作为，该负责的人一个都找不到。为了给女儿讨一个说法，他拒绝了身边人林宝仪的劝阻，一个人走上了复仇的路。眼前这个人，不过是个上了年纪的餐馆老板，可他曾经在战场上学过的东西并没有忘记。他一次次找上那群人，逼他们交出名字，从街头一路追到权力中心的门口。随着关键人物汉尼斯浮出水面，一桩远比个人恩怨复杂得多的阴谋被扯了出来。2017 年的这部作品是成龙主动转型的一次尝试：全片几乎没有笑料，情绪压得极低，动作也刻意收起了华丽，走的是硬桥硬马的写实路子，跟他以往那些轻松热闹的作品形成了鲜明对比。｜TMDB 7.0｜TMDB 7.0"
  date: 2017-09-28
  added: "2026-10-09 15:23"
  image: mv-310.jpg

- id: mv-311
  title: "尖峰时刻3"
  category: 电影
  tags: ["电影", "动作", "喜剧", "犯罪", "尖峰时刻3 Rush Hour 3"]
  quark_url: "https://pan.quark.cn/s/226a35d71096"
  description: "李探长与贫嘴的卡特凑到一起，本来就意味着麻烦。上一次任务过去没多久，新的一桩就砸了过来：一直在收集三和会犯罪证据的韩领事被人当街暗杀，李探长追凶追红了眼，自责压得他喘不过气。此时的卡特早被贬去当交警，一腔热心办的全是倒忙，可这对组合还是凑到了一起。顺着韩领事留下的线索，他们一路追到巴黎，那座城市正是三和会藏得最深的地方。查案之外还有一件事压在李探长肩上：他要护住韩领事长大成人的女儿苏阳。等到真正的杀手站到面前，李探长才发现那是他小时候在孤儿院一起长大的兄弟 Kenji。旧情与职责正面撞上，这一关比任何一场打斗都难过去。这部 2007 年的作品把舞台搬到了巴黎，动作场面延续了系列一贯的搭档互补路数，李探长的沉稳与卡特的喋喋不休依旧是最好笑的部分。｜TMDB 6.5｜TMDB 6.5"
  date: 2007-08-08
  added: "2026-10-09 15:23"
  image: mv-311.jpg

- id: mv-312
  title: "双龙会"
  category: 电影
  tags: ["电影", "动作", "喜剧", "犯罪", "双龙会 双龙会"]
  quark_url: "https://pan.quark.cn/s/95450b86564b"
  description: "一对双胞胎兄弟刚出生就遇上劫匪，从此天各一方。弟弟被一个舞女抱走，在底层摸爬滚打长大，成了浑身江湖气的玩命，替朋友出头时认识了歌女芭芭拉，也顺手把黑帮给得罪了。哥哥被一对有钱夫妇带去美国，一路读上去，成了小有名气的音乐家，回香港开音乐会时认识了世伯家的女儿唐心。两条线在一个偶然的岔口撞到了一起：两人误打误撞互换了身份，走进了对方的生活。身边的人分不清谁是马友谁是玩命，笑话一个接一个，两位姑娘的心思也开始摇摆。音乐厅里，玩命胡乱挥了几下指挥棒，居然大获成功；另一边，马友被黑帮逼着开车去救人质。等到真相摊开，兄弟俩终于站到了一起，联手对付共同的敌人。1992 年的这部片子让成龙一人分饰两角，靠剪辑与替身完成了大量同框对手戏，在当年算得上相当费功夫的精细活，喜剧效果也出得很足。｜TMDB 6.9｜TMDB 6.9"
  date: 1992-01-15
  added: "2026-10-09 15:23"
  image: mv-312.jpg

- id: mv-313
  title: "特务迷城"
  category: 电影
  tags: ["电影", "动作", "喜剧", "惊悚", "特务迷城 特務迷城"]
  quark_url: "https://pan.quark.cn/s/65deb6030e78"
  description: "小北在健身器材店卖货，从小练过几手，还多了一种说不清的预感能力，总觉得自己天生该干特务这一行。某天他在银行里凭直觉和身手把劫匪当场摁住，一下子成了新闻人物，也引来了一位私家侦探。对方怀疑他是韩国客户朴元正失散多年的儿子，带着他去见了朴元正的律师。小北拗不过好奇心，跟着去了韩国。人刚见到，朴元正就过世了。从美国女记者福喜那里，他才知道朴氏夫妇原来是著名的双重特务。照着遗言往下走，小北在福喜的帮助下转去土耳其，找到一笔巨款，也遇见了神秘的女子咏。正当他有点飘的时候，一连串莫名其妙的袭击接连落到头上，他这才反应过来：自己早就被卷进了一张看不见的网里。这部 2001 年的作品把动作与悬疑拧在了一起，取景横跨香港、韩国与土耳其，是成龙千禧年前后一次风格上的尝试，动作戏依旧搏命，故事则比他以往的作品绕得多。｜TMDB 6.0｜TMDB 6.0"
  date: 2001-01-18
  added: "2026-10-09 15:23"
  image: mv-313.jpg

- id: mv-314
  title: "邻家特工"
  category: 电影
  tags: ["电影", "动作", "喜剧", "家庭", "邻家特工 The Spy Next Door"]
  quark_url: "https://pan.quark.cn/s/98b34d06ba31"
  description: "鲍伯是那种写在档案里会让人倒吸一口凉气的特工：单枪匹马端过匪巢，拦下过炸弹，堵过毒贩。可脱下那身行头，他只是个戴着黑框眼镜、看上去毫不起眼的华裔中年男人。他打算退休了，索性搬到女朋友吉莉安家隔壁。眼下的新任务比任何一次卧底都棘手：吉莉安临时出门几天，把三个孩子交给他照看。三个孩子都不是他的骨肉，也都不太待见他。一个干了半辈子特工的人，既不会做饭也不会哄人，头几天几乎是一场灾难。好不容易磨出一点信任，其中一个孩子误打误撞从电脑上下载了一段秘密编码。这下好了，俄罗斯的恐怖分子来了，别国的特工也来了，本来平静的街区瞬间变成了战场。鲍伯别无选择，只能带上三个孩子，重新拿起那套工具，一边护住他们一边跟这帮人周旋。2010 年的这部片子是成龙在好莱坞交出的又一部家庭向动作喜剧，笑点主要在「特工带娃」这个反差上，属于轻松的合家欢作品。｜TMDB 5.9｜TMDB 5.9"
  date: 2010-01-15
  added: "2026-10-09 15:23"
  image: mv-314.jpg

- id: mv-315
  title: "飞渡卷云山"
  category: 电影
  tags: ["电影", "动作", "飞渡卷云山 飛渡捲雲山"]
  quark_url: "https://pan.quark.cn/s/9bf41c183edb"
  description: "丁冲在江湖上有个响亮的诨号叫豹子，凭的是一双铁拳。这一回他和两位朋友常无意、张聋子接了趟活：护送一名病重的人去京城找叶神医。病人等不起，只能抄近路走卷云山。可卷云山这三个字，近十年没几个人敢提：山上盗贼盘踞，各路亡命之徒都往那儿钻，进去的人多，出来的人少。三个人硬着头皮往上走，迎接他们的是一环扣一环的陷阱，暗器、机关、埋伏，几乎每一步都踩在生死线上。靠着各自的机智与过硬的身手，他们破了一阵又一阵，闯过一关又一关。越是往里走，越觉得这趟活不对劲，等到最后真相摊开，三个人才发现自己从头到尾都蒙在鼓里。这部 1978 年的作品是成龙早期主演的古装功夫片，走的是闯关式的结构，动作设计一关一换花样，观感上更像一场接一场的擂台，跟他后来那些带着喜剧节奏的作品不太一样。｜TMDB 6.1｜TMDB 6.1"
  date: 1978-04-27
  added: "2026-10-09 15:23"
  image: mv-315.jpg

- id: mv-316
  title: "上海正午2：上海骑士"
  category: 电影
  tags: ["电影", "冒险", "喜剧", "西部", "上海正午2：上海骑士 Shanghai Knights"]
  quark_url: "https://pan.quark.cn/s/b05188c58726"
  description: "1887 年，强在美国西部一个小镇上做治安官，日子过得安稳。一封家书把这一切打碎：看护玉玺的父亲被人杀死，玉玺下落不明，妹妹铃一路追着凶手到了英国。强立刻动身，先去纽约找老朋友罗伊。他原本指望上次那笔皇家黄金能派上用场，谁知风流又爱吹牛的罗伊早把钱赌了个精光，如今沦落到在餐厅当侍应。埋怨归埋怨，强还是带上他一起去了英国。先一步抵达的铃已经盯了仇人雷斯本好些日子，顺着这条线往下摸，一桩牵扯清、英两国的大阴谋浮出水面：私生子出身的皇帝之弟吴超，为了夺取皇位与雷斯本联手，抢走玉玺正是兵变的第一步。强赶到的时候，留给他周旋的时间已经不多了。为了替父亲报仇，也为了家族的荣誉，他决定不惜代价阻止吴超。这部 2003 年的作品是《上海正午》的续集，把舞台从美国西部搬到了维多利亚时代的伦敦，动作与笑料依旧靠两个性格南辕北辙的搭档撑起来。｜TMDB 6.1｜TMDB 6.1"
  date: 2003-02-06
  added: "2026-10-09 15:23"
  image: mv-316.jpg

- id: mv-317
  title: "宝贝计划"
  category: 电影
  tags: ["电影", "剧情", "动作", "喜剧", "宝贝计划 寶貝計劃"]
  quark_url: "https://pan.quark.cn/s/a11c815c65b2"
  description: "人字拖有一身好身手，人却活得没个方向，赌瘾缠身，跟包租公、八达通搭伙干些偷偷摸摸的勾当。改变是从一个婴儿开始的。城中女富豪唯一的孙子刚出生，包租公抵不住那笔钱的诱惑，答应把孩子偷出来交给黑帮老大，对方想确认这孩子是不是自己死去的儿子留下的骨肉。孩子到手了，麻烦也跟着来了。三个人围着这个还不会说话的小东西团团转，喂奶、换尿布、哄睡，一件比一件难。日子一天天过去，人字拖开始惦记起家里人，八达通也第一次看清了自己老婆这些年的不容易。人心在变，外头的压力却越来越紧：包租公和黑帮步步紧逼，非要他们把孩子交出去不可。到这一步，交还是不交，已经不是一道能用钱算清的题。2006 年的这部片子把成龙式的动作喜剧套进了育儿日常里，笑料多来自几个大男人被婴儿折腾得手忙脚乱，温情也在其中一点点攒起来。｜TMDB 7.0｜TMDB 7.0"
  date: 2006-09-28
  added: "2026-10-09 15:23"
  image: mv-317.jpg

- id: mv-318
  title: "奇谋妙计五福星"
  category: 电影
  tags: ["电影", "动作", "冒险", "喜剧", "奇谋妙计五福星 奇謀妙計五福星"]
  quark_url: "https://pan.quark.cn/s/d723a6e39ebd"
  description: "五个人在看守室里认识，出来时成了兄弟：茶壶、死气喉、卷毛积、凡士林、鲁奇，个个都是因为小偷小摸或者跑龙套栽进去的冤大头。五个人同一天放出来，约好了重新做人，东拼西凑开了家清洁公司，老老实实上门打扫。生意刚起步，麻烦就找上门了。黑帮在一次假钞电版交易时被个愣头愣脑的警察撞破，慌乱中把电版塞进了五福星的清洁车。五个毫不知情的人，就这样稀里糊涂成了江湖上的焦点：警察认定他们是黑帮同伙，四处通缉；黑帮则要杀人灭口，把电版拿回去。两边都在找他们，而他们连电版长什么样都没见过。进退无路，只能靠这几个人各显其能，想办法把这道死局解开。1983 年的这部片子是「福星」系列的开山之作，群戏是它最大的本钱，五个人各有各的滑稽毛病，动作与笑料穿插得很密，成龙在片中的戏份虽不是最重，几场打斗依旧亮眼。｜TMDB 7.0｜TMDB 7.0"
  date: 1983-07-07
  added: "2026-10-09 15:23"
  image: mv-318.jpg

- id: mv-319
  title: "快餐车"
  category: 电影
  tags: ["电影", "爱情", "动作", "喜剧", "快餐车 快餐車"]
  quark_url: "https://pan.quark.cn/s/2b65b069ba12"
  description: "托马士和大卫在西班牙靠一辆快餐车过日子，另一个华侨胖子毛比在侦探社里做事，社长躲债去了，他索性自己接活。这天来了位客人，要求十四天内找到一个叫哥莉亚的女人和她的女儿苏维亚，线索只有一张照片，外加一句「她曾流落风尘」的传闻。毛比拉上托马士和大卫一起找，不久就在一家精神病院里找到了当扒手的苏维亚，也把她的真实身份揭了出来：她要找的人其实是某位伯爵的女儿，背后牵着一笔巨额遗产，以及她堂兄精心布下的夺产阴谋。几个人就这么从街头一路查到古堡。到了收尾，自然少不了一场硬碰硬的苦战。这部 1984 年的作品是成龙、洪金宝、元彪三师兄弟继《A计划》之后再度合体，全片远赴西班牙拍摄，欧式古堡与街巷都成了动作戏的舞台，三个人各展所长，配合得相当顺手。｜TMDB 6.9｜TMDB 6.9"
  date: 1984-08-17
  added: "2026-10-09 15:23"
  image: mv-319.jpg

- id: mv-320
  title: "醉拳3"
  category: 电影
  tags: ["电影", "动作", "喜剧", "醉拳3 醉拳III"]
  quark_url: "https://pan.quark.cn/s/158f9798597c"
  description: "袁世凯一心要登基称帝，为此笃信邪教，教主送他一枚玉扳指，说是能保他事成。谁知袁世凯转手把扳指送给了四王爷的三公主沈玉，还打算立她为皇后。教主得知后勒令他必须把扳指收回来。与此同时，潜伏在袁世凯身边的革命党干部杨君，为了阻止他登基，干脆把沈玉掳走了。李督军奉命沿途追索杨、沈二人，杨君路过宝芝林时碰上黄麒英，便把护送沈玉的重任托付给了黄家父子。黄飞鸿是个醉拳迷，这一趟正合他的心意。护送途中他们遭到密探截杀，汽车一头撞进了仁伯的酒庄。这位深藏不露的醉拳高手出手替二人解了围，转头又扣下他们做工抵偿酒庄的损失。一枚玉扳指把各路人马都卷了进来，李督军随后率军赶到，酒庄里外掀起连场激战。1994 年的这部作品是《醉拳》系列的第三部，黄飞鸿由季天笙饰演，刘家良执导并出演醉拳高手仁伯，拳脚设计依旧是南派醉拳的路子，风格比起前两部更热闹也更夸张。｜TMDB 6.1｜TMDB 6.1"
  date: 1994-07-02
  added: "2026-10-09 15:23"
  image: mv-320.jpg

- id: mv-321
  title: "奇迹"
  category: 电影
  tags: ["电影", "犯罪", "动作", "喜剧", "奇迹 奇蹟"]
  quark_url: "https://pan.quark.cn/s/eb85c8c1a812"
  description: "郭振华一个人到香港讨生活，人生地不熟，因为一次路见不平被卷进两派黑帮的火并，稀里糊涂坐上了大哥的位置。他自己都觉得蹊跷，细想下来，认定是街边卖花的玫瑰夫人给他带来了好运，从此逢谈判、出门之前，必定先去买她一支玫瑰，求个心安。手里的丽池饭店被他改成夜总会经营，前任老板的女儿杨露明为了还债上台表演，没想到一炮而红，两个人的关系也在日复一日的相处里起了变化。盯上这门生意的福建帮开始频频发难，郭振华照例先去找玫瑰夫人求运，却发现这位给他带来好运的老人自己正陷在更大的困境里：为了让在外地读书的女儿安心，她编造了一个体面的身份，如今眼看就要被戳穿。出于感激，郭振华决定帮她把这个谎圆下去，一连串的笑料也就此展开。1989 年的这部作品由成龙自导自演，是他最花心思的一部，场面调度与群戏编排都相当讲究，温情与笑料配得比他同期任何一部都足。｜TMDB 7.1｜TMDB 7.1"
  date: 1989-06-15
