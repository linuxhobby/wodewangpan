  quark_url: "https://pan.quark.cn/s/fd101acc4bc0"
  description: "未来的世界，科技的力量胜过一切，基因决定命运，几乎成为金科玉律。不幸文森特（伊桑·霍克 Ethan Hawke 饰）是一个基因不良的人，出生以来就决定了他近视和心脏病的缺陷，他只能活到30岁。 于是父母为文森特增添了一个有着优良基因的弟弟。文森特的梦想是漫游太空，然而恶劣的基因令他无法圆梦，直到他遇到了太空中心的杰罗姆（裘德·洛 Jude Law 饰）。杰罗姆有优秀的基因，却在一次意外中半身瘫痪。 二人决定调换身份，文森特千方百计隐藏自己的基因信息，每天都认真清洗掉自己的皮屑毛发，不暴露任何蛛丝马迹。另一方面，杰罗姆帮他筹备进入太空前需要检查的基因物品。事情进展得非常顺利，然而一桩谋杀案和一根…｜TMDB 7.6"
  date: 1997-07-09
  added: 2026-09-30
  image: mv-129.jpg

- id: mv-130
  title: "退伍军官"
  category: 电影
  tags: ["电影", "动作", "犯罪", "剧情", "退伍军官 सूबेदार"]
  quark_url: "https://pan.quark.cn/s/acff705ecb1a"
  description: "《退伍军官》是一部印度动作片，主人公退役准尉阿尔俊·莫里亚在军队里待了大半辈子，回到平民社会之后并没有真正安顿下来：妻子去世这件事他始终没能过去，和女儿的关系也一天比一天疏远。好不容易开始了新的生活，一次鲁莽的行为却把这一切彻底打乱，旧伤被重新撕开——对于那些当了半辈子兵的人来说，所谓「过去的事」从来不会被真正放下。于是他只能把心里那个当兵的部分重新唤醒，去打一场离自己非常近的仗。这类印度动作片通常都要有蓄力与爆发，本片也不例外，前半段铺得比较耐心，看点在后半程集中释放。影片真正的内核其实是父女关系：一个是习惯了用命令和纪律解决问题的老兵，一个是想要自己生活的年轻人，两个人的沟通方式完全不同，而外面发生的这场冲突，最终是把这条线重新接到一起的方式。缺点是整体故事比较常规，部分情节略显冗长，歌舞段落与全片的军人基调也有些脱节。推荐给喜欢退役军人题材的观众。｜TMDB 6.8"
  date: 2026-03-05
  added: 2026-09-30
  image: mv-130.jpg

- id: mv-131
  title: "战·争"
  category: 电影
  tags: ["电影", "战争", "动作", "战·争 Warfare"]
  quark_url: "https://pan.quark.cn/s/c7cde984561a"
  description: "《战·争》取材自前海豹突击队成员雷·门多萨的亲身经历，这一点决定了它的拍法：没有战略地图，没有宏观视角，镜头几乎从没离开过那栋房子。故事相当简单——一支海豹小队在伊拉克的一处民宅里设立哨站执行监视任务，任务本身平淡到甚至有些沉闷，直到周围有人开始动。敌军大举围攻之后，整支队伍被困在屋子里：弹药有限，医疗物资见底，有一名队员伤势危重，唯一的出路是等装甲车开来。影片的时间几乎是实时的，也就是说，观众体验到的漫长、焦虑、耳鸣与干渴，和屋里的人是同一种节奏。它拒绝把这些人拍成传统意义上的英雄，也拒绝做任何远超必要的解说，群像之间的分工、争执与默契全靠细碎的对话撑起来。导演把重点放在了现场感上：枪声的距离感、伤员的处置细节、众人等待无线电回话的那几十秒，都拍得很实。缺点是这种设计对你的耐心要求不低，前一小时几乎没有传统意义上的推进。适合喜欢不求爽感、愿意看一场「当时就是这么回事」的战争片的观众。｜TMDB 7.1"
  date: 2025-04-09
  added: 2026-09-30
  image: mv-131.jpg

- id: mv-132
  title: "雷霆特攻队"
  category: 电影
  tags: ["电影", "动作", "科幻", "冒险", "雷霆特攻队 Thunderbolts*"]
  quark_url: "https://pan.quark.cn/s/80f4bc25361b"
  description: "娜塔莎牺牲后，叶莲娜·贝洛娃始终无法摆脱内心的失落，在多年替瓦伦蒂娜执行秘密任务之后，也逐渐厌倦了这种生活。一次她被派往沙漠中的秘密设施清除目标，却在那里先后遇到约翰·沃克、幽灵和模仿大师。众人很快发现，他们其实都被瓦伦蒂娜安排来互相灭口，而整座设施也成了销毁秘密与证据的死亡陷阱。逃脱过程中，他们还遇到一个失去记忆、来历不明的男子鲍勃，他的存在似乎与瓦伦蒂娜隐藏的实验有关。与此同时，已成为国会议员的巴基·巴恩斯正在追查瓦伦蒂娜的秘密行动，红色守卫者阿列克谢也因叶莲娜陷入危险而加入其中。这群彼此缺乏信任、各自背负失败与创伤的人不得不临时合作，共同面对一场远超预料的危机。影片的看点在于一群反英雄如何凑成队伍，前半小时就把人凑齐了。心理创伤这条线被反复提起，是这群人唯一的共同点。动作戏偏近身，情绪线比一般同类片重。适合关注这些角色的观众。｜TMDB 7.3"
  date: 2025-04-30
  added: 2026-09-30
  image: mv-132.jpg

- id: mv-133
  title: "十二怒汉"
  category: 电影
  tags: ["电影", "剧情", "十二怒汉 12 Angry Men"]
  quark_url: "https://pan.quark.cn/s/125ec8337814"
  description: "西德尼·吕美特的导演处女作，也是影史上被反复提起的法庭剧。改编自雷金纳德·罗斯的电视剧，故事几乎全发生在一间闷热的房间里：十二名陪审员要裁定一名被控弑父的少年是否有罪，十一人急着定罪，只有亨利·方达饰演的那一位投下反对票。影片的乐趣在于看合理怀疑如何一点点被建立起来——不是靠新证据，而是靠把每个人默认的假设挨个拆开。群像写得清楚，十二个人各有立场，也各有私心，争论从案件本身慢慢转向各自的处境，脾气、偏见和良心在闷热里一层层剥落。它对空间的利用极其讲究，镜头随着讨论的推进从宽敞走向逼仄，黑白影像和封闭空间的处理是教科书级别的，很多后来的作品都在学它。不到两个小时，节奏干净利落，全靠对话和表演推动。它对司法程序中多数决的质疑，放在今天依然成立。适合任何还没看过它的观众。｜TMDB 8.6"
  date: 1957-04-10
  added: 2026-09-30
  image: mv-133.jpg

- id: mv-134
  title: "不列颠之战"
  category: 电影
  tags: ["电影", "战争", "历史", "动作", "不列颠之战 Battle of Britain"]
  quark_url: "https://pan.quark.cn/s/4e6d4f9c5f2d"
  description: "上世纪四十年代初，德国进攻英国前夕，瑞士的里克特男爵向英国大使凯利建议采取和平态度，认为抵抗纳粹无异于以卵击石；凯利拒绝接受，宣称英国将抗战到底。彼时英国的处境极其险恶：陆军在法兰西战役中损失惨重，本土只剩下 780 门火炮、160 门反坦克炮和 200 辆坦克；空军同样受创，损失约千架飞机，牺牲了 435 名富有经验的飞行员。皇家空军上将道丁察觉大战迫在眉睫，他需要更多的飞机和飞行员。不久之后，丘吉尔宣布不列颠之战正式开始。影片的兴趣在于把这些数字摆出来——它不是英雄传奇，而更像一本关于国家资源的账本。它对指挥体系和雷达的使用做了专门交代，这正是这场战役的关键。空战场面的规模在当年相当可观，群星阵容也是一大卖点。适合喜欢二战空战题材、想看一段偏纪实处理的观众。｜TMDB 6.8"
  date: 1969-09-15
  added: 2026-09-30
  image: mv-134.jpg

- id: mv-135
  title: "三岔口"
