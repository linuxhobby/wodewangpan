  description: "《冥界警局》的设定本身就挺好玩：人死之后不是去休息，而是接着上班。杰夫·布里吉斯饰演的老警探罗伊已经死了好几百年，性情粗粝、枪法精准，满嘴都是上个世纪的行话；瑞安·雷诺兹饰演的尼克刚刚在一次缉毒行动中被同伙出卖而死，醒来就发现自己被编进了这个部门。规则很清楚：服役满一百年才有机会回去，尼克不愿认命，于是两人成了搭档，负责处理那些以人类外形混迹人间、不服管束的亡魂。影片走的是典型的双警探喜剧路子：一个老油条带一个新来的，互相嫌弃又不得不合作，插科打诨的部分占了相当比重。两位主演的互动是主要看点，老戏骨一本正经地胡说八道配上后者的吐槽，笑点密度还算可观。视觉设计有些意思：这些不死警探在人间显出的状态与常人不同，造型相当荒诞。缺点是故事相当套路，反派的阴谋毫无悬念，动作场面的特效在今天看已经发假，整体像是九十年代那种暑期档爆米花。看完就忘，但过程还算轻松。推荐给喜欢《黑衣人》那类超自然搭档喜剧、只想打发一个下午的观众。｜TMDB 5.9"
  date: 2013-07-18
