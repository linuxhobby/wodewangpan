  description: "《极寒潜袭》把两条线拧在了一起：一艘俄罗斯的导弹核潜艇在格陵兰海执行秘密任务时失联，北方舰队最年轻的司令维克托·沃罗宁奉命带队前去搜寻——而失踪潜艇的指挥官正是他的亲哥哥；与此同时，一座极地考察站被彻底毁掉，北方海域里出现了说不清的东西。于是潜艇灾难片与深海怪物片在这部电影里凑到了同一个剧本里：一边是钢铁、水压、氧气读数这些潜艇片的标准紧张感，一边是冰海之上那种格外压抑的孤立感。影片的长处在氛围——北方海域的实景拍得相当冷冽，灰蓝色的水面、浮冰、舰桥上的白气，都让人感受到这个地方不适合人类。两兄弟之间的那条线给这趟搜救加了重量，弟弟要在职责与亲情之间做选择。缺点是两条线的融合略显生硬，怪物的呈现并不总是让人满意，特效水平波动较大。整体上适合喜欢潜艇题材、或者对极地背景下军事科幻有兴趣、能接受慢热节奏的观众。｜TMDB 6.8"
