  baidu_code: "bqvm"
  description: "江涛是个在江湖边上打转的小人物，没什么真本事，英雄梦倒做得比谁都勤。他在一处庄园里当杂役，某天撞破总管的女客人在练五毒邪功，吓得夺路就逃。他不知道的是，这位女客正是五毒教掌门苗春花，正与总管盘算着半路截下神威镖局护送的万年活玉与九转返魂丹。逃亡路上又生枝节：江涛碰上神鞭大侠与采花贼同归于尽，干脆冒了神鞭大侠的名去领悬赏，这一冒名反倒引来一个神秘老乞丐的注意。五毒教的人追上来时，是老乞丐出手救了他。江涛索性拜了师，老乞丐交给他一件信物，让他去找押送宝物的神威镖局总镖师方威。见到镖局众人，他又对方威的女儿一见钟情，于是铁了心跟着队伍护宝上路。这一路强敌一个接一个，比他想象的要难走得多。1978 年的这部片子是成龙早期谐趣武侠的代表，武功设计半是真功夫半是胡闹，笑料密度大，跟他后来都市题材的动作片完全是两种趣味。｜TMDB 6.2｜TMDB 6.2"
