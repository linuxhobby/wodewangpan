  quark_url: "https://pan.quark.cn/s/fc9d67f6a729"
  description: "讲述1909年在远离祖国的哈尔滨为夺回即将落入日本帝国之手的祖国而拼命的独立斗士们的故事。 玄彬将饰演大韩义军参谋中将安重根一角，朴正民饰演比起留下的名字，更先考虑国家的独立斗士禹德顺一角，赵祐镇将饰演与安重根（玄彬 饰）一起为找回失去的祖国 而努力的独立斗士金尚贤一角，全余赟将饰演独立军孔夫人，刘在明将饰演安重根义士的助手崔在亨，朴勋将饰演日本帝国的森田雄。影片将在拉脱维亚和蒙古拍摄外景。 1909年10月26日，安重根在中国哈尔滨成功刺杀了侵略朝鲜的元凶、前日本首相伊藤博文，当场被捕。日本关东都督府地方法院判处安重根绞刑，于1910年3月26日在中国旅顺就义。安重根被当今朝鲜和韩国分别称为…｜TMDB 7.3"
