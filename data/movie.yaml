  baidu_code: "p5di"
  description: "《战·争》取材自前海豹突击队成员雷·门多萨的亲身经历，这一点决定了它的拍法：没有战略地图，没有宏观视角，镜头几乎从没离开过那栋房子。故事相当简单——一支海豹小队在伊拉克的一处民宅里设立哨站执行监视任务，任务本身平淡到甚至有些沉闷，直到周围有人开始动。敌军大举围攻之后，整支队伍被困在屋子里：弹药有限，医疗物资见底，有一名队员伤势危重，唯一的出路是等装甲车开来。影片的时间几乎是实时的，也就是说，观众体验到的漫长、焦虑、耳鸣与干渴，和屋里的人是同一种节奏。它拒绝把这些人拍成传统意义上的英雄，也拒绝做任何远超必要的解说，群像之间的分工、争执与默契全靠细碎的对话撑起来。导演把重点放在了现场感上：枪声的距离感、伤员的处置细节、众人等待无线电回话的那几十秒，都拍得很实。缺点是这种设计对你的耐心要求不低，前一小时几乎没有传统意义上的推进。适合喜欢不求爽感、愿意看一场「当时就是这么回事」的战争片的观众。｜TMDB 7.1"
