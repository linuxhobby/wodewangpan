  category: 电影
  tags: ["电影", "冒险", "剧情", "动作", "十三刺客 十三人の刺客"]
  quark_url: "https://pan.quark.cn/s/7ad5c5d6e4d0"
  description: "《十三刺客》是三池崇史执导的时代剧，翻拍自 1963 年的同名经典。故事背景是幕府末期：将军的异母弟弟斋藤昭道手握权势、荒淫残暴，奸杀无辜却因出身而凌驾于法纪之上，无人能治。眼看着此人即将接任要职，一位正直的武士暗中受命：组建一支十三人的刺客小队，在半路上将这个恶魔除掉。影片的前半段是招兵买马的过程，节奏克制，主要交代每个人的来历与赴死的理由——有人为报私仇，有人为还人情，有人纯粹觉得该这么做。后半段则完全释放：影片最后整整四十五分钟是一场发生在山间宿场的伏击战，从设陷阱、封路到逐门逐户厮杀，刀光、泥浆、血水混作一处，把「以十三人对抗百余人」的悬殊感拍得极其具体。这段长镜头般的连续决战在整个类型片史上都极为罕见，看完就知道为什么会被反复提起。缺点在于前半人物众多却笔墨有限，不熟悉日本题材的观众前二十分钟可能要捋清谁是谁。强烈推荐给喜欢時代剧、武士片或对「小队伏击」这种军事化调度着迷的观众。｜TMDB 7.3"
  date: 2010-09-25
  added: 2026-09-30
  image: mv-180.jpg

- id: mv-181
  title: "双宝斗恶魔"
  category: 电影
  tags: ["电影", "喜剧", "恐怖", "双宝斗恶魔 Tucker and Dale vs. Evil"]
  quark_url: "https://pan.quark.cn/s/f4a93e505c9f"
  description: "《双宝斗恶魔》是一部聪明的反类型恐怖喜剧，它的核心笑点就是把视角彻底翻转：那些在恐怖片里最先死掉的「乡下人」，在这部片子里才是主角。塔克和戴尔是两个结伴去林子里翻修小屋的老好人，性格憨厚，长相和打扮比较粗犷，说话不太利索。与此同时，一群放假来露营的大学生正好也在附近。两边第一次照面就出了岔子：学生们把他们当成了传说中的森林杀手，认定这俩人要杀人。接下来就是一连串由误会推动的死亡——其中一个女生溺水被救上岸，学生们的解读却是「她要被拖进林子」；于是他们一个接一个地跑去「救人」，结果每一个都在自己制造的混乱中把自己送走。塔克和戴尔从头到尾都很困惑：为什么这帮年轻人非要跑到我们的地方来自杀？影片的乐趣完全建立在这种错位上，血腥场面够直白，死法也足够荒唐，笑点与恶心几乎同时在发生。角色讨喜，两位主角的友谊写得真诚。推荐给喜欢《僵尸肖恩》那种把类型片规矩倒过来玩的观众。｜TMDB 7.4"
  date: 2010-01-22
  added: 2026-09-30
  image: mv-181.jpg

- id: mv-182
  title: "危情谍战"
  category: 电影
  tags: ["电影", "动作", "喜剧", "危情谍战 Knight and Day"]
  quark_url: "https://pan.quark.cn/s/16adf8b6c436"
  description: "平凡无奇的美女汽车修理师茱恩·哈文斯（卡梅隆·迪亚茨 Cameron Diaz 饰）如何也想不到，她回家的路途竟会变得如此漫长而险象环生。最初，她一波三折登上了开往家乡波士顿的神秘航班，机上乘客寥寥，茱恩与在机场有过短暂接触并拥有迷人气质的陌生男子罗伊·米勒（汤姆·克鲁斯 Tom Cruise 饰）相谈甚欢。看起来一段浪漫美好的旅途恋情即将展开，谁知短短几分钟过后，机舱便被恐怖肃杀的氛围所替代。除罗伊外，所有乘客和飞行员全部毙命。原来罗伊的正体是一名训练有素、身手不凡的特工，他持有一枚重要的电池，而这也成为一众叛徒特工不择手段急于得手的主要原因。茱恩也许猜对了结局，却根本没有猜到过程。在接下来…｜TMDB 6.2"
  date: 2010-06-15
  added: 2026-09-30
  image: mv-182.jpg

- id: mv-183
  title: "危情时速"
  category: 电影
  tags: ["电影", "动作", "惊悚", "危情时速 Unstoppable"]
  quark_url: "https://pan.quark.cn/s/31bc5e4b5cd4"
  description: "宾夕法尼亚州南部的布鲁斯特市，资深火车机师弗兰克·巴恩斯即将提前退休。他和伙伴们对公司出于成本考虑雇用便宜又没经验的新人颇有意见，这天早晨他迎来新搭档、年轻气盛的领航员威尔·科尔森。同一时间，北部的富勒站出了状况：满载危险化学品的 777 号列车在无人驾驶的情况下自行开走，朝着人口密集的城镇冲过去。影片几乎没有多余的铺垫，危机在开场不久就立住，之后一路加速，片长控制得紧，没有多余的支线。它的紧张感建立在非常具体的物理事实上——一列满载的火车要停下有多难，弯道和坡道各自意味着什么。实拍的比例很高，镜头经常贴在车身和铁轨上，速度感是真实产生的。它对铁路公司内部推诿和成本优先的批评相当直接，是影片少有的表态。两个主角的代际摩擦是唯一的人文线，从互相看不顺眼到彼此托付，写得不算新鲜但有效。结尾的处置场面拍得相当直接。｜TMDB 6.6"
  date: 2010-11-04
  added: 2026-09-30
  image: mv-183.jpg

- id: mv-184
  title: "变脸"
  category: 电影
  tags: ["电影", "动作", "犯罪", "科幻", "变脸 Face/Off"]
  quark_url: "https://pan.quark.cn/s/5d265cf63d3a"
  description: "《变脸》大概是九十年代最「想得出来」的一个设定：联邦探员肖恩·阿彻追捕恐怖分子卡斯特·特洛伊多年，两人各自失去了至亲，恩怨已经过了理性的边界。为了阻止一场即将发生的袭击，阿彻做了一个近乎荒唐的选择——接受一项尚未公开的手术，把特洛伊的脸移植到自己脸上，顶着敌人的面孔混进去。影片从这里开始才真正发力：换这张脸不只是换皮，还意味着他要接受对方的妻子、同伙和过去。麻烦在于对方并没有死，醒来之后立即报复，强迫医生把自己变成了阿彻。于是最可怕的事情发生了：一个恶棍堂而皇之地住进了受害者的房子，用他的脸吃他家的饭。吴宇森的拍法让这场荒诞变得可信——双枪、白鸽、慢镜，以及那场经典的「镜子」对峙，两个人对着玻璃里的自己开火，这是动作片史上最聪明的一场戏。两位主演也交换了表演方式，几乎可以只看一边的表情判断现在是谁。强烈推荐给所有动作片观众。｜TMDB 7.1"
  date: 1997-06-27
  added: 2026-09-30
  image: mv-184.jpg

- id: mv-185
  title: "变相怪杰"
  category: 电影
  tags: ["电影", "喜剧", "奇幻", "犯罪", "变相怪杰 The Mask"]
  quark_url: "https://pan.quark.cn/s/33c3e55761c5"
  description: "银行小职员斯坦利（金•凯瑞 Jim Carrey 饰）老实本分，过着和所有老实人一样的平凡生活。一次，斯坦利在接待金发美女蒂娜（卡梅隆•迪亚茨 Cameron Diaz 饰）时深深恋上了对方，不料蒂娜却是黑帮头目多利安（彼得•格林纳 Peter Greene 饰）抢劫银行前派来打探地形的。多利安随后成功抢劫了斯坦利所在的银行。一晚，斯坦利意外获得了一个奇怪的面具。戴上面具后的斯坦利变得力大无比、身手敏捷。斯坦利开始四出捉弄平日欺负他的人，并抢走了多利安劫得的巨款，与蒂娜在夜总会尽情飞舞。多利安知道了面具的威力后，用计夺走了面具，斯坦利则被关进了监狱。斯坦利最后能否凭自己的智慧夺回面具，与蒂娜有…｜TMDB 7.0"
  date: 1994-07-29
  added: 2026-09-30
  image: mv-185.jpg

- id: mv-186
  title: "后天"
  category: 电影
  tags: ["电影", "科幻", "惊悚", "冒险", "后天 The Day After Tomorrow"]
  quark_url: "https://pan.quark.cn/s/9a10c96593b6"
  description: "气候学家杰克·霍尔在研究中发现，全球变暖和极地冰川融化可能扰乱洋流循环，让地球在很短时间内陷入极端气候。他的警告没能换来足够的重视，不久后异常天气开始席卷各地：巨型冰雹、龙卷风、暴雨和海啸接连出现，北半球气温急剧下降。与此同时，他的儿子山姆正在纽约参加学术竞赛，被突如其来的灾难困在被洪水与严寒包围的城市里。影片用两条线并行推进：一边是父亲决定穿越冰封的大地去纽约，一边是儿子和同伴在城市里设法活下去。科学家这条线承担了说服的任务，也是片中唯一带乐观色彩的线索，不过它对灾难成因的解释做了简化，追求的是直观而不是严谨。它对灾难的呈现偏奇观路线，冰封的城市和瞬间冻结的浪头都是典型的罗兰·艾默里奇手法，看完最深的印象往往是那几个静止的城市画面。两条线最后汇合时情绪给得相当足，这是这类片最擅长的收法。｜TMDB 6.6"
  date: 2004-05-26
  added: 2026-09-30
  image: mv-186.jpg

- id: mv-187
  title: "史前一万年"
  category: 电影
  tags: ["电影", "冒险", "动作", "剧情", "史前一万年 10,000 BC"]
  quark_url: "https://pan.quark.cn/s/4ef3bd913b5a"
  description: "史前一万年的世界，神秘而幽远。在终年为白雪覆盖的大白山上，生活着以打猎为生的亚高族。他们擅长捕猎猛犸象，然而随着猛犸象越来越少，亚高族也逐渐走向末路。具有预知能力的老妈妈临死前做出预言：亚高族将面临四脚恶魔的入侵，届时族人将迎来最后一次狩猎，在此之后一位伟大的战士就会出现，并迎娶躲避战乱来到部落的蓝眼睛小女孩伊芙乐（Camilla Belle 饰）为妻，最终带领亚高族远离饥饿。 族人们对此深信不疑，耐心等待决定命运的时刻的到来。男孩达雷（Steven Strait 饰）和卡恩（Mo Zinal 饰）对伊芙乐都心存爱慕。某日，消失十多年的猛犸象群重新回到大白山，达雷阴差阳错杀死一头猛犸象，赢得了…｜TMDB 5.5"
  date: 2008-03-04
  added: 2026-09-30
  image: mv-187.jpg

- id: mv-188
  title: "地心引力"
  category: 电影
  tags: ["电影", "科幻", "惊悚", "剧情", "地心引力 Gravity"]
  quark_url: "https://pan.quark.cn/s/51b75499959a"
  description: "一次例行的航天飞机任务变成了一场求生：瑞安·斯通博士首次上天，与即将退休的老宇航员马特·科沃斯基一起搭乘探索者号维修哈勃望远镜。舱外作业进行到一半，被击毁的卫星碎片引发连锁碰撞，航天飞机被重创，两人与地面失联，漂浮在没有任何依托的太空里。影片大部分时间只跟着一个人：氧气在减，通讯在断，碎片每隔一段时间还会再来一轮。导演把失重和真空拍得极其具体，开场那段长镜头的舱外作业几乎让人忘记剪辑的存在。对失重状态下动作的呈现尤其讲究，翻滚、抓握和惯性都经得起推敲。它的技术完成度是讨论这部片时绕不开的部分，声音设计、光影和虚拟摄影的配合在当年属于标杆级别。故事本身很简单，情绪却相当直接：一个人在绝境里重新决定要不要活下去。适合喜欢太空题材、也想看点技术奇观的观众。｜TMDB 7.2"
  date: 2013-10-03
  added: 2026-09-30
  image: mv-188.jpg

- id: mv-189
  title: "囚徒"
  category: 电影
  tags: ["电影", "剧情", "惊悚", "犯罪", "囚徒 Prisoners"]
  quark_url: "https://pan.quark.cn/s/4c7a3509f218"
  description: "凯勒·多佛面对的是每个父母最恐惧的噩梦：六岁的女儿安娜和小玩伴一起失踪，唯一的线索是早前停在家附近的一辆休闲车。警探洛基逮捕了车主亚历克斯，却因证据不足只能放人。想到孩子还在某处，多佛决定不再等——他用自己的方式去找，也在这条路上一点点越过了自己原本不会越过的线。影片真正想问的是，寻求正义能不能凌驾于法治之上。它不急着抓凶手，而是把两种焦虑并排摆着：一边是父亲的时间在流逝，一边是警察必须按程序办事。洛基这条线写得比一般配角用心，他的执念和疲惫有自己的分量，对搜救过程的呈现也相当繁琐，正因为繁琐，父亲的绝望才成立。导演的处理相当克制，雨、雪和灰调的影调把压抑感压得很实，小镇那种封闭氛围也营造得成功，邻里彼此熟悉，也因此彼此怀疑。几位演员的表演是这部最被称道的部分。看完之后那个问题会留很久：换作自己会怎么做。｜TMDB 8.1"
  date: 2013-09-19
  added: 2026-09-30
  image: mv-189.jpg

- id: mv-190
  title: "夺宝联盟"
  category: 电影
  tags: ["电影", "动作", "犯罪", "夺宝联盟 도둑들"]
  quark_url: "https://pan.quark.cn/s/8a4568b9b4f0"
  description: "价值三百亿的钻石太阳之泪惊现澳门，某神秘人物委托混迹赌场的盗贼朴澳门组织人马，侵入赌场金库把它取出来，报酬丰厚。朴从韩国网罗了当年被他背叛过的伙伴波比、詹姆帕诺、艾妮可等人，又与中国方面的陈、安德鲁、朱莉、乔尼汇合。这支队伍里偷盗、绳索、路线、演技各有专人，是一次强强联合。行动在朴澳门的策划下有条不紊地展开，两方人马一边暗暗较劲一边相互帮衬，紧张、有趣又意外迭出，语言不通被当成了笑料，也确实制造了几次麻烦。这类盗贼片的乐趣在于分工和配合——每个人何时出场、负责哪一环，都被安排得清清楚楚。赌场金库的空间设计是它的技术看点，几处潜入戏处理得相当细致，澳门赌场的呈现也漂亮，空间层次是行动设计的基础。人物之间的旧账在行动中被反复提起，恩怨让这场合作多了变数。它不追求深度，只求过程的精巧。｜TMDB 6.8"
  date: 2012-07-25
  added: 2026-09-30
  image: mv-190.jpg

- id: mv-191
  title: "夺魂索"
  category: 电影
  tags: ["电影", "惊悚", "犯罪", "剧情", "夺魂索 Rope"]
  quark_url: "https://pan.quark.cn/s/720e6e80f60c"
  description: "两名哈佛出身的年轻人博兰顿和菲利普合谋杀害了同学戴维，把尸体藏进客厅里的一只大箱子。接下来他们做了一件近乎挑衅的事：用这只箱子当餐桌，摆上食物，邀请戴维的父母、未婚妻、同学，以及当年讲授过相关哲学的茹伯特教授来赴宴。客人们在看不见的尸体旁谈笑，戴维被说成临时外出。胆小的菲利普从入座起就坐立不安，博兰顿却谈笑自若，甚至享受这种危险。茹伯特教授从他的言谈里渐渐察觉出蹊跷。希区柯克用长镜头把整场晚宴拍得像一次连续的舞台演出，剪接的缺席让观众被困在同一个房间里。全片几乎只有一个场景，时间和现实同步推进，这种限制反而让对话的能量被放大。道具和灯光的处理几乎是按舞台剧的方式做的，连影子都会随情节移动。两个年轻人之间的关系写得含蓄，却是整个行为逻辑的支点。它的道德议题在今天看依旧锋利，影片并不打算替观众给出判断。适合喜欢实验性叙事的观众。｜TMDB 7.9"
  date: 1948-02-01
  added: 2026-09-30
  image: mv-191.jpg

- id: mv-192
  title: "女巫季节"
  category: 电影
  tags: ["电影", "冒险", "奇幻", "动作", "女巫季节 Season of the Witch"]
  quark_url: "https://pan.quark.cn/s/8a4c670d02ac"
  description: "中世纪，中欧。一身伤痛的十字军骑士边沁（尼古拉斯·凯奇饰）和费尔森（朗·普尔曼饰）在外随国王的军队征战多年，终于换来暂时的和平，得以返回故乡。原以为可以在家安享来之不易生活的他们，却发现黑死病正在家乡的土地上肆虐，到处都是染病而无药可医的灾民。面对瘟疫的蔓延，束手无策的的教会，认为这一切的罪魁祸首是一名女巫（克莱尔·福伊饰），病重的红衣主教让二人把她押往远方的修道院，送上僧侣驱除瘟疫仪式的祭台。边沁答应了红衣主教的要求，而他护送的条件是，希望这名女孩能得到公正的审判。两人踏上了前往修道院的道路，在旅途中，他们渐渐的察觉到，这个女孩果然不是普通的人类，她拥有着深不可测的莫名力量，而一路上还有着来…｜TMDB 5.5"
