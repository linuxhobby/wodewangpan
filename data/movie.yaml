  description: "传说里有一枚「再生龙章」，谁得到它的力量，死后就能变成不灭的不死人。国际人蛇集团的头目「蛇魔」盯上了一个身上带着这枚铁章的华籍小孩 Jai，派手下李斯动手绑人。香港特警阿狄两次与李斯交锋，终究没能拦住，孩子还是被带走。阿狄一路追到爱尔兰，在前女友妮歌的牵线下，与老搭档屈逊重新联手。查到李斯的货船靠岸，双方在码头混战，阿狄拼死护住 Jai，自己却沉入水中没了气息。怪事就在此刻发生：Jai 身上的铁章把一个全新的阿狄带了回来，伤口能瞬间愈合，体能远超常人。可还没等他弄明白怎么回事，「蛇魔」已经再度出手夺走龙章，也获得了再生之力，而且比他更强。影片 2003 年上映，把成龙式的动作喜剧整个搬进了好莱坞的奇幻框架，特效与超能力设定占了很大比重，打斗更多依赖镜头与后期，跟他在香港时期的搏命风格差别明显，属于一次带着实验性质的跨国尝试。｜TMDB 5.7｜TMDB 5.7"
