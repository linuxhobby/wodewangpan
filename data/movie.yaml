  baidu_url: "https://pan.baidu.com/s/1fAfY4-bINeJiK97cV80Bug"
  baidu_code: "kgl7"
  description: "江湖上提起梅星河，没人不怕他的夺命流星。这一日，剑侠柳青衣找上门来，邀他同去拜访另一位高手天魔星花无病。花无病的武功深不可测，日子却过得比谁都窝囊：妻子花雨夫人为了让他服帖，早在他身上下了毒，每年毒发时痛不欲生，只能低声下气去求解药，人对他也就予取予求。为了挣脱这根绳子，花无病请来梅星河，想借他的手除掉花雨夫人，把解药夺回来。可花雨夫人本身功夫了得，身边还围着满天星、鬼道士一干高手，这一战想不流血是不可能的。梅星河这边另有一层身份：他其实是朝廷刑部的密捕，多年前宫中遗失的如意七宝，嫌疑正落在花无病身上。上头授意他将计就计，答应下来，一边当刺客一边查案。江湖上的仇与宫里的宝，两条线就这么缠到了一起。这部 1976 年的片子属于成龙成名之前的古装武侠作品，那时他演的还是反派配角，身手已经相当利落。｜TMDB 4.8｜TMDB 4.8"
