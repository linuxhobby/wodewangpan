  description: "五福星加上霸王花一行人好不容易凑出个假期，跟着旅行团去泰国散心，人还没玩够，曹警司的电话就追了过来：富商马先生被杀，要他们立刻回香港协助调查。真正的麻烦不在案子本身，而在那三个随后抵港的杀手：他们要杀掉马先生的女友王小姐，以及与此案有关的商人刘仁富灭口。为了保住两条人命，几路人马分了工：霸王花把王小姐接到五福星家里藏着，鸡骨草和鹿尾巴负责护住商人，独脚金与霸王花则留在屋里守株待兔。计划落了空，杀手识破了布置，商人当街被杀，王小姐那边也陷入追杀。最要紧的关头，鸡骨草赶到，跟杀手硬碰硬地打了一场。1985 年的这部片子是「福星」系列的又一部群戏力作，人多却不乱，笑料一茬接一茬，成龙饰演的鸡骨草戏份集中在后段，几场搏斗依旧是他拿手的环境动作路数。｜TMDB 6.5｜TMDB 6.5"
