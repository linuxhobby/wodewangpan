- id: mv-294
  title: "剑花烟雨江南"
  category: 电影
  tags: ["电影", "动作", "剧情", "剑花烟雨江南 劍花煙雨江南"]
  quark_url: "https://pan.quark.cn/s/fd3c25e922c9"
  description: "十五年前，奇峯山庄的老庄主借着做寿的机会，会同各路武林高手围剿过一个叫人面桃花蜂的对手，那一仗之后，对方销声匿迹。如今老庄主年过六旬，江湖上忽然传来消息：人面桃花蜂重出江湖了。老人心里清楚，自己的六十大寿多半就是对方选的日子，于是把来宾与下人统统遣散，决定独自留下迎战。山庄里不只有他一个人要面对这场劫数。少庄主小雷与丫环纤纤情投意合，可越是这个时候，他越不能让纤纤留在庄上。为了把她气走，也为给雷家留下血脉，小雷一改往日的温存，故意翻脸无情，又私下托好友金川代为照应。安排完这一切，他只剩下一件事：与奇峯山庄共存亡。这部 1977 年的作品属于典型的老派武侠片，故事不复杂，讲究的是恩怨分明与情义两难，人物在道义与私情之间的取舍撑起了整部戏的张力，江湖气息浓厚，是那个年代武侠电影里值得翻出来看看的一件作品。｜TMDB 5.6｜TMDB 5.6"
  date: 1977-07-22
  added: "2026-10-09 14:54"
