  baidu_code: "d1mo"
  description: "军阀少帅侯杰能征善战，也横征暴敛，直到被自己当兄弟看待的副官曹蛮出卖。一夜之间，妻子颜夕离他而去，女儿死在乱兵之中，曾经呼风唤雨的人只剩下满腔恨意。走投无路之际，他躲进了少林寺，在厨房里遇见了那个煮了一辈子饭的僧人悟道。悟道话不多，对佛法的领悟却深，日复一日的相处里，侯杰心里的那团火一点点被浇熄，也慢慢看明白了自己前半生究竟造了什么。寺中三位年轻僧人净能、净海、净空，起初与他并不对付，后来也成了可以托付的伙伴。大彻大悟之后，侯杰剃度出家。可外面的战火没有停：曹蛮带着手下索降图步步紧逼，灾民涌入寺中避难。昔日的少帅选择站在山门前，带着僧众护住这座寺和这些人。影片 2011 年上映，成龙在片中饰演悟道，戏份不重却是点题的那个人，整体基调沉郁，与他常见的喜剧路子差别明显。｜TMDB 6.8｜TMDB 6.8"
