  baidu_code: "ffg0"
  description: "秦将蒙毅奉命护送朝鲜公主玉漱入秦为妃，途中遭叛军伏击，为护住玉漱，他握着她的手随战车一起坠下万丈瀑布。两千年过去，考古学家 Jack 反复做着同一个梦，梦里那个白衣女子的脸越来越清晰，也让他对秦朝古物越来越着迷。好友 William 是个痴迷超自然能量的科学家，他拉上 Jack 去印度，看一座悬在半空的灵棺。William 一时手痒摘下祭坛上的宝石，灵棺当场坠地粉碎，两人被守墓侍卫与信众一路追杀，逃散途中 Jack 被印度少女 Samantha 带到高僧处暂避，老和尚一眼看出他困在一段前世的缘分里。回到西安，Jack 与 William 重逢，却也发现对方已经变了：William 把那颗能抵御地心引力的浮力宝石据为己有，还投靠了借学术之名盗墓走私的古先生。两个曾经出生入死的朋友，因为信念不同彻底决裂。Jack 独自乘直升机飞到郦山上空，纵身跳进那条与梦境一模一样的瀑布，隧道尽头是悬浮的天宫，还有等了他两千年的玉漱。可古先生带人接管天宫，妄图在此长生；混乱中 William 撬走机关上的宝石，天宫失去浮力，成千上万的兵马俑从空中坠落，水银四涌。影片 2005 年上映，走的是穿越与宿命的路子，把动作、奇幻与爱情揉在一起，是成龙中后期少见的带有史诗气质的作品。｜TMDB 6.4｜TMDB 6.4"
