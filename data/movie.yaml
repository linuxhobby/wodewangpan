  baidu_code: "zhu9"
  description: "《圣斗士星矢》是车田正美的经典漫画首次被真人电影化，故事没有从圣域篇开始，而是选了最合适入门的一段：街头孤儿星矢从小和妹妹失散，一直靠着打架和骗钱活下来；某次与人交手时，他身上突然爆发出不属于常人的力量，也因此被卷进了一个他完全不了解的世界——一个神秘组织正在追杀一位转世的女神，而这位女神正是他要找的妹妹。影片的主要问题在于它想塞进去的东西太多：身世之谜、小宇宙的设定、青铜圣衣、十二宫与背后那位幕后主使，两个小时的篇幅分摊到每一块都显得仓促。结果是打斗戏的密度不低，但缺乏重量感，圣衣的特效质感也偏廉价，特别是与原著那种「燃烧到最后一刻」的气质相比，火候差了不少。如果你是漫画的老读者，看到圣衣在真人大银幕上出现的那一刻或许还是会有些触动；改编方向上它尽量忠实，术语和造型都有对照。但对没有原作情感的观众来说，这部片子的人物动机和世界观都会显得难以进入。建议先看动画版补背景，或直接当作一部普通的奇幻动作片来看。｜TMDB 6.3"
