  description: "《黑道中人》最大的噱头也是它最大的赌注：罗伯特·德尼罗一人分饰两角，演的是五十年代纽约两大黑帮家族的掌舵人——维托·热那亚瑟和弗兰克·科斯特洛。两人曾是同一条道上起步的旧友，却在权力版图上走到了对立面。故事的转折落在 1957 年那场真实的枪击：热那亚瑟派人在公寓楼下向科斯特洛开枪，子弹擦过头部却没有致命，此后科斯特洛心灰意冷，让出了家族老大的位置。影片更像是一份关于「两个老头如何走向不同结局」的双人肖像：一个嗜权、一个想退，两人偶尔在餐厅、理发店的对话里还能看出旧日情谊的残影。巴里·莱文森的处理偏冷静，没有把黑帮题材拍成枪林弹雨的爽片，黑色幽默和对话比动作更重要。缺点是节奏略温，中段有几段推进稍显拖沓。适合喜欢《好家伙》《爱尔兰人》那类「黑帮暮年回望」题材、愿意听两个老演员互相飙戏的观众。｜TMDB 6.2"
  date: 2025-03-19
  added: 2026-09-30
