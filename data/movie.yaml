  tags: ["电影", "剧情", "犯罪", "三滴血 三滴血"]
  quark_url: "https://pan.quark.cn/s/6dfcdb182237"
  baidu_url: "https://pan.baidu.com/s/1N8kI7M-Rvt3L1Y4uQiWMWg"
  baidu_code: "q0xt"
  description: "《三滴血》是一部国产犯罪片，切入点选得很沉：家族式人口贩卖。三个素不相识的人因为一场变故被绑到同一条船上——善恶难辨的中年男人「驯鹿」、身怀六甲的年轻女人李棋、以及一个不会说话的男孩冰棍。为了在路上不那么显眼，三人假扮成一家人，这个看似完整的家庭单位成了掩护，也在日复一日的同行中生出了真的牵绊。他们的身份并不单纯：这三个人既是猎物，也在某些时刻扮演着猎人的角色，沿着这条链条往上追，买家、中间人、运输环节逐步浮出水面。影片的气质偏冷，大量冬景与夜戏，雪地、卡车、废弃厂房把一种离开故乡就再也回不去的绝望感压得很实。人物都处在灰色地带，很难说谁是纯粹的好人，这也是它比较有说服力的地方。缺点是叙事在几处转场上略显生涩，部分情节推进依赖巧合。整体基调沉重，不适合想轻松一下的时候看。推荐给关注现实题材、愿意看完之后再想一想「家」这个字到底意味着什么的观众。｜TMDB 5.3"
  date: 2025-11-15
  added: 2026-09-30
  image: mv-200.jpg


- id: mv-201
  title: "谍影追凶"
  category: 电影
