  description: "龙从小就爱看别人练拳，家里拿不出学费，他就蹲在墙头、趴在窗边，一点一点地偷师。运气来的一次，他撞见一个其貌不扬的老叫花，出手才知道是真有本事的人，死缠烂打拜了师。十年寒来暑往，当年的野孩子练出了一身实打实的功夫，回到街坊里，见着不平的事总忍不住要管一管。麻烦也就这么来了。某次出手，他跟一个地痞结下梁子，对方咽不下这口气，转头把师父搬了出来。等到两边真正站到一处，龙才看清，站在对面的那个人，正是当年害死他父亲的仇家。偷学十年、苦练十年，原来绕来绕去，全是为这一刻做准备。这部 1973 年的片子属于成龙出道初期的作品，制作朴素，剧情走的是最传统的复仇路子，拳脚也是那个年代硬桥硬马的规矩打法，能看得出他早年身手最原本的样子。｜TMDB 5.2｜TMDB 5.2"
