  description: "《新世界》是一部日本电影，镜头落在东京这座能把所有人过成另一个样子的城市上。故事顺着两个女人的生活展开：玲子白天是小剧团的演员，日子紧巴巴，还在为一个不大的角色拼命练习；到了晚上，她换上另一副面孔，成了涉谷一带最有名的女人，见识着那些白天衣冠楚楚、夜里卸下人形的男人。另一条线属于亚由美，她的男友小健是一名高考复读生，为了把这个还在准备考试的人供下来，她瞒着对方用身体赚钱，心里想的却是有朝一日和他结婚——这两件事放在一起，本身就是一种相当苦的现实。两条线索的日常被铺得很细：化妆、换衣服、坐末班电车回家，一个人的一天被拆成两个部分，中间几乎没有接缝。影片并不打算给出评判，也没有安排戏剧化的审判，那种平静到几乎冷掉的语气反而是它最有力的地方。缺点是节奏偏慢，两条线的交汇来得相当晚。适合喜欢日本都市题材、能接受沉静基调的观众。｜TMDB 7.4"
