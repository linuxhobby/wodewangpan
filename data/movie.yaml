  description: "《老千 3：独眼杰克》接着前作的世界往下讲：独眼杰克本是这个赌桌上声名在外的名字，却被人设计拖进一场早已安排好的赌博诈骗，赔上了自己也赔上了朋友。为了翻身，他重新组队，找来传奇老千「单耳」的儿子日出、一个话多但手很稳的搭档、一位擅长用姿色做局的女伴，以及一位背景复杂的院长。几个人凑在一起要干嘛很清楚：在一场赌上性命的扑克局里，把被人骗走的东西连本带利拿回来。这部片子最值得看的部分从来都不是阴谋有多大，而是赌桌上的那些细节——洗牌的手、换牌的时机、一个人如何通过「下注的节奏」让对手误判自己的牌力，以及骗术之间的一物降一物。节奏不拖，几场牌局之间的编排有层次，看得出来是有备而来。缺点是人物数量偏多，部分角色的出场略拥挤，结局的处理也稍显草率。如果已经看过《老千》前两部、尤其熟悉那个赌桌世界，这一部会带来不少熟悉的乐趣；没看过前作也能跟得上，但会少掉一些上下文。｜TMDB 6.0"
