  quark_url: "https://pan.quark.cn/s/adfd99c04fc4"
  description: "雷·费瑞尔（汤姆·克鲁斯 饰）和妻子离了婚，一儿一女跟着母亲生活——因为他的贪玩懒散、疏忽责任，这个家才变得支离破碎。这天妻子有事，只好把儿女交给他照顾。电闪雷鸣、天色灰暗，一切都有些异样，随后马路上赫然升起一个庞大的三脚飞行器，外星人降临了这个原本平静的小镇。人们四处逃亡，雷带着女儿奔走逃命，开始了生死历险。当局想尽办法对付外星人却屡屡失败，整个世界陷入恐慌。而在这个过程中，那个平日吊儿郎当的父亲变得顽强，保护儿女成了他撑下去的全部动力。斯皮尔伯格把这部拍成了一部关于逃难的家庭剧：外星人几乎是背景，人在灾难里的样子才是重点。它对逃难场面的处理相当克制，长镜头和人群调度是主要手段，音效设计在机器登场的那几场戏里出力不少。结局忠实于原著的处理方式，看惯大团圆的观众可能需要适应。｜TMDB 6.6"
