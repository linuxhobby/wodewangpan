  description: "十九世纪末到二十世纪初，清朝三百年的基业已经摇摇欲坠，外有列强环伺，内有民生凋敝，整个时局找不到一处安稳的地方。就在这片动荡里，一批又一批仁人志士冒了出来，他们认定只有民主共和能救这个国家，于是组党、办报、筹划起义，把推翻帝制当成唯一的方向。流血牺牲在这一路上几乎成了家常便饭，前一批人倒下，后一批人接着站出来，直到武昌城里那一枪打响，压在头上的帝制终于开始崩塌。影片 2011 年上映，是为纪念辛亥革命一百周年而拍的献礼之作，走的是全景式群像路线：孙中山、黄兴、黎元洪、隆裕太后、袁世凯、汪精卫、宋教仁、秋瑾等各方人物依次登场，各自站在自己那一侧，把那段历史的复杂与撕扯铺开来讲。成龙在片中饰演黄兴，表演刻意收了动作明星的锋芒，整体基调庄重，更像一堂影像化的历史课，而非一部追求戏剧冲突的类型片。｜TMDB 5.7｜TMDB 5.7"
  date: 2011-09-23
  added: "2026-10-09 14:54"
  image: mv-291.jpg


- id: mv-292
  title: "少林门"
  category: 电影
