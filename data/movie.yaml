  description: "在墨尔本，华裔厨师积奇算得上小有名气，隔三差五上电视教人做菜，日子过得安稳。变故起于一场黑帮火并：毒枭金·卡洛清除了敌对帮派安插的卧底，又带人在仓库里大打出手，整场枪战被记者戴安娜的摄像机完完整整拍了下来。逃命路上戴安娜撞见积奇，积奇二话不说引开追兵救了她，可分手时两人拿错了袋子，戴安娜带走的是积奇的烹饪节目录像带，真正的证据反倒留在了他手上。戴安娜的住处很快被找上门，一无所获的歹徒顺藤摸瓜转向积奇。偏偏这时女友美琪远道而来，还特意去了节目录制现场，贩毒集团干脆把围捕搬到了摄影棚前。一场街头苦战之后积奇脱了身，可黄雀在后，敌对帮派掳走了美琪，点名要用那盘录像带换人。一盘带子，把积奇、警方和两个犯罪集团全卷了进来。这部 1997 年的作品在澳大利亚实景拍摄，动作戏与喜剧节奏延续了成龙的招牌配方，街头追逐与工地搏斗几段拍得相当漂亮。｜TMDB 6.6｜TMDB 6.6"
