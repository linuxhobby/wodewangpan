  baidu_url: "https://pan.baidu.com/s/1YqoPkHEbDFkVStLA5WhSiQ"
  baidu_code: "1e3g"
  description: "《我要复仇》是朴赞郁「复仇三部曲」的第一部，也是冷得最彻底的一部。故事的主角柳是一个聋哑青年，父母去世后与姐姐相依为命，他在工厂做工，也在特殊学校里遇到了一个假装失聪的女孩，生活好不容易有了一点起色。这时姐姐查出绝症，必须换肾才能维持生命。他自己的想法很简单——把自己的肾捐出去；然而配型并不合适，医院也不接受这样的交换。为了凑钱，他走上了一条再也回不了头的路：一场注定要出错的绑架，一个本来还算善良的工厂老板，加上一连串谁都不想看到的误会。影片最狠的地方在于它从不给出反派：每一步选择的人都只是为了自己最亲近的那个人，而正是这些「合理」的决定一步步推向灾难。导演的调度冷静到近乎清醒，画面的色调、雨天的街角、那辆车的后视镜都压着一层凉意。结局毫无疑问是残酷的，看完需要缓一缓。适合愿意被剧情重击、不介意从头到尾没有出口的观众。｜TMDB 7.5"
