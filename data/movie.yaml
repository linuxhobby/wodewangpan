  quark_url: "https://pan.quark.cn/s/4170812174e1"
  description: "《预言者》是雅克·欧迪亚执导的法国犯罪片，视角完全落在监狱里。主人公马利克被判六年徒刑，入狱时十九岁，既不识字也不会写字，瘦弱、沉默，在所有人眼里都是最容易被捏的那个。监狱里真正说了算的是一个科西嘉帮派的头目，他看中了马利克「没人注意」这一点，开始差他去办各种见不得人的事。马利克别无选择，只能照做，而正是在这一次次任务里，他学会了自己看规则、算得失，也一点点赢得了对方的信任。影片真正好看的地方，是这条从最底层往上爬的线的过程感：他如何学会读写、如何在一个完全陌生的语言环境里站住脚，以及那种始终压在画面里的孤独感。所谓「预言者」的意味，也在这一路的推进里慢慢显形。达希·哈立德饰演的主角几乎没有夸张的表演，全靠眼神和身体的变化撑起整个弧线，塔哈·拉希姆更是凭此一战成名。缺点是节奏偏慢，前一小时需要沉住气。强烈推荐给喜欢写实监狱题材、愿意看一个人如何在封闭环境里被塑造出来的观众。｜TMDB 7.6"
  date: 2009-08-26
  added: 2026-09-30
