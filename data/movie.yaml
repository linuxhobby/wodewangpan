  quark_url: "https://pan.quark.cn/s/df5efa85ef14"
  description: "《冷山》改编自查尔斯·弗雷泽获得美国国家图书奖的同名小说，是一部关于回家的小说式电影。故事开始于南北战争末期：伤兵英曼在一次惨烈的攻势之后躺在战地医院里，他的灵魂几乎燃尽了，唯一还立着的东西是家乡的那座山和山上等着的那个人。于是他做了一个明确的选择——离开军队，往回走。这条回家的路占了影片的一半篇幅，他沿途遇到的人是这部片子最丰富的内容：有心怀鬼胎的传教士，也有愿意收留他的陌生人，战争的破坏不只是战线上的伤亡，还有沿途那些被抽空的家园。另一半属于艾达：她原本是牧师家的女儿，战争开始时失去了父亲，一个人留在这片山里的农庄上手足无措。她必须在没有旁人的情况下学会种地、杀猪、过一个冬天，而从城里来的一个乡下女人成了她的依靠。两条线各自推进，中间只靠信件维持联系，最后的相遇因此格外有分量。影片的画面非常美，山峦、雪地、晨雾都拍得沉静。缺点是片长偏长，节奏慢。适合愿意安静待两个半小时的观众。｜TMDB 6.9"
