  baidu_code: "k5ox"
  description: "《黑袋行动》是史蒂文·索德伯格近年的又一部密室间谍片，核心设定相当锋利：一对夫妻同为情报人员，丈夫乔治·伍德豪斯是业内备受尊敬的资深情报员，妻子凯瑟琳则在另一个部门担任高管。某天，一份名单流出，凯瑟琳被列为背叛国家的嫌疑人。于是乔治必须在婚姻与国家之间作出选择。索德伯格的聪明之处是把这场审讯搬到了家里：两人时而深情，时而试探，一句闲话都可能是内线的暗号，一张餐桌就可以是一场没有硝烟的攻防。迈克尔·法斯宾德把一个习惯于克制情感的职业特工演得克制到发冷，凯特·布兰切特则用一句台词就可以让对方脚下发软，两人的对手戏是全片最值得看的表演。影片时长控制在九十多分钟，节奏干练，没有大场面的枪战追逐，整部戏几乎全靠对话推进。三星水平——表演和气氛都值得，但如果期待《谍影重重》式的开场十分钟就炸桥，可能会觉得闷。适合喜欢《锅匠，裁缝，士兵，间谍》那种低烧慢炖的谍战氛围、也愿意为了看一场婚姻里话中有话的拉锯而坐得住的观众。｜TMDB 6.4"
