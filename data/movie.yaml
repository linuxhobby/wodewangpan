  baidu_code: "vqlq"
  description: "五个人在看守室里认识，出来时成了兄弟：茶壶、死气喉、卷毛积、凡士林、鲁奇，个个都是因为小偷小摸或者跑龙套栽进去的冤大头。五个人同一天放出来，约好了重新做人，东拼西凑开了家清洁公司，老老实实上门打扫。生意刚起步，麻烦就找上门了。黑帮在一次假钞电版交易时被个愣头愣脑的警察撞破，慌乱中把电版塞进了五福星的清洁车。五个毫不知情的人，就这样稀里糊涂成了江湖上的焦点：警察认定他们是黑帮同伙，四处通缉；黑帮则要杀人灭口，把电版拿回去。两边都在找他们，而他们连电版长什么样都没见过。进退无路，只能靠这几个人各显其能，想办法把这道死局解开。1983 年的这部片子是「福星」系列的开山之作，群戏是它最大的本钱，五个人各有各的滑稽毛病，动作与笑料穿插得很密，成龙在片中的戏份虽不是最重，几场打斗依旧亮眼。｜TMDB 7.0｜TMDB 7.0"
