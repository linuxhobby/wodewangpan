  baidu_url: "https://pan.baidu.com/s/1tqQoQJeuUrFJCq4w11MVfQ"
  baidu_code: "49eo"
  description: "1887 年，强在美国西部一个小镇上做治安官，日子过得安稳。一封家书把这一切打碎：看护玉玺的父亲被人杀死，玉玺下落不明，妹妹铃一路追着凶手到了英国。强立刻动身，先去纽约找老朋友罗伊。他原本指望上次那笔皇家黄金能派上用场，谁知风流又爱吹牛的罗伊早把钱赌了个精光，如今沦落到在餐厅当侍应。埋怨归埋怨，强还是带上他一起去了英国。先一步抵达的铃已经盯了仇人雷斯本好些日子，顺着这条线往下摸，一桩牵扯清、英两国的大阴谋浮出水面：私生子出身的皇帝之弟吴超，为了夺取皇位与雷斯本联手，抢走玉玺正是兵变的第一步。强赶到的时候，留给他周旋的时间已经不多了。为了替父亲报仇，也为了家族的荣誉，他决定不惜代价阻止吴超。这部 2003 年的作品是《上海正午》的续集，把舞台从美国西部搬到了维多利亚时代的伦敦，动作与笑料依旧靠两个性格南辕北辙的搭档撑起来。｜TMDB 6.1｜TMDB 6.1"
  date: 2003-02-06
