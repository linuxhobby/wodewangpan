  baidu_code: "rtwd"
  description: "一个说不出话的少年进了少林，为的是替父亲报仇。寺里没人知道他心里压着什么，只看见他从挑水砍柴做起，日复一日地熬着最枯燥的内功底子。累到撑不住的时候，父亲被害的画面和客居寺中的五枚师太那几句话，总能让他重新咬紧牙关。打出木人巷这件事，他不知在梦里演练了多少回。转机出现在少林禁地，他发现了一个被铁链锁住的老怪人法愚。法愚看着不像僧人，却念着他送来的那几口饭，开始偷偷指点这个还没有学武资格的哑徒弟。同门师兄硬闯木人巷铩羽而归，五枚师太又看出他出招过于狠辣，特意传他蛇翼八步来调理心性。功夫终于练成，他打出木人巷得以出师，法愚却交给他一件信物，让他去联络江湖帮派。这一去牵出连场搏杀，也让他一点点逼近法愚真正的身份。1976 年的这部片子属于成龙成名之前的作品，拳脚走的是老派少林功夫的硬路子，跟后来那种借着桌椅楼梯翻飞的谐趣打法完全不同，能看到他早期最扎实的身手。｜TMDB 6.8｜TMDB 6.8"
