  baidu_url: "https://pan.baidu.com/s/1ybYxIX9YMdyk9K9iRDnwZw"
  baidu_code: "3hwp"
  description: "《为奴十二年》改编自所罗门·诺瑟普 1853 年出版的同名回忆录，这也是它最有力的地方：故事里的每一步都有人真的走过。所罗门原本是纽约州北部的自由黑人，有妻子、孩子和一份正当的生计，会拉小提琴，出门办事时被人骗去了华盛顿——在那里，自由人的身份证明毫无用处。醒来时他已经是别人的财产，从此开始了长达十二年的奴隶生涯。影片刻意把镜头停在具体的日常上：摘棉花的节拍、庄园主那种自以为仁慈的残忍、夜里别人翻身的声音，以及他几次几乎就要接触到援手却失之交臂的段落。史蒂夫·麦奎因的处理极其克制，没有煽情的配乐，但几处长镜头看得人几乎喘不过气。编剧约翰·里德利把一个原本可能被拍成苦情戏的故事处理得尊严而有层次——所罗门要保住的不只是性命，还有「我是谁」。切瓦特·埃加福的表演把这个角色扛住了。影片拿下当年奥斯卡最佳影片，名副其实。推荐给愿意看一部沉重但必要的作品的观众。｜TMDB 7.9"
  date: 2013-10-18
  added: 2026-09-30
  image: mv-148.jpg


- id: mv-149
