- id: mv-283
  title: "绝地逃亡"
  category: 电影
  tags: ["电影", "动作", "冒险", "犯罪", "绝地逃亡 Skiptrace"]
  quark_url: "https://pan.quark.cn/s/8767c673bb19"
  description: "香港探员陈港生盯了黑道老大维克多·王十几年，为了把对方的犯罪证据攥到手里，他把自己熬成了一根紧绷的弦。这一次眼看就要收网，他却一头栽进对方布好的局里，更要命的是，侄女白舒也被牵扯了进来。三方势力同时压过来：中国特警在追，维克多·王的人要灭口，俄罗斯黑帮也在找他们。逃亡路上，陈港生身边多了个甩不掉的搭档康纳，一个靠赌术吃饭的美国人，同样被维克多·王和俄国杀手追得走投无路。两个人语言不通、脾气对不上，一路上互相埋怨又互相救命，从草原走到雪山，再一路漂流而下，把沿途能用的交通工具几乎试了个遍。越是狼狈，两人之间那点别扭的交情反倒越结实。影片 2016 年上映，走的是成龙最熟悉的跨国动作喜剧路线，搭档之间的嘴仗与身体笑料占了很大篇幅，风景一路变换，属于那种不用动脑、看着热闹的公路片。｜TMDB 5.8｜TMDB 5.8"
  date: 2016-07-21
  added: "2026-10-09 14:40"
  image: mv-283.jpg

- id: mv-284
  title: "福星高照"
  category: 电影
  tags: ["电影", "动作", "喜剧", "福星高照 福星高照"]
  quark_url: "https://pan.quark.cn/s/76c04e302846"
  description: "警界出了个败类三哥，卷走价值近一亿元的珠宝直奔日本。鸡骨草和独角金两位干探一路咬着追过去，人没抓到，反倒让日本黑社会头目松本把三哥保了下来，连自己都陷进险境。碍于公众形象，香港警方不愿明目张胆动用本土警力，曹警司只好另想办法，把主意打到了正在服刑的鹧鸪菜身上。鹧鸪菜答应出面，条件是把当年孤儿院的几个老伙计一起捞出来：花旗参、犀牛皮、大生地、罗汉果，这四位凑到一块儿，光是站着不动就够热闹。再加上一位女警探霸王花，一行人在曹警司的连哄带吓之下，就这么踏上了去日本的路。影片 1985 年上映，是「福星」系列里人气很高的一部，走的是群星闹剧加动作的路子，笑料密度大，人物各有各的怪毛病，打斗设计也刻意往滑稽里做，属于那种图个痛快、看完心情不错的港式贺岁片。｜TMDB 6.6｜TMDB 6.6"
  date: 1985-02-10
  added: "2026-10-09 14:40"
  image: mv-284.jpg

- id: mv-285
  title: "尖峰时刻2"
  category: 电影
  tags: ["电影", "动作", "喜剧", "犯罪", "尖峰时刻2 Rush Hour 2"]
  quark_url: "https://pan.quark.cn/s/3be2dd538f57"
  description: "香港警队的李督察本该放个假，偏偏老搭档卡特从洛杉矶飞来探班，两人还没寒暄几句，美国领事馆就遭了炸弹袭击，两名工作人员当场身亡。案子牵到了三合会，李督察只能硬着头皮带上卡特，去拜访那位既是帮会头目、又是父亲昔日搭档的邓力奇。可对方显然不打算客客气气，手下的胡莉接连出手，招招往要害上招呼。很快李督察被美方以身份为由排除在外，香港警局也紧跟着挨了炸弹，局面彻底失控。走散的两个人各自摸到邓力奇的游艇上，正撞见三合会内讧，话还没说完，胡莉已经一枪把邓力奇打进了海里。线索断了，两人一路追到洛杉矶，在当地大亨荣士勋的宅子里找着了胡莉的踪迹，还撞见美国的卧底特工。到这一步才看明白，邓力奇与胡莉真正卷进去的是一桩巨额假钞案，而那块印版还在胡莉手里。作为系列第二部，这部 2001 年的作品把舞台从洛杉矶搬到了香港，动作场面依旧是成龙式的环境搏斗，卡特嘴上没完的抱怨与两人之间的节奏反差，是整套片子最好笑的部分。｜TMDB 6.8｜TMDB 6.8"
  date: 2001-08-03
  added: "2026-10-09 14:54"
  image: mv-285.jpg

- id: mv-286
  title: "玻璃樽"
  category: 电影
  tags: ["电影", "冒险", "动作", "喜剧", "玻璃樽 玻璃樽"]
  quark_url: "https://pan.quark.cn/s/bcbaf45516cd"
  description: "台湾海边的小渔村里，女孩阿北过着再普通不过的日子，直到有一天在沙滩上捡到一只从香港漂过来的玻璃樽。樽里塞着一张纸条，写的人说「我很寂寞，你呢？」，底下留了住址和电话。就这么几个字，让阿北收拾行李去了香港。按着地址找过去，她见到了写纸条的男孩阿波，阿波被她这份说走就走的勇气打动，把她留了下来。日子一长，阿北才慢慢看明白，阿波根本不是她想象中的那个人，她心里的位置也一点点挪到了别处。真正让她动心的是金融奇才阿祥，一个专爱追求刺激的人。为了能靠近他，阿北随口编了个身份，说自己出身黑道人家。这个谎一撒出去就收不回来了，接下来发生的事远比她预想的要热闹。影片 1999 年上映，是成龙作品里少见的爱情喜剧，动作戏退到了次要位置，故事更像一个关于误打误撞与坦诚相待的都市童话，节奏轻快，笑点温和，跟他那些拳脚片完全不是一个路子。｜TMDB 6.5｜TMDB 6.5"
