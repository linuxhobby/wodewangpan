  baidu_url: "https://pan.baidu.com/s/1842hBi_pkSvciEYLp53f1A"
  baidu_code: "gica"
  description: "人字拖有一身好身手，人却活得没个方向，赌瘾缠身，跟包租公、八达通搭伙干些偷偷摸摸的勾当。改变是从一个婴儿开始的。城中女富豪唯一的孙子刚出生，包租公抵不住那笔钱的诱惑，答应把孩子偷出来交给黑帮老大，对方想确认这孩子是不是自己死去的儿子留下的骨肉。孩子到手了，麻烦也跟着来了。三个人围着这个还不会说话的小东西团团转，喂奶、换尿布、哄睡，一件比一件难。日子一天天过去，人字拖开始惦记起家里人，八达通也第一次看清了自己老婆这些年的不容易。人心在变，外头的压力却越来越紧：包租公和黑帮步步紧逼，非要他们把孩子交出去不可。到这一步，交还是不交，已经不是一道能用钱算清的题。2006 年的这部片子把成龙式的动作喜剧套进了育儿日常里，笑料多来自几个大男人被婴儿折腾得手忙脚乱，温情也在其中一点点攒起来。｜TMDB 7.0｜TMDB 7.0"
