  quark_url: "https://pan.quark.cn/s/ff25bc43548e"
  description: "一名洗黑钱的罪犯被押送回港，职业杀手曲（吴彦祖 饰）将他枪杀后逃逸，背后主谋是洗钱集团首领饶天颂（罗嘉良 饰），而饶天颂的儿子同时被神秘人物拐走，案情变得千头万绪。案子交到警察孙（郭富城 饰）手上，他一向倒霉，这次最让他意外的是发现饶天颂的律师杜厚生（郑伊健 饰）有个叫 Amy（李心洁 饰）的妻子，长得极像他十年前失踪的女友。于是他把大量心血投进这桩案子。而对案件感兴趣的，除了孙，还有杀手曲。几条线各有心事，在错综复杂的关系里互相拉扯。影片属于典型的港式群戏犯罪片，人物多、线索密，讲的是巧合与执念，接受了这个前提，后面的展开才有意思。几场动作戏的处理偏写实，枪战和追车都不算夸张。演员阵容在当年港片里相当齐整。适合怀念那个年代港片质感的观众。｜TMDB 6.5"
