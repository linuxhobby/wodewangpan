  description: "香港探员陈港生盯了黑道老大维克多·王十几年，为了把对方的犯罪证据攥到手里，他把自己熬成了一根紧绷的弦。这一次眼看就要收网，他却一头栽进对方布好的局里，更要命的是，侄女白舒也被牵扯了进来。三方势力同时压过来：中国特警在追，维克多·王的人要灭口，俄罗斯黑帮也在找他们。逃亡路上，陈港生身边多了个甩不掉的搭档康纳，一个靠赌术吃饭的美国人，同样被维克多·王和俄国杀手追得走投无路。两个人语言不通、脾气对不上，一路上互相埋怨又互相救命，从草原走到雪山，再一路漂流而下，把沿途能用的交通工具几乎试了个遍。越是狼狈，两人之间那点别扭的交情反倒越结实。影片 2016 年上映，走的是成龙最熟悉的跨国动作喜剧路线，搭档之间的嘴仗与身体笑料占了很大篇幅，风景一路变换，属于那种不用动脑、看着热闹的公路片。｜TMDB 5.8｜TMDB 5.8"
