  description: "明朝末年，反清的火头在各地此起彼伏，少林也因民族大义卷了进来。偏偏寺里出了个石少锋，为了荣华富贵投了清廷，反过来成了朝廷的爪牙，专抓昔日同道，下手毫不留情。义士谭雄被他捉进大牢，受不住狱中折辱，含恨自尽。少林方丈看不下去，派爱徒云飞下山清理门户，本意是阻止石少锋继续杀戮，盼他回头。谭雄的弟弟为兄报仇心切，一路追着石少锋不放；另有一位漂泊江湖的浪子，看似什么都不在乎，良心却还没磨灭。三个人各有各的缘由，最终拧成一股，一同对上石少锋。这部 1976 年的作品由吴宇森执导，属于他早期的功夫片，叙事规整，立场分明，动作以硬桥硬马的少林拳为主。片中还能看到成龙的身影，那时他还不是主角，身手却已经相当利落，属于早期港产功夫片里值得翻出来看看的一部。｜TMDB 6.6｜TMDB 6.6"
