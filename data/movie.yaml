  description: "阿龙的父亲在芝加哥开了一家餐馆，生意刚有起色，当地黑帮就上门收保护费。阿龙咽不下这口气，把来人狠狠揍了一顿。这一打反而暴露了他的身手，黑帮头目盯上了他，硬要他代表自己参加那场名叫「杀手壕」的地下格斗赛，去争冠军。为了让阿龙就范，他们绑走了他哥哥的未婚妻，还安排一个假女人顶替回去复命，条件是：出赛，赢了就放人。阿龙没有别的选择。赛场上他一路往上打，先拿下摩洛哥红毛王，再过铁头僧这一关，最后站到他对面的是杀人王老李。这一场靠的不只是拳脚，还得靠脑子。片子 1980 年上映，是成龙第一次主演的英语电影，也是他进军好莱坞的早期尝试，打斗保留了港式的灵活与节奏感，只是整体风格为了迁就海外市场做了不少调整，属于他生涯里一段值得留意的过渡期。｜TMDB 5.9｜TMDB 5.9"
