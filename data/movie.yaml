- id: mv-322
  title: "我是谁"
  category: 电影
  tags: ["电影", "冒险", "动作", "喜剧", "我是谁 我是誰"]
  quark_url: "https://pan.quark.cn/s/1309a71cc564"
  description: "三名科学家在非洲发现一种杀伤力极强的神秘矿石，返程途中被一支特别行动小队截下，十一个人来自不同国家，执行的任务是把人和成果一起带走。可情报局内部有内鬼，他想把这份成果据为己有，于是命令负责接应的飞行员制造了一场空难，既杀人灭口，也掩盖自己已经抢走成果的事实。小队几乎全军覆没，只有队员杰克活了下来。等他被当地土著救醒，剧烈的撞击已经夺走了他的全部记忆，名字、来历、任务，一概不知。此后他逢人只会问一句：我是谁。为了弄明白自己到底是谁，杰克一路回到了纽约。1998 年的这部作品由成龙自导自演，开篇那场鹿特丹大楼的斜坡滑落与结尾的玻璃幕墙搏斗都是他生涯里最著名的特技段落，全片在动作之外还压着一条关于身份的线，属于他九十年代表现最完整的一部。｜TMDB 7.2｜TMDB 7.2"
  date: 1998-01-17
  added: "2026-10-09 15:23"
