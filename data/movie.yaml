  description: "正风武馆在当地是有名气的，每年一度的舞狮大会，他们已经连着七年把冠军扛了回来。今年主办方为了吸引看客，把难度往上又提了一档，设了个采青大赛。馆里原本年年是阿昆出赛，偏偏临出赛前几天练习时崴了脚，馆长没办法，只能把第一次上场的阿龙推上去。难度摆在那里，阿龙头一回参赛，最终没能撑住，输了。师兄弟们免不了拿他打趣，阿龙倒没往心里去。真正让他放不下的，是他在比赛里无意间撞见的一件事。那个发现像块石头一样压在他心头，比输掉比赛要沉得多。1980 年的这部片子由成龙自导自演，是他正式挑大梁的早期代表作，片中大量舞狮与采青的段落本身就是硬功夫，动作与喜剧的配合已经相当熟练，结尾那场连续搏斗更是把他的耐力与节奏感展现得淋漓尽致。｜TMDB 7.0｜TMDB 7.0"
