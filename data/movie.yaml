  description: "考古学教授 Jack 在讲台上一待就是很多年，讲起那些被他添了油加了醋的历史，校长和学生都将信将疑。某次课后，一个印度姑娘找上门来，摊开一张千年地图，正好戳中了他的痒处。Jack 拉上挚友的儿子李琼斯和助教小光，凑成一支「寻宝小分队」，冲着那颗传说中的神秘宝石出发了。这一路的画风跳得厉害：在迪拜跟土豪飙车，在冰岛钻进冰穴，在印度跟土狼周旋，还跟当地贵族比了一场舞。地理跨度拉得很开，动作与喜剧的配比也往上加了一档。作为 2017 年的贺岁档作品，这部片子走的是标准的合家欢路线：不追求烧脑，图的是热闹与喜庆，取景一路从迪拜铺到冰岛，场面铺得相当舍得。喜欢看异国风光配着热闹打闹的观众，这一部看得会比较轻松，是成龙后期代表性的那种公路式寻宝喜剧。｜TMDB 5.9｜TMDB 5.9"
