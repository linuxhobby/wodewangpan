  baidu_code: "9pyq"
  description: "《突袭》是一部把动作元素压缩到极致的印尼片，故事简单到一句话：雅加达贫民窟深处的一栋楼里聚着全城最危险的杀手和黑帮，黎明前最黑的那段时间，一支精英特警队悄悄摸近这栋楼——然后才发现他们走进的是一个陷阱。导演加雷斯·埃文斯把整部片子拍成了一场通关游戏：从一楼开始，一层一层往上打，楼梯、走廊、空房间都是战场，每一层换一种对手和打法。当年它之所以让人震惊，是因为这是一部几乎没有吊威亚、不靠绿幕堆叠的作品，肉搏全靠身体碰撞和长镜头撑起来，观众能清楚看到两个人之间到底发生了什么。主演伊科·乌艾斯的名字从此和这种近身格斗风格绑在一起，而短刀和警棍的使用也相当有辨识度。除此之外，片子还留了一点家族线，兄弟两人站在不同位置的处理给这场混战加了一点重量。缺点是剧情相当简单，基本是托住动作场面的借口。推荐给想看一场干脆直接、血脉偾张的近身动作片的观众。｜TMDB 7.4"
  date: 2012-03-22
  added: 2026-07-25
