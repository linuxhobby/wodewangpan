- id: mv-251
  title: "新生化危机"
  category: 电影
  tags: ["电影", "动作", "恐怖", "科幻", "新生化危机 Resident Evil: Welcome to Raccoon City"]
  quark_url: "https://pan.quark.cn/s/89c22dc9532e"
  baidu_url: "https://pan.baidu.com/s/1N9ArE50TMekhBfccYxIBqw"
  baidu_code: "0cj5"
  description: "《新生化危机》是一次重开机，野心不小：它不接着任何一部前作讲，而是回到游戏最初设定的那一天，把浣熊市这座被制药巨头控制的小镇重新搬上银幕。故事从几个视角切入——回到小镇的克莱尔、刚调来执勤的警员里昂、以及被派去查看郊外那栋洋馆的特警小队。这座城市表面上看只是失去了支柱产业后逐渐衰败，地下却藏着伞公司留下的东西：一旦失控，整座城市在一夜之间就会变成另一个样子。影片最大的优点是氛围：阴冷的街道、突然熄灯的建筑、第一批被感染者出现的那几场戏，恐怖感是扎扎实实的，比起前几部偏动作的风格更接近原作的压抑感。演员方面几位主演在游戏玩家眼里未必是首选，但作为各自的原型算称职。缺点也很清楚：篇幅太短，人物关系没有展开，高潮段的收敛过于仓促，几位重要角色的结局几乎是一笔带过。整体上它有工业水准，也有对原作的敬意，但更像是一部面向粉丝的序章。推荐给游戏玩家和对丧尸题材有兴趣、能接受一定惊吓强度的观众。｜TMDB 5.9"
  date: 2021-11-24
  added: 2026-10-06
  image: mv-251.jpg

