  baidu_code: "x5i0"
  description: "《瞄准》的主角是一位已经从中情局退出的特工，如今靠画画打发日子，生活平静得几乎没有波澜。变故来自过去认识的一位神秘女人：她重新出现之后，他的住处、身份和那段刻意模糊的过去一起被翻了出来——杀手穷追不舍，组织逍遥法外，而官方那边似乎也不打算把事情说清楚。他只能把那些以为早已忘掉的本事重新找回来。影片属于标准的孤胆动作片：节奏快、打斗密集，剧情基本是通往下一场动作的引线，人物的分工清晰，反派就是反派，没有太多暧昧的空间。近身格斗是主要卖点，几场在封闭空间里的处理相当利落，枪械动作也算规范；因为篇幅短，整部片子没有多余的段落，作为一次消遣刚好合适。缺点也很清楚：故事骨架老套到几乎每一个转折都在预料之内，反派的动机含糊，女主角的身份交代得过于潦草，对逻辑要求高的观众会觉得敷衍。适合只想看点紧张来回票局值、不在意叙事创新的观众。｜TMDB 6.0"
