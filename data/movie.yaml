  description: "陈国荣带的那一组是警队里最能打的一批人，破案记录漂亮得没话说。直到他们遇上阿祖。这个总警师的儿子纠集了几个高官子弟，把犯罪当成一场针对警方的游戏：他们抢银行，等警笛响起、警察冲进去，人早被引入了事先布置好的空旷仓库。那一晚阿荣的队员一个接一个倒下，连女友可颐的弟弟也没能幸免。阿荣被停职，内疚压得他抬不起头，索性跟可颐分了手，整日泡在酒精里。转机出现在酒吧，他遇上阿锋。为了让阿荣重新站起来，阿锋谎称自己是上司派来协助翻案的新警员，硬是把他拽回了案子里。随着调查推进，阿荣才发现当年那伙人把事件编成了一款游戏，而情报泄露的原因也一点点浮出水面。2004 年的这部作品是成龙主动撕掉喜剧标签的一次尝试，动作戏往写实方向收，情绪比他以往任何一部都重，警匪对峙的压迫感贯穿全片，属于他中后期生涯里分量最足的表演之一。｜TMDB 7.2｜TMDB 7.2"
