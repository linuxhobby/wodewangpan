  description: "《罪人》是瑞恩·库格勒首次完全架空的作品，此前他拍的是《黑豹》《奎迪》这类既定宇宙里的故事。影片背景落在1930年代的美国南方：一对双胞胎兄弟在江湖上混过一圈后回到家乡，打算用带回来的钱开一间属于黑人的小酒馆，把过去抛在身后。开业那天热闹得像场仪式——蓝调、酒、族人的笑声都回来了，但入夜之后，某种更古老、更饥饿的东西被这片土地上的动静引了过来。影片前半段是一幅带着烟火气的社区画卷，音乐在其中占到核心位置，几段蓝调演奏拍得像是把整段历史摁进一间屋子里；后半段急转直下，变成彻底的恐怖片，而且下手相当重。迈克尔·B·乔丹一人分饰兄弟俩，两兄弟性格差异靠步态、眼神和语速就能分辨，表演本身足够好看。主题上「文化挪用」的隐喻写得直白，不必深挖也能接住。尺度大，血腥场面不少，恐血者请绕行。推荐给愿意看不同类型混搭、对流媒体时代少见的大银幕原创还抱期待的观众。｜TMDB 7.5"
  date: 2025-04-16
  added: 2026-09-30
  image: mv-205.jpg


- id: mv-206
  title: "绝望海峡"
  category: 电影
