  quark_url: "https://pan.quark.cn/s/1acc90d83327"
  description: "20世纪70至80年代，朝鲜半岛非军事区附近有一座与世隔绝的小村湖浦港，海风裹着咸腥味常年拍打堤岸，村民守着祖辈传下的渔网与田地，对外面的世界既好奇又警惕。某天夜里，一道不明来处的光落进海湾，紧接着，形态诡异的外星生物开始出现在滩涂、林子和废弃防空洞里。起初只是家畜失踪、渔船莫名失控，后来整支巡逻队在浓雾里失了踪，村民才意识到，这片世代栖息的平安海域早已被某种不属于地球的目光盯上。村中老幼各有算盘，有人想连夜逃走，有人想掘地藏身，也有人决心把入侵者拦在家门口。当军方与村民的目标彼此错位，原本相亲相守的小村被割裂成几派，谁都不肯先退一步。影片把科幻惊悚揉进半岛特有的紧张地缘底色，用逼仄的村庄空间制造压迫感，外星威胁始终藏在镜头边缘若隐若现，真正落笔的，是普通人在绝境里如何守住彼此、守住家园的朴素勇气。｜TMDB 7.2"
