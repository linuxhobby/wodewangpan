  description: "《东方快车谋杀案》之所以难拍，在于几乎所有读者都知道结局，而这个版本依然值得一看。故事从大侦探波洛登上这列豪华列车开始：一场大雪把列车困在半路，夜里他三次被奇怪的动静吵醒，第二天清晨，车厢里那位美国富商被发现死在包厢内，身上十二刀，门从里面反锁。所有线索都指向同一个方向：凶手一定在这列车上。波洛要做的，是在十几名乘客之间来回盘问，把他们各自的证词拼成一张完整的图——这些人看似互不相识，简历、口音、身份各异，却在细节上严丝合缝地对上了。肯尼思·布拉纳自己出演波洛，把这位侦探的洁癖、自嘲与不合时宜的同情心演出了层次；群像演员阵容豪华，其中一位女演员的独角戏几乎可以单独拿出来看。运镜与车厢布景相当讲究，雪景和长镜头都在强调这列火车是一个封闭的密室。缺点是前半节奏稍慢，几个角色的戏份被压缩到几乎没有。推荐给喜欢本格推理、想在大银幕上看一次经典密室的观众。｜TMDB 7.1"
