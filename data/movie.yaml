- id: mv-287
  title: "新警察故事"
  category: 电影
  tags: ["电影", "动作", "惊悚", "犯罪", "新警察故事 新警察故事"]
  quark_url: "https://pan.quark.cn/s/20ae04dd23a4"
  description: "陈国荣带的那一组是警队里最能打的一批人，破案记录漂亮得没话说。直到他们遇上阿祖。这个总警师的儿子纠集了几个高官子弟，把犯罪当成一场针对警方的游戏：他们抢银行，等警笛响起、警察冲进去，人早被引入了事先布置好的空旷仓库。那一晚阿荣的队员一个接一个倒下，连女友可颐的弟弟也没能幸免。阿荣被停职，内疚压得他抬不起头，索性跟可颐分了手，整日泡在酒精里。转机出现在酒吧，他遇上阿锋。为了让阿荣重新站起来，阿锋谎称自己是上司派来协助翻案的新警员，硬是把他拽回了案子里。随着调查推进，阿荣才发现当年那伙人把事件编成了一款游戏，而情报泄露的原因也一点点浮出水面。2004 年的这部作品是成龙主动撕掉喜剧标签的一次尝试，动作戏往写实方向收，情绪比他以往任何一部都重，警匪对峙的压迫感贯穿全片，属于他中后期生涯里分量最足的表演之一。｜TMDB 7.2｜TMDB 7.2"
  date: 2004-09-23
  added: "2026-10-09 14:54"
  image: mv-287.jpg

- id: mv-288
  title: "新精武门1991"
  category: 电影
  tags: ["电影", "动作", "喜剧", "新精武门1991 新精武門1991"]
  quark_url: "https://pan.quark.cn/s/d52a42da887a"
  description: "一个右臂天生神力的少年，心思直、运气差，一路磕磕绊绊地拜师学艺，最后站上了擂台。故事的主线简单到几乎一眼能望到底，真正的看头全在过程里。收下他的四位师傅，是四个牙都快掉光的糟老头，各自抱着同一个心思：把这小子练出来，好去擂台赛上赢一笔奖金。偏他们传授的所谓绝艺，来路都不太正经，招式名字听着唬人，练法却荒唐得要命。少年天生有把子力气，性子又憨得可笑，学得越认真，场面越滑稽。等到真正站上擂台，那些看似胡闹的招数反倒派上了用场，一路跌跌撞撞地打到了最后。结局并不出人意料，真正让人记住的是这一路上那些荒唐到家的小桥段，四个老头各出各的馊主意，少年却照单全收，练得越认真越滑稽。影片 1991 年上映，属于周星驰式的无厘头功夫喜剧，笑料密集、节奏飞快，细节上的巧思远比剧情框架精彩，跟成龙那条靠身手搏出来的动作路线完全是两条路子。｜TMDB 6.4｜TMDB 6.4"
  date: 1991-03-23
  added: "2026-10-09 14:54"
  image: mv-288.jpg

- id: mv-289
  title: "迷你特攻队"
