  baidu_code: "bjvq"
  description: "《冷血动物》从一桩地产经纪被残忍杀害的命案开始。死者看起来是个体面的普通人，案发现场却相当不好看，而房间的格局透露出这件事并不简单。负责调查的侦探汤姆·尼科尔斯一层层往里走，很快就发现这张网比看上去要密：涉案的人各自都藏着一点东西，每解开一层就会出现新的欺骗，证词与物证之间的缝隙越调查越大。影片属于那种慢节奏的犯罪悬疑片，推动它的不是追车和枪战，而是细节的堆积——一句没说完的话、一份处理过的不动产文件、一个人对另一个人的解释。这种处理方式让把线索自己拼起来的观众会觉得格外耐看。本尼西奥·德尔·托罗扮演的主角相当适合这类「看得见太多」的角色，他本人也处在一种对什么都提不起劲的状态。缺点是节奏偏慢，中段有几处略显沉闷，配角的笔墨有限。喜欢《十二宫》《真探》气质作品的观众会对上频率；想看快节奏破案会觉得急人。留白不少，结局常被拿来讨论。｜TMDB 6.7"
