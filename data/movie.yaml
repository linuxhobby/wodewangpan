  tags: ["电影", "动作", "犯罪", "剧情", "镇上的新暴徒 தக் லைஃப்"]
  quark_url: "https://pan.quark.cn/s/8168ee3975d0"
  description: "《镇上的新暴徒》是一部印度犯罪片，讲的是黑帮家族内部的背叛。故事起点是一次看似偶然的救助：黑手党头目萨克蒂维尔在一场枪战中救下了一个小男孩阿马兰，此后便把他当成自己的孩子抚养长大。影片把这段安排得足够日常，让这个家庭看起来是真的——兄弟、亲情、以及一个从小在这个院子里长大的孩子。多年之后，这个家庭遭遇了一次暗杀，虽然没有要了萨克蒂维尔的命，却彻底改变了他的判断：他开始怀疑身边的每一个人，心里那团复仇的火烧得比什么都旺。于是他一步步把自己一手建立起来的帝国拆掉，而那些依附于这个家族的人也随之陷入混乱。影片的长处在于家族关系的处理，人物之间的张力比外部的枪战更有看头；缺点是篇幅偏长，几处转折的处理略显拖沓，歌舞段落与整体的黑帮基调也有些脱节。适合对印度黑帮题材有兴趣、能接受较长片长的观众。｜TMDB 5.0"
  date: 2025-06-04
  added: 2026-09-30
  image: mv-103.jpg

