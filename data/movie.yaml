  baidu_code: "ndu4"
  description: "《重返重生》的动机非常直白：一位母亲的女儿遇害，而她获得了穿越到平行宇宙的能力。于是她一个接一个地进入不同的世界，在每个世界里找到那个凶手，一次又一次地把他解决掉。前几次看得相当解气，问题在于复仇这件事本身是有代价的——每一次重复，她身上属于人的那部分就被磨掉一点。片子真正想讲的不是「能不能报仇」，而是「报完之后还剩下什么」。它表面上套着科幻与平行世界的壳，骨子里是一部人物剧：看点在主角如何从一个痛苦的年轻母亲，逐渐变成一个越来越熟练、也越来越陌生的执行者。这种处理让每一次循环的重复感不再是噱头，而成了叙事本身的一部分。导演对节奏的控制相当稳，重复段落的编排有变化，不会让人觉得是在凑时间。缺点是中段略显单调，几个配角的戏份偏薄，结局的处理略含糊。适合喜欢丧女复仇题材、也能接受「再来一次」这种循环设定的观众；想看轻松爽片的可能会觉得压抑。｜TMDB 6.6"
