  description: "韩大使到美国赴任之前，曾主持破获中涛犯罪集团的走私网络，这笔账被人记了下来。人刚到美国，中涛就指使手下绑走了他的女儿素洋，开口索要五千万美元赎金。FBI 随即介入全面调查，韩大使却信不过美方的效率，执意要调香港的老搭档李督察过来帮忙。FBI 这边也不甘心被抢了风头，特意从洛杉矶警局挑了个麻烦不断的卡特出来「协助」，说白了是拖后腿。一个是身手不凡、行事低调的香港督察，一个是嘴上没个把门、作风高调的美国警探，两个人凑到一起，误会和笑话就没断过。可危机一场接一场地来，两人反倒在一次次交手中磨出了默契。1998 年的这部片子让成龙真正打进了北美市场，动作戏与搭档之间的化学反应同样重要，也是后来整个系列的起点。｜TMDB 7.1｜TMDB 7.1"
