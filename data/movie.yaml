  baidu_code: "kr2t"
  description: "《犯罪都市2》把战场从首尔搬到了东南亚。重案组的马锡道因为一名自首的嫌疑人被派往越南引渡，落地后发现事情远不止一起自首案：近几年不断有韩国游客在东南亚失踪，线索最终指向一个专门绑架、勒索韩国人的团伙，而带头人姜海尚是个极其纯粹的暴徒——勒索的钱到手也照样撕票，杀人不太需要理由。于是影片的结构变得非常清晰：一边是那种毫无底线、随时索命的冷血反派，一边是这位用拳头讲道理的刑警，两股力量一次次对撞，从越南的街市打到韩国的机场。马东锡的喜剧感在这一部里被放大，他在严肃刑侦场面和笑料之间切换自然，招牌的一拳放倒每次出现观众都会笑。动作戏的量相当足，而且干脆利落，近身搏斗的打击感是全系列里最好的一档。缺点是剧情本身很简单，基本靠场面和角色魅力撑起来。强烈推荐给已经看过第一部、或单纯想看一场解压式的猛拳大战的观众。｜TMDB 7.3"
