  baidu_code: "qmab"
  description: "《怒之杀》的开头是一个最糟糕的时刻：科尔·里德亲眼看着自己的老板——一个亿万富豪——被人杀害，而他自己当场被扣上了凶手的帽子。没有申辩的机会，也没有人愿意听，他能做的只有先逃。顺着这条线，他追到一艘即将离港的远洋货轮上，而那里正是这场埋伏的底座。登船之后事情变得更难：空间封闭，通讯受限，追杀无处不在，他必须在这样一个几乎无处可退的地方一边应付追兵，一边把真相翻出来，最终挖出的东西远超个人恩怨，牵涉到一个相当大的布局。这类「孤身闯入」的动作片看的就是主角那份狼狈与狠劲——他不是刀枪不入的超级战力，会受伤，会被围住，每一步都是硬拼出来的。货轮的封闭空间被用得很足，机房、货舱、狭窄的金属走廊几乎构成了一场密室戏，动作的视觉效果也因此相当直接。缺点是剧情本身套路化明显，反派的计划经不起细想。适合想要一部从头打到尾、逻辑不必太较真的动作片的观众。｜TMDB 7.1"
