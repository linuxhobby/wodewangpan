  description: "《毒劫》的故事起因是一桩毒品抢劫彻底走样：一笔不该动的货被人劫走，而货的背后牵着一个政客的儿子。为了把这个人从烂摊子里捞出来，一名早已快撑不住的警察不得不在这座从上到下都烂掉的城市里到处钻缝——黑帮、政客、同僚，每一个都比他更清楚该往哪边站。主角身上背着的东西不少：失败的婚姻、不再年轻的身体、一个他不太知道该怎么教育的女儿，而这一夜正好把这些全都摊开。影片的整体基调偏脏：雨夜、霓虹、枪火基本贯穿全片，视觉相当统一，动作场面多而且下手狠，很多场面拍得很不留余地。它属于那种看完很难复述剧情、但过程相当亢奋的片子——叙事本身经不起细想，人物的取舍也常常是为了下一个场景服务。汤姆·哈迪演这类狼狈又执拗的角色相当熟练。如果你属于那种喜欢《突袭》式密集动作、不在乎故事逻辑严丝合缝的观众，会觉得够劲；想看点有条理的犯罪片则会失望。｜TMDB 6.4"
