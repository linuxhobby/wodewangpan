  baidu_code: "75q6"
  description: "袁世凯一心要登基称帝，为此笃信邪教，教主送他一枚玉扳指，说是能保他事成。谁知袁世凯转手把扳指送给了四王爷的三公主沈玉，还打算立她为皇后。教主得知后勒令他必须把扳指收回来。与此同时，潜伏在袁世凯身边的革命党干部杨君，为了阻止他登基，干脆把沈玉掳走了。李督军奉命沿途追索杨、沈二人，杨君路过宝芝林时碰上黄麒英，便把护送沈玉的重任托付给了黄家父子。黄飞鸿是个醉拳迷，这一趟正合他的心意。护送途中他们遭到密探截杀，汽车一头撞进了仁伯的酒庄。这位深藏不露的醉拳高手出手替二人解了围，转头又扣下他们做工抵偿酒庄的损失。一枚玉扳指把各路人马都卷了进来，李督军随后率军赶到，酒庄里外掀起连场激战。1994 年的这部作品是《醉拳》系列的第三部，黄飞鸿由季天笙饰演，刘家良执导并出演醉拳高手仁伯，拳脚设计依旧是南派醉拳的路子，风格比起前两部更热闹也更夸张。｜TMDB 6.1｜TMDB 6.1"
