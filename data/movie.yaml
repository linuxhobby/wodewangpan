  quark_url: "https://pan.quark.cn/s/3e440e753810"
  description: "影片来源于一个真实的故事。1962年，卢旺达宣布独立后，胡图族与图西族两部族之间矛盾重重，多次发生冲突，战事持续不断。 1994年4月6日，一架载着卢旺达胡图族总统朱韦纳尔·哈比亚利马纳和布隆迪总统西普里安·恩塔里亚米拉的座机在卢旺达首都基加利上空被火箭击落，两国元首同时罹难。4月7日，空难在卢旺达国内引发了胡图族与图西族两族的互相猜疑，从而爆发了一场规模空前的武装冲突和种族大屠杀，令世界震惊的人间惨剧拉开了帷幕。被胡图族种族主义者控制的广播电台也为大屠杀的行为煽风助阵，他们叫嚣着“让一切的郁积都爆发出来吧。在这样一个时刻，鲜血将滚滚而出”，失控的人群在媒体的号召下四处搜寻和杀死图西族人，空气…｜TMDB 7.7"
  date: 2004-12-22
  added: 2026-09-30
  image: mv-178.jpg

- id: mv-179
  title: "十二宫"
  category: 电影
  tags: ["电影", "犯罪", "悬疑", "惊悚", "十二宫 Zodiac"]
  quark_url: "https://pan.quark.cn/s/3dbbca493228"
  description: "二十世纪七十年代的旧金山，出现了一个自称十二宫的杀人狂。他杀人之后给媒体寄信，留下密码和线索，公开向警方挑衅；而管辖权分割、部门之间的推诿和一连串阴差阳错，让案件始终无法收口。影片把重点放在调查本身：走访、比对笔迹、核对时间线，过程冗长、反复、没有回报。追查者一个是报社记者罗伯特（杰克·格兰恩哈尔 饰），一个是漫画家出身的保罗（小罗伯特·唐尼 饰），还有警察大卫（马克·普法洛 饰）——三个人被同一个未解的谜拖着走，各自的生活也随之崩解。影片对时代细节的还原相当讲究，报社、办公桌和衣着都在替叙事说话。它最独特的地方在于把查不到本身拍成了内容，这在同类片里很少见。导演刻意不给答案，也不做英雄化处理，执念本身才是主角。它真正想说的是执念如何改变一个人，而不是凶手到底是谁。适合喜欢真实犯罪题材、能接受没有痛快结局的观众。｜TMDB 7.5"
  date: 2007-03-02
  added: 2026-09-30
  image: mv-179.jpg

