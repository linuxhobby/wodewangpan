  baidu_code: "jcnv"
  description: "纽约的夜里，华人警察黄比利和同事在酒吧庆祝来美十周年，一群劫匪突然闯进来，同事当场丧命。比利悲愤之下当场击毙凶手，却因此触怒上司，被发配去给大亨沙比路的时装展维持秩序，明摆着是惩罚。偏偏时装表演那天，沙比路的女儿罗娜被人绑走。比利查下去发现蹊跷：沙比路的保镖宾尼此前多次往香港打电话，种种迹象指向沙比路与香港头号毒枭高伟洛之间早有合作，这起绑架很可能是两方反目的结果。为了查清真相，比利带着搭档丹尼直飞香港，找到高伟洛昔日的两名合作伙伴李兴与何天的女儿何美芳。线索刚有眉目，高伟洛的人已经杀到，对方要一次性清掉所有知情者。比利在重重围堵中撕开口子，摸到对方老巢，带着搭档发起了最后那一击。这部 1985 年的作品是成龙进军好莱坞的第二次尝试，动作戏拍得很硬，风格偏写实，跟他同期的香港作品明显不是一个调子。｜TMDB 5.9｜TMDB 5.9"
