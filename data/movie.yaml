  description: "《反叛行动》的主线可以概括为一句话：一个人回头去摧毁那个造就了她的机构。女主角自幼被带进一个代号「实习生」的中央情报局绝密项目，和一批同龄孩子一起被训练成没有留下任何档案痕迹的杀手——他们不算正式编制，也不存在于任何名单上，这就是为什么这类人好用。多年之后她决定不再这么活下去，于是把当年那批同伴重新召集起来，把枪口转向昔日的教官与幕后主使。招致的后果可想而知：情报机构只能派出同等致命的力量，来清理自己当年造出来的麻烦。影片的动作设计偏写实，近身与枪械的配合算是这一档里不错的水平，没有超级英雄式的夸张，更多是清房、撤退、再交火。团队作战的部分比个人英雄主义写得用心，几位成员各有所长。缺点是剧情骨架老套，幕后的机构几乎是纯背景板，女主之外的人物基本只有功能。整体是合格的流水线动作片，看完不会记住多少，但两个小时并不难熬。推荐给喜欢硬派女杀手题材、对「被自己造出来的东西反噬」这个套路还不腻的观众。｜TMDB 6.4"
