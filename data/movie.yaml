  quark_url: "https://pan.quark.cn/s/3b5c16da42ab"
  description: "埃利奥·布兰德是一个性格开朗而又温顺的的推销员。然而，即将迎娶一生挚爱的他却陷入了债务危机中。正当他为此感到绝望，走投无路之时，意外的接到了一个神秘的电话，他被告知已被挑选参加一场隐藏摄像头录制的真人秀电视游戏节目。只要他按照要求完成13项游戏任务，就能获得一笔总值620万美元的奖金。艾利奥试探性的完成了前两项任务：抓住在他身旁飞来飞去的苍蝇；将抓到的苍蝇吃到肚子里去。紧接着数千美元突然出现在他的银行账户，埃利奥虽然持怀疑态度，但是金钱的利诱驱使他安慰自己是可以随时放弃这不亏本钱的游戏。然而，他却不知道自己陷入了他人的恐怖操纵之中，随着游戏的升级埃利奥特必须完成更为极端的任务，他也因此走上了一…｜TMDB 6.3"
