  description: "一个右臂天生神力的少年，心思直、运气差，一路磕磕绊绊地拜师学艺，最后站上了擂台。故事的主线简单到几乎一眼能望到底，真正的看头全在过程里。收下他的四位师傅，是四个牙都快掉光的糟老头，各自抱着同一个心思：把这小子练出来，好去擂台赛上赢一笔奖金。偏他们传授的所谓绝艺，来路都不太正经，招式名字听着唬人，练法却荒唐得要命。少年天生有把子力气，性子又憨得可笑，学得越认真，场面越滑稽。等到真正站上擂台，那些看似胡闹的招数反倒派上了用场，一路跌跌撞撞地打到了最后。结局并不出人意料，真正让人记住的是这一路上那些荒唐到家的小桥段，四个老头各出各的馊主意，少年却照单全收，练得越认真越滑稽。影片 1991 年上映，属于周星驰式的无厘头功夫喜剧，笑料密集、节奏飞快，细节上的巧思远比剧情框架精彩，跟成龙那条靠身手搏出来的动作路线完全是两条路子。｜TMDB 6.4｜TMDB 6.4"
