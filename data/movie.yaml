  description: "生活对小职员卫斯理（James McAvoy 饰）来说是毫无意义的重复，每天要忍受痴肥上司唠叨、好友与女友上床，还要不停用药物控制过快的心跳。这天他被一名陌生女子从疯狂枪手的追杀中救出，进入了刺客联盟的世界，救命恩人火狐（Angelina Jolie 饰）与联盟领导史隆（Morgan Freeman 饰）告知卫斯理当年抛弃他的父亲也是组织一员，最近为叛徒十字所杀，卫斯理必须尽快在严酷的训练中成长，才能自保，甚至为父报仇。 刺客联盟起源于纺织行会，他们按照纺织机提供的密码决定刺杀对象，从而顺应命运的安排。卫斯理很快凭借优异的天赋掌握一系列暗杀手段成为组织一员，开始执行命运赋予的任务，并逐渐接近向…｜TMDB 6.5"
