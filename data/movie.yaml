  baidu_code: "46vu"
  description: "《勇敢之人》把背景放在朝鲜半岛局势骤然紧张的那段时间：一架美国直升机因为机械故障在朝鲜一侧坠毁，机组成员活了下来，但处境立刻变得极其危险。他们没有后援，通讯受到限制，任何误判都可能升级成国际事端；而更麻烦的是机上还有一名民用技术专家——这个人既没有军事训练，又是不能被落在当地的关键角色。于是幸存者必须在没有上级指示的情况下自己决断：是留在原地等待，还是设法带着伤员和技术专家走出这条线。影片的主要张力来自「孤立无援」这件事本身：时间被压缩，决策只能就地做出，而地形、语言、边境两侧的军队都是变量。整体上是一部标准的军事惊悚片，节奏紧凑，篇幅不长，一个晚上足够看完。缺点是人物刻画偏功能化，反派几乎是背景式的，几处情节推进靠巧合，结局的处理相对温和。适合喜欢朝韩题材、军人求生故事，或者偏爱那种任务现场失控后如何收尾的观众。｜TMDB 6.7"
