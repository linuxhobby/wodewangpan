  baidu_code: "ncqv"
  description: "清廷四处搜捕练武之人，形意门大掌门陈鹏飞只好带着孙儿兴龙躲进山里，隐姓埋名过日子。爷爷定下规矩不许孙儿显露功夫，可兴龙年轻气盛，一天到晚在外头惹是生非，到底还是把身份漏了出去，清廷统带任天化一路追到山间。陈鹏飞拼尽全力仍不是对手，当着孙儿的面被打死。亲眼看着爷爷倒在眼前，兴龙这才收起玩心，寻到祖父的旧友八脚麒麟门下，从头扎马步、练形意拳，把报仇当成唯一活下去的理由。练功的日子枯燥又熬人，他一遍遍在梦里打出木人巷，醒来接着练。等到功夫成了气候，与任天化的那场正面清算便再无退路。这部 1979 年的作品是成龙早期自导自演的代表作，动作设计走的是硬桥硬马的南派路子，拳脚招式清晰可数，与后来那些靠着环境道具翻腾挪移的场面完全是两种味道，喜剧成分主要落在兴龙插科打诨的性子上。｜TMDB 6.7｜TMDB 6.7"
