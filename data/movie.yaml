- id: mv-323
  title: "夏日福星"
  category: 电影
  tags: ["电影", "动作", "喜剧", "夏日福星 夏日福星"]
  quark_url: "https://pan.quark.cn/s/dc383bc7929c"
  description: "五福星加上霸王花一行人好不容易凑出个假期，跟着旅行团去泰国散心，人还没玩够，曹警司的电话就追了过来：富商马先生被杀，要他们立刻回香港协助调查。真正的麻烦不在案子本身，而在那三个随后抵港的杀手：他们要杀掉马先生的女友王小姐，以及与此案有关的商人刘仁富灭口。为了保住两条人命，几路人马分了工：霸王花把王小姐接到五福星家里藏着，鸡骨草和鹿尾巴负责护住商人，独脚金与霸王花则留在屋里守株待兔。计划落了空，杀手识破了布置，商人当街被杀，王小姐那边也陷入追杀。最要紧的关头，鸡骨草赶到，跟杀手硬碰硬地打了一场。1985 年的这部片子是「福星」系列的又一部群戏力作，人多却不乱，笑料一茬接一茬，成龙饰演的鸡骨草戏份集中在后段，几场搏斗依旧是他拿手的环境动作路数。｜TMDB 6.5｜TMDB 6.5"
  date: 1985-08-15
  added: "2026-10-09 15:23"
  image: mv-323.jpg

- id: mv-324
  title: "龙兄虎弟"
  category: 电影
  tags: ["电影", "冒险", "动作", "喜剧", "龙兄虎弟 龍兄虎弟"]
  quark_url: "https://pan.quark.cn/s/4d18385cc15a"
  description: "《圣经》里记载，上帝曾用五件「上帝武装」击败邪魔，后来这五件东西散落到了世界各地。眼下伯爵手里有三件，邪魔的传人手里有两件。艾伦的女友罗娜在一场时装表演上被信奉邪魔的恶僧侣掳走，对方开出的条件是：拿伯爵那三件上帝武装来换人。艾伦只好去找兄弟亚洲飞鹰帮忙。不巧的是，飞鹰手上的三件早就卖给了伯爵，要想救人，只能先把东西借回来。伯爵起初一口回绝，艾伦索性夜入伯爵府去偷，结果被当场抓住。最后是飞鹰出面说情，答应借出三件的同时，把邪魔阵营那两件也一并奉上，伯爵这才松口。更麻烦的是伯爵的女儿阿美，她坚持要跟着去监督这次行动，也成了队伍的一员。三个人就这样一路往欧洲去，救人、夺宝，哪一样都不轻松。1986 年的这部作品远赴欧洲取景，古堡、雪山与公路追逐轮番上阵，是成龙八十年代表现最奔放的一次冒险尝试。｜TMDB 7.0｜TMDB 7.0"
  date: 1986-08-16
  added: "2026-10-09 15:23"
  image: mv-324.jpg

- id: mv-325
  title: "A计划续集"
  category: 电影
  tags: ["电影", "动作", "喜剧", "A计划续集 A計劃續集"]
  quark_url: "https://pan.quark.cn/s/d19cb6fea37a"
  description: "清末的香港，警官马如龙奉命接管西环一带的治安。他上任后先拿当地恶霸开刀，这一动就捅了马蜂窝：那位与黑恶势力勾结的帮办「镇三环」，从此跟他结下了梁子。麻烦还不止于此。马如龙无意间结识了革命党人，被卷进清廷的抓捕风波；而上一部里被他重创的海盗残余，也一直在暗处等着寻仇。三方势力缠在一起，把他推到了一个前后无路的境地：官面上有人要办他，江湖上有人要杀他，朝廷的人还在到处抓革命党。马如龙只能一边打一边周旋，在连场搏斗与错位的笑料里找出路。这部 1987 年的作品由成龙自编自导自演，张曼玉、关之琳、刘嘉玲等人一同出演，拿下了第 7 届香港电影金像奖最佳动作设计奖，群戏、动作与喜剧三条线都撑得很稳，是系列里公认水准最高的一部。｜TMDB 7.1｜TMDB 7.1"
  date: 1987-07-25
  added: "2026-10-09 15:23"
  image: mv-325.jpg

- id: mv-326
  title: "龙拳"
  category: 电影
  tags: ["电影", "动作", "惊悚", "龙拳 龍拳"]
  quark_url: "https://pan.quark.cn/s/c440a9e5a280"
  description: "唐山武馆馆主庄三太在武林比武中夺魁，捧回武林至尊匾，还没捂热，百胜道场的钟鉴均就上了门。两人十八年前为争夺钟夫人结下的仇，到今天仍未解开。钟鉴均下手不留情，用绝技三弹腿将庄三太重伤致死。庄三太的高徒唐浩云带着师母与师妹离开故地，心里只剩下一件事：报仇。另一边，钟夫人因丈夫手段太狠，以死相劝，钟鉴均痛失爱妻，把「百胜」改成了「百忍」。三年过去，百忍道场在乡里已有口碑，临近的豪门魏家横行霸道，村民求到门下，道场便出面捉拿魏家的恶仆。偏偏就在此时，武功大进的唐浩云寻上门来。一心赎罪的钟鉴均根本不还手，唐浩云一拳打空，只能罢手。可魏家已经布好了局，他们要借唐浩云的手，除掉钟鉴均。1979 年的这部片子是成龙早期主演的正统功夫片，拳脚硬朗，情绪沉，跟他后来那种带着笑料的打法完全是两种气质。｜TMDB 6.3｜TMDB 6.3"
  date: 1979-04-21
  added: "2026-10-09 15:23"
  image: mv-326.jpg

- id: mv-327
  title: "机器之血"
  category: 电影
  tags: ["电影", "科幻", "动作", "冒险", "机器之血 机器之血"]
  quark_url: "https://pan.quark.cn/s/6f5f8c1f5fa6"
  description: "2007 年，Dr.James 在军火商的资助下推进生化人研究。实验失控，生化人安德烈发生基因突变后大开杀戒，杀了军火商，接管了他的组织与研究。Dr.James 侥幸活命，只能寻求警方保护。特工林东接到证人保护任务，代价是必须离开当时生命垂危的小女儿西西。十三年过去，一本名叫《机器之血》的科幻小说出版，把三股力量重新搅到了一起：神秘的黑衣生化人组织、身份不明的骇客李森、还有隐姓埋名多年的林东。他们的目标都指向同一个看似普通的女孩 Nancy，人人都想拿到她身上的秘密。销声匿迹多年的安德烈再度出手，几番缠斗之后终于把 Nancy 抓走。林东与李森只能联手犯险救人，而就在关键时刻，林东才看清李森的真实身份：他是当年被杀的那位军火商的儿子，生化人的实验记录也已经落到了他的手上。2017 年的这部作品把成龙式的动作搬进了科幻框架，是他晚年题材上步子迈得最大的一次尝试。｜TMDB 6.0｜TMDB 6.0"
  date: 2017-12-18
  added: "2026-10-09 15:23"
  image: mv-327.jpg

- id: mv-328
  title: "尖峰时刻"
  category: 电影
  tags: ["电影", "动作", "喜剧", "犯罪", "尖峰时刻 Rush Hour"]
  quark_url: "https://pan.quark.cn/s/51928a120bab"
  description: "韩大使到美国赴任之前，曾主持破获中涛犯罪集团的走私网络，这笔账被人记了下来。人刚到美国，中涛就指使手下绑走了他的女儿素洋，开口索要五千万美元赎金。FBI 随即介入全面调查，韩大使却信不过美方的效率，执意要调香港的老搭档李督察过来帮忙。FBI 这边也不甘心被抢了风头，特意从洛杉矶警局挑了个麻烦不断的卡特出来「协助」，说白了是拖后腿。一个是身手不凡、行事低调的香港督察，一个是嘴上没个把门、作风高调的美国警探，两个人凑到一起，误会和笑话就没断过。可危机一场接一场地来，两人反倒在一次次交手中磨出了默契。1998 年的这部片子让成龙真正打进了北美市场，动作戏与搭档之间的化学反应同样重要，也是后来整个系列的起点。｜TMDB 7.1｜TMDB 7.1"
  date: 1998-09-18
  added: "2026-10-09 15:23"
  image: mv-328.jpg

- id: mv-329
  title: "解忧杂货店"
  category: 电影
  tags: ["电影", "奇幻", "剧情", "家庭", "解忧杂货店 解忧杂货店"]
  quark_url: "https://pan.quark.cn/s/8e15e0248b2d"
  description: "僻静街道旁有一家杂货店，传说把烦恼写在信里投进卷帘门的投信口，第二天就能在店后的牛奶箱里取到回信。某个夜晚，三个正处在人生岔路口的年轻人阿杰、小波、彤彤无意间闯了进去。这一闯，时间像是被拧开了一道缝：从收到第一封来自过去的咨询信开始，他们一边回信一边收信，过去与未来就这么接上了。信的那头，是几个同样被卡住的人：拿不准要不要继续音乐梦想的秦朗，不知道该不该跟着家人躲债远走的浩博，犹豫着要不要放下舞女工作的晴美。三个年轻人给出的建议，最终都成了对方人生里的转折点，也悄悄把所有人的命运串到了一起。而他们自己，也在这一来一回中，收到了属于自己的答案。这部 2017 年的作品改编自东野圭吾的同名小说，走的是温情奇幻的路子，几段故事彼此勾连，节奏舒缓，情绪落在「被听见」这件事上。｜TMDB 5.7｜TMDB 5.7"
  date: 2017-12-29
  added: "2026-10-09 15:23"
  image: mv-329.jpg

- id: mv-330
  title: "师弟出马"
  category: 电影
  tags: ["电影", "动作", "喜剧", "师弟出马 師弟出馬"]
  quark_url: "https://pan.quark.cn/s/53f4dc1d5820"
  description: "正风武馆在当地是有名气的，每年一度的舞狮大会，他们已经连着七年把冠军扛了回来。今年主办方为了吸引看客，把难度往上又提了一档，设了个采青大赛。馆里原本年年是阿昆出赛，偏偏临出赛前几天练习时崴了脚，馆长没办法，只能把第一次上场的阿龙推上去。难度摆在那里，阿龙头一回参赛，最终没能撑住，输了。师兄弟们免不了拿他打趣，阿龙倒没往心里去。真正让他放不下的，是他在比赛里无意间撞见的一件事。那个发现像块石头一样压在他心头，比输掉比赛要沉得多。1980 年的这部片子由成龙自导自演，是他正式挑大梁的早期代表作，片中大量舞狮与采青的段落本身就是硬功夫，动作与喜剧的配合已经相当熟练，结尾那场连续搏斗更是把他的耐力与节奏感展现得淋漓尽致。｜TMDB 7.0｜TMDB 7.0"
  date: 1980-02-09
  added: "2026-10-09 15:23"
  image: mv-330.jpg

- id: mv-331
  title: "功夫瑜伽"
  category: 电影
  tags: ["电影", "喜剧", "悬疑", "家庭", "功夫瑜伽 功夫瑜伽"]
  quark_url: "https://pan.quark.cn/s/e4dc69572f5a"
  description: "考古学教授 Jack 在讲台上一待就是很多年，讲起那些被他添了油加了醋的历史，校长和学生都将信将疑。某次课后，一个印度姑娘找上门来，摊开一张千年地图，正好戳中了他的痒处。Jack 拉上挚友的儿子李琼斯和助教小光，凑成一支「寻宝小分队」，冲着那颗传说中的神秘宝石出发了。这一路的画风跳得厉害：在迪拜跟土豪飙车，在冰岛钻进冰穴，在印度跟土狼周旋，还跟当地贵族比了一场舞。地理跨度拉得很开，动作与喜剧的配比也往上加了一档。作为 2017 年的贺岁档作品，这部片子走的是标准的合家欢路线：不追求烧脑，图的是热闹与喜庆，取景一路从迪拜铺到冰岛，场面铺得相当舍得。喜欢看异国风光配着热闹打闹的观众，这一部看得会比较轻松，是成龙后期代表性的那种公路式寻宝喜剧。｜TMDB 5.9｜TMDB 5.9"
  date: 2017-01-27
  added: "2026-10-09 15:23"
  image: mv-331.jpg

- id: mv-332
  title: "龙少爷"
  category: 电影
  tags: ["电影", "动作", "喜剧", "龙少爷 龍少爺"]
  quark_url: "https://pan.quark.cn/s/33d045443665"
  description: "清朝末年，洋人打进来，大势眼看就要倾覆。大内太监总管程如虎瞅准宫中混乱，以「保护国宝」为名，带着一队禁卫军把大批宫廷珍宝押出了紫禁城，一路辗转运到广东龙山镇，再借着当地首富王员外与洋人熟络的关系，一件件卖出去换钱。副总管于海坚决反对，当场跟他闹翻。另一边，龙山镇富家公子龙少爷武艺高强，某天与朋友出游，无意间闯进一处堆满宝物的地方，被看守发现后一路追杀，多亏王员外暗中出手才捡回一条命。他撞见的正是程公公私藏国宝的所在，机关重重。与此同时，于海趁乱偷出了一批国宝，程公公大怒，派人四处搜捕。一次在岳王庙里，程的手下正要拿人，龙少爷拔刀相助，反倒把杀身之祸引到了王员外身上。程公公认定两人勾结，下令一并剿杀。为救人，龙少爷不得不正面挑战这个老谋深算的卖国贼。1982 年的这部片子由成龙自导自演，是他早期把家国情怀与谐趣功夫捏在一起的作品。｜TMDB 6.5｜TMDB 6.5"
  date: 1982-01-21
  added: "2026-10-09 15:23"
  image: mv-332.jpg

