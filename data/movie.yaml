  quark_url: "https://pan.quark.cn/s/b07c89461ea7"
  description: "板门店边界的共同警备区，哨所里一名朝鲜士兵被来路不明的子弹打死，双方随即交火。最有嫌疑的是同在边界上的韩国士兵，可南北双方互相指责，谁都认为对方该负责。为处理这桩无头案，双方同意由中立国出面调查，瑞士籍韩裔女孩苏菲（李英爱 饰）受命前来。韩国一方的李秀赫（李秉宪 饰）始终保持沉默，朝鲜一方的幸存者吴敬必（宋康昊 饰）则表现出敌意，事情越来越扑朔迷离。随着调查深入，苏菲发现现场另有其人，也发现两边的士兵之间存在着不该存在的东西。影片用大量闪回交错呈现同一个事件，视角的切换是关键手段，它关心的始终是那几个人，而不是哪一方的立场。朴赞郁把这部拍成了一部关于分裂的悲剧，边界两侧的敌意与具体的个人情感始终在互相撕扯。它对板门店这个特殊空间的呈现相当准确，几米之内就是两个世界。结尾把个人和国家这两层关系压在一起，余味很重。｜TMDB 7.8"
