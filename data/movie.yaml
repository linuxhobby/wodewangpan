  description: "《爱情假说》改编自曾在社交平台上掀起讨论热潮的同名畅销小说，走的是学术界版本的「契约恋爱」。女主角是研究化学的博士生，聪明、严谨、有点社恐，为了闺蜜的一次临时求助，她在实验室走廊上随手抓住一位陌生男性吻了上去——这一吻的对象偏偏是系里出了名难接近的年轻教授亚当·卡尔森，冷面、毒舌、对学生毫不留情。问题是两人此刻都恰好需要一段名义上的恋情：她要向别人证明自己走出了上一段感情，他则有自己难言的苦衷。于是这段本该演完就散的关系被迫延续下去，实验设计、论文截止日期、校园八卦全都掺了进来。影片的乐趣在于把科研生活拍成了恋爱节奏的一部分：实验室里的化学反应与两人之间的化学反应互为对照，女主对待实验的那套理性方式，正好碰上一个无法被量化的对象。改编保留了原著的轻快语气与尴尬喜感，情感推进也足够顺滑。结局的反转在书中被讨论很多，电影的处理相对收敛。推荐给喜欢校园学术背景的爱情喜剧、看重两个人之间平等关系的观众。｜TMDB 8.0"
