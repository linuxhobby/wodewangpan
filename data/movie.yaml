  baidu_code: "sbtp"
  description: "程家三兄弟替乡亲出头除了一害，却把地煞和天煞两个狠角色彻底得罪了。老大死在屠刀之下，老二程振南和老三程振北各自带着儿子阿龙、阿栋连夜逃命，混乱中两个孩子走散，从此走上了两条完全不同的路。多年过去，阿龙长成了个乐观正直的青年，日子过得平淡，直到某次情急之下使出家传的程家拳。这套拳早已失传，却也因此暴露了行踪，一路追查仇家的地煞和天煞循着线索找上门来，程家再度遭难。危急关头，丐帮帮主的女儿小玲拼死护住阿龙，自己却没能逃出来。血债压在肩上，阿龙找到了失散多年的阿栋，两兄弟决定联手，把这笔账算清楚。这部 1983 年的作品是《笑拳怪招》的续作，走的依旧是南派拳脚的路子，招式扎实，节奏明快。成龙在这部里的身手已经相当成熟，几场对打干净利落，能看到他从早期硬派功夫向后来的动作喜剧过渡的痕迹。｜TMDB 5.8｜TMDB 5.8"
