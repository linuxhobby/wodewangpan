  description: "李探长与贫嘴的卡特凑到一起，本来就意味着麻烦。上一次任务过去没多久，新的一桩就砸了过来：一直在收集三和会犯罪证据的韩领事被人当街暗杀，李探长追凶追红了眼，自责压得他喘不过气。此时的卡特早被贬去当交警，一腔热心办的全是倒忙，可这对组合还是凑到了一起。顺着韩领事留下的线索，他们一路追到巴黎，那座城市正是三和会藏得最深的地方。查案之外还有一件事压在李探长肩上：他要护住韩领事长大成人的女儿苏阳。等到真正的杀手站到面前，李探长才发现那是他小时候在孤儿院一起长大的兄弟 Kenji。旧情与职责正面撞上，这一关比任何一场打斗都难过去。这部 2007 年的作品把舞台搬到了巴黎，动作场面延续了系列一贯的搭档互补路数，李探长的沉稳与卡特的喋喋不休依旧是最好笑的部分。｜TMDB 6.5｜TMDB 6.5"
