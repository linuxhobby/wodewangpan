  description: "《刺杀游戏》讲的是两个替不同老板卖命的顶级杀手：他们多次交手，彼此最清楚对方的斤两，也各自为这份职业付出了代价——至亲之死让两个人开始重新盘算，自己这些年到底在替谁干活。于是关系发生了变化：从敌对到相惜的过程写得相当耐心，中间有好几段是两个人隔着一张桌子互相试探，看对方会不会先动手。等他们终于站到同一边，对手变成了那些真正把人当消耗品的家伙——付钱的人在办公室里签字，做这些事的人连名字都不会留下。影片的乐趣主要来自双主角结构，两位主演的气质一冷一热，对手戏撑起了大半个场子；几场暗杀与近身格斗的处理干净，没有太多花哨的剪辑。缺点是剧情走向相当常规，幕后的反派几乎没有层次，中段稍显平缓。整体上它属于扎实、老派的动作片，不给你惊喜，但也不会让人觉得敷衍。适合喜欢那种一路莽到底的双人动作组合片、尤其偏好有年纪的主演的观众。｜TMDB 6.3"
