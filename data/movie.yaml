  description: "《俄罗斯方块》把一款人人玩过的游戏拍成了冷战商战片。故事发生在 1988 年前后，荷兰游戏设计师亨克·罗杰斯在一次展会上偶然接触到这款来自苏联的消除游戏，直觉告诉他该专属主机，于是踏上前往莫斯科的谈判之旅。等待他的不是签约文本，而是层层审批、国有机构的内幕交易，以及背后各方对版权的暗中争夺。影片把枯燥的授权谈判拍出了谍战片的紧张感：一边是急于变现的中间人，一边是不懂游戏却掌握命运的官员，再加上急着抢占市场的主机厂商，几方势力围着一块小小的方块拉扯。导演用像素动画、仿旧式游戏的过场来复刻八十年代的质感，娱乐性相当足，结尾那段街机风格的呈现是全片最出彩的地方。塔伦·埃哲顿演得了这种带点执拗的理想主义者。它并不严格遵循史实，部分桥段有明显戏剧化加工，当作改编故事看会比当纪录片舒服得多。适合对游戏掌故、八九十年代流行文化和商战题材都感兴趣的观众。｜TMDB 7.8"
  date: 2023-03-15
  added: 2026-09-07
