  description: "《退伍军官》是一部印度动作片，主人公退役准尉阿尔俊·莫里亚在军队里待了大半辈子，回到平民社会之后并没有真正安顿下来：妻子去世这件事他始终没能过去，和女儿的关系也一天比一天疏远。好不容易开始了新的生活，一次鲁莽的行为却把这一切彻底打乱，旧伤被重新撕开——对于那些当了半辈子兵的人来说，所谓「过去的事」从来不会被真正放下。于是他只能把心里那个当兵的部分重新唤醒，去打一场离自己非常近的仗。这类印度动作片通常都要有蓄力与爆发，本片也不例外，前半段铺得比较耐心，看点在后半程集中释放。影片真正的内核其实是父女关系：一个是习惯了用命令和纪律解决问题的老兵，一个是想要自己生活的年轻人，两个人的沟通方式完全不同，而外面发生的这场冲突，最终是把这条线重新接到一起的方式。缺点是整体故事比较常规，部分情节略显冗长，歌舞段落与全片的军人基调也有些脱节。推荐给喜欢退役军人题材的观众。｜TMDB 6.8"
