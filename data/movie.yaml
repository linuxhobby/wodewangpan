- id: mv-222
  title: "偷天陷阱"
  category: 电影
  tags: ["电影", "爱情", "剧情", "悬疑", "偷天陷阱 Entrapment"]
  quark_url: "https://pan.quark.cn/s/cd6f9bf6c638"
  description: "一个著名画家在纽约举办了一次画展，不料展出的名画却被盗走，众人怀疑的矛头指向了大盗麦克（肖恩•康纳利 Sean Connery 饰）。因为麦克是一个名贵艺术品的惯偷分子，而这次名画失窃的所有证据，也表明麦克嫌疑最大。 为了使其入罪，承包此画的保险公司决定使用美人计——职员维吉尼亚（凯瑟琳•泽塔-琼斯 Catherine Zeta-Jones 饰）假扮麦克的同道中人，诱使麦克出手犯罪，而保险公司则随后追踪取证。然而，每一次麦克都没有落入圈套，还与维吉尼亚渐生情愫。得知千年虫入侵电脑，维吉尼亚唆使麦克利用这个机会入侵马来西亚的国际银行，这里管理森严，号称全球之最。一场斗智斗勇的计划开始了，而维吉尼…｜TMDB 6.2"
  date: 1999-04-29
  added: 2026-09-30
  image: mv-222.jpg

- id: mv-223
  title: "城中大盗"
  category: 电影
  tags: ["电影", "犯罪", "剧情", "惊悚", "城中大盗 The Town"]
  quark_url: "https://pan.quark.cn/s/b935f1e73b0c"
  description: "波士顿近郊的查尔斯城，爱尔兰裔工薪阶层聚居，贫困和压力让银行抢劫成了某种地方行当。某个早晨，银行经理人克莱尔被一伙头戴骷髅面具的劫匪劫为人质，最终意外生还，仿佛那场变故从未发生。不久后她邂逅了高大英俊的道格·麦克雷，两人开始交往——而克莱尔并不知道，这个人正是那天站在她面前的人之一。影片最有意思的地方在于它把抢劫当成一个社区内部的职业来拍：谁负责开车、谁负责枪、谁负责收尾，都是熟人之间的事。道格想离开却总被拉回去，这种想收手的处境是他身上唯一真实的挣扎，他几乎不解释自己的处境，沉默是他唯一的防御。对查尔斯城的呈现相当具体，酒吧、球赛和家庭聚会构成了这个社区的另一面，它对这个地方的态度是同情的，没有把抢匪写成恶棍。动作戏集中在首尾两场，中间大量是人物和街区。｜TMDB 7.2"
  date: 2010-09-15
  added: 2026-09-30
  image: mv-223.jpg

- id: mv-225
  title: "飞机陷落"
  category: 电影
  tags: ["电影", "动作", "冒险", "惊悚", "飞机陷落 Plane"]
  quark_url: "https://pan.quark.cn/s/2991e50524f0"
  description: "《飞机陷落》是一部结构非常干净的动作片：先把不可能的降落做完，再让人落进更难的局面。前半段是空中戏——机长布罗迪·托伦斯驾驶一架民航客机从新加坡经东京飞往檀香山，途中遭遇强烈风暴，飞机受损、通讯中断，他只能把飞机迫降在一片地形复杂的地区。这一段的紧张感做得不错，仪表、无线电和机舱里的慌乱都处理得有模有样。麻烦在于飞机落下的地方不对：那片区域被当地武装势力控制着。飞机刚刚停稳，武装人员就找上门来，打算把这架飞机和机上乘客一并变成筹码。于是原本只需要等待救援的局面，变成了要在丛林里周旋、保护乘客不被带走的对峙。杰拉德·巴特勒演这类沉默能打的硬汉相当熟练，与一位身份可疑的乘客之间的配合也算有来有回。影片不追求智商的惊喜，反派就是反派，好人就是好人，所有冲突都正面解决，看得很明确。缺点是部分情节套路化明显，后段的动作处理稍显急躁。适合喜欢那种毫无负担、一路紧绷到收尾的动作片的观众。｜TMDB 6.9"
  date: 2023-01-11
  added: 2026-09-30
  image: mv-225.jpg

- id: mv-226
  title: "黑亚当"
  category: 电影
  tags: ["电影", "动作", "冒险", "科幻", "黑亚当 Black Adam"]
  quark_url: "https://pan.quark.cn/s/d88d547dbf27"
  description: "《黑亚当》是超英世界里比较少见的那一面：这个人被古代诸神赋予力量之后，并没有学会所谓的分寸。故事开始于他被封印，五千年后重见天日，在现代世界里用一种别人完全没见过的方式行使自己的正义——该杀人就杀人，从不犹豫，也不觉得需要解释。影片其实在追问一个有点意思的问题：一个完全不讲程序的英雄到底还算不算英雄，旁观者该怎么给这种行为分类。正反两方的立场摆得比一般的超英片清楚一些，正义会社那几位成员的出场也给片子带来了一定的对照。道恩·强森对这个角色投入多年，形象上是贴合的，那种不动如山的压迫感确实存在。视觉奇观的量给得足，特效场面撑得起大银幕，节奏偏快，几乎不给喘息的机会。缺点相当明显：从头到尾都在打，人物关系基本靠台词交代，反派的设定和女巫线的处理都比较敷衍。适合想看点反英雄题材、不太费脑的爆米花片观众；期待剧作新意的话建议降低预期。｜TMDB 6.8"
  date: 2022-10-19
  added: 2026-09-30
  image: mv-226.jpg

- id: mv-227
  title: "黑鹰坠落"
  category: 电影
  tags: ["电影", "动作", "战争", "历史", "黑鹰坠落 Black Hawk Down"]
  quark_url: "https://pan.quark.cn/s/034fe5f97ed8"
  description: "影片改编自 1993 年的真实事件：一支美军特种部队被派往索马里，任务是推翻当地军阀、把粮食和人道援助送进去，结果在摩加迪沙的街巷里遭到伏击，救援行动演变成一场持续整夜的城市巷战。雷德利·斯科特的镜头非常克制，几乎不做情绪引导，也不给观众留出喘息，因此那种任务失控后只能自己想办法活到天亮的体验格外强烈。它的镜头语言几乎不带立场，观众看到的往往是混乱本身，而不是谁对谁错。影片的兴趣不在政治立场，而在把一场军事行动的过程还原得足够具体：通讯、掩护、撤离，每一个环节都可能出错。士兵们大多年轻，彼此之间的对话简短而直接，几乎不做性格铺陈。群戏调度和音效设计是公认的强项，大量演员的面孔在混战中被逐一记住。它对夜战的呈现相当克制，黑暗里的低辨识度让混乱感更加真实。它的观看体验更接近纪录而非剧情，情绪是慢慢累积出来的。适合战争片爱好者。｜TMDB 7.4"
  date: 2001-12-28
  added: 2026-09-30
  image: mv-227.jpg

- id: mv-228
  title: "第一滴血"
  category: 电影
  tags: ["电影", "动作", "惊悚", "剧情", "第一滴血 First Blood"]
  quark_url: "https://pan.quark.cn/s/a582c0f3d13b"
  description: "退伍军人兰博（西尔维斯特·史泰龙 饰）从越南回国，回到已显得陌生的原居小镇。当地警长（布莱恩·丹内利 饰）从第一眼起就对他百般挑剔，甚至把他带回警局肆意侮辱。不堪忍受的兰博袭警后逃走，警长随即召集大批警察展开追捕。兰博逃进荒山野林，不断用越战中掌握的游击战术反击，甚至夺下武器运输车返回小镇烧毁了商店——法律和武器都拦不住他。最后是他在越战时的长官上校（理查德·克里纳 饰）出现，劝说兰博放下枪械，而积压已久的兰博终于吼出了自己的困惑与不甘。影片常被当成纯粹的动作片，其实它的落点是创伤：一个被训练来打仗的人，回不到一个不需要他的社会。山林作战的段落是它的主要看点，陷阱、地形和耐力都被拍得很具体。结尾那段独白是整部片的情绪出口，也是它区别于续作的地方。｜TMDB 7.5"
  date: 1982-10-22
  added: 2026-09-30
  image: mv-228.jpg

- id: mv-229
  title: "四十七浪人之刃"
  category: 电影
  tags: ["电影", "奇幻", "动作", "四十七浪人之刃 Blade of the 47 Ronin"]
  quark_url: "https://pan.quark.cn/s/b5c74b6a0ead"
  description: "《47 Ronin》系列的第二部，时间推到元禄赤穗事件之后三百年。现代社会照常运转，而那些武士家族仍在暗中存续，守着外人不知道的规矩与仇恨。故事重新集结散落各地的浪人后裔，去对抗一股同样来自阴影里的旧势力。这一部的动作设计更偏奇幻，剑与咒术并存，战斗的尺度比前作放得更开。它在武士血脉如何在现代延续这个设定上比前作走得更远，也顺带把现代都市和古代仪式的反差做成了视觉上的主要趣味——高楼与神社出现在同一场戏里并不违和。剑术和咒术的组合在视觉上有新鲜感，属于这一部的特色。人物关系相对简单，节奏偏快，人物来不及深写，主要靠场面推进，看点是类型和视觉的混搭，而不是叙事的复杂。建议先看 2013 年的《47 Ronin》再接这部，人物和背景会更顺，其实单独看也能跟上。适合喜欢武士与奇幻混搭题材的观众。｜TMDB 6.4"
  date: 2022-10-25
  added: 2026-09-30
  image: mv-229.jpg

- id: mv-230
  title: "神圣之夜：恶魔猎人"
  category: 电影
  tags: ["电影", "动作", "奇幻", "恐怖", "神圣之夜：恶魔猎人 거룩한 밤: 데몬 헌터스"]
  quark_url: "https://pan.quark.cn/s/50c7c8580889"
  description: "2025 年的韩国动作奇幻片，改编自同名网络漫画。设定里有一支专收拾恶魔的神圣之夜小队，成员是被称作黑暗解决师的异能者。这次他们面对的不只是零星邪祟，而是一个有组织、有信仰支撑的犯罪集团——驱魔的对象从超自然的东西，变成了有人在系统地召唤它们。动作戏的漫画感很明显，符咒、超自然力量与近身格斗混在一起，暗色调画面和快切剪辑把节奏推得相当快。驱魔场面和打斗场面基本是重叠的，特效和肉搏相互推进。恶魔的形象设计偏向生物感，跟常见的宗教意象不太一样。人物配置是典型的小队结构，各人能力互补，情绪线靠过往创伤串起来，前史用闪回交代，篇幅不多但够用。作为漫画改编，它在还原造型这件事上做得相当认真。它对宗教元素的处理偏向通俗娱乐，不必担心需要背景知识。如果只想要一场接一场的超能力打斗，这部给得足够密集，节奏几乎不留喘息空档。｜TMDB 7.0"
  date: 2025-04-30
  added: 2026-09-30
  image: mv-230.jpg

- id: mv-231
  title: "疾速追杀3"
  category: 电影
  tags: ["电影", "动作", "惊悚", "犯罪", "疾速追杀3 John Wick: Chapter 3 - Parabellum"]
  quark_url: "https://pan.quark.cn/s/95f8160a7d0f"
  description: "高桌是一个笼罩整个地下世界的犯罪组织，约翰·威克曾宣誓永远忠于它。违约之后，组织派出审判者到酒店清算那些帮助过他的人，同时招募杀手零追杀他本人。失去庇护的约翰只能先处理伤口、找安全的退路，于是联系上曾与他同行的女杀手索菲亚，一支临时的小队就此成形。影片继续把那个由金币、血誓和礼仪构成的地下秩序做细，对酒店规则与血誓的解释比前两部都多，是这一部最值得留意的部分。地下世界的等级、义务和代价被一层层摆出来，看多了会发现打斗只是这套规则的表层表现。动作设计延续前作的近身枪斗风格，场景一环扣一环，在保持写实底子的同时越来越夸张，能看出制作的野心。情节推进简单直接，人物动机也清楚，世界观铺陈才是系列的真正主线。它的节奏几乎是直线推进，不设缓冲，体力的消耗感相当明显。对新观众来说，跳过前作直接看会损失不少设定上的趣味。｜TMDB 7.4"
  date: 2019-05-15
  added: 2026-09-30
  image: mv-231.jpg

- id: mv-232
  title: "碟中谍"
  category: 电影
  tags: ["电影", "冒险", "动作", "惊悚", "碟中谍 Mission: Impossible"]
  quark_url: "https://pan.quark.cn/s/60fad3865f50"
  description: "中情局向以吉姆为首的特工小组发来指令：一名特工已经叛国，将在布拉格的领事馆窃取中情局在东欧潜伏的特工名单，一旦落入坏人之手后果不堪设想。他们奉命获取该特工窃取情报的证据，并将其与买家一并逮捕。很快，在吉姆的策划下，一线主力伊森·亨特和其他成员全部到位。可计划进行到一半，情况急转直下，包括吉姆在内的小组成员相继殒命，情报失踪，只有伊森一人生还。几乎崩溃的伊森与上司见面，却因幸免于难和账户上突然多出的十二万美元被指认为叛徒。原来失窃的是假情报，行动的真正目的是查出内奸。突出重围的伊森决定自己把叛徒找出来，而此时同样侥幸生还的吉姆的妻子克莱尔与他重逢。伊森在开篇几乎是被动的，他的主动性是一点点夺回来的。那场悬挂在天花板的潜入戏是系列最经典的场面之一。几场调度是它的招牌。｜TMDB 7.0"
  date: 1996-05-22
  added: 2026-09-30
  image: mv-232.jpg

- id: mv-233
  title: "对外秘密：权力的诞生"
  category: 电影
  tags: ["电影", "犯罪", "惊悚", "剧情", "对外秘密：权力的诞生 대외비: 권력의 탄생"]
  quark_url: "https://pan.quark.cn/s/51f8c2dcd184"
  description: "1992 年的釜山，一直渴望出头的底层议员海雄（赵震雄 饰）希望终结自己万年候选人的命运。本届选举他信心满满，却被只手遮天的政治人物顺泰（李星民 饰）抛弃，在地区公选中再次落败。不甘心的海雄拿到了一份与顺泰有关的釜山开发机密文件，打算用它扭转局势；他与黑帮弼道（金武烈 饰）联手，获得大量选举资金，以无党派候选人的身份重回战场，节节取胜。此时的顺泰也得知了海雄手里的秘密武器，一场政治斗争就此展开。影片的兴趣不在政策，而在选举这台机器怎么运转——钱、人、消息和背叛各自值多少钱，对造势场面的呈现也相当热闹，游行、拜票和喊口号一样不少。它对九十年代韩国地方政治的刻画相当具体，舞弊和动员的手法拍得直接，街景还原得用心。黑帮这条线并不是装饰，它解释了资金从哪来、代价是什么。两位演员的对峙是主要看点。｜TMDB 6.1"
  date: 2023-03-01
  added: 2026-09-30
  image: mv-233.jpg

- id: mv-234
  title: "敢死队4：最终章"
  category: 电影
  tags: ["电影", "动作", "冒险", "惊悚", "敢死队4：最终章 Expend4bles"]
  quark_url: "https://pan.quark.cn/s/3ad9890c04f4"
  description: "又一批资深雇佣兵被派上一艘漂在海上的货轮，任务是在它满载的货物引发灾难之前把事情摆平。这一部的定位非常明确：给从小看动作片长大的人一次怀旧式的大杂烩，硬碰硬的拳脚、成规模的爆炸、老面孔轮番上阵。几场打斗的设计偏老派，能看出演员本人完成的比例不低。新成员与老班底之间的交接是它想讲的唯一一点新东西，其余基本是既有公式的重复。新角色的加入并没有带来多少化学反应，老观众大概还是冲着熟面孔来的。剧情和逻辑都别太当真，台词也多是那种彼此心照不宣的互损。动作场面的规格够，但创新不多，属于看着熟悉、看完就忘的那一类。它更像是给动作片这个类型递上的一封致敬信，内容不新，态度是真诚的。影片时长控制得比较克制，没有往更长的篇幅堆，这对一部纯动作片来说是好事。它并不打算在这个系列里做总结，只是把人再聚一次。｜TMDB 6.0"
  date: 2023-09-15
  added: 2026-09-30
  image: mv-234.jpg

- id: mv-235
  title: "谍影重重"
  category: 电影
  tags: ["电影", "动作", "悬疑", "惊悚", "谍影重重 The Bourne Identity"]
  quark_url: "https://pan.quark.cn/s/35cc15e45aa4"
  description: "一艘意大利渔船在海上救起一个身中两枪的男人。他醒过来，除了臀部皮肤下埋着的瑞士银行账号，没有任何东西能证明自己是谁。马特·达蒙饰演的杰森·伯恩从银行里取出大量现金、六本护照和一把枪，同时发现自己身上留着一些不该属于普通人的能力——格斗、枪械、语言。他开始顺着这些线索往回追，把搭车去巴黎的陌生女子玛丽（弗兰卡·泼坦特 饰）也卷了进来。影片对失忆的处理相当耐心，主角每一次想起的片段都不完整，反而更接近真实的恢复过程。它对欧洲城市的呈现偏冷，街道和旅馆都显得没有温度。它最特别的地方在于它的冷：与后来那些热闹的谍战片不同，这里的追杀几乎无声，动作直接而短促，主角更多时候是在躲避和思考。追车那场戏拍得相当克制，没有配乐，只有引擎和轮胎的声音。身份的疑问贯穿始终，真正的悬念不是他能不能活下来，而是他究竟是什么人。结尾干净利落，不把话说满。｜TMDB 7.5"
  date: 2002-06-14
  added: 2026-09-30
  image: mv-235.jpg

- id: mv-237
  title: "会计刺客"
  category: 电影
  tags: ["电影", "犯罪", "惊悚", "剧情", "会计刺客 The Accountant"]
  quark_url: "https://pan.quark.cn/s/703c3f94d6e6"
  description: "《会计刺客》的设定相当好玩：一个数学天才同时也是一名杀手。克里斯蒂安·沃尔夫的日常身份是一名不起眼的注册会计师，专门给那些不方便公开的机构做账，客户包括各种你不会想在同一个房间里遇到的人。他办事干净，收费公道，从不留下多余的东西。财政部那边负责追查金融犯罪的一名官员注意到了这个名字，与此同时，他为了掩护自己接下了一家合法的人工智能公司的账目，而这家公司的会计在核对时发现了上百万美元对不上的差额。于是两条线开始收拢：一边是调查在逼近，一边是有人不想让这笔账被查清。影片最大的谜团并不是那笔钱，而是主角本人——他的行为方式、他在高压之下的反应、以及他为什么会是这个样子，这些都铺得很细。本·阿弗莱克的表演刻意保持平直，反而贴合角色。几场动作戏干净利落，节奏不慢。缺点是后半段的转折略生硬，结局的分量不够。推荐给喜欢《谍影重重》式的悬念、又不介意主角是个性情古怪会计师的观众。｜TMDB 7.1"
  date: 2016-10-13
  added: 2026-09-30
  image: mv-237.jpg

- id: mv-238
  title: "罗汉系列3部合集（十一/十二/十三罗汉）"
  category: 电影
  tags: ["电影", "惊悚", "犯罪", "罗汉系列3部合集（十一/十二/十三罗汉） Ocean's Eleven"]
  quark_url: "https://pan.quark.cn/s/ddadcb4f5427"
  description: "这套合集收了《十一罗汉》《十二罗汉》《十三罗汉》三部。第一部里丹尼·奥逊（乔治·克鲁尼 饰）刚出狱就重操旧业，目标是赌城富豪金库里的一亿五千万；后面两部把舞台搬到欧洲，团队一次次扩充，骗局也一层层往上叠。这套片子的乐趣不在悬念——反正没有人真的抢不到手——而在看一群身怀不同绝技的人配合得行云流水，顺带回味当年的明星阵容。导演的处理干净利落，镜头和剪辑都带着一种轻快的得意，连骗术的揭示也做得漂亮而不炫耀。几场计划执行的段落几乎全靠画面推进，台词少得惊人。配乐和服装都带着那个年代的轻松劲儿，现在看反而成了额外的趣味。三部连看能明显看到风格的变化，从第一部紧实的赌场戏，到后面几部玩笑式的基调，各有各的好。它的人物关系简单，靠演员之间的默契撑起大部分趣味。它对赌城的描述几乎是一封写给这座城市的情书。剧情不必细究，群戏才是重点。｜TMDB 7.5"
  date: 2001-12-07
  added: 2026-09-30
  image: mv-238.jpg

- id: mv-239
  title: "瞒天过海：美人计"
  category: 电影
  tags: ["电影", "犯罪", "喜剧", "动作", "瞒天过海：美人计 Ocean's Eight"]
  quark_url: "https://pan.quark.cn/s/74536d80690a"
  description: "《瞒天过海：美人计》是这个系列的全女性阵容版本，主角黛比是丹尼·奥申的妹妹，刚从监狱出来就动手策划了一场大买卖。她的目标很明确：在一年一度的纽约大都会艺术博物馆慈善舞会上，从一位当红女星脖子上取下那条价值一亿五千万美元的钻石项链。为此她找来一位老搭档，两人凑起了一支各有所长的队伍——有人负责珠宝，有人负责伪装，有人负责在宴会里接应，有人负责把东西处理掉。影片的乐趣基本是两套：一是组团的过程，看每个人怎么用各自的本事把这条链路补上；二是执行那天的调度，谁在哪个节点说什么话、什么时候把东西换下来，这些环节的编排相当细。它并不是一部严肃的犯罪片，整体轻松、漂亮，镜头在服装与场景上停留的时间明显比在阴谋上多一些。缺点是布局虽有巧思，但执行部分过于顺利，缺少惊喜感。适合喜欢女排群戏、不想动脑的周末娱乐场合，也推荐给看过老版三部曲的观众。｜TMDB 6.9"
  date: 2018-06-07
  added: 2026-09-30
  image: mv-239.jpg

- id: mv-240
  title: "黑寡妇"
  category: 电影
  tags: ["电影", "动作", "冒险", "科幻", "黑寡妇 Black Widow"]
  quark_url: "https://pan.quark.cn/s/dd30c196e091"
  description: "《黑寡妇》是漫威电影宇宙进入第四阶段后的第一部作品，也是娜塔莎·罗曼诺夫这位初代复仇者第一次拥有完全属于自己的篇章。时间线被放在《美国队长3》内战结束之后，娜塔莎因为站队问题成了被通缉的对象，只能隐姓埋名四处躲藏，一条来自旧日的线索却把她重新拉回那套早已被她埋进地下的训练体系。影片开场那段九十年代的潜伏戏很有分量：一个伪装成普通家庭的小队在俄亥俄州生活了数年，任务结束时被迫分开，两个女孩被送进名为「红房子」的秘密机构，从此被改造成没有名字的武器。多年之后，娜塔莎与同样出身红房子的叶莲娜重逢，两个人对同一段过往的态度截然不同，一个想彻底埋掉，一个想把制造这套体系的人揪出来。随着阿列克谢与梅丽娜重新聚齐，这个临时拼起来的家庭要面对的不只是追杀，还有彼此之间从未清算过的旧账。反派「模仿大师」的设定很巧，她能复制对手的招式，等于让黑寡妇们与自己最熟悉的打法正面相撞。动作场面一段接一段，街头追车、高空坠落、基地决战各有看点，近身格斗保持了这一系列一贯的硬朗风格，姐妹对打那场戏的招式里还带着情绪。斯嘉丽·约翰逊把角色的疲惫与决绝揉在一起演，弗洛伦斯·皮尤的叶莲娜则贡献了全片最多的轻松时刻，两人搭戏让这部片子不只是交代背景的过渡作。作为一部迟到多年的单人电影，它真正的落点是告别，娜塔莎在结尾做出的选择，把她的故事交到了下一个人手里。｜TMDB 7.1"
  date: 2021-07-07
  added: 2026-09-30
  image: mv-240.jpg

- id: mv-241
  title: "特种部队Ⅱ：全面反击"
  category: 电影
  tags: ["电影", "动作", "科幻", "冒险", "特种部队Ⅱ：全面反击 G.I. Joe: Retaliation"]
  quark_url: "https://pan.quark.cn/s/4013d6d0b831"
  description: "在公爵（钱宁·塔图姆 Channing Tatum 饰）的率领下，特种部队给恐怖组织“眼镜蛇”以沉重的打击。虽然眼镜蛇指挥官等中心人物落网，但白幽灵（李秉宪 饰）等组织骨干依然逍遥法外，时刻准备向特种部队和全世界展开反扑。在干净利落解决某中东国家的核危机后，特种部队突然遭 到来自美国政府的惨烈打击，公爵等队员英勇殉职，只有拦路虎（道恩·强森 Dwayne Johnson 饰）、杰伊小姐（阿德琳妮·帕里奇 Adrianne Palicki 饰）和弗林（D·J·科特罗纳 D.J. Cotrona 饰）三人侥幸逃生。原来眼镜蛇早已渗透到美国高层，他们藉此抹黑特种部队，栽赃重要成员之一的蛇眼，其目的是…｜TMDB 5.7"
  date: 2013-03-27
  added: 2026-10-02
  image: mv-241.jpg

- id: mv-243
  title: "金蝉脱壳"
  category: 电影
  tags: ["电影", "动作", "惊悚", "金蝉脱壳 Escape Plan"]
  quark_url: "https://pan.quark.cn/s/95d5073f70f9"
  description: "雷·布雷斯林（西尔维斯特·史泰龙 饰）是最强的越狱高手，八年内成功逃出十四座防卫最严密的重刑监狱。他的真实身份是国安局的监狱安管专家——每逃出一座，就意味着找到了一处漏洞。这一回是他退休前的最后一次任务，目标是传说中滴水不漏的超级监狱坟墓。可入狱之后他才发现，这是一座深埋海底、不见天日的死狱；当他想表明身份退出时，典狱长的手段反而变本加厉。影片的乐趣在前半段：观察、试探、利用规则，像看一份专业的活儿被拆解。它对监狱结构和流程的描写相当具体，前半段的每一处细节后面都用得上，对越狱工具的制作过程也给足了镜头。监狱里的配角各有功能，有人提供信息，有人负责施压，安排得很清楚。后半段转为标准的越狱动作片，套路更常规，逻辑也不必细究，看两个老牌动作明星同框本身就是看点。适合喜欢越狱题材的观众。｜TMDB 6.7"
  date: 2013-10-09
  added: 2026-10-04
  image: mv-243.jpg

- id: mv-244
  title: "金蝉脱壳2：冥府"
  category: 电影
  tags: ["电影", "动作", "惊悚", "犯罪", "金蝉脱壳2"]
  quark_url: "https://pan.quark.cn/s/59c0fdc82996"
  description: "《金蝉脱壳2》换了导演，气质和前作不太一样：监狱从海上船舱换成了一座全封闭的高科技设施，名字就叫「冥府」。故事起因是布雷斯林团队里的周树（黄晓明 饰）在夜市被蒙面人绑走，转手卖进了这座不见天日的牢笼，里面关着各国来的重刑犯，规则只有一条：拳头硬的人说了算。布雷斯林别无选择，只好叫上搭档，故意让自己被抓进去，从内部把人捞出来。影片的主要看点有两处：一是这座设施的地形设计，越狱路线的摸底与机关的破解，延续了系列一贯的解题乐趣；二是史泰龙与黄晓明的搭配，后者以近身格斗为主，动作也算下了功夫。缺憾同样明显：剧情基本是上一部的复刻，反派动机潦草，几处合成的特效场面廉价感遮不住，最后的枪战收得过于草率。整部片的水准在系列里排得比较靠后。如果你是这一系列的老观众，抱着看热闹的心态倒也能看完；若还没看过第一部，先把那部补上。｜TMDB 5.2"
  date: 2018-06-05
  added: 2026-10-04
  image: mv-244.jpg

- id: mv-245
  title: "金蝉脱壳3：恶魔车站"
  category: 电影
  tags: ["电影", "动作", "惊悚", "犯罪", "金蝉脱壳3"]
  quark_url: "https://pan.quark.cn/s/0f7955e8f96d"
  description: "《金蝉脱壳3》是这一系列里口碑掉得最厉害的一部，先看口碑再看片子会更清醒。故事从一位香港科技大亨的女儿遭绑架开始，布雷斯林——这位常年靠越狱技术吃饭的老手——接手后发现对面布局动手的绑匪是自己旧日对手的后人。对方不仅挟走了人质，还把布雷斯林的亲密同伴阿比盖尔也一并抓走，关进了一座号称无法逃脱的秘密监狱「魔鬼车站」。接下来是熟悉的配方：勘察地形、结交狱友、找出守备漏洞，再从这座铜墙铁壁里把人带出来。这一部的监狱换成了铁路火车改造的移动设施，空间设计上确实有点新意，近身动作戏也还算扎实；但剧情推进基本靠巧合，反派的计划漏洞大到几乎不用推敲，两位主角的互动缺乏前作那种惺惺相惜的化学反应。若你是史泰龙动作片的一贯观众，看个热闹没问题；若是从《金蝉脱壳》第一部入门并对里面那个严密感官设计的监狱产生了兴趣，也许可以直接跳过这一部。｜TMDB 5.4"
  date: 2019-06-20
  added: 2026-10-04
  image: mv-245.jpg

- id: mv-246
  title: "蜘蛛侠：崭新之日"
  category: 电影
  tags: ["电影", "科幻", "动作", "冒险", "蜘蛛侠：崭新之日 Spider-Man: Brand New Day"]
  quark_url: "https://pan.quark.cn/s/0ba57cf66df4"
  description: "全世界已经忘记了彼得·帕克。失去朋友、爱人与家人之后，他独自留在纽约，把全部生活投入打击犯罪，成了真正意义上的全职蜘蛛侠。数年过去，日复一日的战斗和孤独压得他越来越沉，身体也开始出现无法解释的异常变化；与此同时，一股难以察觉的新威胁正在城市里蔓延。他要面对的是一个甚至无法被看见的敌人，也不得不再次面对那些以为已经彻底放下的过去。这一部的看点在于把超级英雄的日常成本摆到台面上——没有人在等他回家，也没有人记得他是谁。它对忘记这件事的处理偏心理层面，不是简单的失忆设定，整体调性也比前几部更沉，独处的段落明显变多。动作戏回归了街头层面的近身打斗，摆荡和落地依然是视觉上的招牌。它对纽约街区的呈现比以往更贴近地面，少了宏大场面，多了具体的街角。适合关注蜘蛛侠这条个人线的观众。｜TMDB 8.0"
  date: 2026-07-29
  added: 2026-10-06
  image: mv-246.jpg

- id: mv-247
  title: "潜伏6：血域"
  category: 电影
  tags: ["电影", "恐怖", "惊悚", "潜伏6：血域 Insidious: Out of the Further"]
  quark_url: "https://pan.quark.cn/s/e7d6a503b68f"
  description: "「潜伏」系列拍到第六部，已经把「异界」的世界观铺得相当完整。这一部不接兰伯特家的旧账，改以一个新搬进郊区的家庭为核心：三名不请自来的潜行者悄然入侵，把这家人困在了灵薄狱的夹缝里——那片存在于现实与鬼域之间的灰色地带，正是系列一直以来最核心的视觉符号。三人原本以为这只是一次轻松的狩猎，结果却撕裂了现实与异界之间的边界，于是「灵薄狱」开始从裂缝里渗回现实世界，事态远远超出了他们的控制。影片的吓点延续系列一贯的路数：一惊一乍的声效时有，但长线维持的是那种「房间里某个角落不对劲」的持续不安感，黑暗中的轮廓、突然出现的苍白的脸、算不清距离的走廊，都还算熟练。家庭线那边的情感动机写得单薄些，基本是恐怖本身的触发器。建议先看前作再补这一部——系列里的人物关系和时间线已经盘根错节，直接入场会损失大量信息。适合习惯了这类一惊一乍式吓点，也就是所谓「跳吓」手法的恐怖片爱好者。｜TMDB 6.5"
  date: 2026-08-19
  added: 2026-10-06
  image: mv-247.jpg
- id: mv-250
  title: "坠落2：死点"
  category: 电影
  tags: ["电影", "惊悚", "坠落2：死点 Fall 2: Deadpoint"]
  quark_url: "https://pan.quark.cn/s/7ba6809f1ed5"
  description: "《坠落》的续作换了个地方，把两位攀岩者送到了泰国的坤山山脉。故事发生在上一部那场惨剧之后：失去了姐妹般的同伴汉特，杰克斯始终没能走出来，于是她和汉特那位胆子极大的朋友露斯重新聚到一起，选择用一场徒步来把心事消化掉。风景确实壮美，疗伤也算有效，直到一场突如其来的山体滑坡把她们逼上了绝路——两人被困在一段悬在空中的木质栈道上，脚下是三千英尺的落差，四周没有信号，体力一点点流失，而她们手里能用的东西少得可怜。影片延续了前作那套「把人放到极高处、然后一点点收走所有退路」的做法：恐高的压迫感、每一次挪动的计算、以及脱水与失温这些现实细节，都是这部片子最有效的部分。高空取景做得确实让人手心出汗。缺点是剧情比前作更单薄，几个转折略显刻意，救援逻辑经不起细想。适合喜欢极限求生题材、享受那种「我不敢看但又想看」生理反应的观众，恐高者请自行斟酌。｜TMDB 6.2"
  date: 2026-09-01
  added: 2026-10-06
  image: mv-250.jpg

- id: mv-251
  title: "新生化危机"
  category: 电影
  tags: ["电影", "动作", "恐怖", "科幻", "新生化危机 Resident Evil: Welcome to Raccoon City"]
  quark_url: "https://pan.quark.cn/s/89c22dc9532e"
  description: "《新生化危机》是一次重开机，野心不小：它不接着任何一部前作讲，而是回到游戏最初设定的那一天，把浣熊市这座被制药巨头控制的小镇重新搬上银幕。故事从几个视角切入——回到小镇的克莱尔、刚调来执勤的警员里昂、以及被派去查看郊外那栋洋馆的特警小队。这座城市表面上看只是失去了支柱产业后逐渐衰败，地下却藏着伞公司留下的东西：一旦失控，整座城市在一夜之间就会变成另一个样子。影片最大的优点是氛围：阴冷的街道、突然熄灯的建筑、第一批被感染者出现的那几场戏，恐怖感是扎扎实实的，比起前几部偏动作的风格更接近原作的压抑感。演员方面几位主演在游戏玩家眼里未必是首选，但作为各自的原型算称职。缺点也很清楚：篇幅太短，人物关系没有展开，高潮段的收敛过于仓促，几位重要角色的结局几乎是一笔带过。整体上它有工业水准，也有对原作的敬意，但更像是一部面向粉丝的序章。推荐给游戏玩家和对丧尸题材有兴趣、能接受一定惊吓强度的观众。｜TMDB 5.9"
  date: 2021-11-24
  added: 2026-10-06
  image: mv-251.jpg

- id: mv-252
  title: "生化危机6：终章"
  category: 电影
  tags: ["电影", "动作", "恐怖", "科幻", "生化危机6：终章 Resident Evil: The Final Chapter"]
  quark_url: "https://pan.quark.cn/s/b0120a23cb6a"
  description: "《生化危机6：终章》是这个系列拖了十几年的收尾，导演还是一路拍过来的那位作者。故事紧接上一部：华盛顿已经失守，爱丽丝在最后的据点里被威斯克出卖，几乎失去了所有可以依靠的人。这一次她没有再去别处，而是回到一切开始的地方——浣熊市，那个被地下设施困住的小镇。因为在那里才能拿到终止这场灾难的办法。于是这一趟既是回师痞也是清算：过去的同伴一个个重新出现，红后、保护伞公司、以及那些年在不同部里登场的角色，都被拉回这条线上做一个了结。影片的长处在于它终于把整套设定给了一个答案，同时对前作的画面做过不少呼应；几段纵深镜头的压迫感是刻意做出来的。缺点同样明显：这一部的节奏赶得太急，反派的计划简单得经不起想，部分场面过度依赖剪辑，决战部分情绪始终没能托住。作为系列的结尾，它完成了任务，但谈不上多好。建议只在已经看完前五部的情况下补最后这一部。｜TMDB 6.1"
  date: 2016-12-23
  added: 2026-10-06
  image: mv-252.jpg

- id: mv-253
  title: "生化危机5：惩罚"
  category: 电影
  tags: ["电影", "动作", "恐怖", "科幻", "生化危机5：惩罚 Resident Evil: Retribution"]
  quark_url: "https://pan.quark.cn/s/b25b74857288"
  description: "爱丽丝（米拉·乔沃维奇 Milla Jovovich 饰）救出了被冷冻的同伴们，众人在离开之际却被赶来的雇佣兵赶尽杀绝。T病毒的肆虐使红后的程序发生了错误，变得残暴嗜血的她想要杀死最后的人类毁灭地球。唯一能够阻止红后的只有爱丽丝一人。而此刻，失去了能力的爱丽丝却被保护伞公司囚禁在位于海底的秘密基地中。威斯克（肖恩·罗伯茨 Shawn Roberts 饰）通过病毒侵入了保护伞公司的系统，他放走了爱丽丝并告诉她，她是人类最后的希望，而为了拯救人类，他们必须冰释前嫌共同抵抗更强大的敌人。爱丽丝遇见了保护伞公司的前员工艾达王（李冰冰 饰），两人一路上奋勇杀敌结下了深厚的友谊。同时，爱丽丝旧日的战友们也组成了一个小分队，从外向内进行突围。保护伞公司在海底建造了逼真的模拟城市，并使用克隆人作为T病毒的实验对象，为了抵达出口，爱丽丝一行人必须穿越东京、纽约、华盛顿和莫斯科四座城市，而每座城市中，都有属于它的丧尸们在蠢蠢欲动……｜TMDB 5.8"
  date: 2012-09-12
  added: 2026-10-06
  image: mv-253.jpg

- id: mv-254
  title: "生化危机4：战神再生"
  category: 电影
  tags: ["电影", "动作", "冒险", "恐怖", "科幻", "生化危机4：战神再生 Resident Evil: Afterlife"]
  quark_url: "https://pan.quark.cn/s/24fdf05f5fc4"
  description: "爱丽丝（米拉·乔沃维奇 Milla Jovovich 饰）来到东京，向保护伞公司复仇。后者潜藏在地球的底部，威斯克（肖恩·罗伯茨 Shawn Roberts 饰）执行着自以为是的安全技术标准。爱丽丝闯入了禁区，直捣黄龙。而威斯克竟然不惜毁灭城市做困兽斗。最终，当他驾驶着直升机逃离时，却被爱丽丝胁迫，情急之下，他向爱丽丝身上注入了具有对T细胞的免疫病毒，令她丧失了超能力，只能驾机飞翔荒无人烟的阿拉斯加。地球上已经177天没有生命迹象。然而，爱丽丝却意外发现了克莱尔（艾丽·拉特 Ali Larter 饰）。她们循着阿卡迪亚信号，回到了地狱之城，满眼的僵尸令人触目惊心。迎接她们的是同样听到信号的幸存者。在神秘犯人克里斯（文特沃斯·米勒 Wentworth Miller 饰）的帮助下，她们向阿卡迪亚之船进发……｜TMDB 6.1"
  date: 2010-09-01
  added: 2026-10-06
  image: mv-254.jpg

- id: mv-255
  title: "生化危机3：灭绝"
  category: 电影
  tags: ["电影", "恐怖", "动作", "科幻", "生化危机3：灭绝 Resident Evil: Extinction"]
  quark_url: "https://pan.quark.cn/s/42fe0b1c8c39"
  description: "爱丽丝（米拉·乔沃维奇 Milla Jovovich 饰）被保护伞公司实验室复制，成了伊萨克博士（伊恩·格雷 Iain Glen 饰）的研究标本。因为她体内的DNA可以对抗T-病毒，所以博士以此来提升丧尸的杀伤力。爱丽丝接到了人类的求救信号，但却中了奸计，几经拼杀，方才自救。她如释重负，然而在睡梦中，她却强烈地感受体内强大力量的召唤，显然保护伞公司实验室对她做了手脚。而且，伊萨克博士还给僵尸注入了人类血液，激活其人类的心智。僵尸变得更强大，根本无法被控制，他们残忍地杀害了实验室助手，被训练对付爱丽丝。3年后，地球成了不毛之地。内华达州的幸存者结成了同盟，爱丽丝也在其中，但是她不敢表露身份，因为实验室给了她超能力，同时也让她被迫做了间谍。爱丽丝被孤立，只有卡洛斯懂得她的苦衷，二人也因此陷入了暧昧之中……｜TMDB 6.3"
  date: 2007-09-20
  added: 2026-10-06
  image: mv-255.jpg

- id: mv-256
  title: "生化危机2：启示录"
  category: 电影
  tags: ["电影", "恐怖", "动作", "科幻", "生化危机2：启示录 Resident Evil: Apocalypse"]
  quark_url: "https://pan.quark.cn/s/7a1380171fe7"
  description: "T 病毒在蜂巢肆虐之后很快打破了浣熊市的平静，丧尸开始在街头出现。保护伞公司封锁全城，计划用核武器把城市连同病毒一起抹掉。被注射过 T 病毒、身体能力远超常人的爱丽丝从昏睡中醒来，在混乱的城里与防卫队员瓦伦汀、记者泰莉等人组队寻找出路。另一边，保护伞的科学家艾肯佛博士为搭救被公司抛弃在城中的女儿安琪拉，以提供逃生方式为代价，请求爱丽丝和防卫人员卡洛斯两组人马帮忙。而公司派出了由环保分子麦特改造而成的复仇邪神来阻止这一切。这一部把舞台从封闭设施搬到了整座城市，规模明显放大，核弹的倒计时给了全片一个明确的时间压力。爱丽丝在这部里能力明显提升，动作戏的规格也比前作高，对浣熊市的呈现偏荒凉，街道、教堂和学校轮番成为战场。剧情主要服务于一场接一场的遭遇战。适合喜欢丧尸题材的观众。｜TMDB 6.4"
  date: 2004-09-10
  added: 2026-10-06
  image: mv-256.jpg

- id: mv-257
  title: "生化危机"
  category: 电影
  tags: ["电影", "恐怖", "动作", "科幻", "生化危机 Resident Evil"]
  quark_url: "https://pan.quark.cn/s/9fc85e27756b"
  description: "为军方研究生化武器的保护伞公司，在浣熊市地下设有巨大的研究中心蜂巢。一次意外事故导致可通过空气传播的生化武器泄露，负责蜂巢安保的电脑系统红后启动应急措施，却导致数百名工作人员罹难。四小时后，蜂巢安保人员爱丽丝（米拉·乔沃维奇 饰）在出口醒来，因为催眠气体而失忆。一支受命关闭红后的特种小队来到此处，与爱丽丝、自称警察的安德森，以及蜂巢工作人员帕克斯组队深入地下。一行人因任务目标与红后冲突，先后遭遇保卫系统和丧尸的连番袭击，而爱丽丝渐渐恢复的记忆揭示了她与同行者之间非同一般的联系。影片改编自同名游戏，把封闭空间、程序失控和丧尸这几样东西组合在一起，节奏紧凑。它对蜂巢这个空间的呈现层次分明，走廊、管道和实验室各有用途。红后这条线是片中最有设计感的部分，逻辑自洽且冷酷。结尾留了口子，明显是为续集准备的。｜TMDB 6.7"
  date: 2002-03-15
  added: 2026-10-06
  image: mv-257.jpg

- id: mv-258
  title: "猛攻"
  category: 电影
  tags: ["电影", "动作", "惊悚", "恐怖", "猛攻 Onslaught"]
  quark_url: "https://pan.quark.cn/s/039ab2b7bbe8"
  description: "《猛攻》的开局是一个军事基地里跑出了某种危险的东西，一支装备精良的雇佣兵队伍被派去追捕，任务指令简单，手段不受限制。追捕的另一端是一位住在拖车里的母亲——她曾经当过兵，如今远离那些事，日子的重心是守住自己仅剩的家当和所在乎的那几个人。当这两拨人撞到一起，事情的性质就变了：雇佣兵以为自己追逐的是一个目标，实际上惹错了一类人。影片的设定并不复杂，看点是绝境里的反击，方法从临时拼凑的陷阱到近身的搏杀层层升级，主角手里的牌越少，反打就越解气。这类片子通常不需要什么剧作纵深，它的乐趣很直接：追兵一路推进，主角一边把家里的地形改造成战场，一边保护自己的人。导演对节奏的控制还算利落，开场不久就进入正题，几乎没有多余的铺垫。缺点也很明显：反派几乎是一群没有名字的面孔，双方最后谁也没占便宜的处理略显草率。适合喜欢「别惹错了人」这一类型动作惊悚片的观众。｜TMDB 5.8"
  date: 2026-09-02
  added: 2026-10-06
  image: mv-258.jpg

- id: mv-259
  title: "绵羊侦探团"
  category: 电影
  tags: ["电影", "喜剧", "家庭", "悬疑", "绵羊侦探团 The Sheep Detectives"]
  quark_url: "https://pan.quark.cn/s/2caaf10ef9c2"
  description: "与其看剧情介绍，不如直接接受这个设定：一群羊当上了侦探。《绵羊侦探团》改编自莱奥妮·斯万的畅销小说，主角是牧羊人乔治和一支爱听他朗读侦探小说的羊群——乔治最大的爱好就是给这群羊读推理故事，讲给它们听的时候自己乐在其中。然而有一天，乔治离奇死亡，留下一笔高达三千万的遗产。这笔钱让身边的每个人都忽然有了动机：亲戚、邻居、生意伙伴，谁都像是嫌疑人。而当地警察查案的路走得相当慢。于是羊群决定自己上手。它们对侦探小说里那套逻辑的了解，全来自乔治平日里念的故事，凭着这些半懂不懂的知识，加上「遇到麻烦就吃点草、嗅到危险就躺下」的生存哲学，这群羊一步一步把案情推了下去。影片的基调是轻快的喜剧，拟人化但不至于低幼，笑点那种「羊的逻辑」与人类案件之间的错位里反复出现，结局也安排了一个意料之外的转折。整体适合带孩子一起看，7.9 的评分说明它在同类合家欢里相当受欢迎。｜TMDB 7.9"
  date: 2026-04-30
  added: "2026-10-07 17:40"
  image: mv-259.jpg

- id: mv-261
  title: "猎黑行动"
  category: 电影
  tags: ["电影", "动作", "犯罪", "猎黑行动"]
  quark_url: "https://pan.quark.cn/s/b5b7f9b23cab"
  description: "《猎黑行动》是一部国产刑侦片，走的是打黑除恶这条主线。刑警秦峰带队的专案组盯上了一个以放高利贷为主业的涉黑团伙，头目吴向佛狡猾成性，明面上做着正常生意，暗地里通过虚增债务、伪造合同把借款人一步步套牢，一旦有人反抗就动用绑架和暴力逼债。影片的主线基本是标准的猫鼠结构：警方逐步收网，嫌疑人层层设防，中间穿插几场正面硬的抓捕。看点集中在团伙如何用看似合法的手段把一个家庭逼到绝路——这部分写得比单纯的动作戏更有冲击力，也解释了为什么这类案子办起来难。动作场面以近身搏斗和追车为主，规模不大，场面调度中规中矩，属于电视剧制作水准的院线电影。人物关系相对简单，正反阵营分明，没有太多灰色地带。整体四平八稳，适合已经对谍战、悬疑类需要反复推的片子感到累、只想看一段清清爽爽的办案过程并获得明确结果的观众。｜TMDB 0.0"
  date: 2023-02-22
  added: "2026-10-08 20:10"
  image: mv-261.jpg

- id: mv-262
  title: "狄仁杰之通天帝国"
  category: 电影
  tags: ["电影", "动作", "冒险", "剧情", "悬疑", "狄仁杰之通天帝国 狄仁傑之通天帝國"]
  quark_url: "https://pan.quark.cn/s/34e9d866b6e3"
  description: "高达百米的通天浮屠即将落成，武则天登基之日也近在眼前。可接二连三发生骇人的自焚案，死者全是武后的亲信——究竟是逆天而行的天谴，还是有人在暗中挑战她的权威。武则天听从国师指引，命上官静儿召回通天神探狄仁杰，任为钦差，与上官静儿、裴东来一同查案。自焚案的受害者越来越多，登基大典迫在眉睫，而查到的线索都指向与武后有关的秘密，三人各有心思，静儿的身份和立场尤其暧昧。徐克把这部拍成了一部视觉上相当用力的古装探案片，浮屠的体量、机关的设计和动作场面都是主要看点，自焚案的手法在视觉上做得很有仪式感，这也是它最标志性的部分。它对唐代都城的想象带着明显的奇幻色彩，不必按史实去核对。武则天这条线写得相当有压迫感，她的命令既是授权也是枷锁。案件的解答在最后才揭晓，前面的线索铺得还算公平。｜TMDB 6.6"
  date: 2010-09-18
  added: "2026-10-08 20:10"
  image: mv-262.jpg
- id: mv-265
  title: "警察故事2"
  category: 电影
  tags: ["电影", "动作", "犯罪", "惊悚", "警察故事续集 警察故事續集"]
  quark_url: "https://pan.quark.cn/s/b7390002a09a"
  description: "陈家驹这个火爆脾气又惹麻烦了。因为不满上司把一个极度危险的重犯放走，他在办公室里跟顶头上司吵翻，一气之下递交辞呈，脱下警服陪女友出门散心。可人算不如天算，一家电话公司突然接到炸弹恐吓，消息传来时他人还在路上，本性难移的家驹二话不说掉头就往现场赶，重新扎进案子里。事情远比想象中棘手：那个炸弹狂徒不光在电话公司安放了炸药，还堂而皇之地把警局大门炸了个窟窿，随后绑架了家驹的女友，点名要他带着大笔赎款到货仓换人。当家驹提着装满现金的箱子踏进货仓，映入眼帘的是满地密布的引线和一个始终不露面的对手。作为成龙自导自演的系列第二部，这一部把舞台从开阔的商场挪进了更封闭的空间，动作设计在惊险之外多了一层压迫感，1988 年上映后依旧由成龙挑大梁，动作、犯罪与惊悚三条线拧成一股。｜TMDB 7.1"
  date: 1988-08-13
  added: "2026-10-09 14:21"
  image: mv-265.jpg

- id: mv-266
  title: "警察故事"
  category: 电影
  tags: ["电影", "动作", "犯罪", "喜剧", "警察故事 警察故事"]
  quark_url: "https://pan.quark.cn/s/560a16cbae97"
  description: "1985 年的这部作品是成龙从演员走向导演的关键一笔，他自己执导并主演，也定下了整个系列的基调。陈家驹是受过特警训练的警察，为人正直、办案不要命，代价是常常把女友晾在一边。一次围剿行动里他亲手拘捕了大毒枭朱滔，眼看就要定罪，关键证人莎莲娜却在开庭前失踪，案子只能搁置，家驹反倒背上处分、被降了职。怀恨在心的朱滔设局报复，把家驹引到囚禁莎莲娜的别墅，还派手下杀死一名警察嫁祸给他，逼得这位曾经的警队精英成了通缉犯，只能四处流亡。侥幸逃出的莎莲娜终于看清朱滔的为人，冒险潜回对方办公室偷走证据，却被一路追杀到商场，家驹及时赶到，在一排排货架与玻璃橱窗之间展开连场恶斗。商场里那几场不用替身的搏命演出，后来成了香港动作片教科书级的段落，也让这部片子拿到了香港电影金像奖最佳影片。｜TMDB 7.6"
  date: 1985-12-14
  added: "2026-10-09 14:21"
  image: mv-266.jpg

- id: mv-267
  title: "警察故事续集"
  category: 电影
  tags: ["电影", "动作", "犯罪", "惊悚", "警察故事续集 警察故事續集"]
  quark_url: "https://pan.quark.cn/s/9a87ccc312e1"
  description: "辞掉警察职务的陈家驹本想安稳几天，命运却不给他这个机会。上一部里那个为了办案连命都不要的干探，这一次因为放走重犯的事跟上司彻底闹翻，愤然离职，带着女友出门旅行散心。旅途中忽然传来电话公司遭炸弹恐吓的消息，他骨子里的那股执拗又上来了，转身就扎进现场查案。狂徒的胆子大得离谱，先炸电话公司，再炸警局大门，最后一不做二不休把家驹的女友绑走，开口索要巨额赎金，还指定要他一个人带钱到货仓。家驹提着装满现钞的箱子走进那间堆满炸药的仓库，才明白自己踏入的是对手精心布好的局。成龙依旧自导自演，把动作场面从开阔的商场搬进封闭空间，紧张感更集中，1988 年上映时再度刷新了观众对港产动作片的想象。整部片子节奏紧凑，笑点与危机交替出现，是系列里承上启下的一部。｜TMDB 7.1"
  date: 1988-08-13
  added: "2026-10-09 14:21"
  image: mv-267.jpg

- id: mv-268
  title: "警察故事4：简单任务"
  category: 电影
  tags: ["电影", "动作", "冒险", "喜剧", "警察故事4：简单任务 警察故事4之簡單任務"]
  quark_url: "https://pan.quark.cn/s/520e398d02dd"
  description: "这一回陈家驹的舞台跨出了香港。他接到美国中央情报局的委托，去查一个涉嫌贩卖核子武器的国际集团，上司和他起初都觉得这话离谱，黑市上哪来的核弹，多半是一群乌合之众在虚张声势。家驹跟踪嫌疑人徐杰进入交易现场，却意外撞见乌克兰境内的核弹基地，这才意识到事态严重到了什么地步。交易双方发现有人盯梢，他逃命时失足跌进冰湖，被俄军救起才捡回一条命。恢复之后，俄军上校格里格把他派往澳洲，追查徐杰的妹妹安妮，可人刚落地就撞上当地黑帮的追杀，让他隐约察觉整件事背后藏着更深的盘算。唐季礼接手执导，把成龙式的搏命特技搬到了雪原、冰湖与澳洲街头，1996 年上映时以跨国取景和更宏大的格局，成为系列里制作规格最高的一部。成龙在冰湖与雪原上的搏命演出，依旧是这部最值得看的部分。｜TMDB 6.5"
  date: 1996-02-10
  added: "2026-10-09 14:21"
  image: mv-268.jpg

- id: mv-269
  title: "警察故事3：超级警察"
  category: 电影
  tags: ["电影", "动作", "犯罪", "惊悚", "警察故事3：超级警察 警察故事 III：超級警察"]
  quark_url: "https://pan.quark.cn/s/b0710e13d0f6"
  description: "陈家驹这次的任务是卧底。他远赴大陆，以囚犯身份打进一个横跨军火与毒品的走私集团，配合他的是大陆女公安杨建华。两人一明一暗，家驹先是接近正在服刑的集团成员豹强，靠着敢打敢拼的做派赢得对方信任，被视作心腹，随之卷进越狱计划。为了放长线钓大鱼，他一口答应，越狱后豹强提出要去家驹随口胡诌的家乡避风头，全靠杨建华提前安排才没露出破绽，她索性以妹妹的身份一同随行。一行人辗转香港见到集团头目猜霸，顺利混进核心，又跟着前往吉隆坡营救被绑走的头目妻子，偏在这里撞上家驹的女友阿美。阿美不知道男友在办案，只当他和杨建华有私情，情绪失控的举动引来集团成员的警觉，原本周密的部署眼看就要崩盘。杨紫琼与成龙的双打对手戏是这部最亮眼的部分，唐季礼执导，1992 年上映。｜TMDB 6.9"
  date: 1992-07-04
  added: "2026-10-09 14:21"
  image: mv-269.jpg

- id: mv-270
  title: "新精武门"
  category: 电影
  tags: ["电影", "动作", "惊悚", "新精武门 新精武門"]
  quark_url: "https://pan.quark.cn/s/02a49f3ff785"
  description: "陈真死后，精武门名存实亡，只剩师妹小丽不肯认命，一心要为师兄报仇。她打算投奔远在台湾的外公，一路却遭到日本人的围追堵截，三个人走投无路之际，幸得一位华籍探长冒死相助，才终于有惊无险地抵达台湾。在台湾，小丽结识了阿龙。阿龙是个从小受人欺负却极有骨气的青年，一身功夫天赋加上满腔爱国心，两人一见如故，又因为同一个目标结为同伴。接下来的日子是日复一日的苦练与硬碰，最终他们把欺压同胞的日本人制服在拳下，洗雪了压在心头的那口恶气，精武门也在众人的努力下重新立了起来。这部 1976 年的作品是成龙成名之前的代表作之一，动作风格还带着老派功夫片的硬桥硬马，情绪上承接了精武门题材一贯的家国情怀，动作与惊悚两条线都走得相当直白。｜TMDB 6.0"
  date: 1976-07-08
  added: "2026-10-09 14:21"
  image: mv-270.jpg

- id: mv-271
  title: "龙的心"
  category: 电影
  tags: ["电影", "动作", "喜剧", "犯罪", "龙的心 龍的心"]
  quark_url: "https://pan.quark.cn/s/bccbc4de2785"
  description: "阿泰从小就梦想当一名无拘无束的海员，可哥哥嘟嘟天生智力有障碍，两人自幼相依为命，为了照顾哥哥，他把这个念头一压再压，老老实实当了个普通警察。警局的日子并不好过，天性散漫又不受拘束的他跟上司处不来，一次顶撞之后索性辞职，决定去圆自己的海员梦。嘟嘟却误会了弟弟的意思，以为自己要被丢下，开始笨拙地学着独立生活。一次和邻家小孩玩耍时，他意外捡到劫匪遗落的珠宝，小孩的哥哥见财起意，把嘟嘟推下山崖抢走东西，谁知劫匪折返回来，反倒将他杀了。阿泰闻讯赶到，一番搏斗后杀死劫匪，把哥哥从山边救了回来，自己却也难逃杀人的罪责。洪金宝自导自演，与成龙兄弟同台，1985 年的这部作品在连场打斗之外，把重心放在了手足情上，是两人合作里最温情也最沉重的一部。｜TMDB 7.0"
  date: 1985-09-14
  added: "2026-10-09 14:21"
  image: mv-271.jpg

- id: mv-272
  title: "红番区"
  category: 电影
  tags: ["电影", "犯罪", "动作", "喜剧", "红番区 紅番區"]
  quark_url: "https://pan.quark.cn/s/7940be376853"
  description: "货车司机黄家驹飞去美国，是为了给移居当地的骠叔贺新婚。骠叔打算婚后和黑人妻子安安静静过完下半辈子，连经营多年的超级市场都盘给了年轻寡妇 Elaine。家驹头一回见 Elaine 就生出好感，主动帮她打理起超市的生意。日子刚有起色，以 Johnny 为首的一帮朋克党就开始上门捣乱，砸店找事，家驹毫不退缩，该出手时就出手，一边用拳头讲道理，一边还真试着跟这帮年轻人讲讲人生。麻烦却一桩接一桩，这边刚压下去，那边他又被卷进一桩钻石赃物失窃案，招来黑手党的追杀，从街头一路打到天台。唐季礼执导，成龙与梅艳芳搭档，1995 年上映后成为首部在北美大规模上映的港产片，让成龙的招牌真正打进了国际市场。片尾那场跨越楼顶的跳跃，是成龙职业生涯里最著名的镜头之一。｜TMDB 6.9"
  date: 1995-01-21
  added: "2026-10-09 14:21"
  image: mv-272.jpg

- id: mv-273
  title: "大兵小将"
  category: 电影
  tags: ["电影", "动作", "喜剧", "冒险", "大兵小将 大兵小将"]
  quark_url: "https://pan.quark.cn/s/bb82afaa935a"
  description: "公元前 227 年，卫国军队在凤凰山中了梁国的埋伏，一场血战打下来，卫国这边只剩一位身受重伤的大将军，梁国这边只剩一个靠装死捡回命的小兵。大将军心里装的是统一诸国的宏图，小兵想的却只是远离战场、分块田地安稳过日子。为了换良田、免兵役，小兵决定把这位大将军押回梁国领赏，于是一个想逃、一个要押，两个身份悬殊、信念完全相反的人被迫结伴上路。前有未知的山河险阻，后有身份神秘的卫国追兵，一路上互相算计又互相依赖，闹出不少笑话，也一次次在生死边缘擦身而过。丁晟执导，成龙与王力宏主演，2010 年上映，用动作喜剧的壳子讲了一个关于战争与平民视角的故事，兄弟档的化学反应撑起了整趟归途。一路上笑料与危机交替，荒诞里透着乱世中平民最朴素的愿望。｜TMDB 6.9"
  date: 2010-02-14
  added: "2026-10-09 14:21"
  image: mv-273.jpg

- id: mv-274
  title: "重案组"
  category: 电影
  tags: ["电影", "动作", "犯罪", "惊悚", "重案组 重案組"]
  quark_url: "https://pan.quark.cn/s/ecdd9211f9cd"
  description: "故事脱胎于当年轰动香港的王德辉绑架案。富翁黄一飞上一次被绑架后平安脱身，这一回再度落入绑匪手中，警局高层如临大敌，案卷资料被列为高度机密。年轻有为的陈帮办接手侦查，可一连多日毫无头绪，只好硬着头皮去请教当年把黄一飞从劫匪手里救出来的老警察洪爷。洪爷给了他不少办案思路，陈帮办照着线索一步步逼近真相，眼看就要摸到核心，却猛然发现自己像是被歹徒捏在手里，一举一动对方都了如指掌。究竟是什么让对手对他的行动了如指掌，成了压在这位干探心头最大的疑问。黄志强执导，成龙与郑则士、罗家英同台，1993 年上映，整体气质比《警察故事》系列冷硬许多，是成龙演艺生涯里少见的写实犯罪题材。成龙也凭陈帮办这个角色拿下金马奖最佳男主角，是演技层面的一次突破。｜TMDB 6.8"
  date: 1993-06-24
