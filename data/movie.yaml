  baidu_code: "487c"
  description: "小北在健身器材店卖货，从小练过几手，还多了一种说不清的预感能力，总觉得自己天生该干特务这一行。某天他在银行里凭直觉和身手把劫匪当场摁住，一下子成了新闻人物，也引来了一位私家侦探。对方怀疑他是韩国客户朴元正失散多年的儿子，带着他去见了朴元正的律师。小北拗不过好奇心，跟着去了韩国。人刚见到，朴元正就过世了。从美国女记者福喜那里，他才知道朴氏夫妇原来是著名的双重特务。照着遗言往下走，小北在福喜的帮助下转去土耳其，找到一笔巨款，也遇见了神秘的女子咏。正当他有点飘的时候，一连串莫名其妙的袭击接连落到头上，他这才反应过来：自己早就被卷进了一张看不见的网里。这部 2001 年的作品把动作与悬疑拧在了一起，取景横跨香港、韩国与土耳其，是成龙千禧年前后一次风格上的尝试，动作戏依旧搏命，故事则比他以往的作品绕得多。｜TMDB 6.0｜TMDB 6.0"
