- id: mv-295
  title: "上海正午"
  category: 电影
  tags: ["电影", "冒险", "喜剧", "西部", "上海正午 Shanghai Noon"]
  quark_url: "https://pan.quark.cn/s/252d96e8bad9"
  description: "清朝宫廷里，蓓蓓公主被指婚给皇族亲王，心里一万个不情愿。教她英文的安德鲁看准了这份抵触，几句话便把她说动，跟着他一路逃去了美国。人刚走，安德鲁留下一封勒索信，开口就要十万金条。皇帝慌了神，立刻点派三名大内高手带上赎金远赴美国救人。大内侍卫黄强在公主出逃那晚见过她一面，没能拦住人，那张脸却再也没放下。他求当翻译的叔叔替他说情，硬是挤进了这支营救队伍。于是三个从紫禁城出来的侍卫，就这样踏上了十九世纪末的美国西部：语言不通，规矩不同，处处是笑话也是陷阱。黄强一身功夫在这片土地上倒派上了用场，只是他面对的不只是绑匪，还有安德鲁背后那套更深的算计。这部 2000 年的作品把成龙式的动作喜剧整个搬进了西部片的框架里，马背、酒馆与荒原都成了搏斗的舞台，与他早年那些在楼宇间翻腾的片子趣味截然不同。｜TMDB 6.4｜TMDB 6.4"
  date: 2000-05-26
  added: "2026-10-09 15:23"
