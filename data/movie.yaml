- id: mv-249
  title: "生化危机：爆发夜"
  category: 电影
  tags: ["电影", "恐怖", "科幻", "冒险", "生化危机：爆发夜 Resident Evil"]
  quark_url: "https://pan.quark.cn/s/cb03b8251279"
  baidu_url: "https://pan.baidu.com/s/1AwYxIlxn1jHPPtbnE911HQ"
  baidu_code: "1x9h"
  description: "《生化危机：爆发夜》又是一次重启，但切入点比系列前几部都小：主角不是身手逆天的改造人，而是一个奉命奔赴浣熊市的医疗速递员。布莱恩接到任务时以为只是送一趟货，等他真正进城才发现整座城市已经运转不下去了——病毒扩散、街上的人不对劲、到处是追捕。他得在这座已经变成猎场的城市里找出一条活路，而他能依靠的只有身上的东西和一点运气。这种视角的好处是恐怖感回来了：主角会害怕，会算计弹药，会因为一次判断失误付出代价，观众跟着他一起从零开始摸这座城市的底。影片的重心放回小人物的求生过程，恐怖场面与动作段落都不含糊，夜戏和封闭空间的比重相当大，那种「走廊尽头有什么在动」的紧张维持得不错。缺点是人物关系展开有限，对浣熊市背景没有铺垫，未接触过这个系列的观众会有信息缺口。适合喜欢丧尸末日题材、或者「在城里逃出生天」这类设定的观众。｜TMDB 7.3"
  date: 2026-09-16
  added: 2026-10-06
  image: mv-249.jpg

- id: mv-250
  title: "坠落2：死点"
