  description: "《金蝉脱壳3》是这一系列里口碑掉得最厉害的一部，先看口碑再看片子会更清醒。故事从一位香港科技大亨的女儿遭绑架开始，布雷斯林——这位常年靠越狱技术吃饭的老手——接手后发现对面布局动手的绑匪是自己旧日对手的后人。对方不仅挟走了人质，还把布雷斯林的亲密同伴阿比盖尔也一并抓走，关进了一座号称无法逃脱的秘密监狱「魔鬼车站」。接下来是熟悉的配方：勘察地形、结交狱友、找出守备漏洞，再从这座铜墙铁壁里把人带出来。这一部的监狱换成了铁路火车改造的移动设施，空间设计上确实有点新意，近身动作戏也还算扎实；但剧情推进基本靠巧合，反派的计划漏洞大到几乎不用推敲，两位主角的互动缺乏前作那种惺惺相惜的化学反应。若你是史泰龙动作片的一贯观众，看个热闹没问题；若是从《金蝉脱壳》第一部入门并对里面那个严密感官设计的监狱产生了兴趣，也许可以直接跳过这一部。｜TMDB 5.4"
