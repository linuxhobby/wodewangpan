  description: "连环杀手 Cusp 把年轻女孩杀死再救活，一遍又一遍，直到被害人自己求死为止。玛雅是他的第一个受害者，昏迷后侥幸活下来，而这次濒死体验让她获得了进入他人意识的能力。此后她一直协助联邦调查局追捕 Cusp。一次行动中她救人切，贸然进入对方意识，反被控制，导致被害人死亡。一年后 Cusp 再度出现继续作案，玛雅在警方帮助下逐步逼近，打算再次进入他的意识去救新的受害者。这一部把重心放在进入意识这个设定的可视化上，场景偏超现实，几段意识空间的美术设计有想象力，是这部最值得看的部分。玛雅的能力在片中有明确的规则和代价，不是随手可用的万能钥匙，对受害者处境的呈现也相当直接。它基本是独立成篇的续作，没看过前作也能跟上设定。剧情本身相当简单，逻辑上的漏洞不少，看的时候不必太较真。｜TMDB 3.5"
