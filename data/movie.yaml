- id: mv-290
  title: "天将雄师"
  category: 电影
  tags: ["电影", "冒险", "历史", "动作", "天将雄师 天將雄師"]
  quark_url: "https://pan.quark.cn/s/d3df2b317da1"
  description: "西汉汉元帝年间，坐镇西域都护府的大都护霍安被人构陷，从一军主帅沦为戴罪之身，发配到雁门关修城。就在这段最灰暗的日子里，一支来自极西之地的队伍闯进了他的地界：罗马将军卢魁斯护着遭兄长迫害的小王子一路东逃，人马疲惫，退到了雁门关下。两个原本八竿子打不着的军人在戈壁滩上碰面，上来先打了一仗，打着打着倒摸清了彼此的脾性，从敌手变成了能托付后背的人。霍安一边修城一边暗中查自己那桩冤案，查着查着撞破了好兄弟殷破与罗马大王子提比斯之间的勾当。几乎同一时间，提比斯亲率大军压向西域，目标正是那个孩子。为了护住小王子，也为了不让西域诸国再起战火，霍安与卢魁斯在荒漠上并肩迎战。影片 2015 年上映，走的是古装史诗的路子，把罗马军团与汉朝西域的相遇做成了一个虚构的传奇，大场面与戈壁实景是它最舍得下本钱的地方。｜TMDB 6.4｜TMDB 6.4"
  date: 2015-02-19
  added: "2026-10-09 14:54"
