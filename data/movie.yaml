  baidu_code: "t9zx"
  description: "郭振华一个人到香港讨生活，人生地不熟，因为一次路见不平被卷进两派黑帮的火并，稀里糊涂坐上了大哥的位置。他自己都觉得蹊跷，细想下来，认定是街边卖花的玫瑰夫人给他带来了好运，从此逢谈判、出门之前，必定先去买她一支玫瑰，求个心安。手里的丽池饭店被他改成夜总会经营，前任老板的女儿杨露明为了还债上台表演，没想到一炮而红，两个人的关系也在日复一日的相处里起了变化。盯上这门生意的福建帮开始频频发难，郭振华照例先去找玫瑰夫人求运，却发现这位给他带来好运的老人自己正陷在更大的困境里：为了让在外地读书的女儿安心，她编造了一个体面的身份，如今眼看就要被戳穿。出于感激，郭振华决定帮她把这个谎圆下去，一连串的笑料也就此展开。1989 年的这部作品由成龙自导自演，是他最花心思的一部，场面调度与群戏编排都相当讲究，温情与笑料配得比他同期任何一部都足。｜TMDB 7.1｜TMDB 7.1"
