  baidu_code: "gv57"
  description: "如果超级英雄打赢之后的故事怎么拍？这部国产喜剧给了一个轻松的答案。三十年前，以超人王长海为首的英雄协会把入侵的外星人打退，从此天下太平；三十年后，这位老英雄被派回看似风平浪静的莱茵小镇，任务是组建一支战斗小队。麻烦在于，小镇上并不存在需要拯救的世界危机，只有盘根错节的人情世故：邻里之间的面子、酒桌上的规矩、礼尚往来里裹着的人事纠葛，每一件都比当年的外星人更难对付。王长海一身硬功夫，却在这些软钉子上处处碰壁，越是想按军令办事，越是被卷进说不清的漩涡。影片的笑点主要来自这位习惯于「一拳解决」的英雄被迫学着做人情题的反差，也在戏仿超英套路：当世界不再需要你的时候，英雄该如何自处。整体是轻快的学院派喜剧，动作场面不算多，靠的是情境和台词。适合喜欢《宇宙探索编辑部》《独行月球》那类本土化超英喜剧、也愿意顺便看一句中年再就业困境的观众。｜TMDB 6.7"
