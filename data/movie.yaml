  baidu_code: "5fxv"
  description: "上世纪初的香港海域不太平，海盗横行，商船动辄被劫。当局担心各国商家的信心受挫、连累香港的贸易地位，索性把水师改编成一支特警小队专管海上治安。队长马如龙办事卖力，却在一桩公务里被人下套，一气之下辞了职。没多久海盗头目罗三炮抓走一批官兵家眷当人质，上头打算走内线周永龄的路子从中调停，马如龙早看出这个周永龄跟海盗是一伙的，干脆自告奋勇救人，重新拉起队伍，定下一套里应外合的方案，也就是所谓的 A 计划：上司洪天赐与好兄弟卓一飞在外接应，他从正面切入。影片 1983 年上映，是成龙把动作喜剧推到新高度的标志性作品，钟楼坠楼那一段不用替身、连摔两次的拍法，至今仍是香港动作片里被反复提起的镜头。陆上追逐与海上收尾两条线交替推进，节奏干净利落，整部片子几乎不给观众喘气的空隙。｜TMDB 7.3｜TMDB 7.3"
