  baidu_code: "qwj5"
  description: "《野党》是一部韩国犯罪动作片，切入点相当少见：它讲的是游走在毒品世界与调查机关之间的那类人。所谓「野党」，指的是不以官方身份、却长期充当线人的角色。故事围绕毒品市场里一桩足以震动整个版图的内幕展开，几条线彼此咬合——姜河那饰演的秘密线人李江秀，长期向国家调查机关提供毒品世界的情报，脚踩两条船，谁都不属于；柳海真饰演的检察官具关熙出身底层，野心比他手里的案子更大；朴解浚饰演的毒品调查队组长吴尚才则是那种抓到一次线索就咬住不放的人。三个人各怀心思，互相利用也互相牵制，构成了片子的三角格局。影片的乐趣在于这几方之间不断变动的位置关系：今天的合作对象可能明天就被推出去顶罪，情报成了最硬也最不值钱的通货。动作场面中规中矩，笑点不多但台词相当泼辣。缺点是支线略多，个别配角的戏份收得仓促。推荐给喜欢韩国犯罪题材、尤其偏好《毒战》那种多方博弈结构的观众。｜TMDB 6.9"
