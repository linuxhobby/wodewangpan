  baidu_code: "z65u"
  description: "《黑手党战争》讲的是一个还没有喘过气就被推回去的卧底故事。主角是一名前科犯，因为表现良好提前获释，刚回到社会上就被告知他的刑期其实没有真正结束——他被强行编进一个六人组成的卧底小组，任务是混进一个家族的内部，监视他们的交易与账目。计划听上去可行，实际上从第一天起就出了问题：首次行动中，其他五个人全部遇害，只剩下他一个。于是所有压力都落在他身上——他得继续接近那些他奉命监视的人，而最要命的是他不知道对方是否已经识破了自己的身份，每一次见面都可能是最后一次。这类卧底片的核心永远是同一个问题：身份什么时候暴露。本片的设定把这个悬念推到了最前面，也让它成为全部的主线——比起外面发生的事，主角心里那根弦什么时候断才是戏眼。演员的处理还算投入，几场对峙还算拉得住。缺点同样清楚：整体制作规模不大，节奏控制一般，反派的脸谱化程度高，结局也显得仓促。适合愿意只看张力、不计较制作的观众。｜TMDB 5.4"
  date: 2024-10-11
  added: 2026-09-30
  image: mv-236.jpg


