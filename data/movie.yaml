  baidu_code: "1il0"
  description: "《月球叛军：火之女》是扎克·施奈德给流媒体拍的一部太空歌剧，灵感来源相当直白——七武士的故事骨架搬到了银河系边陲。当一个残暴的帝国军团盯上某个偏远殖民地上的村庄时，村民们能指望的并不是住在城里的正规军，而是一个身份神秘的陌生女子柯拉。她曾经属于那支军团，如今的任务是招募一队真正能打的人：有边缘人、有叛军、有农民、也有战争留下的孤儿，这批人出身各异，加入的理由各不相同，但都带着同一份「迟早要算」的账。影片的前半段基本是组队的过程，每个成员的出场都有自己的小段落；后半段才是正面对撞，一场以小博大的守卫战。视觉风格一如既往地重：慢镜、高对比度的光、刻意做旧的质感都还在，太空歌剧的美术设计是它最值得看的部分。缺点是人物太多而戏份太少，几个角色基本只有标签，情感铺垫不足；作为系列第一部，它承担的铺垫工作更重也更累。推荐给喜欢《星球大战》那种银河对抗设定、且对导演风格有偏好的观众。｜TMDB 6.2"
