  description: "武林中八大门派的掌门人聚到一处，合力钻研出一套前所未有的拳法，取名蛇鹤八步。拳法成了，人也出事了：八位掌门在功成之后尽数暴毙，那本拳谱也随之不知去向。侠客徐英风机缘巧合拿到了拳谱，从此麻烦缠身。各门各派认定东西在他手上，一路追杀不断；其中最难缠的是黑龙帮主钱狮，此人阴狠且不择手段，为了夺谱什么事都做得出来。徐英风腹背受敌，一边要应付整个武林的围堵，一边还想弄明白当年那八个人到底死在谁手里。拳谱是死的，凶手是活的，两件事搅在一起，每一步都踩在刀口上。这部 1978 年的作品是成龙早期主演的古装功夫片之一，故事走的是传统武侠的路数，拳脚设计扎实，蛇形与鹤形两种身法在片中有明确的区分，能看到他那时对动作细节的讲究，属于他谐趣风格成型之前的一次认真尝试。｜TMDB 6.5｜TMDB 6.5"
