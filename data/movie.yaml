  quark_url: "https://pan.quark.cn/s/8492632a3a0f"
  description: "贝克（巨石 The Rock 饰）欠了比利一大笔高利贷，比利承诺只要贝克到亚马逊中部的黄金城把他辍学在外漂泊的儿子屈维斯（西恩?威廉?斯科特 Seann William Scott 饰）带回来即免除一切债务，贝克爽快地答应了。 贝克在黄金城通过一名酒吧女招待玛丽安娜（罗莎里奥?道森 Rosario Dawson 饰）很快就找到了正在寻宝的屈维斯。就在他要带走屈维斯时，当地的黑社会老大赫切带着手下也来争夺屈维斯，原来屈维斯知道了当地的宝物“加托”的下落。贝克打跑他们后，带着屈维斯赶往机场回家。途中屈维斯企图开溜导致两人都落入了当地的叛军手中，原来玛丽安娜就是叛军首领，她也在寻找“加托”。为了顺利…｜TMDB 6.4"
  date: 2003-09-26
  added: 2026-09-30
  image: mv-141.jpg

- id: mv-142
  title: "东方快车谋杀案"
  category: 电影
  tags: ["电影", "剧情", "惊悚", "悬疑", "东方快车谋杀案 Murder on the Orient Express"]
  quark_url: "https://pan.quark.cn/s/4a0add891b20"
  description: "《东方快车谋杀案》之所以难拍，在于几乎所有读者都知道结局，而这个版本依然值得一看。故事从大侦探波洛登上这列豪华列车开始：一场大雪把列车困在半路，夜里他三次被奇怪的动静吵醒，第二天清晨，车厢里那位美国富商被发现死在包厢内，身上十二刀，门从里面反锁。所有线索都指向同一个方向：凶手一定在这列车上。波洛要做的，是在十几名乘客之间来回盘问，把他们各自的证词拼成一张完整的图——这些人看似互不相识，简历、口音、身份各异，却在细节上严丝合缝地对上了。肯尼思·布拉纳自己出演波洛，把这位侦探的洁癖、自嘲与不合时宜的同情心演出了层次；群像演员阵容豪华，其中一位女演员的独角戏几乎可以单独拿出来看。运镜与车厢布景相当讲究，雪景和长镜头都在强调这列火车是一个封闭的密室。缺点是前半节奏稍慢，几个角色的戏份被压缩到几乎没有。推荐给喜欢本格推理、想在大银幕上看一次经典密室的观众。｜TMDB 7.1"
  date: 1974-11-22
  added: 2026-09-30
  image: mv-142.jpg

- id: mv-143
  title: "两杆大烟枪"
  category: 电影
  tags: ["电影", "喜剧", "犯罪", "两杆大烟枪 Lock, Stock and Two Smoking Barrels"]
  quark_url: "https://pan.quark.cn/s/50ae734c6dae"
  description: "艾迪（尼克·莫伦 饰）思维敏捷，是个玩牌高手。在三个好友的支持下，他带着巨资参加黑社会的高额赌局，不想落入圈套，欠下五十万赌债。为了还钱，他和朋友们绞尽脑汁，最终算计到一群毒贩身上，还特地买了两杆老式烟枪准备打劫。可这群毒贩也不安分，正惦记着他们毒品供应商的钱，并在同一天动手。等毒贩费尽周折把那笔熨得整整齐齐的钱拿到手，艾迪他们幸运地坐享其成。而他们并不知道，这看似简单的抢劫案背后还有更厉害的角色，手里那两杆破烟枪也藏着不少故事。盖·里奇把几条线同时抛出去，再让它们在最不合适的地方撞上，拼贴式的剪辑和俚语对白是它的招牌。它的笑点来自小人物与大人物之间的落差，越严肃越好笑，结尾把所有线索收在一处，处理得相当漂亮。人物多得需要一点注意力，对上频率之后节奏非常快。｜TMDB 8.1"
  date: 1998-08-28
  added: 2026-09-30
  image: mv-143.jpg

- id: mv-144
  title: "中途岛之战"
  category: 电影
  tags: ["电影", "动作", "剧情", "历史", "中途岛之战 Midway"]
  quark_url: "https://pan.quark.cn/s/8a01bacccb7a"
  description: "1941年12月7日，日本对美国太平洋主要基地珍珠港发动了突然袭击，美国陆海军及其航空力量损失惨重，太平洋战争爆发。但是令日本海军深感不安的，是美太平洋舰队的三艘航空母舰，全部未受损失。日本联合舰队司令山本五十六大将，坚持要打中途岛大战，企图一举围歼对方的海空力量。于是军事史上一场以航母和空中力量决定胜负的最大战役打响了。 到了1942年4月，日本侵略者已在中国大陆和太平洋占领了大片地区，掠夺了数不清的财富和自然资源，包括东南亚丰富的石油，这为他们进行更大规模的海陆征战创造了条件。 在日本领导人物中，至少有一个人没有沉溺在独霸天下的幻想里，此人便是日本帝国海军联合舰队司令山本五十六大将。偷袭珍…｜TMDB 6.6"
  date: 1976-06-18
  added: 2026-09-30
  image: mv-144.jpg

- id: mv-145
  title: "人工智能"
  category: 电影
  tags: ["电影", "剧情", "科幻", "冒险", "人工智能 A.I. Artificial Intelligence"]
  quark_url: "https://pan.quark.cn/s/71b024e114b7"
  description: "21世纪中期，由于气候变暖，南北两极冰盖的融化，地球上很多城市都被淹没在了一片汪洋之中。此时，人类的科学技术已经达到了相当高的水平，人工智能机器人就是人类发明出来的用以应对恶劣自然环境的科技手段之一。先进的人工智能机器人不但拥有可以乱真的人类外表，而且还能像人类一样感知自己的存在。大卫（海利·乔·奥斯蒙特 饰）就是这样一个有思想、有感情的小孩机器人，他被一对人类父母莫妮卡和亨利所收养，但他始终不是真人。由于种种原因，莫妮卡还是将大卫留在郊外（为了使大卫不被销毁），所以他一直渴望着自己终有一天不再仅仅是个机器人。抱着对这个愿望的执着，大卫踏上了漫长的寻找蓝仙女的旅程，途中遇到了被追杀的善良的机器…｜TMDB 7.1"
  date: 2001-06-29
  added: 2026-09-30
  image: mv-145.jpg

- id: mv-146
  title: "亡命驾驶"
  category: 电影
  tags: ["电影", "剧情", "惊悚", "犯罪", "亡命驾驶 Drive"]
  quark_url: "https://pan.quark.cn/s/4222353fae84"
  description: "白天，他在好友香农的车行做电影飞车特技；夜里，他给劫匪当逃脱车手，只在任务里出现，不多说一句话。一次逛超市时他邂逅了艾琳母子，双方互有好感，度过了一个愉快的周末。可艾琳的丈夫斯坦德出狱了，这段刚萌芽的感情被拦腰斩断。香农把他推荐给黑帮大佬伯尼和尼诺，与此同时他发现斯坦德在狱中欠了保护费，正被人追讨。为了偿还高利贷、保证母子平安，他决定帮斯坦德完成这一票。然而抢劫银行的过程中斯坦德被店主击毙，他和女同伙布兰奇陷入了一场黑吃黑的迷局。影片的气质非常特别：大量沉默、霓虹色调和合成器配乐，暴力来得突然又干脆。开场的追车戏几乎不含对话，靠调度和声音就把规矩立住了。主角的沉默不是酷，而是他把自己限制在极小的生活范围里。中段之后暴力程度明显上升，心理准备要有。｜TMDB 7.6"
  date: 2011-09-15
  added: 2026-09-30
  image: mv-146.jpg

- id: mv-147
  title: "亡命天涯"
  category: 电影
  tags: ["电影", "动作", "惊悚", "剧情", "亡命天涯 The Fugitive"]
  quark_url: "https://pan.quark.cn/s/e4f6f6e4ca43"
  description: "改编自六十年代的同名电视剧。哈里森·福特饰演的外科医生理查德·金波被控杀害妻子，押送途中意外脱逃，从此他只有一个身份：一个被钉上罪名的逃犯。要洗清自己，他只能自己把那条线索追到底，而身后是汤米·李·琼斯饰演的法警——一个不完全相信他有罪、但无论如何都要把他抓回来的对手。两人的追与逃构成全片最耐看的部分：追的人靠经验和耐心一步步逼近，逃的人靠医生那点观察和应变一次次脱身（琼斯凭此拿到奥斯卡最佳男配角）。影片对司法程序的描写相当克制，没有把任何一方写成单纯的坏人。几场逃脱戏的设计相当聪明，靠的是医生的常识而不是运气。动作戏扎实，节奏也紧，叙事效率极高，几乎没有闲笔，两个多小时的紧绷感很少断掉。即使已经知道结局，重看依然有效，这在同类型片里并不常见。它把一个逃亡故事拍得条理清楚，这一点至今仍是范本。｜TMDB 7.5"
  date: 1993-08-06
  added: 2026-09-30
  image: mv-147.jpg

- id: mv-148
  title: "为奴十二年"
  category: 电影
  tags: ["电影", "剧情", "历史", "为奴十二年 12 Years a Slave"]
  quark_url: "https://pan.quark.cn/s/67c480f76f52"
  description: "《为奴十二年》改编自所罗门·诺瑟普 1853 年出版的同名回忆录，这也是它最有力的地方：故事里的每一步都有人真的走过。所罗门原本是纽约州北部的自由黑人，有妻子、孩子和一份正当的生计，会拉小提琴，出门办事时被人骗去了华盛顿——在那里，自由人的身份证明毫无用处。醒来时他已经是别人的财产，从此开始了长达十二年的奴隶生涯。影片刻意把镜头停在具体的日常上：摘棉花的节拍、庄园主那种自以为仁慈的残忍、夜里别人翻身的声音，以及他几次几乎就要接触到援手却失之交臂的段落。史蒂夫·麦奎因的处理极其克制，没有煽情的配乐，但几处长镜头看得人几乎喘不过气。编剧约翰·里德利把一个原本可能被拍成苦情戏的故事处理得尊严而有层次——所罗门要保住的不只是性命，还有「我是谁」。切瓦特·埃加福的表演把这个角色扛住了。影片拿下当年奥斯卡最佳影片，名副其实。推荐给愿意看一部沉重但必要的作品的观众。｜TMDB 7.9"
  date: 2013-10-18
  added: 2026-09-30
  image: mv-148.jpg

- id: mv-149
  title: "亚特兰蒂斯：世界的终结，传奇的诞生"
  category: 电影
  tags: ["电影", "剧情", "历史", "亚特兰蒂斯：世界的终结，传奇的诞生 Atlantis: End of a World, Birth of a Legend"]
  quark_url: "https://pan.quark.cn/s/0912cd8cb533"
  description: "严格说来这不是故事片，而是一部用虚构人物串起真实发现的考古纪录片。起点是古希腊的锡拉岛——今天去圣托里尼旅游的人脚下踩着的那层火山灰，正是三千多年前那场地中海史上最著名爆发的遗物。影片跟着两个虚构的年轻人，把这场灾难的前后完整演示了一遍：地震先来，然后是海啸，最后是整座岛屿的塌陷与火山的冲天喷发；而在文明层面，米诺斯就此从地图上被抹去。片子真正想说的是这个消失的文明如何变成了另一个故事——柏拉图笔下那个一夜之间沉入海中的亚特兰蒂斯，很可能就是从锡拉岛的记忆里长出来的。影像复原的水平放在今天看不算顶尖，场面调度也比较朴素，但对火山机制与青铜时代聚落生活的细节还原相当扎实。缺点是虚构叙事情节的比重不小，某些关于当时衣食起居的推想拍得过于确定，容易让观众误以为是史实。推荐给喜欢历史地理、想知道亚特兰蒂斯这个传说究竟从哪儿来的观众。｜TMDB 6.0"
  date: 2011-01-01
  added: 2026-09-30
  image: mv-149.jpg

- id: mv-150
  title: "义兄弟"
  category: 电影
  tags: ["电影", "惊悚", "动作", "剧情", "义兄弟 의형제"]
  quark_url: "https://pan.quark.cn/s/f85099252247"
  description: "《义兄弟》讲述了原本隶属于两个敌对组织的特工，因6年前发生的一起枪击案而被各自的组织驱逐，在偶然的情况下，二人竟住到了同一个屋檐下，接连发生了一系列的故事。姜东元与宋康昊饰演了一对在影片中并不知道彼此真实身份的好友。 宋康昊饰演退休的原韩国情报院特工，姜东元饰演被派到韩国执行任务却被迫与宋康昊住在一起的朝鲜特工。这部影片是新锐导演长勋的转型尝试，但愿市场能作出相应的消化，避免意外损耗。此番的男性题材没有了年轻的双子星，改由宋康昊和姜东元这一老一少的搭档，不知道还能否拍得潇洒写意。张勋依然让两个人物处在无法妥协的对立面上（南北情报特工），进而发展出一系列的对手戏。初看这样的故事剧情有点像港产双雄…｜TMDB 6.4"
  date: 2010-02-04
  added: 2026-09-30
  image: mv-150.jpg

- id: mv-151
  title: "何处是我家"
  category: 电影
  tags: ["电影", "剧情", "何处是我家 Nirgendwo in Afrika"]
  quark_url: "https://pan.quark.cn/s/57ccbf1ebe23"
  description: "伊朗偏僻山村的小学里，一群孩子在课堂上听老师讲课。检查作业时，老师发现穆罕德屡次没完成，于是严厉批评他，说再犯就开除，并强调这是帮他们树立规矩。当天放学后，小男孩阿穆德赫然发现自己把同桌穆罕德的作业本带回了家。他听懂了老师的话，明白这本子就是同桌继续上学的凭证。为了还回去，他先求母亲和祖父帮忙，都没成功，只能孤身一人翻过山，去对面山里的村落找同桌。可他不认识人家的家，处处碰壁，遭遇到难以想象的困难。影片把镜头几乎完全交给孩子，用他们的视角呈现一整套成人世界的规则。它对成人的刻画很轻，但每一次没人当回事的瞬间都让人心里一沉。孩子的执拗没有被美化成勇敢，而是被拍成一种朴素的责任感。山路、风声和奔跑的声音构成了它的全部节奏。适合愿意慢下来看的观众。｜TMDB 7.0"
  date: 2001-12-11
  added: 2026-09-30
  image: mv-151.jpg

- id: mv-152
  title: "你丫闭嘴！"
  category: 电影
  tags: ["电影", "喜剧", "犯罪", "你丫闭嘴！ Tais-toi !"]
  quark_url: "https://pan.quark.cn/s/69a78fb8b50c"
  description: "钢蛋（杰拉尔·德帕迪约 饰）是个大话痨，聊天不分时间、场合和对象，因此在监狱里一个接一个地换室友，直到遇上总也不说话的杀手卢比（让·雷诺 饰）。钢蛋可以对着卢比一直说下去，卢比不说话也不生气，脑子里只在盘算越狱。计划本来天衣无缝，却因为被钢蛋死死黏住，两人在混乱中一起逃了出去。卢比心里还有为女友复仇的打算，钢蛋只想永远跟卢比做朋友、开一家餐馆。一个喋喋不休，一个喊着要对方闭嘴，两人在逃亡路上冲突不断、笑料迭出，德帕迪约的语速和雷诺的沉默形成了天然的节奏差。这部法国喜剧的笑点几乎全靠台词和节奏，配乐用得不多，两个性格截然相反的人被绑在一起，本身就是最有效的设置。它对法国外省小镇和监狱的呈现都轻松随意，荒诞感从头保持到尾，风景和天气都在替喜剧服务。结尾的走向比预期温情，这也是它一直被提起的原因。｜TMDB 6.7"
  date: 2003-10-22
  added: 2026-09-30
  image: mv-152.jpg

- id: mv-153
  title: "伸冤人"
  category: 电影
  tags: ["电影", "惊悚", "动作", "犯罪", "伸冤人 The Equalizer"]
  quark_url: "https://pan.quark.cn/s/17143e00ebfa"
  description: "《伸冤人》给动作片提供了一个相当简单的支点：一个已经不需要证明自己的人，重新出手。麦考尔曾经是黑色行动部队的成员，那种处理完就不留下记录的角色；如今他想回归普通生活，甚至自导自演了自己的死亡，在波士顿的一家建材超市找了份夜班工作，看书，喝固定的茶，和同事保持着礼貌的距离。改变他的是一次偶遇：一名被迫在街头讨生活的年轻女孩走进店里，两人建立起一种安静的默契。当她被俄国黑帮打进医院之后，麦考尔做了他的选择。这条线索在片子里铺得很慢——前半个小时几乎没有动作场面，只有那个既整洁又孤独的日常；所以他后来的每一次出手都格外有分量。丹泽尔·华盛顿的表演克制到几乎是静止的，这也让之后这场清算显得异常干净利落。缺点是剧情本身相当常规，反派脸谱化，结局的处理稍显敷衍。整体上它以风格和表演赢得了自己的位置。推荐给喜欢《疾速追杀》那种「别把老实人逼到最后一步」结构的观众。｜TMDB 7.3"
  date: 2014-09-24
  added: 2026-09-30
  image: mv-153.jpg

- id: mv-154
  title: "偷心贼"
  category: 电影
  tags: ["电影", "喜剧", "爱情", "偷心贼 캐치미"]
  quark_url: "https://pan.quark.cn/s/df21e7468d3a"
  description: "《偷心贼》是一部韩国爱情喜剧，走的是「猫和老鼠谈恋爱」这条老路，但两个人物的分工写得不赖。男主角李浩泰是警局里出了名的破案机器，再绕的案子到他手里也能抽丝剥茧，同事给了他一个外号叫「专门分析器」——顺便说一句，他的自信程度与这个外号基本成正比。对手部门近来盯上了一个专偷艺术品的女贼：尹珍淑作案从不留下痕迹，行事的风格更像是一场表演，每次得手之后还会给追查者留一点线索，像是在打招呼。于是两条叙事线开始交汇：一个无案不破的警探和一个无往不利的女贼，两个人彼此都知道对方在干什么，捉迷藏渐渐变成了一种默契，而这场追逐往哪边走，双方心里其实都有数。影片的整体基调轻松，笑点主要来自男主角那种过分自信一路被打脸的反差，金雅中的角色则有相当的主动性，不是等着被追的花瓶。缺点是桥段比较老套，结局处理略显仓促。推荐给喜欢韩国爱情喜剧、想要一部不用动脑的轻松作品的观众。｜TMDB 6.7"
  date: 2013-12-18
  added: 2026-09-30
  image: mv-154.jpg

- id: mv-155
  title: "大内幕"
  category: 电影
  tags: ["电影", "犯罪", "惊悚", "大内幕 The Big Heat"]
  quark_url: "https://pan.quark.cn/s/0dbdfef369b9"
  description: "侦探戴夫·班尼恩接手的本来是一桩没什么悬念的案子：一名警官自杀。直到一个酒吧女招待找上门，说她手里有证据能证明那是谋杀，而上级在同一时间叫他别再管。班尼恩顺着线索怀疑上黑帮头目拉加纳——一个靠别人的肮脏生意过活的体面人。一颗本该炸死班尼恩的炸弹却炸死了无辜的旁观者，从这一刻起，他不再只是查案，而是带着怒火独自撞向整个腐败的系统。主角的转变并没有太多铺垫，怒火本身就是这部片的引擎。影片开头对家庭生活的短暂描写，反而让后面的暴力更加刺眼。女招待这个角色并不只是线索的提供者，她的处境本身就是那个系统的缩影。影像极为干脆，没有任何多余的情绪渲染，暴力也总是在画外或被省略。它的力量来自克制：越是不动声色，那些被收买的人越显得可怖。半个多世纪之后再看，那种对体制的不信任依然没有过时。适合喜欢经典黑色电影的观众。｜TMDB 7.7"
  date: 1953-10-14
  added: 2026-09-30
  image: mv-155.jpg

- id: mv-156
