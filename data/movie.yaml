  quark_url: "https://pan.quark.cn/s/5fa2d8e65a09"
  baidu_url: "https://pan.baidu.com/s/1E9JFxIf-BkPNXet_BkwhxQ"
  baidu_code: "fjb5"
  description: "《绝望海峡》的起点是一起失手的银行劫案。一伙匪徒原本的计划就不算周全，行动中又接连出错，于是从动手那一刻起，他们就已经处在外逃的状态：一个已经走投无路的劫匪、他那个情绪越来越不受控制的兄弟、以及他们那位当过海军陆战队员的同伴。追在后面的是联邦探员，合围正在收紧，而他们唯一能去的方向是离开新奥尔良。影片是标准的紧凑型犯罪动作片：逃脱路线的规划、临时拼凑的同盟、不断被压缩的时间表，这几样东西组成了它的骨架。城市本身的质感是加分项——新奥尔良的窄街、水岸、夜色给追逃段落提供了不少地形变化。真正让它比同类片高一档的，是兄弟之间那条线：一个想把事做干净，一个已经不在乎后果，这种拉扯比外面的追捕更有看头，也是全片少见的用心之处。缺点是整体相当套路，结局没有惊喜，人物群像写得偏薄。适合喜欢城市追逐与火并场面、不太在意创新的观众。｜TMDB 6.2"
