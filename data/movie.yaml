  baidu_url: "https://pan.baidu.com/s/1M1A6Vyl85Y92pJVlq1GoQg"
  baidu_code: "mjd7"
  description: "严格说来这不是故事片，而是一部用虚构人物串起真实发现的考古纪录片。起点是古希腊的锡拉岛——今天去圣托里尼旅游的人脚下踩着的那层火山灰，正是三千多年前那场地中海史上最著名爆发的遗物。影片跟着两个虚构的年轻人，把这场灾难的前后完整演示了一遍：地震先来，然后是海啸，最后是整座岛屿的塌陷与火山的冲天喷发；而在文明层面，米诺斯就此从地图上被抹去。片子真正想说的是这个消失的文明如何变成了另一个故事——柏拉图笔下那个一夜之间沉入海中的亚特兰蒂斯，很可能就是从锡拉岛的记忆里长出来的。影像复原的水平放在今天看不算顶尖，场面调度也比较朴素，但对火山机制与青铜时代聚落生活的细节还原相当扎实。缺点是虚构叙事情节的比重不小，某些关于当时衣食起居的推想拍得过于确定，容易让观众误以为是史实。推荐给喜欢历史地理、想知道亚特兰蒂斯这个传说究竟从哪儿来的观众。｜TMDB 6.0"
  date: 2011-01-01
  added: 2026-09-30
  image: mv-149.jpg


