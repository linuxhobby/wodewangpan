  baidu_code: "fcmq"
  description: "鲍伯是那种写在档案里会让人倒吸一口凉气的特工：单枪匹马端过匪巢，拦下过炸弹，堵过毒贩。可脱下那身行头，他只是个戴着黑框眼镜、看上去毫不起眼的华裔中年男人。他打算退休了，索性搬到女朋友吉莉安家隔壁。眼下的新任务比任何一次卧底都棘手：吉莉安临时出门几天，把三个孩子交给他照看。三个孩子都不是他的骨肉，也都不太待见他。一个干了半辈子特工的人，既不会做饭也不会哄人，头几天几乎是一场灾难。好不容易磨出一点信任，其中一个孩子误打误撞从电脑上下载了一段秘密编码。这下好了，俄罗斯的恐怖分子来了，别国的特工也来了，本来平静的街区瞬间变成了战场。鲍伯别无选择，只能带上三个孩子，重新拿起那套工具，一边护住他们一边跟这帮人周旋。2010 年的这部片子是成龙在好莱坞交出的又一部家庭向动作喜剧，笑点主要在「特工带娃」这个反差上，属于轻松的合家欢作品。｜TMDB 5.9｜TMDB 5.9"
  date: 2010-01-15
