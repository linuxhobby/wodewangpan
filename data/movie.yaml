  description: "鹰爪门与蛇形门在江湖上斗了几代，谁都想把对方连根拔起。一个月黑风高的夜里，鹰爪门突袭，蛇形门满门遭难，只有长老白长天逃了出来。从此他隐姓埋名缩在市井里，连头都不敢多抬。某天他在街上被无赖围住，是武馆里一个叫简福的打杂替他解了围。这一出手反倒惹了祸，白长天的行藏露了馅，鹰爪门的伏击紧跟着就到，又是简福碰巧路过，把他从鬼门关拽了回来。白长天看出这个年轻人是块料，决定把蛇形拳传给他。简福学得快，也不死守规矩，练着练着在蛇形拳的路数里加进了自己的东西，另创出一门蛇形刁手。等鹰爪门再次找上门，已经轮到这个当年的打杂站到师傅前面去了。1978 年的这部片子是成龙真正打出名堂的起点，谐趣功夫的路子在这里基本成型，师徒二人插科打诨的段落与最后那场硬仗搭配得相当利落。｜TMDB 7.3｜TMDB 7.3"
