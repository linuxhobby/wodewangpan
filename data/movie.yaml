  baidu_code: "vja7"
  description: "《网络谜踪》最关键的设定在于它的画面：整部片子几乎完全在一块电脑屏幕上发生。父亲大卫·金是典型的工程师，自认为和十六岁的女儿玛戈特相处得不错。某天深夜女儿出门后没有回来，报警之后，负责调查的警探判断是离家出走——这类案子通常也确实如此。大卫不接受这个结论，于是坐下来打开女儿的电脑，从她的账号、聊天记录、支付流水、直播回放里一点点倒推：她在失踪前那段时间究竟在跟谁说话，又在隐瞒些什么。影片的高明之处在于它把搜索框、对话框、加载进度这些最日常的界面拍出了悬疑感，鼠标悬停、消息撤回、邮件草稿都成了信息；而父亲在这些痕迹里逐渐发现，他自以为了解的那个女儿，其实有一整面他不认识的生活。这种错位带来的情绪冲击，比案件本身更有力。前四十分钟节奏稍慢，需要一点耐心；中段之后的几次反转干净利落。推荐给喜欢桌面式叙事、或对亲子关系话题有感的观众。｜TMDB 7.6"
