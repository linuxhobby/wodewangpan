  description: "《谍报暗线》从一起边境罪案调查切入：在俄罗斯符拉迪沃斯托克一家朝鲜餐厅工作的员工，身份并不简单——这个人掩藏了很久的间谍身份意外暴露，各方势力立刻被卷了进来。线索是从一次人名的核对开始的：某个被记录在案的人，与眼前的这个人并不是同一个。接下来的争夺围绕这一个人展开，两名来自不同机构的情报人员各自接到指令，很快碰到了一起，局势也就从一场抓捕升级为南北之间的一场高危对局。这类谍战片的看点是「每一步都可能是双向的」——你不知道对方的指令是什么，也不知道自己的同伴会不会另一个插头。本片把地缘背景摆得很实：那座边境城市的街道、餐馆、暗巷拍得相当具体，本身就带着紧张感。几位主演的处理都稳，尤其是两方人员那种「服从命令」与「想把事情做对」之间的拉扯。缺点是中段推进略缓，个别配角的处理太仓促。适合喜欢《共同警备区》《铁雨》那种南北题材的观众。｜TMDB 7.4"
