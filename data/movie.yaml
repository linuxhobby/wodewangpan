  description: "警官黄伟被借去查一桩牵涉警员犯案的案子，为了拿到证据，他选了最冒险的一条路，主动入狱。火烧岛这座监狱里的规矩跟外头完全不同：典狱长一手遮天，暴力与不公是常态，连犯人之间的殴斗都被默许成一种秩序。黄伟进去后很快结识了室友小朱，还有因为想念儿子而反复越狱的刘世杰，又亲眼见识了帮派人物大林入狱时那套下马威。台球选手大锤因为误杀帮派大哥钢珠的弟弟被关了进来，大林奉命向他寻仇，最后由狱中说话算数的桂老大出面调停。这四个人随后被典狱长挑中，编进一支叫「清风队」的队伍，专门替他执行见不得光的暗杀任务。正是在一次次任务里，黄伟一点点逼近了那个他追查许久的幕后真凶。1991 年的这部作品是港产监狱题材里阵容相当可观的一部，群戏扎实，气氛压抑，动作戏不多但每次出手都有分量，跟成龙那些轻松谐趣的作品完全是两种气质。｜TMDB 6.3｜TMDB 6.3"
