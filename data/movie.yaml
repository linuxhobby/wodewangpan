- id: mv-110
  title: "艋舺"
  category: 电影
  tags: ["电影", "惊悚", "艋舺 艋舺"]
  quark_url: "https://pan.quark.cn/s/18f10689b9ed"
  description: "蚊子（赵又廷 饰）十七岁那年搬到艋舺，因为一根鸡腿踏进黑道，认识了和尚（阮经天 饰）、志龙、阿伯和白猴，五人结为太子帮。他们秉持只识意气、不问意义的信条，凭借志龙的父亲 Geta（马如龙 饰）在地方上的地位在学校里呼风唤雨。踏入黑道就意味着腥风血雨，而和尚作为众人的守护神总能帮他们化解危机。艋舺传统的黑道秩序正遭受现代文明的威胁，外省人灰狼（钮承泽 饰）要求和艋舺的老大们合作，遭到拒绝。此时和尚因为得知父辈之间的事而对 Geta 心怀不满，加上文谦的怂恿，卷入了一场阴谋。艋舺局势暗潮汹涌，五兄弟在黑道与友情之间做出了各自的选择。影片把青春片和黑帮片拧在一起，前半段的明亮和后半段的沉重对比强烈。它对艋舺街区的呈现相当有生活感，庙口、巷子和夜市都有真实的场所感。演员之间的默契撑起了兄弟情这个核心。｜TMDB 6.6"
  date: 2010-02-05
  added: 2026-09-30
  image: mv-110.jpg

- id: mv-111
  title: "布达佩斯大饭店"
  category: 电影
  tags: ["电影", "喜剧", "剧情", "布达佩斯大饭店 The Grand Budapest Hotel"]
  quark_url: "https://pan.quark.cn/s/eb5fb3ddc139"
  description: "一位作家来到昔日辉煌、如今衰落的布达佩斯大饭店，结识了饭店主人穆斯塔法。晚餐时，穆斯塔法讲起这家饭店年轻时的往事：那时他还是名叫零的门童，在传奇礼宾员古斯塔夫手下学习如何当一个出色的饭店员工。古斯塔夫很受年长女客人们的欢迎，富有的 D 夫人是其中之一。她突然去世后在遗嘱里把一幅价值连城的名画留给了他，引发家族争夺，也让古斯塔夫意外卷进一场谋杀嫌疑与遗产纠纷。随着欧洲局势日渐动荡，两人踏上了一段荒诞而危险的旅程。影片的结构是层层嵌套的回忆，每一层用了不同的画幅比例，对饭店这个空间的处理也极其讲究，前台、走廊和电梯各有用处。韦斯·安德森的对称构图、粉色调和快速剪辑在这部里用到了极致，形式本身就是内容的一部分。它对逝去的欧洲文明有一层淡淡的哀悼，包在闹剧的外壳下面，荒诞和伤感在结尾汇合。｜TMDB 8.0"
  date: 2014-02-26
  added: 2026-09-30
  image: mv-111.jpg

- id: mv-112
  title: "大卫叔叔"
  category: 电影
  tags: ["电影", "恐怖", "剧情", "惊悚", "大卫叔叔 Uncle David"]
  quark_url: "https://pan.quark.cn/s/a50f583e8b19"
  description: "2010 年的英国黑色喜剧惊悚片，由行为艺术家大卫·霍伊尔与 Mike Nicholls、Gary Reich 联合执导，霍伊尔本人出演主角。故事写一位叔叔和侄子之间不断滑向失控的关系：表面是英国式的体面与日常，内里却是近乎疯癫的逻辑，一路走到令人不安的结局。影片成本极低，风格粗粝，制作质感接近家庭录像，粗糙本身是风格的一部分而非缺陷。它对英国郊区那种体面而压抑的家庭氛围抓得很准，越礼貌越不对劲，演员的表演基本是即兴的路子，失控感是设计出来的。舞台感、挑衅式的幽默混在一起，是典型的小众邪典小品。它不打算让人舒服，也不打算把话说清楚，更多是表演者的一次自我暴露，片长不长却显得拖沓，这一点连能接受它的观众也未必喜欢。欣赏霍伊尔那种气质的观众会格外有感觉，尤其是熟悉他现场作品的人；追求工整叙事的观众多半会不适应。｜TMDB 3.9"
  date: 2010-03-25
  added: 2026-09-30
  image: mv-112.jpg

- id: mv-113
  title: "源代码"
  category: 电影
  tags: ["电影", "惊悚", "科幻", "悬疑", "源代码 Source Code"]
  quark_url: "https://pan.quark.cn/s/9a5ef0c906f4"
  description: "美军直升机飞行员柯尔特·史蒂文斯上尉突然在一列驶向芝加哥的列车上醒来，身边的女子似乎认识他，他却发现镜中的自己变成了另一个人。还没弄清发生了什么，列车就在爆炸中毁灭。再次醒来时，他身处一个封闭空间，女军官古德温通过屏幕告诉他正在执行一项特殊任务：借助名为源代码的项目，他必须一次次回到爆炸前最后的八分钟，在有限的时间里找出凶手，并阻止即将发生的下一场袭击。随着一次次重返同样的八分钟，柯尔特也开始对自己身处的现实产生越来越多的疑问。影片把同一段时间反复重拍，靠细节的变化推进，节奏控制得相当干净。八分钟这个限制让每一次重复都有明确目标，观众知道自己该看什么。它不是一个复杂的科幻设定，胜在执行和情感上的收束，结尾的走向把故事推向了另一个层面。适合喜欢悬疑科幻的观众。｜TMDB 7.3"
  date: 2011-03-30
  added: 2026-09-30
  image: mv-113.jpg

- id: mv-114
  title: "分手的决心"
  category: 电影
  tags: ["电影", "惊悚", "悬疑", "爱情", "分手的决心 헤어질 결심"]
  quark_url: "https://pan.quark.cn/s/aa2456a8f126"
  description: "《分手的决心》从一桩坠亡案开始：韩国某处山顶，一名男子坠落身亡，现场的证据指向两种可能——自杀，或者被人推下去。负责调查的刑警海俊把怀疑落在死者年轻的妻子徐来身上。她是个从中国来到韩国、在医院做护工的女人，说话很慢，常常先笑一下再回答，身上的一切都说得通，又都好像有点不对。接下来的看点不是「她到底杀没杀人」，而是这段调查关系本身：海俊是一个长期失眠、把生活过得很整齐的人，他一边监视她，一边被她的语气和沉默一点点拉过去。朴赞郁拍这部片子的方式非常特别——镜头几乎像言语一样移动，转场、甚至是手机屏幕上的一行字都被安排成了叙述的一部分，情绪藏得很深，看第二遍会发现很多话是在镜头里而不是台词里。两位主演的表演极其细腻，汤唯的处理让这个角色始终保持一致的多义性。适合喜欢慢热悬疑、享受那种说不清道不明的暧昧感的观众。｜TMDB 7.3"
  date: 2022-06-29
  added: 2026-09-30
  image: mv-114.jpg

- id: mv-115
  title: "偷破天际线"
  category: 电影
  tags: ["电影", "动作", "喜剧", "犯罪", "偷破天际线 Lift"]
  quark_url: "https://pan.quark.cn/s/d0614b33f200"
  description: "《偷破天际线》的设定一句话就能说完：一支国际盗贼团要在四万英尺的高空，把一架客机上价值五亿美元的黄金搬走。难点在于整桩事都发生在飞行途中——窗口极短，货舱一旦打开就要立刻完成，还得同时应付机组、乘客、航线的例行检查，以及另一伙同样盯上这批货的人。影片走的是轻松路线：热闹、幽默，并不想把抢劫这件事拍得太沉重，导演显然更在意团队成员之间的打趣与每一次备用方案的接替。凱文·哈特的制作公司出品，基调也确实是那种一边贫嘴一边办事的风格；动作段落的量给得足，几场在机舱与货舱之间的调度还算利落。缺点毫无疑问——认真追究每个环节的可行性会破坏它的乐趣：这套计划在现实里几乎每一处都站不住脚，逻辑基本服务于笑点和下一个转折。适合想要一部不用动脑、看个开心的爆米花片的观众；追求精密抢劫片的话建议改看《十一罗汉》或《盗火线》。｜TMDB 6.4"
  date: 2024-01-10
  added: 2026-09-30
  image: mv-115.jpg

- id: mv-116
  title: "猫鼠游戏"
  category: 电影
  tags: ["电影", "剧情", "犯罪", "猫鼠游戏 Catch Me If You Can"]
  quark_url: "https://pan.quark.cn/s/211f6bce3a4c"
  description: "《猫鼠游戏》改编自真实经历，讲的是一场长达数年的追逐，而这场追逐从头到尾带着一种孩子气的荒唐感。故事开始于家庭的崩解：父母离婚后，未成年的弗兰克离家出走，他唯一的资本是极强的观察力与一脸的坦然。靠着这两个东西，他先后冒充的身份是民航飞行员、医生和律师，支票也是自己做的——一个十几岁的孩子就这样在不止一个人面前通过了审查，取走了数百万美元。另一边，联邦调查局的探员卡尔逐渐把这些看似毫不相干的诈骗案串成了一条线，开始认真追这个人。真正让这部片子成立的是两条线索之间的关系：追捕者和被追者都是孤独的人，他们在电话里的那几次对话，与其说是对峙，不如说是一个同样孤单的成年人和一个缺父的孩子在过节。斯皮尔伯格的处理轻盈、明亮，几乎不带血，两位主演之间的默契是全片最宝贵的部分。它获得了当年多项奥斯卡提名，实至名归。强烈推荐给几乎所有观众，尤其是节日期间。｜TMDB 8.0"
  date: 2002-12-16
  added: 2026-09-30
  image: mv-116.jpg

- id: mv-117
  title: "七天"
  category: 电影
  tags: ["电影", "犯罪", "惊悚", "七天 세븐 데이즈"]
  quark_url: "https://pan.quark.cn/s/8ea92ed35215"
  description: "奎因是个粗鲁乏味的货机驾驶员，洛宾是个唠叨的职场女强人，两人各有各的生活。洛宾和未婚夫一起到夏威夷度假，故事就从这里开始。度假第二天她接到工作任务，必须尽快赶往大溪地拍摄明星广告，于是央求奎因用货机载她一程。不料飞行途中遇上暴风雨，奎因只好紧急迫降在一个荒凉的小岛上。在这里，两人要面对的是最实际的问题：找食物、找活路、还要躲开岛上的海盗。奎因虽是个粗人，此时却有力地保护着洛宾，两人情不自禁地互生情愫，而身为他人未婚妻的洛宾心中万分挣扎。影片把爱情片套在荒岛求生的框架里，前段的性格冲突和后段的处境压力互相推动。它对荒岛环境的利用比较表面，重点始终在两人的关系变化上。海盗这条线出现得晚，作用主要是给后半段加压。两位演员的搭配有化学反应，斗嘴的段落是最好看的部分。｜TMDB 6.7"
  date: 2007-11-14
  added: 2026-09-30
  image: mv-117.jpg

- id: mv-118
  title: "夺宝奇兵5：命运转盘"
  category: 电影
  tags: ["电影", "冒险", "动作", "夺宝奇兵5：命运转盘 Indiana Jones and the Dial of Destiny"]
  quark_url: "https://pan.quark.cn/s/434449909906"
  description: "《夺宝奇兵5：命运转盘》是印第安纳·琼斯这条线的收官一战，哈里森·福特最后一次戴上那顶帽子。这一部的的时间跨度相当大：开场那段二战末期的年轻版琼斯是用特效减龄处理的，观感见仁见智——技术比几年前进步不少，但那种违和感依然在；好处是这段戏给系列补上了一块拼图，也让这个故事从一开始就有了一个「追了一辈子」的东西作为目标。回到现代之后，琼斯已经是个退休的老教授，讲课没人听，家里也不太热闹，他被一些旧相识拖回这条路上，原因是一件传说中的器物据说能改变时间。于是新的队伍成立：一个年轻女孩、一个不太可靠的飞行员，加上一堆不太诚实的同行者。导演把追车的段落拍得相当扎实，尤其是那几场在街巷间的追逐与打斗，保住了这个系列一贯的手作感。作为一场告别仪式，它到位了。适合从小看这一系列长大的观众。｜TMDB 6.5"
  date: 2023-06-25
  added: 2026-09-30
  image: mv-118.jpg

- id: mv-119
  title: "疯狂的麦克斯4：狂暴之路"
  category: 电影
  tags: ["电影", "动作", "冒险", "科幻", "疯狂的麦克斯4：狂暴之路 Mad Max: Fury Road"]
  quark_url: "https://pan.quark.cn/s/760d41dd3728"
  description: "《疯狂的麦克斯4：狂暴之路》几乎是动作片史上的一个异数：它本质上是一场长达两小时的追逐，却能把密度如此之高的场面和清晰的叙事拧成一股。故事设定在后末世的荒漠，水和汽油比人命值钱，一个靠控制水源统治众生的堡垒领主，把一批人关在里面当作资源，一整个狂热的武装团体为他卖命。转折发生在一辆巨型油罐车驶出堡垒的那一刻——指挥官弗瑞奥萨把车一拐，带着那几个女人逃进了沙漠。麦克斯原本只是被卷进来的流浪者，此刻却成了这场逃跑最可靠的打手。接下来的两个小时几乎全在移动中展开：改装车、长杆、沙暴、追兵，所有动作场面都是实拍，实景特技的比例在今天的商业片里几乎已经绝迹。导演乔治·米勒对留白的控制令人震惊：没有多余的解释，没有一个多余的镜头，反派的设定靠画面就讲清楚了。它拿下当年奥斯卡六项技术奖，完全实至名归。没看过前三部也不影响入场，这是一部可以直接看的经典。强烈推荐。｜TMDB 7.6"
  date: 2015-05-13
  added: 2026-09-30
  image: mv-119.jpg

- id: mv-120
  title: "聚焦"
  category: 电影
  tags: ["电影", "剧情", "历史", "聚焦 Spotlight"]
  quark_url: "https://pan.quark.cn/s/734418991781"
  description: "《聚焦》讲的不是什么惊心动魄的故事，而是记者每天真在做的那件事：打电话、查档案、被拒绝、再来一次。故事来自真实事件：《波士顿环球报》一个只有四个人的 深度调查小组接手了一条线索——一位神父被指控多年以來性侵儿童。随着访谈展开，他们发现这不是个别案例，也不是某座教堂的问题，而是一种制度性的遮掩：教会把人从一个教区调到另一个教区，司法系统配合压下材料，地方报纸几十年里几乎集体沉默。影片拒绝把记者拍成英雄，重点全在过程的耐性上——一份被封存的名单怎么拿到，一封信的回执怎么争取，一位律师为什么会犹豫。托德·麦卡锡掌镜的处理极其克制，没有任何煽情的配乐推动，最后的字幕名单被密密麻麻地打出来时，反而比任何反转都更有力量。群戏表演整齐，每一位记者都有各自的处境。这是那一届奥斯卡最佳影片，获奖完全合理。推荐给关注新闻行业与社会议题、愿意为「真相是如何来的」花两小时的观众。｜TMDB 7.8"
  date: 2015-11-06
  added: 2026-09-30
  image: mv-120.jpg

- id: mv-122
  title: "惊天营救2"
  category: 电影
  tags: ["电影", "动作", "惊悚", "犯罪", "惊天营救2 Extraction 2"]
  quark_url: "https://pan.quark.cn/s/b290999d596c"
  description: "泰勒·雷克在上一部结尾被炸得半死，捡回一条命之后，又接下一个几乎必死的任务：从戒备森严的监狱里，把一个格鲁吉亚黑帮头目的家人弄出来。克里斯·海姆斯沃斯继续主演，招牌打法也继续——贴身肉搏、长镜头调度、大量实拍的爆破与枪战，动作编排的密度比前作还要高。它的场景转换很快，监狱、公路、机场一段接一段，几乎没有留出喘息的段落。实拍的比例很高，几处危险动作能看出不是靠后期堆出来的。剧情简单到几乎不用记，人物动机几句话就能说清，文戏基本只承担解释任务的功能。几场群戏调度显示出制作上的野心，比如一段持续很久的长镜头追逐，几乎成了这一部的名片。整体属于纯粹的体能型爽片，情绪线薄，暴力程度高，主角几乎全程带伤在跑。如果看过第一部并且喜欢那种打法，这一部基本不会让人失望。适合只想看大场面、不想动脑子的周末。｜TMDB 7.4"
  date: 2023-06-09
  added: 2026-09-30
  image: mv-122.jpg

- id: mv-123
  title: "Nocturnal"
  category: 电影
  tags: ["电影", "Nocturnal Nocturnal"]
  quark_url: "https://pan.quark.cn/s/8f70c92945d1"
  description: "《夜行人》（英文原名 Nocturnal）是 2025 年上映的剧情片，本站收录的是可直接转存的网盘版本。需要说明的是，这部片子在公开渠道能查到的资料相当有限：剧情大纲、片长、主演阵容等都缺少可以确认的可靠来源，因此这里不对其情节做任何推测性的描述，只给出已确认的基本收录信息——英文原名 Nocturnal，类型归在剧情之下。从片名与已知的类型判断，它属于那种安静、节奏偏慢的独立制作，信息不畅在这类小成本影片里并不少见，很多时候只能等首映后有更多资料流出。若你偏好不成名的独立剧情片、愿意不看介绍就直接开看的口味，这倒是个可以尝试的选择；但如果你习惯先了解清楚再决定，建议先等完整的剧情介绍核实之后再决定是否观看。也欢迎看过本片的朋友提供补充信息，介时再把介绍写全。｜TMDB 0.0"
  date: 2025-09-01
  added: 2026-09-30
  image: mv-123.jpg

- id: mv-124
  title: "全信没收"
  category: 电影
  tags: ["电影", "动作", "惊悚", "犯罪", "全信没收 The Rip"]
  quark_url: "https://pan.quark.cn/s/973eaa2be444"
  description: "故事从一个最容易让人生出贪念的场景开始：一群迈阿密警察在一间废弃的藏身屋里翻出数百万现钞。钱摆在眼前，彼此之间的信任就变了味——一旦外面的人知道充公金额如此可观，事情就再也回不到从前。整部片子基本围着一个问句打转：到底还剩什么可以相信，谁依然值得托付。它属于典型的内部崩塌式犯罪片，靠人与人之间的猜疑推进，而不是追车枪战；镜头长时间停在几个人互相打量、试探之后的沉默上。钱的数量在片中被反复提起，每一次提起都让人心里的秤再歪一点。影片对警察日常程序的描写相当具体，这让它比一般的贪腐题材更有说服力。演员群戏是它最扎实的部分，几场审讯式的对话几乎全靠眼神和停顿。它不急着给结论，而是让每个人在自己的立场上一步步滑远，这种处理比直接的善恶对立更有压迫感。它对腐败的呈现不靠大动作，而是靠一次次小小的妥协累积。迈阿密的湿热和阳光提供了合适背景。｜TMDB 7.1"
  date: 2026-01-13
  added: 2026-09-30
  image: mv-124.jpg

- id: mv-125
  title: "七月寒潮"
  category: 电影
  tags: ["电影", "剧情", "惊悚", "七月寒潮 Cold in July"]
  quark_url: "https://pan.quark.cn/s/45daa7500cb1"
  description: "《七月寒潮》的开场非常日常：夜里有黑影闯进理查德家的院子，他摸出枪，出于自卫把人打死。事情到这里本该结束——警察来了，验了尸，案子归档，当地报纸还可能夸他一句冷静。但几天之后，死者的父亲找上门来，一个刚出狱不久的硬茬，他的报复方式直接到不需要解释。影片有意思的地方恰恰在后面：这对本该你死我活的两个人，很快就发现这件事不像看起来的那样——死者的身份有疑点，当晚的安排也存在被人为制造的痕迹。于是他们被迫从对立转向联手，沿着线索往上挖，而越往下越黑。片子气质很冷，节奏慢，带着七十年代犯罪片那种粗糙的胶片质感，叙事会拐几次弯，前半段建立起的判断多半要被推翻。演员的处理都相当稳，主要角色在一次次转折中逐渐改变站位。缺点是中间段落略显松散，某些环节的说服力依赖巧合。推荐给喜欢那种「从一件小事开始、一路滑向深渊」的悬疑片的观众。｜TMDB 6.5"
  date: 2014-05-23
  added: 2026-09-30
  image: mv-125.jpg

- id: mv-126
  title: "十二猴子"
  category: 电影
  tags: ["电影", "科幻", "惊悚", "悬疑", "十二猴子 Twelve Monkeys"]
  quark_url: "https://pan.quark.cn/s/b60b86eb93a3"
  description: "公元2035年，人类被12只猴子军研制的一种病毒侵袭，大部分人类都在这场病毒灾难中死亡，只有少数人侥幸逃生，但也只能在阴暗的地下，苟且偷生。科学家们决定派人穿越时光回到1996年追查12只猴子军的来历。囚徒詹姆斯·科尔(布鲁斯·威利斯 Bruce Willis 饰)被挑选为志愿者。阴差阳错，科尔回到了1990年，当他向当时的人们描述未来的那场大灾难时，被当作精神病捉了起来并被医生凯瑟琳·雪莉（玛德琳·斯通 Madeleine Stowe 饰）诊断为精神分裂症。科尔在病友杰弗里·戈因斯帮助下逃脱，回到了未来。因为没查清12只猴子军的来历，科尔再次被派回了1996年。科尔这次发现了12只猴子军的起…｜TMDB 7.6"
  date: 1995-12-29
  added: 2026-09-30
  image: mv-126.jpg

- id: mv-127
  title: "国家元首"
  category: 电影
  tags: ["电影", "动作", "惊悚", "喜剧", "国家元首 Heads of State"]
  quark_url: "https://pan.quark.cn/s/b5f33dc063d6"
  description: "《国家元首》是典型的暑期爆米花动作喜剧：英国首相与美国总统一向不对付，两国领导人会面时的那点口角被媒体放大，几乎要让同盟关系出现裂痕。偏偏此时两人成了同一场袭击的目标，被迫放下体面，临时组成逃命搭档，在军情六处一名特工的护送下，横跨欧洲多个国家躲避追杀，同时还要弄清背后那股势力到底想干什么。影片的乐趣基本来自两个「国家门面」被迫同处一辆车、一架飞机、一间旅馆房间时互相拆台的化学反应——一个是体面到近乎刻薄的政客，一个是肌肉比脑子反应更快的前动作明星，反差本身就够笑。动作场面规模不小，追车、坠机、枪战都拍得豪气，幽默基调也统一，不会出现突然严肃的割裂感。代价是剧情逻辑相当随意，阴谋的设计经不起推敲，反派的计划基本靠台词解释。主演之间的互动足够有趣，足以掩盖这些问题。适合想要一个不费脑、笑点与爆炸齐飞的夜晚的观众，别带着剧作期待进场就好。｜TMDB 6.8"
  date: 2025-06-24
  added: 2026-09-30
  image: mv-127.jpg

- id: mv-128
  title: "珠宝大盗：神偷出马"
  category: 电影
  tags: ["电影", "动作", "惊悚", "珠宝大盗：神偷出马 ज्वेल थीफ़ - The Heist Begins"]
  quark_url: "https://pan.quark.cn/s/f140c0a93a27"
  description: "《珠宝大盗：神偷出马》的主线是一次大买卖：一位盗术过人的高手接下了偷取传说中的「非洲红太阳」钻石的任务。这类印度动作片的卖点是场面铺得开、节奏足，而这部的格局也确实不小——跨国取景、豪车、拍卖场、层层安保，导演把这场盗窃拍得相当华丽。真正撑起后半段的是人物关系：计划起初严丝合缝，之后一步步演变成背叛与立场反复切换的棋局，谁也不确定最后拿走钻石的是谁，同伙、雇主、买家之间各有算盘，每一次「合作」背后都可能有另一层安排。如果你已经看过不少印度商业片，会很熟悉它的配方：动作、追车、豪门恩怨，中间穿插歌舞段落，占据了不小的篇幅，这也是这类片子的固定菜单，接受不了的话建议提前有心理准备。整体的娱乐性是够的，主要角色的表演也算投入。缺点是剧情逻辑相当随意，几处转折靠巧合推进，片长偏长。适合喜欢热闹的抢劫题材、能接受长片和穿插桥段的观众；追求精密叙事的话可能会觉得失望。｜TMDB 6.6"
  date: 2025-04-24
  added: 2026-09-30
  image: mv-128.jpg

