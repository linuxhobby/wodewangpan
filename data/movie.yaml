- id: mv-174
  title: "刺杀游戏"
  category: 电影
  tags: ["电影", "动作", "犯罪", "剧情", "刺杀游戏 Assassination Games"]
  quark_url: "https://pan.quark.cn/s/abcae451384d"
  description: "《刺杀游戏》讲的是两个替不同老板卖命的顶级杀手：他们多次交手，彼此最清楚对方的斤两，也各自为这份职业付出了代价——至亲之死让两个人开始重新盘算，自己这些年到底在替谁干活。于是关系发生了变化：从敌对到相惜的过程写得相当耐心，中间有好几段是两个人隔着一张桌子互相试探，看对方会不会先动手。等他们终于站到同一边，对手变成了那些真正把人当消耗品的家伙——付钱的人在办公室里签字，做这些事的人连名字都不会留下。影片的乐趣主要来自双主角结构，两位主演的气质一冷一热，对手戏撑起了大半个场子；几场暗杀与近身格斗的处理干净，没有太多花哨的剪辑。缺点是剧情走向相当常规，幕后的反派几乎没有层次，中段稍显平缓。整体上它属于扎实、老派的动作片，不给你惊喜，但也不会让人觉得敷衍。适合喜欢那种一路莽到底的双人动作组合片、尤其偏好有年纪的主演的观众。｜TMDB 6.3"
  date: 2011-07-28
  added: 2026-09-30
  image: mv-174.jpg

- id: mv-175
  title: "前目的地"
  category: 电影
  tags: ["电影", "科幻", "惊悚", "前目的地 Predestination"]
  quark_url: "https://pan.quark.cn/s/e43fa3a9ca2a"
  description: "一名时间特工奉命穿越时空，试图阻止连环爆炸案的制造者。最后一次任务里他回到 1967 年，在一家酒吧遇见约翰（莎拉·斯努克 饰），听对方讲起自己的人生——从一个女孩成长为男人的曲折经历。特工决定带约翰穿越时空去完成复仇，而在这个过程中，隐藏在时间悖论背后的秘密一点点浮出水面。影片改编自海因莱因的短篇小说，把这个关于自我闭环的构想搬上了银幕。酒吧那场长谈是全片的核心，两人面对面说话的段落占了很长篇幅，节奏因此偏慢。伊桑·霍克和莎拉·斯努克两人撑起了整部片，后者的表演尤其关键。它属于那种把设定推到极致的科幻作品：逻辑自洽是它的乐趣，也是它的负担，看完第一反应通常是想把整条时间线重排一遍。美术和调色偏冷，几个年代的布景做得干净利落。它对性别与身份的处理放在今天看仍有讨论空间。｜TMDB 7.4"
  date: 2014-08-28
  added: 2026-09-30
  image: mv-175.jpg

- id: mv-176
  title: "勇闯夺命岛"
  category: 电影
  tags: ["电影", "动作", "冒险", "惊悚", "勇闯夺命岛 The Rock"]
  quark_url: "https://pan.quark.cn/s/70454553e6f4"
  description: "美国军方在无数次秘密行动中牺牲了一些优秀的指战员，而这些人及其家属没能得到足够的奖励与补助。对此忿忿不平的赫梅尔准将率部占领罗克岛，扣押八十一名观光客作为人质，向政府发难：四十二小时内提出补偿办法，否则就以旧金山为目标发动生化毒气袭击。罗克岛在 1963 年之前是设计最先进的监狱，易守难攻。政府只能求助于唯一一位曾从那里逃出的前英国情报官员约翰，以及联邦调查局的生化武器专家斯坦利。两人必须在三十小时内率特种部队潜入，瓦解赫梅尔的方案。影片属于九十年代动作片的典型规格：大场面、实拍、硬碰硬，反派的动机甚至写得有些正当。它对罗克岛这个真实地点的利用相当充分，地形本身就是剧情的一部分。几场追逐和枪战的调度清楚，节奏控制得稳。适合怀念那个年代动作片的观众。｜TMDB 7.2"
  date: 1996-06-07
  added: 2026-09-30
  image: mv-176.jpg

- id: mv-177
  title: "勇者行动"
  category: 电影
  tags: ["电影", "动作", "惊悚", "战争", "勇者行动 Act of Valor"]
  quark_url: "https://pan.quark.cn/s/d07220b201ad"
  description: "洛克即将成为人父，正准备与大家分享这份喜悦，却突然接到上级命令，带领小队去营救被绑架的中情局人质。与家人才团聚不久，但为祖国效命是海豹突击队员的职责。小队很快集结，按计划前往目的地救人，可营救过程中洛克发现，恐怖分子布下的是一张更大的网，一场惊天阴谋正在酝酿。如果不能阻止，美国本土很可能遭受严重的恐怖袭击，于是海豹突击队一刻不停地在全球展开围剿。影片最大的特点是真实感——片方在全球多地取景，据称根据真实事件改编，战术动作和装备的使用是它的重点。它对夜视、通讯和队形这些细节的处理相当认真，军事迷会看得很仔细，演员也经过了专门的战术训练，动作质感因此与一般动作片不同。文戏基本只承担交代功能。它的节奏偏慢热，前置的铺垫不算短。适合喜欢现代军事题材的观众。｜TMDB 6.6"
  date: 2012-02-24
  added: 2026-09-30
  image: mv-177.jpg

