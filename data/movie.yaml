  tags: ["电影", "爱情", "剧情", "一生所爱 Love of Your Life"]
  quark_url: "https://pan.quark.cn/s/a7db438adba5"
  description: "《你的生命挚爱》由瑞秋·莫里森执导，她此前凭《内心之火》拿下奥斯卡最佳摄影，转做导演后把镜头对准了一段猝不及防的爱情。玛雅由玛格丽特·库里饰演，查理由加布里埃尔·巴索饰演，两人在一次偶然邂逅里擦出火花，一段轰轰烈烈的恋情就此点燃。可这段关系从一开始就不只是两个人的事，它牵出一个远超玛雅想象的未来，那个未来像潮水一样涌来，又像沙堡一样在眼前崩塌。当生活被掀翻，玛雅被抛进一段完全陌生的新日常，她必须重新回答自己是谁、到底想要什么，以及还敢不敢再次去爱。影片把科幻设定收在情感内核之后，用克制的镜头铺陈情绪的起落，让两个普通人在被改写的人生里，重新学会信任、靠近，以及把破碎的日子一点点拼回原样。它不急着给出答案，只是把两个人从相遇到破碎再到重新靠近的过程，老老实实铺在观众眼前。｜TMDB 6.2"
  date: 2026-10-07
  added: 2026-10-15
  image: mv-386.jpg

