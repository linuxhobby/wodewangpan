  description: "《山竹刀》改编自第 22 届中国动漫金龙奖获奖作品，是一部国产动画武侠片。故事从一趟看似简单的还刀之旅开始：女侠芷竹要送一把刀回到它该去的地方，途中与医女李小若同行。两人身份不同、性情也不同，一个习惯提刀解决问题，一个更愿意把人治好，最初只是凑在同一条路上。然而这把刀牵出的东西远比她们预想的多，江湖上的人和事接踵而来，追杀、试探、选择一层层压上来，而旅途的意义也随之改变——从「把刀送回去」变成「要护住什么」。影片的重点并不仅在打斗，而在于两位女性角色之间的互相扶持与重新理解：所谓侠义到头来落实到具体的一个人身上，守护也是。视觉方面走的是东方路线，江南的水乡街巷、竹林烟雨与传统武侠的动作身法被放在一起，画面的笔触明显在做国风的表达。节奏整体偏慢，文戏比武戏占更多篇幅，这也是它的定位。推荐给喜欢国产动画、尤其偏好《白蛇》《哪吒》那种东方审美与女性视角武侠的观众。｜TMDB 0.0"
