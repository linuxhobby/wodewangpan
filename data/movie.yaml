  description: "清朝末年，洋人打进来，大势眼看就要倾覆。大内太监总管程如虎瞅准宫中混乱，以「保护国宝」为名，带着一队禁卫军把大批宫廷珍宝押出了紫禁城，一路辗转运到广东龙山镇，再借着当地首富王员外与洋人熟络的关系，一件件卖出去换钱。副总管于海坚决反对，当场跟他闹翻。另一边，龙山镇富家公子龙少爷武艺高强，某天与朋友出游，无意间闯进一处堆满宝物的地方，被看守发现后一路追杀，多亏王员外暗中出手才捡回一条命。他撞见的正是程公公私藏国宝的所在，机关重重。与此同时，于海趁乱偷出了一批国宝，程公公大怒，派人四处搜捕。一次在岳王庙里，程的手下正要拿人，龙少爷拔刀相助，反倒把杀身之祸引到了王员外身上。程公公认定两人勾结，下令一并剿杀。为救人，龙少爷不得不正面挑战这个老谋深算的卖国贼。1982 年的这部片子由成龙自导自演，是他早期把家国情怀与谐趣功夫捏在一起的作品。｜TMDB 6.5｜TMDB 6.5"
