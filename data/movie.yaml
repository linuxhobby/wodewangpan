  description: "《伸冤人3》给这套系列定了一个相当合适的调：让主角老下来，同时把那份平静留在前面。罗伯特·麦考尔依然在替被欺负的人出头，但这个早已不必再干脏活的人此刻更在意的，是把自己过去为国家效力时期欠下的账慢慢还掉；在替求助者奔走的过程中，他找到了一种近乎苦行的安宁。故事的转折点落在意大利南部：他在海岸边的小镇上认识了几个普通人，被那里的生活节奏打动，几乎有了留下来的念头，直到他发现新朋友们被当地的犯罪头目捏在手里。接下来的走向基本不需要介绍——这位老人不再打算用交谈解决问题。这一部的亮点在氛围：阳光、海边小城、老城石阶与突然发生的暴力之间形成的反差，拍得比前两部更有味道；丹泽尔·华盛顿沉着的表演依旧是整部片的核心。缺点是情节略显常规，反派的层次不足，动作场面的数量也比前作收敛。收官得平稳得体。适合一路看下来、想给这条线一个结尾的观众。｜TMDB 7.3"
