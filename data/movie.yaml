  description: "看似平凡的五金制造公司，其实是一家像铜金属一样冰冷无情的杀人公司。池炯道每天西服革履，却是业绩卓然的职业杀手，为公司供职十年没有一次失手，早已磨出冷血的气质。直到公司来了新人勋，他在对方身上看到了自己当年的影子，一起执行任务时竟有了片刻恍惚。通过与勋的家人接触，他越来越感受到亲情的温度，又在遇到心爱的女人后，职业的敏感开始变化。一次意外失手之后，他萌生退意，可事情远没有他想的那么简单——在梦想平凡生活的同时，池炯道也成了昔日同僚追杀的目标。影片把杀手的日常拍得像上班：打卡、汇报、年会，荒诞感正是从这里来的。它对「公司」这个概念的利用相当彻底，制度性的冷漠比任何反派都可怕。动作戏干净利落，结尾也处理得相当干脆。适合喜欢韩国犯罪片的观众。｜TMDB 7.0"
