- id: mv-275
  title: "笑拳怪招"
  category: 电影
  tags: ["电影", "动作", "喜剧", "笑拳怪招 笑拳怪招"]
  quark_url: "https://pan.quark.cn/s/99417d0f3dde"
  description: "清廷四处搜捕练武之人，形意门大掌门陈鹏飞只好带着孙儿兴龙躲进山里，隐姓埋名过日子。爷爷定下规矩不许孙儿显露功夫，可兴龙年轻气盛，一天到晚在外头惹是生非，到底还是把身份漏了出去，清廷统带任天化一路追到山间。陈鹏飞拼尽全力仍不是对手，当着孙儿的面被打死。亲眼看着爷爷倒在眼前，兴龙这才收起玩心，寻到祖父的旧友八脚麒麟门下，从头扎马步、练形意拳，把报仇当成唯一活下去的理由。练功的日子枯燥又熬人，他一遍遍在梦里打出木人巷，醒来接着练。等到功夫成了气候，与任天化的那场正面清算便再无退路。这部 1979 年的作品是成龙早期自导自演的代表作，动作设计走的是硬桥硬马的南派路子，拳脚招式清晰可数，与后来那些靠着环境道具翻腾挪移的场面完全是两种味道，喜剧成分主要落在兴龙插科打诨的性子上。｜TMDB 6.7｜TMDB 6.7"
  date: 1979-02-17
  added: "2026-10-09 14:40"
  image: mv-275.jpg

- id: mv-276
  title: "铁道飞虎"
  category: 电影
  tags: ["电影", "动作", "冒险", "喜剧", "铁道飞虎 铁道飞虎"]
  quark_url: "https://pan.quark.cn/s/d4fb4c774ae4"
  description: "1941 年太平洋战争打响，穿过山东的津浦铁路成了日军运送兵员物资的命脉，枣庄这一段尤其要紧。就在这条线周边，活跃着一支不太像队伍的抗日力量：成员清一色是枣庄火车站的铁路工人，带头的马原是站里的搬运工工头。白天他们在日军管着的车站低头干活，装作顺民；天一黑就换了一副面孔，靠着对铁轨、道岔和列车时刻的熟悉，扒火车、开火车，用最土的办法跟装备精良的日本正规军来回周旋。当地老百姓给这支队伍起了个响亮的名号，叫铁道飞虎队。影片把故事架在真实历史背景上，走的是群像加动作喜剧的路子，几场扒车与车厢搏斗的戏拍得紧凑，看得出是想把小人物的机灵劲儿做出彩。整体基调偏轻松，战争场面做了类型化处理，没有往惨烈里走，更像是一部拍给全家看的抗战题材动作片，2016 年上映后走的依然是成龙一贯的合家欢路线。｜TMDB 6.1｜TMDB 6.1"
  date: 2016-12-23
  added: "2026-10-09 14:40"
  image: mv-276.jpg

- id: mv-277
  title: "功夫梦"
  category: 电影
  tags: ["电影", "动作", "冒险", "剧情", "功夫梦 The Karate Kid"]
  quark_url: "https://pan.quark.cn/s/2a7d6966b884"
  description: "十二岁的德瑞跟着母亲从底特律搬到北京，陌生的城市、陌生的语言，连校门口的小卖部都让他手足无措。他在学校里认识了拉小提琴的女孩美莹，两个孩子很快熟络起来，这份友谊却招来以程为首的一伙人的敌意。一次放学路上的冲突，德瑞被打得毫无还手之力，是公寓的管理员老韩出手把他救了下来，可这一救也把程的武术老师李师傅给得罪了。两位师傅当众立下约定，让各自的徒弟在比武大会上一决高下。德瑞从此跟着老韩学功夫，起初只是想学会怎么不再挨打，没想到第一课是让他反复穿外套、脱外套，枯燥得近乎刁难。日子久了，他才明白这套训练磨的是心性，拳脚只是附带的东西。影片翻拍自 1984 年的好莱坞同名作品，把舞台整个搬到了北京，长城、胡同与现代高楼交替出现，师徒之间那条从隔阂到信任的线是这部最打动人的部分，2010 年上映时也被不少观众当作一次中美合拍的温和尝试。｜TMDB 6.6｜TMDB 6.6"
  date: 2010-06-10
  added: "2026-10-09 14:40"
  image: mv-277.jpg

- id: mv-278
  title: "少林木人巷"
  category: 电影
  tags: ["电影", "动作", "少林木人巷 少林木人巷"]
  quark_url: "https://pan.quark.cn/s/4a929cba9e29"
  description: "一个说不出话的少年进了少林，为的是替父亲报仇。寺里没人知道他心里压着什么，只看见他从挑水砍柴做起，日复一日地熬着最枯燥的内功底子。累到撑不住的时候，父亲被害的画面和客居寺中的五枚师太那几句话，总能让他重新咬紧牙关。打出木人巷这件事，他不知在梦里演练了多少回。转机出现在少林禁地，他发现了一个被铁链锁住的老怪人法愚。法愚看着不像僧人，却念着他送来的那几口饭，开始偷偷指点这个还没有学武资格的哑徒弟。同门师兄硬闯木人巷铩羽而归，五枚师太又看出他出招过于狠辣，特意传他蛇翼八步来调理心性。功夫终于练成，他打出木人巷得以出师，法愚却交给他一件信物，让他去联络江湖帮派。这一去牵出连场搏杀，也让他一点点逼近法愚真正的身份。1976 年的这部片子属于成龙成名之前的作品，拳脚走的是老派少林功夫的硬路子，跟后来那种借着桌椅楼梯翻飞的谐趣打法完全不同，能看到他早期最扎实的身手。｜TMDB 6.8｜TMDB 6.8"
  date: 1976-10-10
  added: "2026-10-09 14:40"
  image: mv-278.jpg

- id: mv-279
  title: "城市猎人"
  category: 电影
  tags: ["电影", "动作", "冒险", "喜剧", "城市猎人 城市獵人"]
  quark_url: "https://pan.quark.cn/s/b6273f883332"
  description: "私家侦探孟波接了桩寻人的活儿：报业大王今村的女儿清子离家出走，人就在街上跟一群玩滑板的少年混在一起。孟波带着死去搭档的妹妹惠香一路追，追到巷口人却没了影。惠香本打算回孟波家给他张罗一场生日惊喜，推门进去却撞见七个打扮得花枝招展的美女早已守在屋里，气得她当场翻脸，撂下话说要跟表哥大脚板到赌船「富贵号」上去预支蜜月。孟波慌忙追到码头，船眼看就要开，他混在游客里挤了上去。偏偏这船上不光有惠香，清子也在，还有一位扮成性感女郎的香港警察芽子。三个女人凑到一起本就够热闹，再加上一个又好色又好斗的孟波，整条船从这一刻起就没打算太平。影片改编自北条司的同名漫画，1993 年上映，是成龙作品里漫画感最强的一部，造型与桥段都往夸张里做，赌船这个封闭空间给了动作戏很多发挥余地。｜TMDB 6.6｜TMDB 6.6"
  date: 1993-01-14
  added: "2026-10-09 14:40"
  image: mv-279.jpg

- id: mv-280
  title: "A计划"
  category: 电影
  tags: ["电影", "动作", "冒险", "喜剧", "A计划 A計劃"]
  quark_url: "https://pan.quark.cn/s/e4708999ac20"
  description: "上世纪初的香港海域不太平，海盗横行，商船动辄被劫。当局担心各国商家的信心受挫、连累香港的贸易地位，索性把水师改编成一支特警小队专管海上治安。队长马如龙办事卖力，却在一桩公务里被人下套，一气之下辞了职。没多久海盗头目罗三炮抓走一批官兵家眷当人质，上头打算走内线周永龄的路子从中调停，马如龙早看出这个周永龄跟海盗是一伙的，干脆自告奋勇救人，重新拉起队伍，定下一套里应外合的方案，也就是所谓的 A 计划：上司洪天赐与好兄弟卓一飞在外接应，他从正面切入。影片 1983 年上映，是成龙把动作喜剧推到新高度的标志性作品，钟楼坠楼那一段不用替身、连摔两次的拍法，至今仍是香港动作片里被反复提起的镜头。陆上追逐与海上收尾两条线交替推进，节奏干净利落，整部片子几乎不给观众喘气的空隙。｜TMDB 7.3｜TMDB 7.3"
  date: 1983-12-22
  added: "2026-10-09 14:40"
  image: mv-280.jpg

- id: mv-281
  title: "飞龙再生"
  category: 电影
  tags: ["电影", "惊悚", "奇幻", "动作", "飞龙再生 The Medallion"]
  quark_url: "https://pan.quark.cn/s/b4108887b9f3"
  description: "传说里有一枚「再生龙章」，谁得到它的力量，死后就能变成不灭的不死人。国际人蛇集团的头目「蛇魔」盯上了一个身上带着这枚铁章的华籍小孩 Jai，派手下李斯动手绑人。香港特警阿狄两次与李斯交锋，终究没能拦住，孩子还是被带走。阿狄一路追到爱尔兰，在前女友妮歌的牵线下，与老搭档屈逊重新联手。查到李斯的货船靠岸，双方在码头混战，阿狄拼死护住 Jai，自己却沉入水中没了气息。怪事就在此刻发生：Jai 身上的铁章把一个全新的阿狄带了回来，伤口能瞬间愈合，体能远超常人。可还没等他弄明白怎么回事，「蛇魔」已经再度出手夺走龙章，也获得了再生之力，而且比他更强。影片 2003 年上映，把成龙式的动作喜剧整个搬进了好莱坞的奇幻框架，特效与超能力设定占了很大比重，打斗更多依赖镜头与后期，跟他在香港时期的搏命风格差别明显，属于一次带着实验性质的跨国尝试。｜TMDB 5.7｜TMDB 5.7"
  date: 2003-08-15
  added: "2026-10-09 14:40"
  image: mv-281.jpg

- id: mv-282
  title: "火烧岛"
  category: 电影
  tags: ["电影", "动作", "犯罪", "剧情", "火烧岛 火燒島"]
  quark_url: "https://pan.quark.cn/s/f8a7cc1edf0e"
  description: "警官黄伟被借去查一桩牵涉警员犯案的案子，为了拿到证据，他选了最冒险的一条路，主动入狱。火烧岛这座监狱里的规矩跟外头完全不同：典狱长一手遮天，暴力与不公是常态，连犯人之间的殴斗都被默许成一种秩序。黄伟进去后很快结识了室友小朱，还有因为想念儿子而反复越狱的刘世杰，又亲眼见识了帮派人物大林入狱时那套下马威。台球选手大锤因为误杀帮派大哥钢珠的弟弟被关了进来，大林奉命向他寻仇，最后由狱中说话算数的桂老大出面调停。这四个人随后被典狱长挑中，编进一支叫「清风队」的队伍，专门替他执行见不得光的暗杀任务。正是在一次次任务里，黄伟一点点逼近了那个他追查许久的幕后真凶。1991 年的这部作品是港产监狱题材里阵容相当可观的一部，群戏扎实，气氛压抑，动作戏不多但每次出手都有分量，跟成龙那些轻松谐趣的作品完全是两种气质。｜TMDB 6.3｜TMDB 6.3"
  date: 1991-03-28
  added: "2026-10-09 14:40"
