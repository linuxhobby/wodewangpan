  baidu_code: "1rhq"
  description: "2007 年，Dr.James 在军火商的资助下推进生化人研究。实验失控，生化人安德烈发生基因突变后大开杀戒，杀了军火商，接管了他的组织与研究。Dr.James 侥幸活命，只能寻求警方保护。特工林东接到证人保护任务，代价是必须离开当时生命垂危的小女儿西西。十三年过去，一本名叫《机器之血》的科幻小说出版，把三股力量重新搅到了一起：神秘的黑衣生化人组织、身份不明的骇客李森、还有隐姓埋名多年的林东。他们的目标都指向同一个看似普通的女孩 Nancy，人人都想拿到她身上的秘密。销声匿迹多年的安德烈再度出手，几番缠斗之后终于把 Nancy 抓走。林东与李森只能联手犯险救人，而就在关键时刻，林东才看清李森的真实身份：他是当年被杀的那位军火商的儿子，生化人的实验记录也已经落到了他的手上。2017 年的这部作品把成龙式的动作搬进了科幻框架，是他晚年题材上步子迈得最大的一次尝试。｜TMDB 6.0｜TMDB 6.0"
