  description: "《圣经》里记载，上帝曾用五件「上帝武装」击败邪魔，后来这五件东西散落到了世界各地。眼下伯爵手里有三件，邪魔的传人手里有两件。艾伦的女友罗娜在一场时装表演上被信奉邪魔的恶僧侣掳走，对方开出的条件是：拿伯爵那三件上帝武装来换人。艾伦只好去找兄弟亚洲飞鹰帮忙。不巧的是，飞鹰手上的三件早就卖给了伯爵，要想救人，只能先把东西借回来。伯爵起初一口回绝，艾伦索性夜入伯爵府去偷，结果被当场抓住。最后是飞鹰出面说情，答应借出三件的同时，把邪魔阵营那两件也一并奉上，伯爵这才松口。更麻烦的是伯爵的女儿阿美，她坚持要跟着去监督这次行动，也成了队伍的一员。三个人就这样一路往欧洲去，救人、夺宝，哪一样都不轻松。1986 年的这部作品远赴欧洲取景，古堡、雪山与公路追逐轮番上阵，是成龙八十年代表现最奔放的一次冒险尝试。｜TMDB 7.0｜TMDB 7.0"
