  description: "清末的香港，警官马如龙奉命接管西环一带的治安。他上任后先拿当地恶霸开刀，这一动就捅了马蜂窝：那位与黑恶势力勾结的帮办「镇三环」，从此跟他结下了梁子。麻烦还不止于此。马如龙无意间结识了革命党人，被卷进清廷的抓捕风波；而上一部里被他重创的海盗残余，也一直在暗处等着寻仇。三方势力缠在一起，把他推到了一个前后无路的境地：官面上有人要办他，江湖上有人要杀他，朝廷的人还在到处抓革命党。马如龙只能一边打一边周旋，在连场搏斗与错位的笑料里找出路。这部 1987 年的作品由成龙自编自导自演，张曼玉、关之琳、刘嘉玲等人一同出演，拿下了第 7 届香港电影金像奖最佳动作设计奖，群戏、动作与喜剧三条线都撑得很稳，是系列里公认水准最高的一部。｜TMDB 7.1｜TMDB 7.1"
