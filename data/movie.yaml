  tags: ["电影", "动作", "冒险", "喜剧", "迷你特攻队 迷你特攻隊"]
  quark_url: "https://pan.quark.cn/s/5e3029f58111"
  description: "二战时的南亚战场，日军一次突袭把四位盟国将军掳走。军方为了挽回颜面，砸下重金，点名让绰号魔鬼上尉的段宏拼一支特工队把人救回来。段宏找来老孙、草上飞、比利，路上又加入雷莉，几个人各怀本事也各怀心思。队伍穿过烈女族的地盘时出了岔子，段宏中枪坠车，剩下的人被烈女族的当家下令扣押，一路悄悄跟着的江湖拳手二牛在雷莉最危急的时候伸手救了她。等特工队硬闯日军营地，本该生死未卜的段宏又突然现身，场面顿时炸开。这部 1983 年的片子很难归到某一类里：导演朱延平把卓别林式的默片身段、西部片的布景调子、僵尸片的路数和当年流行的歌曲全搅在了一起，成了一部热闹到有点胡来的动作笑闹剧。当年票房相当可观，它也是成龙与朱延平的第一次合作，能看到他早年在群戏里跑动的那种生猛劲。｜TMDB 4.8｜TMDB 4.8"
