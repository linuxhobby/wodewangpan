  quark_url: "https://pan.quark.cn/s/badd457321a5"
  description: "《给阿嬷的情书》是一部融合家庭、剧情与喜剧元素的作品，把镜头对准潮汕一个普通大家庭，2026 年 4 月 30 日上映。故事里，年迈的阿嬷叶淑柔守着老屋，过着平静的晚年生活。孙子晓伟却因为债务缠身，瞒着全家人远赴泰国，去寻找传闻中已经成为亿万富豪的阿公郑木生，指望这位素未谋面的长辈能救急。谁料一个意外的消息掀翻了整个家庭的平静：这么多年来，一直通过跨国信件与阿嬷鸿雁传书、倾诉思念的那个人，竟然并不是她的丈夫郑木生。晓伟顺着这条线索一路查下去，一段藏了几十年的往事被缓缓揭开，一家人之间的关系也在真相面前重新洗牌。影片以喜剧的外壳包裹亲情的内核，潮汕的地域风情与方言质感为故事加分不少，笑点与泪点交替出现，结尾落在一个足够动人的答案上。适合喜欢家庭题材、想在片子里笑着流泪的观众。｜TMDB 8.7"
