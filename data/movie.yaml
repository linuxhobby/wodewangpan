  baidu_code: "m5ww"
  description: "延尚昊执导的韩国丧尸片，2016 年在戛纳电影节午夜展映单元亮相，孔刘、马东锡、郑有美、金秀安主演。故事从一列开往釜山的特快列车说起：基金管理人石宇平日眼里只有数字和业绩，婚姻因此走到尽头，连女儿的生日都记不真切。秀安执意要去釜山找妈妈，石宇这才放下工作，陪着女儿登上清晨的特快列车。列车发车前后，一名感染者踉跄着爬上车厢，尸变在密闭空间里迅速蔓延，几节车厢的工夫，整座城市乃至全国都跟着失控。列车一路向南，停不下来也回不去，石宇、带着怀孕妻子的壮汉尚华，还有一对年轻学生，只能在铁皮车厢之间辗转求生，穿过大田、东大邱，朝着还算安全的釜山狂奔。电影把丧尸类型拍得又快又狠，真正让人后背发凉的却是车厢里的活人：谁先让座、谁关上那扇门、谁值得被救，每个决定都把人往两个方向推。孔刘演的自私父亲在逃亡里一点点被打磨成另一个人，金秀安演的女儿始终是全片最干净的那把尺子。动作戏密集，情绪也不含糊，一百来分钟几乎没有喘息的空档。想看爽的能看爽，想看人性和家庭的，这部片子也给得起。｜TMDB 7.8"
  date: 2016-07-20
  added: "2026-10-09 16:50"
  image: mv-333.jpg


