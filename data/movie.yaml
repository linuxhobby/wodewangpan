- id: mv-291
  title: "辛亥革命"
  category: 电影
  tags: ["电影", "冒险", "剧情", "动作", "辛亥革命 辛亥革命"]
  quark_url: "https://pan.quark.cn/s/062620938331"
  description: "十九世纪末到二十世纪初，清朝三百年的基业已经摇摇欲坠，外有列强环伺，内有民生凋敝，整个时局找不到一处安稳的地方。就在这片动荡里，一批又一批仁人志士冒了出来，他们认定只有民主共和能救这个国家，于是组党、办报、筹划起义，把推翻帝制当成唯一的方向。流血牺牲在这一路上几乎成了家常便饭，前一批人倒下，后一批人接着站出来，直到武昌城里那一枪打响，压在头上的帝制终于开始崩塌。影片 2011 年上映，是为纪念辛亥革命一百周年而拍的献礼之作，走的是全景式群像路线：孙中山、黄兴、黎元洪、隆裕太后、袁世凯、汪精卫、宋教仁、秋瑾等各方人物依次登场，各自站在自己那一侧，把那段历史的复杂与撕扯铺开来讲。成龙在片中饰演黄兴，表演刻意收了动作明星的锋芒，整体基调庄重，更像一堂影像化的历史课，而非一部追求戏剧冲突的类型片。｜TMDB 5.7｜TMDB 5.7"
  date: 2011-09-23
  added: "2026-10-09 14:54"
  image: mv-291.jpg

- id: mv-292
  title: "少林门"
  category: 电影
  tags: ["电影", "动作", "剧情", "少林门 少林門"]
  quark_url: "https://pan.quark.cn/s/370320ece3f7"
  description: "明朝末年，反清的火头在各地此起彼伏，少林也因民族大义卷了进来。偏偏寺里出了个石少锋，为了荣华富贵投了清廷，反过来成了朝廷的爪牙，专抓昔日同道，下手毫不留情。义士谭雄被他捉进大牢，受不住狱中折辱，含恨自尽。少林方丈看不下去，派爱徒云飞下山清理门户，本意是阻止石少锋继续杀戮，盼他回头。谭雄的弟弟为兄报仇心切，一路追着石少锋不放；另有一位漂泊江湖的浪子，看似什么都不在乎，良心却还没磨灭。三个人各有各的缘由，最终拧成一股，一同对上石少锋。这部 1976 年的作品由吴宇森执导，属于他早期的功夫片，叙事规整，立场分明，动作以硬桥硬马的少林拳为主。片中还能看到成龙的身影，那时他还不是主角，身手却已经相当利落，属于早期港产功夫片里值得翻出来看看的一部。｜TMDB 6.6｜TMDB 6.6"
  date: 1976-07-15
  added: "2026-10-09 14:54"
  image: mv-292.jpg

- id: mv-293
  title: "龙腾虎跃"
  category: 电影
  tags: ["电影", "动作", "喜剧", "龙腾虎跃 龍騰虎躍"]
  quark_url: "https://pan.quark.cn/s/aa2a10ae4db4"
  description: "程家三兄弟替乡亲出头除了一害，却把地煞和天煞两个狠角色彻底得罪了。老大死在屠刀之下，老二程振南和老三程振北各自带着儿子阿龙、阿栋连夜逃命，混乱中两个孩子走散，从此走上了两条完全不同的路。多年过去，阿龙长成了个乐观正直的青年，日子过得平淡，直到某次情急之下使出家传的程家拳。这套拳早已失传，却也因此暴露了行踪，一路追查仇家的地煞和天煞循着线索找上门来，程家再度遭难。危急关头，丐帮帮主的女儿小玲拼死护住阿龙，自己却没能逃出来。血债压在肩上，阿龙找到了失散多年的阿栋，两兄弟决定联手，把这笔账算清楚。这部 1983 年的作品是《笑拳怪招》的续作，走的依旧是南派拳脚的路子，招式扎实，节奏明快。成龙在这部里的身手已经相当成熟，几场对打干净利落，能看到他从早期硬派功夫向后来的动作喜剧过渡的痕迹。｜TMDB 5.8｜TMDB 5.8"
  date: 1983-03-04
  added: "2026-10-09 14:54"
