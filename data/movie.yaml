  description: "美艳忧郁的女医生冯雪辉（李昕芸饰）对男性有种致命的吸引力，但她的丈夫方文楠（吴镇宇饰）却以冷暴力相待，两人之间似有深深隐情，他们既是仇人又是同谋。突然医院发生了一起惨烈的坠楼命案，由此牵出围绕金钱与欲望的黑幕，仿佛漩涡注定改变所有人。不得志的颓废刑警张越（田小洁饰）视此案为事业翻身的最后机会而穷追不舍，却被冯雪辉利用引向她的目的；自负到病态的幕后黑手副院长康富荣（戴立忍饰）很早就设计圈套诱捕冯雪辉为替罪羊；暗恋冯雪辉的英俊正直的蒋力航（李至正饰）其实是手握核心证据的人，但他被爱情深深伤害并亲手将冯雪辉投入监狱。漩涡中心里这个美艳的女人，她到底要什么，她为深藏一个不伦的秘密，她愿意付出任何代价，…｜TMDB 6.5"
