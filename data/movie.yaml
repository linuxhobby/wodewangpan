- id: mv-105
  title: "星际迷航：31区"
  category: 电影
  tags: ["电影", "科幻", "冒险", "动作", "星际迷航：31区 Star Trek: Section 31"]
  quark_url: "https://pan.quark.cn/s/74ebabf364d2"
  description: "「第 31 区」是《星际迷航》宇宙里最不光彩的一角：一个不受舰队条约束缚的秘密部门，专门用见不得光的手段处理见不得光的威胁。这部衍生电影把它搬上前台，由杨紫琼饰演的菲利帕·乔吉欧女皇担纲——熟悉《星际迷航：发现号》的观众对她并不陌生，这个角色当年正是在镜像宇宙里登基称帝的那个狠角色。影片讲的是她加入这个组织后参与的第一桩任务：一桩牵涉禁忌武器、足以动摇星际联邦根基的行动。杨紫琼的气场撑得住这类亦正亦邪的角色，她游走于规则之外的做派和反派之间的几次交锋是全片最好看的部分。不过要提前说清楚：这是流媒体平台出品的派生作品，预算、特效和剧作完成度都与院线电影有距离，上映后口碑也相当糟糕。詹姆斯·浩克斯等系列熟脸的客串算是给老粉的一点心意。推荐给已经熟悉这个系列、尤其一路追过《发现号》那条人物线的观众；如果还没入坑，从这里起步恐怕很难领会乔吉欧这个角色的来历与魅力。｜TMDB 4.7"
  date: 2025-01-15
  added: 2026-09-30
  image: mv-105.jpg

- id: mv-106
  title: "永生战士2"
  category: 电影
  tags: ["电影", "动作", "战争", "惊悚", "永生战士2 Sisu 2"]
  quark_url: "https://pan.quark.cn/s/1fac5d1786e2"
  description: "那位怎么也打不死的芬兰老兵回来了。这一部的动机很私人：他回到家乡，想把战争中家人遇害的那栋房子拆掉，换个地方重新起一座。可当年下命令的红军指挥官找上门来，一场横跨国界的残酷追捕就此展开。对手这条线写得简单直接，目的就是把两个人推到非见不可的地步。全片几乎没有解释性的对白，主角为什么这么做，只能从他的动作里推断。上一部那种夸张到近乎漫画式的暴力继续发扬——主角几乎不说话，被逼到极限后用最朴素的工具反击，观众的同情慢慢变成一种荒诞的快感。沉默是他的性格，也成了这部片的幽默来源：台词少得惊人，情绪全靠动作和环境声带出来。荒原、森林和公路的实景拍摄让画面质感相当扎实，冷色调让暴力场面显得格外清冷。它的爽感来自一种近乎固执的因果：惹错了人，就得认。如果当成严肃的历史片会失望。｜TMDB 7.3"
  date: 2025-10-21
  added: 2026-09-30
  image: mv-106.jpg

- id: mv-107
  title: "V字仇杀队"
  category: 电影
  tags: ["电影", "动作", "惊悚", "科幻", "V字仇杀队 V for Vendetta"]
  quark_url: "https://pan.quark.cn/s/39d301805035"
  description: "《V字仇杀队》改编自阿兰·摩尔的同名漫画，背景设在一个被极权统治的未来英国：言论被监控、宣传只有一种口径，同性恋者、异教徒以及任何不符合标准的人被从公共生活中抹去，大多数人选择低头。故事由一个年轻女子艾薇开始：她在宵禁之后出门，遇上了巡逻队，被人救下的那一刻起，她认识了那个永远戴着面具的男人。他自称 V，说话的方式像在演戏，动作却干净得出奇。他做的事在当局看来是恐怖袭击，在城市一些人看来则是一次点火——他炸掉了伦敦的一处标志性建筑，接着把这个国家最不愿意被人提起的过去翻了出来。影片最有力的地方并不是那些反转，而是它把一个关于恐惧如何维持统治、又如何被一点点拆掉的过程拍得很清楚。娜塔莉·波特曼的角色从一个害怕到发抖的普通人开始，这条线是整个故事的骨架。视觉上那场面具与多米诺骨牌的意象至今仍是最常被模仿的形象之一。推荐给几乎所有成年人观众。｜TMDB 7.9"
  date: 2006-02-23
  added: 2026-09-30
  image: mv-107.jpg

