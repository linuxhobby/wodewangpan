# 标签聚合页配置（/tag/xxx/）
# 与站点设置分开：site.yaml 建站定一次，这个跟着内容长，维护节奏不同。

# 一个标签至少挂多少资源才建页（724 个去重标签里 662 个只出现 1 次，调低会造出单条垃圾页）
tagMin: 3

# 点名不建页的标签。与分类同名的自动不出页（如「纪录片」），这里只留「名字不撞、内容撞」的。
# 不建页 ≠ 不显示：标签照常出现在详情页，只是不可点（免得链到 404），站内搜索照样能搜到。
tagExclude: []  # 2026-10-12 放出 macOS（见下方 tagOverlapAllow）

# 标签页与分类页的近重复阈值：两页资源集合的 Jaccard 相似度（重合数 / 两页并集）超过它就在构建时告警点名。配 1 = 关掉。
# 判据不能用「标签里有几成属于某分类」——冒险、科幻本来就 100% 属于电影，却只占电影的一两成，两页差得远。
# 实测 macOS 93%、纪录 87%，其余都在 67% 以下，0.8 能干净地挑出来。
tagOverlapMax: 0.8

# 近重复检测的最小条数门槛：小集合的 Jaccard 极不稳定（Linux 4 条 vs 操作系统 6 条就是 67%），几条内容的页面也不值得告警。配 0 = 不设门槛。
tagOverlapMinSize: 10

# 给指定标签单独写文案，用于与分类页高度重合的标签——两页得有各自的切入点，否则会被当成同一份内容只留一个。
# 支持 {count} 占位符（该标签下的资源数），别手写数字，数据一变就失真。没配的沿用 tagPage() 通用文案。
tagMeta:
  macOS:
    title: Mac 专属软件与游戏资源（{count} 个）
    h1: Mac 专属资源
    desc: 按「有没有 Mac 版」筛过的一批：{count} 个 macOS 资源，主要是 Mac 专属软件，另有少量支持 Mac 的游戏。夸克网盘直链，打开即用、扫码即存。

# 明知与分类页高度重合、但仍要建页的标签：写进来 = 承认这个重合，构建不再为它告警，其余标签继续盯。
# 与 tagExclude 别混：tagExclude = 不建页（标签不可点）；tagOverlapAllow = 建页，只是不再提醒。
# macOS（2026-10-12）：121 条 vs「软件」126 条，重合 119 条（93%）——软件分类本身就有 119 个 Mac 软件，两页没法不重合。
# 但它是本站主要标签之一，用户要这个入口，覆盖面优先于近重复顾虑。等跨平台软件多起来、Jaccard 自然掉下来再把这项删掉。
tagOverlapAllow:
  - macOS

# 建站时为 34 个标签定的英文别名，已收录。之后的新标签交给拼音兜底，不必再往这里加。
# ⚠️ 只增不改：改别名 = 换 URL，已收录的页面会丢排名；已落到拼音 URL 的标签，事后再补别名同样等于换 URL。
# ⚠️ 键必须与 collectTags() 选出的显示名完全一致（区分大小写，含空格）。
tagSlugs:
  # ── 题材 ──
  剧情: drama
  动作: action
  犯罪: crime
  惊悚: thriller
  喜剧: comedy
  悬疑: mystery
  冒险: adventure
  科幻: sci-fi
  动作冒险: action-adventure
  奇幻: fantasy
  历史: history
  恐怖: horror
  战争: war
  家庭: family
  爱情: romance
  动画: animation
  音乐: music
  西部: western
  真人秀: reality-show
  文学: literature
  外国文学: foreign-literature
  # ── 软件 / 工具属性 ──
  实用工具: utility
  效率: productivity
  效率工具: productivity-tools
  开发工具: devtools
  启动器: launcher
  摄影与视频: photo-video
  # ── 平台 / 版本（原本就是 ASCII，统一成小写连字符）──
  macOS: macos
  Windows: windows
  Linux: linux
  Switch: switch
  x86_64: x86-64
  "Sci-Fi & Fantasy": sci-fi-fantasy
  "War & Politics": war-politics
