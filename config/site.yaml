title: 我的网盘资源站
description: 夸克 / 百度网盘资源索引，打开即用，扫码即存
# 站点域名（可选）：写进 canonical / OG / sitemap
# 不配就用构建脚本里的默认域名 https://www.wodewangpan.top
# 换域名时用 BASE_URL=... npm run build，或在这里写 baseUrl: https://新域名
# 首页 SEO 文案（可选，不填则回退用站名与站描述）；{total} = 资源总数，{categories} = 分类列表
homeTitle: 我的网盘资源站 - 夸克/百度网盘资源索引        # 首页 title，构建时自动追加「（396 项）」
homeDesc: 夸克 / 百度网盘资源索引，收录 {total} 个{categories}资源，打开即用，扫码即存
homeH1: 网盘资源索引 · 全部资源                        # 首页 H1（分类页仍用分类名）
disclaimer: 本站仅提供网盘资源索引，所有文件均存放于第三方网盘，版权归原作者所有，如有侵权请联系删除
# 分类标签栏顺序（未在此列出的分类会追加在后面）
categories:
  - 电影
  - 电视剧
  - 纪录片
  - 动漫
  - 游戏
  - 软件
  - 操作系统
  - 电子书
  - 其他
# 分类 → URL 别名（可选）：页面的分类路径用这里的英文名，没配的分类仍用分类名
# 注意：改动已收录的路径要配 301 跳转，否则丢排名
slugs:
  电影: movie
  电视剧: tv
  纪录片: documentary
  动漫: anime
  游戏: game
  软件: software
  操作系统: os
  电子书: ebook
  其他: misc
# 页脚访问统计：local = 本地统计（VPS 解析 nginx 日志生成 /stats.json，不依赖第三方）；
#              留空则不显示
stats: local
# 页脚联系方式（可选，留空整段则不显示）：页面上只显示图标，地址写进 title / aria-label 不直接露出
contact:
  QQ群: https://qm.qq.com/q/UkO8hrPaQ
  邮箱: marco@tinkmail.me
# QQ 群名称（可选）：显示在关于本站页的二维码区块与页脚悬浮提示上，留空则显示通用「QQ群」
qqGroup: 我的网盘资源站
# 维护者署名（可选）：显示在「关于本站」页底部站名下方，留空则不显示
maintainer: 人生若只如初见
# 备案号（可选，留空则不显示）
icp: ""
# 首页 / 分类页首屏渲染条数，其余由「加载更多」渲染（宫格建议 12 的倍数）
pageSize: 35
