title: 我的网盘资源站
description: 夸克 / 百度网盘资源索引，打开即用，扫码即存
# 站点域名（可选）：写进 canonical / OG / sitemap
# 不配就用构建脚本里的默认域名 https://www.wodewangpan.top
# 换域名时用 BASE_URL=... npm run build，或在这里写 baseUrl: https://新域名
# 首页 SEO 文案（可选，不填则回退用站名与站描述）；{total} = 资源总数，{categories} = 分类列表
homeTitle: 我的网盘资源站 - 夸克/百度网盘资源索引        # 首页 title，构建时自动追加「（396 项）」
homeDesc: 夸克 / 百度网盘资源索引，收录 {total} 个{categories}资源，打开即用，扫码即存
homeH1: 网盘资源索引 · 分类浏览                        # 首页 H1（分类页仍用分类名）
# 首页按分类分区展示。homePerCategory = 每个分类给几条（PC 端宫格 5 列，5 条正好一行；
#   窄屏由 CSS 按当前列数自动减到 4/3/2 条，不必为移动端再配一个数）。
# homeCatOrder = 分类区块的排列顺序：
#   fixed  —— 按下面 categories 的顺序，回访用户每次进来位置一致（默认）；
#   recent —— 按各分类最新一条的入库时间倒序，进了新货的分类自动上浮，但位置会天天变。
homePerCategory: 5
homeCatOrder: fixed
disclaimer: 本站仅提供网盘资源索引，所有文件均存放于第三方网盘，版权归原作者所有，如有侵权请联系删除
# 站长平台验证（可选）：填了就在每个页面的 <head> 输出对应的验证 meta。
# 不填则不输出任何标签；某一家还没验证就删掉那行，别留空值。
# 用法：在对应站长平台添加站点 → 选「HTML 标签」验证方式 → 把 content 里的那串码粘到下面。
verification:
  google: 5DMCm8mvJRphFIVfW3IsluxU2NnU7uIIyB8pnr9c_CE     # Google Search Console
#  bing: 粘贴 msvalidate.01 的 content                     # Bing Webmaster（配合 IndexNow 用）
#  baidu: 已放弃百度类引擎（站点只面向 Google + Bing），不再做站长验证  # 百度站长平台
#  360: 粘贴 360-site-verification 的 content              # 360 搜索站长
#  sogou: 粘贴 sogou_site_verification 的 content          # 搜狗站长
# 分类标签栏顺序（未在此列出的分类会追加在后面）
categories:
  - 电影
  - 电视剧
  - 纪录片
  - 动漫
  - 游戏
  - 软件
  - 操作系统
  - 电子书
  - 课程
  - 其他
# 分类 → URL 别名（可选）：页面的分类路径用这里的英文名，没配的分类仍用分类名
# 注意：改动已收录的路径要配 301 跳转，否则丢排名
slugs:
  电影: movie
  电视剧: tv
  纪录片: documentary
  动漫: anime
  游戏: game
  软件: software
  操作系统: os
  电子书: ebook
  课程: course
  其他: misc
# 标签聚合页配置（tagMin / tagExclude / tagOverlap* / tagSlugs）在同目录的 tags.yaml
# 页脚访问统计：local = 本地统计（VPS 解析 nginx 日志生成 /stats.json，不依赖第三方）；
#              留空则不显示
stats: local
# 页脚联系方式（可选，留空整段则不显示）：页面上只显示图标，地址写进 title / aria-label 不直接露出
contact:
  QQ群: https://qm.qq.com/q/UkO8hrPaQ
  邮箱: marco@tinkmail.me
# QQ 群名称（可选）：显示在关于本站页的二维码区块与页脚悬浮提示上，留空则显示通用「QQ群」
qqGroup: 我的网盘资源站
# 详情页反馈条（可选）：每个资源页转存链接下方显示「加入QQ群 / 邮件反馈」入口，
# 是链接失效反馈的落点（A1）。群链接失效或不想露出时设为 false，全站详情页不再渲染。
detailFeedback: true
# 维护者署名（可选）：显示在「关于本站」页底部站名下方，留空则不显示
maintainer: 人生若只如初见
# 备案号（可选，留空则不显示）
icp: ""
# 首页 / 分类页首屏渲染条数，其余由「加载更多」渲染（宫格建议 12 的倍数）
pageSize: 35
# 衡天云联盟推广（affiliate）。enabled: false 可全站一键关闭所有推广位。
# 链接统一带 aff=31743；rel 由渲染层写成 sponsored（Google 对赞助/联盟链接的硬性要求）。
promo:
  enabled: true
  brand: 衡天云
  # 活动落地页（开年活动，主推）；注册/自定义落地页放在 registerHref 备用
  activityHref: https://www.htstack.com/activity/act_openyear.shtml?aff=31743
  registerHref: https://my.htstack.com/aff.php?aff=31743
  # 推广文案（页脚条与图片 alt 复用）
  text: 【衡天云】海外云服务器12元/月起，开年限量抢购，超高性价比！
  # 落地页优先级：activity 用活动页，register 用注册页；改这里即可整体切换
  defaultHref: activity
