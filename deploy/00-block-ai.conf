# /etc/nginx/conf.d/00-block-ai.conf
# 只抓不回流的 AI 索引爬虫 → 403（配合站点 server 块首部的 if ($ai_block) { return 403; }）
#
# 判定依据（2026-10-03 → 10-11 访问日志）：
#   referer 回流：ShapBot 0 次、KeenableBot 0 次、SkytabBot 0 次
#   同期真人搜索来源：Google 281、百度 37、Yandex 5、Bing 1 —— 传统引擎会回流，这三家不会
#   抓取量：ShapBot 3487 / KeenableBot 1886 / SkytabBot 434，合计 5807 次
#   而全站真人 UV 九天只有 186 人
#   另两家是「Agent 检索 API 的索引器」，不给站长后台、不带人类点击
# 行为问题：
#   ShapBot 只读 2 次 robots、KeenableBot 读了 11 次仍照抓；SkytabBot 完全不读 robots/sitemap，
#   同一资源页反复抓 15 次；ShapBot 与 KeenableBot 各有 1200~2000 次请求撞在非规范 URL 上（拿 301 再重试）
#
# 要放行某家：注释掉对应 ~* 行 + nginx -s reload。
# 名单别误伤：Googlebot / YandexBot / Bingbot / Baiduspider / Applebot 是收录来源，
# PerplexityBot / OAI-SearchBot / Claude-SearchBot / Google-Extended 会带来 AI 摘要与引荐链接，
# ClaudeBot 与 GPTBot 本站已刻意保留放行（不在这份名单里）。

map $http_user_agent $ai_block {
    default         0;
    "~*ShapBot"     1;
    "~*KeenableBot" 1;
    "~*SkytabBot"   1;
}
