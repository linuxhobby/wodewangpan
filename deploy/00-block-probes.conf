# /etc/nginx/conf.d/00-block-probes.conf
# 掐断公网漏洞扫描器。纯静态站不存在这些路由，命中即由站点配置里的
# `if ($probe_block) { return 444; }` 直接断连——不回应、不渲染 404 页、不发 body。
#
# 为什么用 444 而不是 404：扫描器每天几千次，404 要回一整页 HTML（本站 3.5 KB），
# 444 只关连接；且不断重试的 wp-admin/.env 这类请求没有任何「值得返回」的内容。
# 放在 server 块最前面（早于裸域与 http→https 的 if），连 301 都不会发给扫描器。
#
# 想临时放行某条：注释掉对应 ~* 行；整体停用：把本文件改名成 .disabled 再 reload。
# 依据是近 9 天访问日志里真实出现过的探测形态（Top：/wp-admin/install.php、/.env、
# /.git/config、phpunit eval-stdin 的数十种路径变体、index.php 的 allow_url_include）。

map $request_uri $probe_block {
    default 0;

    # WordPress 系
    "~*(^|/)(wp-admin|wp-login|wp-signup|wp-register|wp-cron|wp-links-opml|wp-json|xmlrpc\.php)" 1;

    # 任意 .php：静态站永远不该有 PHP 请求（phpunit eval-stdin、index.php 注入都在内）
    "~*\.php($|[?:/])" 1;

    # 环境变量与配置泄漏
    "~*(^|/)\.env(\.|$|[/?])" 1;

    # 版本库与本地文件
    "~*(^|/)\.(git|svn|hg|bzr|aws|ssh|npmrc|gitignore|gitconfig|htpasswd|DS_Store|bash_history)(/|$|[.?])" 1;
    "~*(id_rsa|\.pem($|[?/])|\.key($|[?/]))" 1;

    # 已知漏洞特征
    "~*(phpunit|eval-stdin|allow_url_include|auto_prepend_file)" 1;

    # 管理后台 / Java·PHP 框架面板
    "~*(phpmyadmin|myadmin|adminer|(^|/)pma(/|$)|/manager/html|/actuator|/eureka|/nacos|/druid|/webservice|/tplus|/geoserver|/drupal|/joomla|/telescope|/_profiler|tiny_mce|ewebeditor|/webui/)" 1;

    # 依赖目录与备份/源码后缀
    "~*(/vendor/|/node_modules/|WEB-INF|META-INF|(^|/)(backup|dump)/|\.sql($|[?/])|\.bak($|[?/])|\.old($|[?/])|\.log($|[?/])|\.ini($|[?/])|\.conf($|[?/])|settings\.ya?ml($|[?/]))" 1;
}
